# SPDX-License-Identifier: AGPL-3.0-only
#
# SAMSEG with lesions: whole-brain segmentation with white-matter lesions
# from a T1-weighted image and a FLAIR, for MS and NMOSD lesion load
# (record 49 R1), a starter the engine seeds at boot.
#
# One session's T1w and FLAIR in; a label map (FreeSurfer's aseg codes,
# lesions 99) and a table of volumes, lesions and the intracranial volume
# in mm3 out. The FLAIR is the session's T2w with FLAIR among the `+`
# tokens of its `acq-`, as the release names a T2 FLAIR since record 55
# C4 (FLAIR is a modifier, never the suffix: `acq-Ax+2D+FLAIR+IRTSE_T2w`),
# or the `_FLAIR` of a tree an older release wrote; the pre-flight judges
# a flair pick by the same token. It is resampled onto the T1w's grid
# through the scanner's world coordinates first, as v0's wrapper did,
# since SAMSEG reads its contrasts on one grid. A session without a FLAIR
# picked is named by the pre-flight and skipped by the run; one that
# reaches this without its FLAIR writes nothing here, so the run makes it
# a pipeline:qc item.
#
# The resampling trusts the image headers alone: nothing registers the
# FLAIR to the T1w, and SAMSEG needs its inputs aligned. Until NILS has a
# registration step, each unit checks the alignment (the review of
# 2026-10-12): mri_synthstrip, which reads any contrast, makes a brain
# mask of the T1w and one of the FLAIR on the T1w's grid, and the Dice of
# the two, inside the FLAIR's field of view, is the table's column
# flair_t1_brain_dice. The check holds it against 0.85 (a NILS policy,
# from the review's segcsvd QC table): below it the session is flagged, a
# pipeline:qc item, and not failed, and the unit's log says "FLAIR and T1
# may not be aligned (brain masks agree at 0.xx)". On three open sessions
# whose two series share the scanner's coordinates the masks agreed at
# 0.95 to 0.99, and with the FLAIR moved 15 mm at 0.80 to 0.86: the check
# catches a FLAIR off by 15 mm or more (a patient who moved, another
# series), not a few millimetres. A unit whose masks could not be made
# says so and goes on without the column.
#
# The image is FreeSurfer 8.2.0 (run_samseg, surfa in fspython), pinned by
# its registry manifest digest, resolved 2026-09-24 by a registry manifest
# request, not pulled. v0 ran SAMSEG standalone (MIT) in a private image;
# this uses the one inside FreeSurfer, and declares no licence, which v0's
# notes say SAMSEG needs none of.
#
# A check reads the label map (record 55 H3, job type 3): SAMSEG writes
# its segmentation on the grid of its first input, the T1w, so the map is
# tied to the T1w the unit was given (`grid: t1w`). It is read as its
# lesions, each 26-connected component of label 99, and as its
# structures, each label a part named as FreeSurfer's colour table
# (FreeSurferColorLUT.txt) names it. The structures are every label the
# map holds, so where lesions were segmented label 99 is one of them too;
# with lesions off the map holds no 99 and the lesions have no parts.
name: samseg-lesions
schema-version: "0.5"
tool-version: "freesurfer-8.2.0"
description: >-
  Segment each session with SAMSEG from its T1w and FLAIR, lesions
  included: a label map and the volumes of the brain's structures and its
  white-matter lesions, with the intracranial volume. One session is one
  unit; CPU, about 45 minutes a session.

container-image:
  type: docker
  image: "docker.io/freesurfer/freesurfer@sha256:5648104ca75a24f6ee5a8786146f99b405c2bda1da12bff723a15056da8ddf6b"

inputs:
  - id: lesion
    name: Segment lesions
    type: String
    description: "on reads the FLAIR beside the T1w and segments white-matter lesions (label 99); off segments the anatomy from the T1w alone, in about a quarter of the time."
    value-key: "[LESION]"
    value-choices: ["on", "off"]
    default-value: "on"
  - id: pallidum_separate
    name: Separate pallidum
    type: Flag
    description: Segment the pallidum as a class of its own rather than with the putamen.
    value-key: "[PALLIDUM]"
    command-line-flag: "--pallidum-separate"
    default-value: true
  - id: threads
    name: Threads
    type: Number
    description: The threads SAMSEG uses for one session.
    value-key: "[THREADS]"
    default-value: 4
    integer: true
    minimum: 1
    maximum: 32

command-line: >-
  bash -c 'set -u; shopt -s nullglob; cd [InputDataset];
  flair() { local g s q; for g in "$1"/*_T2w.nii.gz "$1"/*_FLAIR.nii.gz; do s=$(basename "$g" .nii.gz);
  case "$s" in *_FLAIR) echo "$g"; return;; *_acq-*) q=${s#*_acq-};; *) continue;; esac;
  case "+${q%%_*}+" in *+FLAIR+*) echo "$g"; return;; esac; done; };
  for f in sub-*/ses-*/anat/*_T1w.nii.gz; do
  a=$(dirname "$f"); d=[OutputLocation]/$a; mkdir -p "$d";
  b=$(basename "$f" .nii.gz); b=${b%_T1w}; w=$(mktemp -d [OutputLocation]/.work-XXXXXX);
  fl=$(flair "$a");
  if [ "[LESION]" = on ]; then
  if [ -z "$fl" ]; then echo "$a holds no FLAIR, so no lesions"; rm -rf "$w"; continue; fi;
  fspython -c "import sys, surfa; surfa.load_volume(sys.argv[1]).resample_like(surfa.load_volume(sys.argv[2])).save(sys.argv[3])" "$fl" "$f" "$w/flair.mgz" || { rm -rf "$w"; continue; };
  if mri_synthstrip -i "$f" -m "$w/t1_brain.nii.gz" -t [THREADS] && mri_synthstrip -i "$w/flair.mgz" -m "$w/flair_brain.nii.gz" -t [THREADS]
  && al=$(fspython -c "import sys, numpy as np, nibabel as n, scipy.ndimage as d; t, f, p, q = (n.load(x) for x in sys.argv[1:5]); m = np.linalg.inv(f.affine) @ t.affine;
  v = d.affine_transform(np.ones(f.shape[:3], np.float32), m[:3, :3], m[:3, 3], t.shape[:3], order=0) > 0.5; a = (np.asarray(p.dataobj) > 0) & v; b = (np.asarray(q.dataobj) > 0) & v;
  r = round(2 * float((a & b).sum()) / max(int(a.sum() + b.sum()), 1), 2); print(\"%.2f\" % r);
  r < 0.85 and print(sys.argv[5] + \": FLAIR and T1 may not be aligned (brain masks agree at %.2f)\" % r, file=sys.stderr)" "$f" "$fl" "$w/t1_brain.nii.gz" "$w/flair_brain.nii.gz" "$a") && [ -n "$al" ];
  then echo "$a: the brain masks of the FLAIR and the T1w agree at $al (Dice)"; else al=""; echo "$a: the FLAIR was not checked against the T1w"; fi;
  run_samseg -i "$f" -i "$w/flair.mgz" --lesion --lesion-mask-pattern 0 1 -o "$w/out" --threads [THREADS] [PALLIDUM] || { rm -rf "$w"; continue; };
  else al=""; run_samseg -i "$f" -o "$w/out" --threads [THREADS] [PALLIDUM] || { rm -rf "$w"; continue; }; fi;
  fspython -c "import sys, surfa; surfa.load_volume(sys.argv[1]).save(sys.argv[2])" "$w/out/seg.mgz" "$d/${b}_desc-samseg_dseg.nii.gz" || { rm -rf "$w"; continue; };
  fspython -c "import sys, json; r = dict((p[0].strip(), float(p[1])) for n in (\"samseg.stats\", \"sbtiv.stats\") for l in open(sys.argv[1] + \"/\" + n) if l.startswith(\"# Measure\") for p in [l[9:].split(\",\")]);
  r.update(zip(sys.argv[2::2], map(float, sys.argv[3::2]))); print(json.dumps(r))" "$w/out" ${al:+flair_t1_brain_dice $al} > "$d/${b}_desc-samseg_volumes.json";
  rm -rf "$w"; done'

x-nils:
  contract: 1
  analysis-level: session
  input:
    layout: bids
    roles: [t1w, flair]
  units: apart
  outputs:
    - id: labels
      kind: mask
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-samseg_dseg.nii.gz"
      media-type: application/x-nifti+gzip
      grid: t1w
      parts:
        - {key: lesions, words: Lesions, kind: components, labels: [99]}
        - key: structures
          words: Structures
          kind: labels
          names:
            2: Left-Cerebral-White-Matter
            3: Left-Cerebral-Cortex
            4: Left-Lateral-Ventricle
            5: Left-Inf-Lat-Vent
            7: Left-Cerebellum-White-Matter
            8: Left-Cerebellum-Cortex
            10: Left-Thalamus
            11: Left-Caudate
            12: Left-Putamen
            13: Left-Pallidum
            14: 3rd-Ventricle
            15: 4th-Ventricle
            16: Brain-Stem
            17: Left-Hippocampus
            18: Left-Amygdala
            24: CSF
            26: Left-Accumbens-area
            28: Left-VentralDC
            30: Left-vessel
            31: Left-choroid-plexus
            41: Right-Cerebral-White-Matter
            42: Right-Cerebral-Cortex
            43: Right-Lateral-Ventricle
            44: Right-Inf-Lat-Vent
            46: Right-Cerebellum-White-Matter
            47: Right-Cerebellum-Cortex
            49: Right-Thalamus
            50: Right-Caudate
            51: Right-Putamen
            52: Right-Pallidum
            53: Right-Hippocampus
            54: Right-Amygdala
            58: Right-Accumbens-area
            60: Right-VentralDC
            62: Right-vessel
            63: Right-choroid-plexus
            72: 5th-Ventricle
            77: WM-hypointensities
            80: non-WM-hypointensities
            85: Optic-Chiasm
            99: Lesion
            165: Skull
            258: Head-ExtraCerebral
            259: Eye-Fluid
    - id: volumes
      kind: table
      format: json
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-samseg_volumes.json"
      columns:
        - {name: intracranial, from: "Intra-Cranial", unit: mm3, description: "SAMSEG's intracranial volume (sbTIV)"}
        - {name: lesions, from: "Lesions", unit: mm3, description: "White-matter lesion volume, label 99; absent when lesions were off"}
        - {name: left_cerebral_white_matter, unit: mm3}
        - {name: right_cerebral_white_matter, unit: mm3}
        - {name: left_cerebral_cortex, unit: mm3}
        - {name: right_cerebral_cortex, unit: mm3}
        - {name: left_lateral_ventricle, unit: mm3}
        - {name: right_lateral_ventricle, unit: mm3}
        - {name: left_thalamus, unit: mm3}
        - {name: right_thalamus, unit: mm3}
        - {name: left_hippocampus, unit: mm3}
        - {name: right_hippocampus, unit: mm3}
        - {name: brain_stem, unit: mm3}
        - {name: csf, unit: mm3}
        - {name: flair_t1_brain_dice, description: "How well the FLAIR sits on the T1w: the Dice of their SynthStrip brain masks on the T1w's grid, inside the FLAIR's field of view; absent when lesions were off"}
  qc:
    - {metric: intracranial, op: ">=", value: 900000, description: "An intracranial volume under 0.9 litres is a failed segmentation more often than a head"}
    - {metric: intracranial, op: "<=", value: 2300000, description: "Over 2.3 litres the segmentation took more than the head"}
    - {metric: flair_t1_brain_dice, op: ">=", value: 0.85, description: "FLAIR and T1 may not be aligned: their brain masks agree below 0.85 (a NILS policy), and nothing registers them yet"}
  needs:
    cores-input: threads
    gpu: none
    cores: 4
    memory-gb: 16
    unit-minutes: 45
