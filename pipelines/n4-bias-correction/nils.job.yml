# SPDX-License-Identifier: AGPL-3.0-only
#
# N4 bias field correction: the walking-skeleton anchor (record 43, the proof
# of S2 and S3), v0's descriptor ported to contracts/job/v1.
#
# One session's T1-weighted image in, the same image with its low-frequency
# intensity non-uniformity removed out, by ANTs N4BiasFieldCorrection. No
# model, no GPU, no licence. The input is a release of the selection in the
# BIDS layout with the picks applied (R4), so a session holds the one T1w
# its pick chose; v0's wrapper refused any subject that held more than one,
# which is why it "only works on narrow selections".
#
# What changed from v0:
# - The image is the public ANTs image itself, pinned by its registry
#   manifest digest (R3), the base v0's private wrapper was built FROM.
#   Resolved 2026-09-24: docker manifest inspect answers this digest with a
#   single-platform image manifest (linux/amd64), ANTs 2.6.5.dev1-gfdce4d2
#   on Debian 12. v0's tool-version said 2.5.0, which the image is not.
# - No wrapper script: the image carries bash, and the command below finds
#   each session's T1w in the tree and writes its output beside the BIDS
#   path it came from. No results.json is written, so the runner finds each
#   session's output by the template under x-nils.outputs, and a session
#   without one is a pipeline:qc review item.
# - The work unit is the session (v0 had to use subject, since its renderer
#   could not build a session's path); the parameters are substituted where
#   they stand, since the engine splits the line into words itself and runs
#   no shell of its own.
#
# Record 49 A4: a starter the engine seeds at boot; the roles a session
# needs (a picked T1w), its units run apart, and a unit's typical minutes.
#
# N4's settings, after the review of 2026-10-12 (ANTs wiki,
# N4BiasFieldCorrection). The B-spline distance "should always be set
# explicitly", 100 to 200 mm for a brain, and the wiki's example is 180:
# it is the knob spline_distance, recorded with every run like the others,
# with the cubic order (3) fixed. Left out, ANTs fits one mesh element over
# the whole image. It halves at each of the four levels, so 180 ends at
# 22.5 mm. The convergence (-c) and the histogram sharpening (-t) are ANTs'
# own defaults, written out so a reader of the descriptor sees every
# setting that changes the result. The estimated bias field is written
# beside the corrected image, as a second output, for a check of the
# field itself.
#
# With the pack beside it (record 57 P11, Wave 7b P1; research 03): a
# brain mask restricts the fit to the brain, as the wiki advises, so where
# a session has a brain mask from a run of the synthstrip starter (the
# optional input brain_mask, the newest run's) the fit is held to it with
# -x, and the unit says so; where it has none the whole image is read, and
# the table's mask_used tells the two apart, since they do not compare.
# The pack's rules set the shrink factor from the slices (2 for 1.5 to 3
# mm, 1 above 3 mm; ANTs' 4 is for 1 mm volumes) and the levels (3 for the
# fast goal). The bias field's range is measured with ANTs' own
# MeasureMinMaxMean, inside the mask where one was given, for the pack's
# check that a field is positive. N4 is redundant before FreeSurfer's
# recon-all and SAMSEG, which correct the bias themselves, and can lower a
# FLAIR lesion model's Dice: a workflow will not chain it before them
# (record 57 P7).
#
# Add it:  nils pipeline add pipelines/n4-bias-correction/nils.job.yml
# Run it:  nils run n4-bias-correction --select selection:<name>@<v>
name: n4-bias-correction
schema-version: "0.5"
tool-version: "2.6.5.dev1-gfdce4d2"
description: >-
  Correct the low-frequency intensity non-uniformity (bias field) of each
  session's T1-weighted image with ANTs N4BiasFieldCorrection: the corrected
  image and the estimated bias field. One session is one unit; no GPU, no
  licence.

container-image:
  type: docker
  image: "docker.io/antsx/ants@sha256:59c45f54a1f1dc69134f63bec91a726e41c71c64a16cc21cda0b54526910a3c3"

inputs:
  - id: dimension
    name: Image dimensionality
    type: Number
    description: The image's dimensionality, 3 for a structural volume.
    value-key: "[DIM]"
    default-value: 3
    integer: true
    minimum: 2
    maximum: 4
  - id: shrink_factor
    name: Shrink factor
    type: Number
    description: Downsampling that trades accuracy for speed; 4 is ANTs' default for a volume.
    value-key: "[SHRINK]"
    default-value: 4
    integer: true
    minimum: 1
    maximum: 8
  - id: spline_distance
    name: Spline distance
    type: Number
    description: "The B-spline mesh spacing at the coarsest of N4's four levels, halved at each level; the ANTs wiki gives 100 to 200 mm for a brain, and 180 as its example."
    value-key: "[SPLINE]"
    default-value: 180
    minimum: 100
    maximum: 200
    unit: mm
  - id: levels
    name: Levels
    type: Number
    description: "The resolution levels N4 fits, 50 iterations each, the spline distance halving at each: 4 is ANTs' default; 3 is a smoother, faster field for the fast goal, and its results are not compared with four-level ones."
    value-key: "[LEVELS]"
    default-value: 4
    integer: true
    minimum: 2
    maximum: 4

command-line: >-
  bash -c 'set -u; shopt -s nullglob; cd [InputDataset]; n=0; rc=0;
  c=50; l=[LEVELS]; while [ "$l" -gt 1 ]; do c="${c}x50"; l=$((l-1)); done;
  for f in sub-*/ses-*/anat/*_T1w.nii.gz sub-*/ses-*/anat/*_T1w.nii; do
  a=$(dirname "$f"); d=[OutputLocation]/$a; mkdir -p "$d";
  b=$(basename "$f"); b=${b%.gz}; b=${b%.nii}; b=${b%_T1w};
  m=""; k=-1; for p in $(find [Inputs]/brain_mask -path "*/$a/${b}_desc-brain_mask.nii.gz" 2>/dev/null | sort); do
  q=${p#[Inputs]/brain_mask/}; q=${q#*/}; r=${q%%/*}; if [ "$r" -eq "$r" ] 2>/dev/null && [ "$r" -gt "$k" ]; then k=$r; m=$p; fi; done;
  if [ -n "$m" ]; then echo "$a: the fit is held to the brain mask of synthstrip run $k"; else echo "$a: no brain mask of a synthstrip run, so the fit reads the whole image"; fi;
  N4BiasFieldCorrection -d [DIM] -s [SHRINK] -b "[[SPLINE],3]" -c "[$c,0.0]" -t "[0.15,0.01,200]" ${m:+-x "$m"}
  -i "$f" -o "[$d/${b}_desc-n4_T1w.nii.gz,$d/${b}_desc-n4_biasfield.nii.gz]" || { echo "$a: N4 failed"; rc=1; continue; };
  s=$(MeasureMinMaxMean 3 "$d/${b}_desc-n4_biasfield.nii.gz" ${m:+"$m"} 2>/dev/null | tr -s " " | awk "{for(i=1;i<=NF;i++){v=(\$i ~ /:\$/) ? \$(i+1) : \$(i+2); if(\$i ~ /^Min/) mn=v; if(\$i ~ /^Max/) mx=v; if(\$i ~ /^Mean/) me=v}} END{if(mn==\"\") mn=\"null\"; if(mx==\"\") mx=\"null\"; if(me==\"\") me=\"null\"; printf \"%s %s %s\", mn, mx, me}");
  set -- $s; printf "{\"bias_field_min\": %s, \"bias_field_max\": %s, \"bias_field_mean\": %s, \"mask_used\": %d, \"levels\": %d}\n" "${1:-null}" "${2:-null}" "${3:-null}" "$([ -n "$m" ] && echo 1 || echo 0)" [LEVELS] > "$d/${b}_desc-n4_field.json";
  n=$((n+1)); done; echo "N4 corrected $n images"; exit $rc'

output-files:
  - id: n4_image
    name: N4 bias-corrected T1w
    path-template: "sub-[SubjectLabel]/ses-[SessionLabel]/anat/*_desc-n4_T1w.nii.gz"
  - id: bias_field
    name: N4 bias field
    path-template: "sub-[SubjectLabel]/ses-[SessionLabel]/anat/*_desc-n4_biasfield.nii.gz"

suggested-resources:
  cpu-cores: 2
  ram: 4
  walltime-estimate: 0.2

x-nils:
  contract: 1
  analysis-level: session
  # No version list: every earlier version of the name in a catalog.
  replaces:
    why: "It holds the fit to the brain mask of a synthstrip run where the session has one (the ANTs wiki's advice, research 03), takes the pack's levels knob, and writes the bias field's range for the pack's check; the earlier versions fitted the whole image and measured nothing of the field."
  input:
    layout: bids
    roles: [t1w]
  inputs:
    - id: brain_mask
      type: "derivative:mask"
      optional: true
      description: "The sessions' brain masks (*_desc-brain_mask.nii.gz) from a run of the synthstrip starter; where a session has one the fit is held to it (-x), where it has none the whole image is read"
  units: apart
  outputs:
    - id: n4_image
      kind: output
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-n4_T1w.nii.gz"
      media-type: application/x-nifti+gzip
    - id: bias_field
      kind: output
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-n4_biasfield.nii.gz"
      media-type: application/x-nifti+gzip
    - id: field
      kind: table
      format: json
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-n4_field.json"
      columns:
        - {name: bias_field_min, description: "The smallest value of the estimated bias field, inside the brain mask where one was given: a field is positive everywhere it is right (the pack's check)"}
        - {name: bias_field_max, description: "Its largest value"}
        - {name: bias_field_mean, description: "Its mean"}
        - {name: mask_used, type: integer, description: "1 where the fit was held to a synthstrip brain mask, 0 where it read the whole image; the two are not comparable"}
        - {name: levels, type: integer, description: "The resolution levels fitted"}
  needs:
    gpu: none
    memory-gb: 4
    cores: 2
    unit-minutes: 2
