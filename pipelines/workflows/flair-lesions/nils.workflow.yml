# SPDX-License-Identifier: AGPL-3.0-only
#
# FLAIR lesions (Wave 7b, section 8.2; record 57 P7): the FLAIR registered
# to the T1w by the registration family (section 7), then SAMSEG with
# lesions on, SynthSeg of the T1w, and segcsvd's WMH and PVS, which reads
# the SynthSeg label map as its typed input.
#
# The plan checks each link before anything runs (section 8.3): the
# registration's aligned FLAIR satisfies SAMSEG's and segcsvd's
# `aligned(flair, t1w)`; SynthSeg's label map feeds segcsvd's synthseg
# input, and the plan names which SynthSeg (version, robust, of the T1w) the
# segcsvd key carries. Until the registration family is in the catalog the
# plan refuses the register step by name, and says that SAMSEG with lesions
# is then accepted only with its header-alignment check on.
nils_workflow: 1
name: flair-lesions
title: FLAIR lesions
what: "Register the FLAIR to the T1w, segment lesions with SAMSEG, then white-matter hyperintensities and perivascular spaces with segcsvd over a SynthSeg of the T1w"
steps:
  - id: register
    family: registration
    version: current
    goal: standard
  - id: samseg
    pipeline: samseg-lesions
    version: current
    goal: standard
    switches: {lesions: "on"}
  - id: synthseg
    pipeline: synthseg
    version: current
    goal: standard
  - id: segcsvd
    pipeline: segcsvd
    version: current
    goal: standard
    knobs: [wmh_threshold, pvs_threshold]
links:
  - {from: register.aligned_flair, to: samseg.flair}
  - {from: register.aligned_flair, to: segcsvd.flair}
  - {from: synthseg.labels, to: segcsvd.synthseg}
