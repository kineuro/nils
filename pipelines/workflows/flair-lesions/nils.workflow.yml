# SPDX-License-Identifier: AGPL-3.0-only
#
# FLAIR lesions (Wave 7b, section 8.2; record 57 P7): the FLAIR registered
# to the T1w by the registration family (section 7), then SAMSEG with
# lesions on, SynthSeg of the T1w, and segcsvd's WMH and PVS, which reads
# the SynthSeg label map as its typed input.
#
# The plan checks each link before anything runs (section 8.3): the
# registration's aligned FLAIR (the members' typed output flair_aligned:
# kind image, role flair, contrast FLAIR, on the t1w grid) feeds SAMSEG's
# and segcsvd's typed input aligned_flair, which each reads in place of
# the header resampling, and so meets their `aligned(flair, t1w)`;
# SynthSeg's label map feeds segcsvd's synthseg input, and the plan names
# which SynthSeg (version, robust, of the T1w) the segcsvd key carries.
# The register step runs the family's within_session task over the scope;
# a site whose catalog does not hold the registration family has the step
# refused by name, and SAMSEG with lesions is then accepted only with its
# header-alignment check on.
nils_workflow: 1
name: flair-lesions
title: FLAIR lesions
what: "Register the FLAIR to the T1w, segment lesions with SAMSEG, then white-matter hyperintensities and perivascular spaces with segcsvd over a SynthSeg of the T1w"
steps:
  - id: register
    family: registration
    version: current
    goal: standard
    switches: {task: within_session}
  - id: samseg
    pipeline: samseg-lesions
    version: current
    goal: standard
    switches: {lesions: "on"}
  - id: synthseg
    pipeline: synthseg
    version: current
    goal: standard
  - id: segcsvd
    pipeline: segcsvd
    version: current
    goal: standard
    knobs: [wmh_threshold, pvs_threshold]
links:
  - {from: register.flair_aligned, to: samseg.aligned_flair}
  - {from: register.flair_aligned, to: segcsvd.aligned_flair}
  - {from: synthseg.labels, to: segcsvd.synthseg}
