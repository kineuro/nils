# SPDX-License-Identifier: AGPL-3.0-only
#
# postcontrast-full: model r1's full post-contrast pipeline, the fallback
# behind the cascade (record 55 E3, spec 12.2). The engine queues it over
# the stacks a run of postcontrast-cascade marks deferred, given the
# promoted cascade and the parts its card names: the fusion (the cascade's
# own) and the arms.
#
# Per stack: dcm2niix (retried once), SynthMorph's affine to the MNI
# template carrying the template regions and the venous regions onto the
# stack, SynthSeg, SynthStrip; the regions' and the structures' intensities,
# a Frangi vessel filter and the stripped stack's intensity tail (no N4);
# model r1's three frozen arms and its fusion with the stack's header
# evidence, calibrated per site. It answers only T1-type brain at a
# calibrated site and says "not sure" everywhere else, as the cascade.
# Since 0.2.0 a stack left with no image arm, for any reason (no usable
# volume, no segmentation after the card, its retry and the CPU, or no arm
# its features could feed), is "not sure" with that reason, where model r1
# would answer from its header evidence alone, which no test compared with
# a reference (record 55 E3).
#
# With a card the tools run in waves on it (several SynthSeg processes,
# each held to a share of the card) while worker processes convert before
# and compute the features after; without one, every tool runs on the CPU,
# one SynthSeg process per 96 GB of the memory given.
#
# gpu-memory-gb is one full wave, measured in T25 (record 55): two
# SynthSeg processes of 20,000 MiB beside 20,000 for SynthMorph and
# SynthStrip hold 60,000 MiB, so the run takes one wave at a time, as T25's
# did. The engine tells the unit what it leased (NILS_GPU_MEMORY_GB) and
# the tool holds no more: a site that declares less gets fewer SynthSeg
# processes a wave, then SynthSeg alone after each wave, then the CPU; a
# card smaller than the need runs the unit on the CPU. The Frangi filter
# goes on the card only where every worker's share (2,200 MiB) fits beside
# a full wave; at 60 GB it runs on the CPU, as model r1 itself ran it.
#
# The image (Dockerfile.full) holds of FreeSurfer 8.2.0 only the parts the
# Synth tools run on, copied unchanged from FreeSurfer's pinned image (its
# Python, the three tools, their networks, the MNI 2009c template and the
# colour table), with the card's runtimes beside them: no MATLAB Runtime,
# no FSL or CorTechs tools, no licence key, no ptxas or Triton. Its
# NOTICE and the licences it ships say whose terms each part is under. The
# weights and the atlases are the run's model inputs, never part of the
# image; it runs offline. The release does not build this image (its
# build needs more disk than a hosted runner): it is published from a
# machine with the room by scripts/publish-postcontrast-full.sh, which
# pins the digest below, and the release ships this pin as it is.
#
# A site the fusion has no calibration pair for gets no answer
# (no-calibration). Since 0.3.0 it can fit its own pair without a new
# model bundle or image: the raw_scores switch has the run score such
# T1-type brain stacks too and write their fused log-odds before any
# calibration (score_raw), never a probability or a proposal; the site
# labels them and fits the pair with `nils-postcontrast calibrate`
# (at least 20 labelled stacks of each class), and sets the pair file as the
# site file post_contrast_calibration (`nils pipeline secret set
# post_contrast_calibration --file /absolute/path/pair.json`; the engine
# takes an absolute path, since it reads the file where it runs), which
# every run then adds beside the fusion's pairs (a site the fusion has a
# pair for is refused: a certified pair is never replaced). The run records
# the sites the file set, never the pairs. The raw-score columns below are
# on every row of every run, null without the switch.
name: postcontrast-full
schema-version: "0.5"
tool-version: "0.3.0"
description: >-
  Answer post_contrast with model r1's full pipeline on the T1-type brain
  stacks the cascade defers; "not sure" elsewhere.

container-image:
  type: docker
  image: "ghcr.io/kineuro/nils-postcontrast-full@sha256:eff962fabf7a97b2a41cf727bc5dc564ea9db9a966033695c7df7835612255e9"

inputs:
  - id: threads
    name: Workers
    type: Number
    integer: true
    minimum: 1
    maximum: 64
    description: Worker processes computing the stacks' features.
    value-key: "[THREADS]"
    command-line-flag: --threads
    default-value: 12
    optional: true
  - id: memory
    name: Memory
    type: Number
    integer: true
    minimum: 96
    maximum: 1024
    description: The memory in GB the run may use; SynthSeg on the CPU runs at most one process per 96 GB of it (one large volume held 85 GB).
    value-key: "[MEMORY]"
    command-line-flag: --memory-gb
    default-value: 96
    optional: true
  - id: synthseg_procs
    name: SynthSeg processes
    type: Number
    integer: true
    minimum: 1
    maximum: 16
    description: SynthSeg processes a wave runs on a card at once.
    value-key: "[SSPROCS]"
    command-line-flag: --synthseg-procs
    default-value: 2
    optional: true
  - id: raw_scores
    name: Raw scores
    type: Flag
    description: "Score T1-type brain stacks at a site with no calibration too and write their fused log-odds (score_raw), never a probability or a proposal, for the site to fit its calibration pair on with nils-postcontrast calibrate."
    value-key: "[RAW]"
    command-line-flag: "--raw-scores"
    default-value: false

command-line: "nils-postcontrast full --stacks [Manifest] --inputs [Inputs] --output [OutputLocation] [THREADS] [MEMORY] [SSPROCS] [RAW]"

output-files:
  - id: scores
    name: The stack's post-contrast answer or why it has none
    path-template: "postcontrast/{stack}.json"

suggested-resources:
  cpu-cores: 16
  ram: 96
  walltime-estimate: 1.0

x-nils:
  contract: 1
  analysis-level: stack
  input:
    layout: stacks
    header: true
    geometry: true
    contrast: true
  inputs:
    - id: fusion
      type: model
      description: Model r1's frozen fusion (kind head, task axis:post_contrast, JSON) with its per-site calibration and threshold, which the cascade names
    - id: arms
      type: model
      description: Model r1's three frozen image arms with the atlases they were fitted on (JSON), of the same frozen model as the fusion
    - id: cascade
      type: model
      description: The cascade (task axis:post_contrast), whose card names the fusion and the arms by digest
  secrets:
    - id: post_contrast_calibration
      mount: /secrets/post_contrast_calibration.json
      env: NILS_PC_CALIBRATION
      optional: true
      # a site file (the site's calibration pair), not a secret: the tables echo its digest and site lines, so it is not swept
      sweep: false
  outputs:
    - id: scores
      kind: table
      format: json
      path-template: "postcontrast/{stack}.json"
      media-type: application/json
      columns:
        - {name: p_given, description: "The fused, calibrated probability that contrast was given; null where the stack was not scored"}
        - {name: value, type: text, description: "given or not_given where the stack is answered, else null"}
        - {name: confidence, description: "The answer's probability, max(p, 1 - p)"}
        - {name: answers, type: integer, description: 1 when the stack is answered, else 0}
        - {name: stage, type: text, description: "full when the full pipeline scored the stack; null otherwise"}
        - {name: reason, type: text, description: "Why the stack has no answer: sealed, not-mr, not-t1-brain, no-calibration, no-files, not-sure, no-usable-volume, no-segmentation, no-image-arm, worker-died or step-failed (no image arm, so no certified answer; the last two are the run's own failures, not the data's); null when answered"}
        - {name: arms, type: text, description: "The image arms the stack had (T, U, V); a failed tool leaves the arms it could not feed out, as model r1"}
        - {name: failed_steps, type: text, description: "The steps that failed for the stack: convert, tools, base, tail, features"}
        - {name: score_raw, description: "With raw_scores: the fused log-odds before any calibration of a T1-type brain stack at a site with no calibration that has an image arm, for the site to fit its pair on; null elsewhere and without raw_scores. Never a probability"}
        - {name: site, type: text, description: "With raw_scores: the stack's site key as the fusion sees it (<cohort> <make>); null where its cohort is none the fusion knows, and without raw_scores"}
        - {name: make, type: text, description: "With raw_scores: the scanner's make as the site key spells it (Siemens, GE, Philips, Canon/Toshiba or other); null without it"}
        - {name: cohort_candidates, type: text, description: "With raw_scores: a JSON list of the dataset, batch and cohort names the stack belongs to, through the fusion's cohort aliases, in the order the site key is looked for; a site builds its key as one of them and the make. Null without raw_scores"}
        - {name: cascade_digest, type: text, description: The cascade}
        - {name: fusion_digest, type: text, description: The cascade's fusion}
        - {name: arms_digest, type: text, description: The arms}
  needs:
    gpu: optional
    memory-gb: 96
    gpu-memory-gb: 60
    cores: 16
    cores-input: threads
  proposals:
    - axis: post_contrast
      description: given or not_given per answered T1-type brain stack the cascade deferred, with the calibrated probabilities, by the cascade's digest
