[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nils-bodypart"
version = "0.1.0"
description = "v0's body-part detector as a NILS pipeline image: embed, seed, train and infer"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
# What the rules, the head and the file formats need. The encoders' stack
# (torch, open_clip, transformers) is the `encoders` extra, so the tests run
# without it. The image pins every version in constraints.txt.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydicom>=3.0",
    "pillow>=10",
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.3",
]

[project.optional-dependencies]
encoders = [
    "torch",
    "torchvision",
    "open_clip_torch>=2.24",
    "transformers>=4.50,<5",
    "timm>=1.0",
    "huggingface_hub>=0.30",
]
test = ["pytest>=8", "pyyaml>=6", "jsonschema>=4"]

[project.scripts]
nils-bodypart = "nils_bodypart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
