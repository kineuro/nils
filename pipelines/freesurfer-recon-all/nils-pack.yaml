# SPDX-License-Identifier: AGPL-3.0-only
#
# The pack of FreeSurfer recon-all (record 57 P11, Wave 7b P1), from the
# pack study's research 01 (recon-all and recon-all-clinical, FreeSurfer
# 7.4.1 against 8.2.0) and its fact counts (step 2): on the archive 10,785
# sessions meet the hard needs below, 6,661 more hold a 3D T1 labelled
# post-contrast (SynthSR runs first; 3,815 of them in sessions where every
# series carries a contrast tag, so the label is read as a caveat, never a
# skip), and 13,620 are routed to recon-all-clinical (5,219 with a 3D T1
# coarser than 1.3 mm, of which about 4,700 lie at 1.3 to 1.5 mm and run
# here flagged under the 1.5 mm line; 6,964 with a 2D T1 only; 1,311 with
# no T1). 797 of the sessions are finer than 0.9 mm on every side (-hires
# at research grade).
nils_pack: 1
pipeline:
  name: freesurfer-recon-all
  descriptor_sha256: "sha256:ce1ed192112f944792b20af661f8153f52b75c9af6842c580f6b1dbed3807af1"
  version: "1.0"
goals:
  goal: [fast, standard, research]
  # -3T is a cohort's fixed choice, never mixed within one (OtherUsefulFlags)
  three_tesla: ["off", "on"]
  # -bigventricles for hydrocephalus or severe atrophy (the 6.0 notes); the
  # ventricle z-score against the cohort is no fact yet, so a person chooses
  big_ventricles: ["off", "on"]
needs:
  t1w:
    hard:
      - when: "dimension == '3D'"
        words: "the T1 is 2D; recon-all needs a 3D T1 at 1.5 mm or finer, and recon-all-clinical takes this one"
        source: "Glasser and Greve on the FreeSurfer list; recon-all-clinical wiki (record 57, research 01)"
      - when: "voxel_max_mm <= 1.5"
        words: "a side of the T1's voxel is over 1.5 mm; recon-all needs 1.5 mm or finer, and recon-all-clinical takes this one"
        source: "Fischl on the FreeSurfer list (voxels under 1.3 mm or so); the 1.5 mm line is the spec's (record 57, research 01, step 2)"
    soft:
      - when: "voxel_max_mm <= 1.3"
        words: "a side of the T1's voxel is between 1.3 and 1.5 mm, coarser than the 1.3 mm recon-all is made for; its results are kept apart (voxel class coarse)"
        source: "Fischl on the FreeSurfer list (record 57, research 01)"
      - when: "post_contrast != 'given'"
        words: "the T1 is labelled post-contrast: grey matter and thickness read 3 to 17 % high and white matter 1.7 % low in FreeSurfer 6 and 7, so SynthSR makes a synthetic T1 first; the label itself is a filled contrast tag in many sessions"
        source: "Eur Radiol 2022 (doi 10.1007/s00330-021-08405-8); Iglesias and Gopinath on the FreeSurfer list (record 57, research 01; step 2)"
      # not a need yet: age at scan (adults only) waits for a provider; the registry
      # gives no age until the clinical import carries one, so a need on age_years
      # would put a cannot-tell caveat on every unit
      - when: "not (diagnosis == 'MS' or diagnosis == 'multiple sclerosis' or diagnosis == 'Multiple sclerosis')"
        words: "MS: the white and pial surfaces can be wrong near lesions, which are labelled WM-hypointensities; lesion filling changed no FreeSurfer volume"
        source: "Eur Radiol 2018 (doi 10.1007/s00330-018-5710-x) (record 57, research 01)"
  host:
    soft:
      - when: "host.memory_gb >= 32"
        words: "the host has less than 32 GB; FreeSurfer 8's recon-all holds about 24 GB and has peaked near 80"
        source: "FreeSurfer 8 release notes and rel8notes (record 57, research 01)"
knobs:
  threads:
    what: "the OpenMP threads one session uses; mris_fix_topology is held to one thread whatever this says, so the result does not follow the count"
    comparability: none
    set_by: person
  synthsr:
    what: "SynthSR makes a synthetic 1 mm MPRAGE first and recon-all runs on it, the maintainers' route for a post-contrast 3D T1"
    cost: "a few minutes more"
    changes: [subject, aseg, quality]
    comparability: breaks
    set_by: rule
  hires:
    what: "conform to the scan's own submillimetre voxel rather than 1 mm"
    cost: "much longer and more memory"
    changes: [subject, aseg, quality]
    comparability: breaks
    set_by: rule
  three_t:
    what: "the 3 T N3 parameters and the Schwartz 3 T atlas"
    changes: [subject, aseg]
    comparability: breaks
    set_by: rule
  bigventricles:
    what: "the ventricle-aware registration for hydrocephalus or severe atrophy"
    changes: [subject, aseg]
    comparability: breaks
    set_by: rule
  qcache:
    what: "the smoothed fsaverage maps, files added for research grade"
    cost: "minutes"
    changes: [subject]
    comparability: additive
    set_by: rule
  voxel_class:
    what: "fine for a T1 at 1.3 mm or finer, coarse for 1.3 to 1.5 mm: the two are never pooled"
    comparability: breaks
    set_by: rule
variants:
  clinical:
    pipeline: freesurfer-recon-all-clinical
    words: "recon-all-clinical takes a T1 of any resolution, 2D or 3D"
rules:
  - id: route-to-recon-all-clinical
    when: "not (t1w.dimension == '3D' and t1w.voxel_max_mm <= 1.5)"
    route: clinical
    why: "no T1 of the session meets recon-all's needs; recon-all-clinical is made for 2D and thick scans"
    source: "Greve on the FreeSurfer list, 2024-12-10; recon-all-clinical wiki (record 57, research 01)"
  - id: coarse-voxel-kept-apart
    when: "t1w.voxel_max_mm > 1.3"
    set: {voxel_class: coarse}
    why: "a side between 1.3 and 1.5 mm runs, flagged, and its results never pool with finer ones"
    source: "Fischl on the FreeSurfer list; the spec's 1.5 mm line (record 57, research 01, step 2)"
  - id: synthsr-first-for-a-post-contrast-t1
    when: "t1w.post_contrast == 'given'"
    set: {synthsr: true}
    why: "surfaces on an enhanced T1 would probably fail; SynthSR then the standard recon-all"
    source: "Iglesias and Gopinath on the FreeSurfer list, 2024-06 (record 57, research 01)"
  - id: hires-at-research-grade
    when: "goal == 'research' and t1w.voxel_max_mm < 0.9"
    set: {hires: true}
    why: "native submillimetre reconstruction for a T1 finer than 0.9 mm at research grade"
    source: "SubmillimeterRecon wiki (record 57, research 01)"
  - id: three-tesla-as-the-cohort-chose
    when: "three_tesla == 'on'"
    set: {three_t: true}
    why: "-3T is set for a whole cohort or not at all"
    source: "OtherUsefulFlags wiki (record 57, research 01)"
  - id: big-ventricles-as-chosen
    when: "big_ventricles == 'on'"
    set: {bigventricles: true}
    why: "hydrocephalus or severe atrophy, the person's call until the ventricle z-score is a fact"
    source: "FreeSurfer 6.0 release notes (record 57, research 01)"
  - id: qcache-at-research-grade
    when: "goal == 'research'"
    set: {qcache: true}
    why: "the smoothed maps are cheap and research wants them"
    source: "recon-all source (record 57, research 01)"
checks:
  - {metric: euler_lh, op: ">=", action: flag, cohort: true, stratum: [site, vendor, field_strength, sequence, post_contrast], min_sessions: 30, z: 3.29, source: "Rosen et al. 2018; Monereo-Sanchez et al. 2021 (record 57, research 01)", words: "the left hemisphere's Euler number is far below its cohort's: a surface a person should look at"}
  - {metric: euler_rh, op: ">=", action: flag, cohort: true, stratum: [site, vendor, field_strength, sequence, post_contrast], min_sessions: 30, z: 3.29, source: "Rosen et al. 2018; Monereo-Sanchez et al. 2021 (record 57, research 01)", words: "the right hemisphere's Euler number is far below its cohort's: a surface a person should look at"}
  - {metric: intracranial, op: ">", value: 0, action: fail, source: "FreeSurfer 8.0 known issues (record 57, research 01)", words: "an intracranial volume of 0 is FreeSurfer 8.0's csvprint fault, not a head: the unit's table is not to be trusted"}
  - {metric: brain_segmentation, op: "!=", action: flag, cohort: true, min_sessions: 10, source: "fsqc outlier detection, 10 subjects or more (record 57, research 01)"}
  - {metric: cortex, op: "!=", action: flag, cohort: true, min_sessions: 10, source: "fsqc outlier detection, 10 subjects or more (record 57, research 01)"}
  - {metric: cerebral_white_matter, op: "!=", action: flag, cohort: true, min_sessions: 10, source: "fsqc outlier detection, 10 subjects or more (record 57, research 01)"}
licence:
  spdx: "LicenseRef-FreeSurfer"
  redistributable: false
  site_file: {env: FS_LICENSE, mount: /opt/fs/license.txt}
  terms: {url: "https://surfer.nmr.mgh.harvard.edu/fswiki/FreeSurferSoftwareLicense", version: "1.0 (2011)"}
  accept: true
resources:
  memory_gb: 32
  minutes: 420
  gpu: none
  by_input:
    - {when: "goal == 'research' and t1w.voxel_max_mm < 0.9", memory_gb: 48, minutes: 900}
# Wave 7b, section 8.3: what a workflow's plan says of a link into recon-all.
links:
  redundant:
    bias_correction: "N4 before recon-all is redundant: recon-all corrects the bias itself in its own steps (record 57, research 03)"
comparability: {}
tests: []
source:
  image: "docker.io/freesurfer/freesurfer@sha256:5648104ca75a24f6ee5a8786146f99b405c2bda1da12bff723a15056da8ddf6b"
  probe: {command: "recon-all -version", expect: "freesurfer"}
  key_files: ["bin/recon-all", "bin/rca-surfreg", "build-stamp.txt"]
