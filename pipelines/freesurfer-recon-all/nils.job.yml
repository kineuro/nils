# SPDX-License-Identifier: AGPL-3.0-only
#
# FreeSurfer recon-all: the field's reference for cortical thickness and
# subcortical volumes (record 49 R1, the last of the first analyses), a
# starter the engine seeds at boot.
#
# One session's T1-weighted image in; the whole FreeSurfer subject folder
# as one archive, and the aseg volumes as a table out. SurfaceHoles is the
# declared check: the topological defects before fixing, which grow as the
# Euler number falls, 200 marking a surface a person should look at.
#
# It reads the lab's FreeSurfer licence as a secret input (record 49 R3):
# `x-nils.secrets` mounts the file the site set with `nils pipeline secret
# set freesurfer_license --file <path>` read-only into this pipeline's
# containers alone and names it in FS_LICENSE, never in an output, a log or
# the run's record. A run is refused before it starts where the site has
# not set it.
#
# Each session runs in a container of its own (`x-nils.units: apart`), so
# the lane runs as many side by side as its budget holds, and a run that
# stopped keeps the sessions it finished.
#
# The image is FreeSurfer 8.2.0, pinned by its registry manifest digest,
# resolved 2026-09-24 by a registry manifest request, not pulled. It
# carries the fix for 8.2.0's expert-options bug (a recon-all given an
# expert-options file stopped at the surface registration): its
# bin/recon-all and bin/rca-surfreg have the checksums of those in
# fs820_updates.sh's patch of 2026-06-25. The bug only touched a run given
# such a file (by -expert, or left in the subject by an earlier run); this
# one starts each session in a new folder without one.
#
# The pack beside this descriptor (nils-pack.yaml, record 57 P11, Wave 7b
# P1) chooses the knobs below per session from the registry's facts and
# the person's goal, as research 01 of the pack study found them: SynthSR
# before recon-all for a post-contrast 3D T1 (Iglesias, Gopinath), -hires
# under 0.9 mm at research grade, -3T as a cohort's fixed choice,
# -bigventricles as a person's switch, -qcache at research grade, and the
# voxel class that keeps a 1.3 to 1.5 mm T1 apart in the comparability
# key. Two of the research's fixed settings are set in the command for
# every unit: FS_V8_XOPTS=1, the 8.x bundle recon-all runs by default, made
# explicit so a reader sees it, and mris_fix_topology -threads 1 through an
# expert-options file, so a run is the same whatever its thread count (the
# 7.4.0 known issue). The Euler number of each hemisphere's unfixed surface
# is a second table, the pack's cohort check (Rosen 2018). A T1 the pack's
# hard needs refuse (2D, or coarser than 1.5 mm) is routed to the
# freesurfer-recon-all-clinical starter by the pack's rule.
#
# Memory: FreeSurfer 8's deep-learning steps hold far more than 7 did. Its
# release notes give about 24 GB, and its install notes (rel8notes) about
# 80 GB in use at one point of a recon-all, which a machine of 32 GB
# carries only with nothing else running. A unit declares 32 GB, up from
# the 8 that fitted FreeSurfer 7.
name: freesurfer-recon-all
schema-version: "0.5"
tool-version: "8.2.0"
description: >-
  Run FreeSurfer 8.2.0 recon-all on each session's T1-weighted image: the
  subject folder as one archive, and the volumes of aseg with the
  intracranial volume and the surface holes as a table. One session is
  one unit; CPU, hours a session, the lab's licence.

container-image:
  type: docker
  image: "docker.io/freesurfer/freesurfer@sha256:5648104ca75a24f6ee5a8786146f99b405c2bda1da12bff723a15056da8ddf6b"

inputs:
  - id: threads
    name: Threads
    type: Number
    description: The threads recon-all's OpenMP steps use.
    value-key: "[THREADS]"
    default-value: 2
    integer: true
    minimum: 1
    maximum: 32
  - id: synthsr
    name: SynthSR first
    type: Flag
    description: "Make a synthetic 1 mm MPRAGE of the T1 with mri_synthsr and run recon-all on it: the maintainers' route for a post-contrast 3D T1, whose surfaces would otherwise likely fail (record 57, research 01). A rule turns it on where the T1 is labelled post-contrast; the unit is flagged by the pack's caveat. Its outputs are not compared with those of a native T1."
    value-key: "[SYNTHSR]"
    command-line-flag: "--synthsr"
    default-value: false
  - id: hires
    name: Native submillimetre
    type: Flag
    description: "recon-all -hires: conform to the scan's own voxel size rather than 1 mm, for a 3D T1 finer than 0.9 mm at research grade (the SubmillimeterRecon wiki). Longer, more memory; its outputs are not compared with 1 mm ones."
    value-key: "[HIRES]"
    command-line-flag: "-hires"
    default-value: false
  - id: three_t
    name: 3 T parameters
    type: Flag
    description: "recon-all -3T: the 3 T N3 parameters and the Schwartz 3 T atlas (OtherUsefulFlags). A cohort's fixed choice, never mixed within one: it changes the talairach and the nu volumes."
    value-key: "[THREE_T]"
    command-line-flag: "-3T"
    default-value: false
  - id: bigventricles
    name: Big ventricles
    type: Flag
    description: "recon-all -bigventricles: the ventricle-aware registration for hydrocephalus or severe atrophy (the 6.0 release notes). It changes the aseg and the surfaces."
    value-key: "[BIGVENTRICLES]"
    command-line-flag: "-bigventricles"
    default-value: false
  - id: qcache
    name: Smoothed maps
    type: Flag
    description: "recon-all -qcache: the smoothed fsaverage maps (0 to 25 mm FWHM), files added for research grade; nothing else changes."
    value-key: "[QCACHE]"
    command-line-flag: "-qcache"
    default-value: false
  - id: voxel_class
    name: Voxel class
    type: String
    description: "fine where every side of the T1's voxel is 1.3 mm or finer, the input recon-all is made for (Fischl); coarse where a side is between 1.3 and 1.5 mm, which the pack admits flagged and keeps apart in the comparability key. A rule sets it from the registry's facts; the unit's log says it."
    value-key: "[VOXEL_CLASS]"
    value-choices: [fine, coarse]
    default-value: fine

command-line: >-
  bash -c 'set -u; shopt -s nullglob; cd [InputDataset]; export FS_V8_XOPTS=1;
  for f in sub-*/ses-*/anat/*_T1w.nii.gz; do
  a=$(dirname "$f"); s=$(echo "${a%/anat}" | tr / _); d=[OutputLocation]/$a; mkdir -p "$d"; w=$(mktemp -d [OutputLocation]/.work-XXXXXX);
  echo "$a: voxel class [VOXEL_CLASS]"; printf "mris_fix_topology -threads 1\n" > "$w/expert.opts";
  i="$f"; if [ -n "[SYNTHSR]" ]; then echo "$a: SynthSR first, then recon-all on its image";
  mri_synthsr --i "$f" --o "$w/synthsr.nii.gz" --threads [THREADS] --cpu || { rm -rf "$w"; continue; }; i="$w/synthsr.nii.gz"; fi;
  recon-all -all -s "$s" -i "$i" -sd "$w" -threads [THREADS] -expert "$w/expert.opts" [HIRES] [THREE_T] [BIGVENTRICLES] [QCACHE] || { rm -rf "$w"; continue; };
  SUBJECTS_DIR="$w" asegstats2table --subjects "$s" --meas volume --tablefile "$d/${s}_desc-aseg_volumes.tsv";
  e() { mris_euler_number "$1" 2>/dev/null | sed -n "s/.* = \(-\{0,1\}[0-9][0-9]*\) --> .*/\1/p" | head -n 1; };
  el=$(e "$w/$s/surf/lh.orig.nofix"); er=$(e "$w/$s/surf/rh.orig.nofix");
  printf "{\"euler_lh\": %s, \"euler_rh\": %s}\n" "${el:-null}" "${er:-null}" > "$d/${s}_desc-recon_quality.json";
  tar -C "$w" -czf "$d/${s}_desc-freesurfer_subject.tar.gz" "$s";
  rm -rf "$w"; done'

x-nils:
  contract: 1
  analysis-level: session
  # It fixes the earlier versions (the review of 2026-10-12), so a new
  # run no longer takes them; their runs and results keep their names.
  # No version list: every earlier version of the name in a catalog.
  replaces:
    why: "It takes the knobs the pack's rules choose per session (SynthSR before recon-all for a post-contrast T1, -hires, -3T, -bigventricles, -qcache, the voxel class), fixes FS_V8_XOPTS=1 and mris_fix_topology -threads 1 (an expert-options file, which this image's recon-all reads correctly), and writes the Euler numbers for the cohort check; the earlier versions had none of these, and the one before them declared 8 GB where FreeSurfer 8 takes 32."
  input:
    layout: bids
    roles: [t1w]
  units: apart
  secrets:
    - id: freesurfer_license
      mount: /opt/fs/license.txt
      env: FS_LICENSE
  outputs:
    - id: subject
      kind: output
      path-template: "sub-{subject}/ses-{session}/anat/sub-{subject}_ses-{session}_desc-freesurfer_subject.tar.gz"
      media-type: application/gzip
    - id: aseg
      kind: table
      format: tsv
      path-template: "sub-{subject}/ses-{session}/anat/sub-{subject}_ses-{session}_desc-aseg_volumes.tsv"
      columns:
        - {name: intracranial, from: "EstimatedTotalIntraCranialVol", unit: mm3, description: "The estimated total intracranial volume (eTIV)"}
        - {name: brain_segmentation, from: "BrainSegVol", unit: mm3}
        - {name: cortex, from: "CortexVol", unit: mm3}
        - {name: cerebral_white_matter, from: "CerebralWhiteMatterVol", unit: mm3}
        - {name: surface_holes, from: "SurfaceHoles", type: integer, description: "Topological defects of the surfaces before fixing"}
        - {name: left_hippocampus, unit: mm3}
        - {name: right_hippocampus, unit: mm3}
        - {name: left_amygdala, unit: mm3}
        - {name: right_amygdala, unit: mm3}
        - {name: left_thalamus, unit: mm3}
        - {name: right_thalamus, unit: mm3}
        - {name: left_lateral_ventricle, unit: mm3}
        - {name: right_lateral_ventricle, unit: mm3}
        - {name: wm_hypointensities, from: "WM-hypointensities", unit: mm3}
    - id: quality
      kind: table
      format: json
      path-template: "sub-{subject}/ses-{session}/anat/sub-{subject}_ses-{session}_desc-recon_quality.json"
      columns:
        - {name: euler_lh, type: integer, description: "The Euler number of the left hemisphere's surface before the topology fix (lh.orig.nofix): 2 - 2 x holes, falling as the defects grow; the pack holds it against the cohort"}
        - {name: euler_rh, type: integer, description: "The right hemisphere's"}
  qc:
    - {metric: surface_holes, op: "<=", value: 200, description: "More holes than 200 is a surface a person should look at"}
  needs:
    cores-input: threads
    gpu: none
    cores: 2
    # FreeSurfer 8: about 24 GB (release notes), up to an 80 GB peak
    # (install notes); 8 GB was a FreeSurfer 7 budget
    memory-gb: 32
    unit-minutes: 420
