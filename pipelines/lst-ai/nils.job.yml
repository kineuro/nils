# SPDX-License-Identifier: AGPL-3.0-only
#
# LST-AI: the white-matter lesions of multiple sclerosis from a
# T1-weighted image and a FLAIR, a deep-learning ensemble (Wiltgen,
# McGinnis et al., NeuroImage: Clinical 42, 2024), the segmentation
# Neuroverify had people check lesion by lesion. A starting point for job
# type 3, check a result (record 55 H3), not a starter the engine seeds.
#
# One session's T1w and FLAIR in; a binary lesion mask, the same lesions
# labelled by where they lie (1 periventricular, 2 juxtacortical, 3
# subcortical, 4 infratentorial, McDonald's regions), and a table of the
# lesion count, voxels and volume out. LST-AI registers both images to
# MNI space itself (greedy), strips the skull there (HD-BET), segments,
# and warps the masks back onto the FLAIR, so both masks are on the
# FLAIR's grid and tied to the FLAIR the unit was given (`grid: flair`). A
# check reads each mask's lesions as its 26-connected components, as
# Neuroverify clustered them; LST-AI's own count in its table joins
# voxels through a face only, so the two counts may differ. The FLAIR is
# the session's T2w with FLAIR among the `+` tokens of its `acq-`, or the
# `_FLAIR` of a tree an older release wrote, as SAMSEG's starter finds
# it; the outputs are named for the FLAIR's stem without its suffix, as
# segcsvd names its WMH. A session without a FLAIR picked is named by the
# pre-flight and skipped by the run; one that reaches this without its
# FLAIR writes nothing here, so the run makes it a pipeline:qc item.
#
# The image is the thin NILS image of this folder (Dockerfile and NOTICE),
# published by scripts/publish-lst-ai.sh as ghcr.io/kineuro/nils-lst-ai and
# pinned below by its own digest. It is built on LST-AI's image,
# jqmcginnis/lst-ai v1.2.0 by LST-AI's authors, the one Neuroverify ran, by
# its registry manifest digest
# sha256:2b2a0d6454e6efff60a350df3c650ae9584f1926338dec7842f9e71912cc6c85
# (resolved 2026-10-11 by a registry manifest request: a single-platform
# linux/amd64 image of 11.1 GB, 30 GB unpacked; CUDA 12.1, TensorFlow 2.13,
# PyTorch 2.1), and runs on the CPU (--device cpu). LST-AI's image is built
# from CompImg/LST-AI's branch jqm/old_hd_bet, with the model weights and
# atlas of that project's release v1.1.0. LST-AI is MIT (its LICENSE,
# Copyright 2023 Julian McGinnis; the weights come with no other licence);
# the image carries HD-BET (Apache-2.0) with HD-BET's parameters (CC-BY-4.0,
# Zenodo record 2540695) and greedy, which in that build is GPL-3.0 or later
# with its source in the image (the project moved to Apache-2.0 in August
# 2026, after it). Its authors say it is for research only and not validated
# for clinical use. The thin image's NOTICE says whose terms each part is
# under.
#
# LST-AI's own image does not run under job contract v1 as it is. Two facts
# of it, read from its manifest, its configuration and its layers, keep it:
# - its ENTRYPOINT is `lst`, which the contract runs before the command
#   line, so the words below reach lst as its own arguments and it refuses
#   them; lst takes a T1w and a FLAIR by their file names, which no word of
#   the contract names for a session;
# - HD-BET reads its parameters from ~/hd-bet_params, and they are in
#   /root/hd-bet_params as files of mode 600 under a /root of mode 700,
#   which the account a run's container has (never root, and with no home
#   of its own) cannot read; without them HD-BET downloads them, and a run
#   has no network.
# The thin image lifts both and changes nothing else: it has no ENTRYPOINT,
# and the parameters are in /opt/hd-bet_params, readable by every account,
# with one line of HD-BET's paths.py naming that folder, whatever the
# account's home is. The command line below is what runs in it.
#
# The pack beside this descriptor (record 57 P11, Wave 7b P1) turns the
# denormal flush on by default and keeps it a switch a site can turn off
# (Wave 7b, section 18): a same-conversion repeat on 2026-10-30 found the
# masks' Dice within the run-to-run noise of unflushed runs. The knob
# flush_denormals carries it into the unit through a sitecustomize module
# every Python process of the container imports.
#
# Run under job contract v1's conditions (docker; an account with no passwd
# entry and no home, on a read-only root; no network; /input read-only,
# /output the one writable folder; 4 cores, 16 GB) on one session's 3D T1w
# and 3D FLAIR at 1 mm, with --fast-mode, a unit wrote all three outputs,
# both masks on the FLAIR's grid and the table's voxels and volume those of
# the mask, and peaked at 10 GB of memory, so the needs keep their 16. Run
# by the engine's docker runtime, the same session's outputs were registered
# as derivatives, the masks tied to the FLAIR. No unit-minutes is declared:
# on a laptop CPU held to 15 W the unit took 2 h 37 min, nearly all of it
# HD-BET's skull strip, whose forward pass ran for hours on that Intel CPU
# until denormals were flushed (torch.set_flush_denormal(True) brought it
# from over 18 minutes to 27 seconds), so the first run on a server says
# what a unit takes.
name: lst-ai
schema-version: "0.5"
tool-version: "1.2.0"
description: >-
  Segment each session's multiple sclerosis lesions with LST-AI from its
  T1w and FLAIR: a lesion mask, the lesions labelled periventricular,
  juxtacortical, subcortical or infratentorial, and their count and
  volume. One session is one unit; CPU.

container-image:
  type: docker
  image: "ghcr.io/kineuro/nils-lst-ai@sha256:85d9647e8be753bd7c354a228750db81566f339283284565a3e2e8eacb458dae"

inputs:
  - id: threshold
    name: Threshold
    type: Number
    description: The probability at which a voxel of the ensemble's map is counted a lesion.
    value-key: "[THRESHOLD]"
    default-value: 0.5
    minimum: 0.05
    maximum: 0.95
  - id: fast
    name: Fast skull strip
    type: Flag
    description: Strip the skull with one HD-BET model instead of five.
    value-key: "[FAST]"
    command-line-flag: "--fast-mode"
    default-value: false
  - id: flush_denormals
    name: Flush denormal floats
    type: Flag
    description: "Have PyTorch flush denormal floats to zero (torch.set_flush_denormal) in every Python process of the unit, through a sitecustomize module on PYTHONPATH: HD-BET's forward pass fell from over 18 minutes to 27 seconds with it on one Intel CPU. The pack turns it on by default, since a same-conversion repeat on 2026-10-30 found the masks' Dice within the run-to-run noise of unflushed runs and the speed effect is on Intel CPUs only; the descriptor alone leaves it off."
    value-key: "[FLUSH]"
    command-line-flag: "--flush-denormals"
    default-value: false
  - id: threads
    name: Threads
    type: Number
    description: The threads LST-AI's registration uses for one session.
    value-key: "[THREADS]"
    default-value: 4
    integer: true
    minimum: 1
    maximum: 32

command-line: >-
  bash -c 'set -u; shopt -s nullglob; cd [InputDataset];
  export OMP_NUM_THREADS=[THREADS] ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS=[THREADS];
  if [ -n "[FLUSH]" ]; then mkdir -p [OutputLocation]/.site; printf "import torch\ntorch.set_flush_denormal(True)\n" > [OutputLocation]/.site/sitecustomize.py;
  export PYTHONPATH="[OutputLocation]/.site${PYTHONPATH:+:$PYTHONPATH}"; echo "denormal floats are flushed to zero"; fi;
  flair() { local g s q; for g in "$1"/*_T2w.nii.gz "$1"/*_FLAIR.nii.gz; do s=$(basename "$g" .nii.gz);
  case "$s" in *_FLAIR) echo "$g"; return;; *_acq-*) q=${s#*_acq-};; *) continue;; esac;
  case "+${q%%_*}+" in *+FLAIR+*) echo "$g"; return;; esac; done; };
  for f in sub-*/ses-*/anat/*_T1w.nii.gz; do
  a=$(dirname "$f"); d=[OutputLocation]/$a; mkdir -p "$d";
  fl=$(flair "$a");
  if [ -z "$fl" ]; then echo "$a holds no FLAIR, so no lesions"; continue; fi;
  c=$(basename "$fl" .nii.gz); c=${c%_*}; w=$(mktemp -d [OutputLocation]/.work-XXXXXX);
  lst --t1 "$f" --flair "$fl" --output "$w/out" --temp "$w/temp" --device cpu
  --threads [THREADS] --threshold [THRESHOLD] [FAST] || { rm -rf "$w"; continue; };
  [ -s "$w/out/space-flair_seg-lst.nii.gz" ] || { echo "$a: lst wrote no mask"; rm -rf "$w"; continue; };
  mv "$w/out/space-flair_seg-lst.nii.gz" "$d/${c}_label-lesion_desc-lstai_mask.nii.gz";
  [ -s "$w/out/space-flair_desc-annotated_seg-lst.nii.gz" ] && mv "$w/out/space-flair_desc-annotated_seg-lst.nii.gz" "$d/${c}_desc-lstai_dseg.nii.gz";
  [ -s "$w/out/lesion_stats.csv" ] && mv "$w/out/lesion_stats.csv" "$d/${c}_desc-lstai_lesions.csv";
  rm -rf "$w"; done'

x-nils:
  contract: 1
  analysis-level: session
  # No version list: every earlier version of the name in a catalog.
  replaces:
    why: "It takes the pack's switch for flushing denormal floats (on by default, decided by one same-conversion repeat), which the earlier versions could not."
  input:
    layout: bids
    roles: [t1w, flair]
  units: apart
  outputs:
    - id: lesions
      kind: mask
      path-template: "sub-{subject}/ses-{session}/anat/*_label-lesion_desc-lstai_mask.nii.gz"
      media-type: application/x-nifti+gzip
      grid: flair
      parts:
        - {key: lesions, words: Lesions, kind: components, labels: nonzero}
    - id: regions
      kind: mask
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-lstai_dseg.nii.gz"
      media-type: application/x-nifti+gzip
      grid: flair
      parts:
        - {key: lesions, words: Lesions, kind: components, labels: nonzero}
        - key: regions
          words: Regions
          kind: labels
          names:
            1: Periventricular
            2: Juxtacortical
            3: Subcortical
            4: Infratentorial
    - id: volumes
      kind: table
      format: csv
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-lstai_lesions.csv"
      columns:
        - {name: lesion_count, from: "Num_Lesions", type: integer, description: "Lesions as LST-AI counts them, voxels joined through a face"}
        - {name: lesion_voxels, from: "Num_Vox", type: integer}
        - {name: lesion_volume, from: "Lesion_Volume", unit: mm3, description: "The lesion mask's volume on the FLAIR's grid"}
  needs:
    cores-input: threads
    gpu: none
    cores: 4
    memory-gb: 16
