# SPDX-License-Identifier: AGPL-3.0-only
#
# The pack of LST-AI (record 57 P11, Wave 7b P1), from the pack study's
# research 02 and 04: the lesion family's first choice for MS with a 3D T1
# and a 3D FLAIR (Wiltgen et al. 2024: Dice 0.67 and lesion-wise F1 0.63
# on 103 public cases, against 0.42 to 0.55 for LST, SAMSEG and nnU-Net).
# On the archive 16,194 sessions hold a 3D T1 and a 3D FLAIR; 11,725 hold
# the pair with one of them 2D (skipped), 3,147 no pair (step 2). The
# denormal-float flush is on by default (Wave 7b, section 18): a
# same-conversion repeat on 2026-10-30 found the masks' Dice within the
# run-to-run noise of unflushed runs, and its speed effect is on Intel CPUs
# only. A site can still turn it off.
nils_pack: 1
pipeline:
  name: lst-ai
  descriptor_sha256: "sha256:f0e4761de2aeb6b1f66f6ac943870ce08b0bb92ae3b80100512f679f03ee0a71"
  version: "1.0"
goals:
  goal: [fast, standard, research]
  # on by default since the same-conversion repeat of 2026-10-30; the first value is the default
  denormal_flush: ["on", "off"]
needs:
  t1w:
    hard:
      - when: "dimension == '3D'"
        words: "the T1 is 2D; LST-AI was trained on 3D T1 and FLAIR pairs"
        source: "Wiltgen et al., NeuroImage: Clinical 2024 (record 57, research 02)"
    soft:
      - when: "diagnosis == 'MS' or diagnosis == 'multiple sclerosis' or diagnosis == 'Multiple sclerosis'"
        words: "LST-AI is trained and validated on MS lesions; another diagnosis is outside its evidence"
        source: "Wiltgen et al. 2024 (record 57, research 02)"
  flair:
    hard:
      - when: "dimension == '3D'"
        words: "the FLAIR is 2D; LST-AI was trained on 3D T1 and FLAIR pairs"
        source: "Wiltgen et al., NeuroImage: Clinical 2024 (record 57, research 02)"
  link:
    soft:
      - when: "aligned(flair, t1w)"
        words: "the FLAIR is not known to be registered to the T1w: LST-AI registers both to MNI itself, so the pair's alignment is read from a registration step or an earlier check"
        source: "LST-AI's method; policy until the registration family (record 57, research 02)"
knobs:
  threshold:
    what: "the probability a voxel of the ensemble's map is counted a lesion at; 0.5 is LST-AI's own"
    changes: [lesions, regions, volumes]
    comparability: breaks
    set_by: person
  fast:
    what: "one HD-BET model for the skull strip instead of five"
    cost: "a fifth of the skull strip's time"
    changes: [lesions, regions, volumes]
    comparability: breaks
    set_by: person
  flush_denormals:
    what: "flush denormal floats to zero in PyTorch, which brought one Intel CPU's skull strip from over 18 minutes to 27 seconds; on by default, since the same-conversion repeat of 2026-10-30 found Dice within the run-to-run noise of unflushed runs"
    changes: [lesions, regions, volumes]
    comparability: breaks
    set_by: rule
  threads:
    what: "the threads the registration uses"
    comparability: none
    set_by: person
rules:
  - id: flush-denormals-as-chosen
    when: "denormal_flush == 'on'"
    set: {flush_denormals: true}
    why: "on by default: the same-conversion repeat of 2026-10-30 found Dice within the run-to-run noise of unflushed runs, and the speed effect is on Intel CPUs only; a person may switch it off"
    source: "the lst-ai starter's measurement; Wave 7b section 18"
checks:
  - {metric: lesion_volume, op: "<=", action: flag, cohort: true, stratum: [site, vendor, field_strength, sequence, post_contrast], min_sessions: 30, source: "policy (record 57, research 02)"}
  - {metric: lesion_count, op: "<=", action: flag, cohort: true, stratum: [site, vendor, field_strength, sequence, post_contrast], min_sessions: 30, source: "policy (record 57, research 02)"}
licence:
  spdx: "MIT"
  redistributable: true
  terms: {url: "https://github.com/CompImg/LST-AI/blob/main/LICENSE", version: "1.2.0"}
  accept: false
resources:
  memory_gb: 16
  gpu: none
# Wave 7b, section 8.3: what a workflow's plan says of a link into LST-AI.
links:
  harmful:
    bias_correction: "N4 before a FLAIR lesion model is possibly harmful: LST-AI was trained on uncorrected images and its own preprocessing normalises the intensities (record 57, research 03)"
comparability: {}
tests: []
source:
  image: "ghcr.io/kineuro/nils-lst-ai@sha256:85d9647e8be753bd7c354a228750db81566f339283284565a3e2e8eacb458dae"
  probe: {command: "lst --help", expect: "--flair"}
  key_files: ["opt/conda/bin/lst", "opt/hd-bet_params"]
