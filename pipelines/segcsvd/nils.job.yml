# SPDX-License-Identifier: AGPL-3.0-only
#
# segcsvd: white-matter hyperintensities on the FLAIR and enlarged
# perivascular spaces on the T1-weighted image, the markers of cerebral
# small vessel disease (record 49 R1, the fourth of the first analyses), a
# starter the engine seeds at boot.
#
# segcsvd reads a SynthSeg 2.0 label map beside each image, so it runs
# after the synthseg starter: that run's label maps are this one's input
# `synthseg` (a derivative of kind mask), and the map of the same T1w
# from the newest synthseg run is taken. The map is resliced onto the T1w's grid with segcsvd's own tool
# first, since segcsvd's T1 mask step reads it on that grid. Where the
# session has a FLAIR, the WMH are segmented on it (segcsvd reslices the
# map itself) and, resliced onto the T1w, they are the WMH prior of the
# PVS step; without one the prior is empty and only the PVS are made. The
# session's FLAIR is its T2w with FLAIR among the `+` tokens of its
# `acq-`, as the release names a T2 FLAIR since record 55 C4 (FLAIR is a
# modifier, never the suffix: `acq-Ax+2D+FLAIR+IRTSE_T2w`), or the
# `_FLAIR` of a tree an older release wrote. The FLAIR and the T1w are
# taken to share the scanner's world coordinates, as two series of one
# session do; they are not registered. segcsvd masks and bias-corrects
# each image itself, from the label map.
#
# segcsvd's README starts from FLAIR and T1 already registered, and its
# WMH step masks the FLAIR with the T1w's label map, so a FLAIR off its T1w
# is masked in the wrong place. Until NILS has a registration step, each
# unit with a FLAIR checks the alignment (the review of 2026-10-12): a
# brain mask of the T1w from its SynthSeg labels (every label but the CSF
# outside the brain, closed by 3 mm and filled), and one of the FLAIR from
# the FLAIR alone, since the image has no skull stripper (an Otsu
# threshold, eroded by 2 mm to cut thin bridges, its largest part grown
# back, closed and filled), both on the T1w's grid. The Dice of the two,
# inside the FLAIR's field of view, is the table's column
# flair_t1_brain_dice; the check holds it against 0.85 (a NILS policy,
# from the review's QC table): below it the session is flagged, a
# pipeline:qc item, not failed, and the unit's log says "FLAIR and T1 may
# not be aligned (brain masks agree at 0.xx)". On three open sessions
# whose two series share the scanner's coordinates (one a 2D FLAIR of
# 3.2 mm slices beside a large stroke) the masks agreed at 0.91 to 0.96,
# and with the FLAIR moved 15 mm at 0.77 to 0.84: the check catches a
# FLAIR off by 10 to 15 mm or more, not a few millimetres. A unit whose
# masks could not be made says so and goes on without the column.
#
# segcsvd's WMH model was trained and validated on white-matter
# hyperintensities of presumed vascular origin, on 3 T FLAIR of vascular
# and neurodegenerative cohorts, never on MS lesions, 1.5 T or contrast
# (the review, research 04): read its WMH in an MS cohort as not validated
# there, and measure MS lesions with samseg-lesions or LST-AI.
#
# The WMH model was trained with a SynthSeg of the FLAIR, and this reads
# the T1w's; and SynthSeg robust and not are different networks (the
# review of the starters' rules, record 57, research 02 and 04). So each
# unit says which SynthSeg it read, in four columns of its table, for a
# result's key to carry: the run (synthseg_run), its pipeline as
# name@version (synthseg_pipeline), whether it ran robust (synthseg_robust,
# 1 or 0) and the contrast it read (synthseg_contrast: the suffix of the
# file the release gave the scan its label map is tied to, FLAIR for a T2w
# with FLAIR among its `acq-` tokens). The run is the folder the map came
# in; the rest is what the engine's manifest says made each derivative
# (`made_by`), and a column the manifest does not answer is left out, as
# the contrast is where the map was never tied to a scan.
#
# One session's T1w (and FLAIR) in; a binary mask and a probability map
# for each target, the WMH named for the FLAIR's stem without its suffix
# and on its grid, the PVS for the T1w's and on its, and a table of the
# WMH and PVS volumes in mm3 out. The thresholds, patch sizes and gammas
# are the authors' (their README). A unit fails, and registers nothing,
# when its label map is missing or a step writes no mask. On one open
# 1 mm session (a 3D T1w and a 3D FLAIR) at 4 cores a unit took 29
# minutes, half of it segcsvd's own bias correction, and under 2 GB of
# memory.
#
# The image is segcsvd rc03 by AICONSlab, GPL-3.0, as its authors publish
# it on Hugging Face (datasets/AICONSlab/segcsvd, docker/segcsvd_rc03.tar.gz,
# sha256 3201c70a...c418fe), unmodified. The authors publish no registry
# image; this digest is a public Docker Hub copy of that archive, checked
# 2026-09-30: its config digest (sha256:ede237f9...) is the one the
# archive loads as, so its layers are the archive's. Loading the archive
# and pushing it gives the same manifest digest. It is 13.4 GB, CPU only
# (its wrappers pass --cpu to the network), and needs no licence file.
#
# A check reads each mask as its parts (record 55 H3, job type 3): the
# WMH and the PVS, each 26-connected component of the mask a part. The
# PVS mask is on the T1w's grid, so it is tied to the T1w the unit was
# given (`grid: t1w`). The WMH mask is on the FLAIR's grid, and the FLAIR
# is no role a unit needs (a session without one gets the PVS alone), so
# it names no grid role: it is tied to the unit's input whose grid it
# matches, the FLAIR.
name: segcsvd
schema-version: "0.5"
tool-version: "rc03"
description: >-
  Segment each session's white-matter hyperintensities on its FLAIR and
  its enlarged perivascular spaces on its T1-weighted image with segcsvd,
  from the session's SynthSeg label map (run synthseg first): a mask and a
  probability map for each, and their volumes in mm3. The WMH model is
  validated for white-matter hyperintensities of vascular origin at 3 T,
  not for MS lesions. One session is one unit; CPU, about half an hour a
  session.

container-image:
  type: docker
  image: "docker.io/frheault/sf-lesionflow-segcsvd@sha256:a4126556fe7fc88802f8813f5ab0d904e117dc799b8eee73a070bf83fe843ff3"

inputs:
  - id: wmh_threshold
    name: WMH threshold
    type: Number
    description: The probability at which a voxel of the WMH map is counted in its mask.
    value-key: "[WMH_THRESHOLD]"
    default-value: 0.35
    minimum: 0.05
    maximum: 0.95
  - id: pvs_threshold
    name: PVS threshold
    type: Number
    description: The probability at which a voxel of the PVS map is counted in its mask.
    value-key: "[PVS_THRESHOLD]"
    default-value: 0.35
    minimum: 0.05
    maximum: 0.95
  - id: threads
    name: Threads
    type: Number
    description: The threads segcsvd's network and tools use for one session.
    value-key: "[THREADS]"
    default-value: 4
    integer: true
    minimum: 1
    maximum: 32

command-line: >-
  bash -c 'set -u; shopt -s nullglob; cd [InputDataset]; rc=0;
  export OMP_NUM_THREADS=[THREADS] ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS=[THREADS];
  flair() { local g s q; for g in "$1"/*_T2w.nii.gz "$1"/*_FLAIR.nii.gz; do s=$(basename "$g" .nii.gz);
  case "$s" in *_FLAIR) echo "$g"; return;; *_acq-*) q=${s#*_acq-};; *) continue;; esac;
  case "+${q%%_*}+" in *+FLAIR+*) echo "$g"; return;; esac; done; };
  for f in sub-*/ses-*/anat/*_T1w.nii.gz; do
  a=$(dirname "$f"); d=[OutputLocation]/$a; mkdir -p "$d";
  b=$(basename "$f" .nii.gz); b=${b%_T1w};
  s=""; n=-1; for p in $(find [Inputs]/synthseg -path "*/$a/${b}_desc-synthseg_dseg.nii.gz" | sort); do
  q=${p#[Inputs]/synthseg/}; q=${q#*/}; r=${q%%/*};
  if [ "$r" -eq "$r" ] 2>/dev/null && [ "$r" -gt "$n" ]; then n=$r; s=$p; fi; done;
  if [ -z "$s" ]; then echo "$f has no SynthSeg label map from a synthseg run: run synthseg on it first"; rc=1; continue; fi;
  k=$(python3 -c "import sys, json; e = [x for x in json.load(open(sys.argv[1])).get(\"derivatives\", {}).get(\"synthseg\", []) if x.get(\"path\") == sys.argv[2]];
  m = (e[0].get(\"made_by\") if e else None) or {}; r = (m.get(\"params\") or {}).get(\"robust\"); g = (m.get(\"grid_stem\") or \"\").split(\"_\");
  c = \"FLAIR\" if g[-1] == \"FLAIR\" or any(\"FLAIR\" in x[4:].split(\"+\") for x in g[:-1] if x.startswith(\"acq-\")) else g[-1];
  print(\" \".join([\"synthseg_run\", str(m.get(\"run\") or sys.argv[3])] + ([\"synthseg_pipeline\", \"%s@%s\" % (m[\"pipeline\"], m[\"version\"])] if m.get(\"pipeline\") and m.get(\"version\") else [])
  + ([\"synthseg_robust\", str(int(r))] if isinstance(r, bool) else []) + ([\"synthseg_contrast\", c] if c.isalnum() else [])))" [Inputs]/manifest.json "${s#[Inputs]/synthseg/}" "$n") || k="synthseg_run $n";
  echo "$f: the SynthSeg label map of run $n ($k)";
  w=$(mktemp -d [OutputLocation]/.work-XXXXXX); mkdir -p "$w/outdir"; export MPLCONFIGDIR=$w HOME=$w;
  fl=$(flair "$a"); c=$(basename "$fl" .nii.gz); c=${c%_*};
  sbtResliceLike "$s" "$f" "$w/synthseg.nii.gz" 1 || { rc=1; rm -rf "$w"; continue; };
  v=""; al="";
  if [ -n "$fl" ]; then
  if al=$(python3 -c "import sys, numpy as np, nibabel as n, scipy.ndimage as d; from skimage.filters import threshold_otsu as o;
  t, f, s = (n.load(x) for x in sys.argv[1:4]); k = d.generate_binary_structure(3, 1);
  on = lambda i, x, q: (lambda m: d.affine_transform(np.asarray(x, np.float32).reshape(i.shape[:3]), m[:3, :3], m[:3, 3], t.shape[:3], order=q))(np.linalg.inv(i.affine) @ t.affine);
  fill = lambda m: np.any([np.moveaxis(np.stack([d.binary_fill_holes(e) for e in np.moveaxis(m, j, 0)]), 0, j) for j in range(3)], 0);
  big = lambda m: (lambda p, c: p == np.bincount(p.ravel())[1:].argmax() + 1 if c else m)(*d.label(m));
  v = on(f, np.ones(f.shape[:3]), 0) > 0.5; g = on(f, f.dataobj, 1); y = g[v & (g > 0)];
  m = g > (o(y) if y.size > 1 and y.min() < y.max() else np.inf); m = d.binary_dilation(big(d.binary_erosion(m, k, 2)), k, 2, mask=m);
  a = fill(d.binary_closing(m, k, 3)) & v; l = np.rint(on(s, s.dataobj, 0)); b = fill(d.binary_closing((l > 0) & (l != 24), k, 3)) & v;
  r = round(2 * float((a & b).sum()) / max(int(a.sum() + b.sum()), 1), 2); print(\"%.2f\" % r);
  r < 0.85 and print(sys.argv[4] + \": FLAIR and T1 may not be aligned (brain masks agree at %.2f)\" % r, file=sys.stderr)" "$f" "$fl" "$w/synthseg.nii.gz" "$a") && [ -n "$al" ];
  then echo "$a: the brain masks of the FLAIR and the T1w agree at $al (Dice)"; else al=""; echo "$a: the FLAIR was not checked against the T1w"; fi;
  segment_wmh "$fl" "$s" "$w/outdir/wmh.nii.gz" 1 "96,128" [WMH_THRESHOLD] 1 false true || { rc=1; rm -rf "$w"; continue; };
  [ -s "$w/outdir/thr_wmh.nii.gz" ] || { echo "$a: segment_wmh wrote no mask"; rc=1; rm -rf "$w"; continue; };
  sbtResliceLike "$w/outdir/thr_wmh.nii.gz" "$f" "$w/prior.nii.gz" 1 || { rc=1; rm -rf "$w"; continue; };
  mv "$w/outdir/thr_wmh.nii.gz" "$d/${c}_label-WMH_desc-segcsvd_mask.nii.gz";
  mv "$w/outdir/wmh.nii.gz" "$d/${c}_label-WMH_desc-segcsvd_probseg.nii.gz";
  v="wmh_volume $d/${c}_label-WMH_desc-segcsvd_mask.nii.gz";
  else echo "$a holds no FLAIR, so no WMH and an empty prior for the PVS";
  python3 -c "import sys, nibabel as n, numpy as np; i = n.load(sys.argv[1]); n.save(n.Nifti1Image(np.zeros(i.shape[:3], np.uint8), i.affine), sys.argv[2])" "$f" "$w/prior.nii.gz" || { rc=1; rm -rf "$w"; continue; }; fi;
  segment_pvs "$f" "$w/synthseg.nii.gz" "$w/prior.nii.gz" "$w/outdir/pvs.nii.gz" "1.0,1.4" 0 false true [PVS_THRESHOLD] || { rc=1; rm -rf "$w"; continue; };
  [ -s "$w/outdir/thr_pvs.nii.gz" ] || { echo "$a: segment_pvs wrote no mask"; rc=1; rm -rf "$w"; continue; };
  mv "$w/outdir/thr_pvs.nii.gz" "$d/${b}_label-PVS_desc-segcsvd_mask.nii.gz";
  mv "$w/outdir/pvs.nii.gz" "$d/${b}_label-PVS_desc-segcsvd_probseg.nii.gz";
  python3 -c "import sys, json, nibabel as n, numpy as np; a = sys.argv[1:]; m = lambda p: float((np.asarray(n.load(p).dataobj) > 0).sum() * np.prod(n.load(p).header.get_zooms()[:3]));
  t = (\"synthseg_pipeline\", \"synthseg_contrast\");
  print(json.dumps(dict((a[i], m(a[i + 1]) if a[i].endswith(\"_volume\") else a[i + 1] if a[i] in t else float(a[i + 1])) for i in range(0, len(a), 2))))" pvs_volume "$d/${b}_label-PVS_desc-segcsvd_mask.nii.gz" $v ${al:+flair_t1_brain_dice $al} $k > "$d/${b}_desc-segcsvd_volumes.json" || { echo "$a: the volumes were not measured"; rc=1; };
  rm -rf "$w"; done; exit $rc'

x-nils:
  contract: 1
  analysis-level: session
  # It fixes the earlier versions (the review of 2026-10-12), so a new
  # run no longer takes them; their runs and results keep their names.
  # No version list: every earlier version of the name in a catalog.
  replaces:
    why: "It says which SynthSeg each unit read (synthseg_run, synthseg_pipeline, synthseg_robust and synthseg_contrast), so a result's key can carry it; the earlier versions did not, though robust and not are different networks and the WMH model was trained with a SynthSeg of the FLAIR, not the T1w's this reads."
  input:
    layout: bids
    roles: [t1w]
  inputs:
    - id: synthseg
      type: "derivative:mask"
      description: "The sessions' SynthSeg label maps (*_desc-synthseg_dseg.nii.gz), from a run of the synthseg starter"
  units: apart
  outputs:
    - id: wmh
      kind: mask
      path-template: "sub-{subject}/ses-{session}/anat/*_label-WMH_desc-segcsvd_mask.nii.gz"
      media-type: application/x-nifti+gzip
      parts:
        - {key: wmh, words: White-matter hyperintensities, kind: components, labels: nonzero}
    - id: wmh_probability
      kind: output
      path-template: "sub-{subject}/ses-{session}/anat/*_label-WMH_desc-segcsvd_probseg.nii.gz"
      media-type: application/x-nifti+gzip
    - id: pvs
      kind: mask
      path-template: "sub-{subject}/ses-{session}/anat/*_label-PVS_desc-segcsvd_mask.nii.gz"
      media-type: application/x-nifti+gzip
      grid: t1w
      parts:
        - {key: pvs, words: Perivascular spaces, kind: components, labels: nonzero}
    - id: pvs_probability
      kind: output
      path-template: "sub-{subject}/ses-{session}/anat/*_label-PVS_desc-segcsvd_probseg.nii.gz"
      media-type: application/x-nifti+gzip
    - id: volumes
      kind: table
      format: json
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-segcsvd_volumes.json"
      columns:
        - {name: wmh_volume, unit: mm3, description: "White-matter hyperintensity volume on the FLAIR, by a model validated for WMH of vascular origin at 3 T and not for MS lesions; absent where the session has no FLAIR"}
        - {name: pvs_volume, unit: mm3, description: "Enlarged perivascular space volume on the T1w"}
        - {name: flair_t1_brain_dice, description: "How well the FLAIR sits on the T1w: the Dice of the T1w's SynthSeg brain mask and a threshold brain mask of the FLAIR on the T1w's grid, inside the FLAIR's field of view; absent where the session has no FLAIR"}
        - {name: synthseg_run, type: integer, description: "The run whose SynthSeg label map the unit read"}
        - {name: synthseg_pipeline, type: text, description: "That run's pipeline, as name@version"}
        - {name: synthseg_robust, type: integer, description: "1 where that run was SynthSeg-robust, 0 where not: the two are different networks, so the WMH and PVS read from one are not comparable with the other's"}
        - {name: synthseg_contrast, type: text, description: "The contrast that SynthSeg read (T1w, FLAIR, T2w), the suffix of the file of the scan its map is tied to, absent where it is tied to none; the WMH model was trained with a SynthSeg of the FLAIR"}
  qc:
    - {metric: pvs_volume, op: ">", value: 0, description: "A starting point: no enlarged perivascular space at all is more often a failed segmentation than an adult brain without any"}
    - {metric: flair_t1_brain_dice, op: ">=", value: 0.85, description: "FLAIR and T1 may not be aligned: their brain masks agree below 0.85 (a NILS policy), and nothing registers them yet"}
  needs:
    cores-input: threads
    gpu: none
    cores: 4
    memory-gb: 8
    unit-minutes: 30
