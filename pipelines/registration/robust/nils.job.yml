# SPDX-License-Identifier: AGPL-3.0-only
#
# The robust member of the registration family (record 57 P6, Wave 7b
# P2): a person's T1w of every visit onto their common space with
# FreeSurfer 8.2.0's mri_robust_register (two visits, `--iscale --satit`,
# the halfway space) and mri_robust_template (three or more visits, the
# unbiased template with `--iscale --satit`), inverse-consistent and robust
# to lesion change (research 07, Table 5 R6). One participant is one
# unit, with every session of the person the selection holds.
#
# Every visit is scored with SynthSeg's quality scores first: a visit
# under 0.50 is left out in words (visits_refused counts them), one under
# 0.65 is registered and flagged, as the SynthSeg starter flags it; only
# when fewer than two visits are left is the unit refused (refused 1 in
# the table). In the pilot of 2026-10-30, 7 of 32 ordinary 3D T1w scored
# 0.528 to 0.608, all on general grey matter, and registered as well as
# the rest. Each
# visit's transform to the common space is kept as an LTA named
# `_from-<ses>_to-midspace_mode-image_xfm`, with the aligned visit and the
# common-space image (the mean of two halfway images, or the robust
# template). The checks: the rigid sanity of every visit's transform (the
# smallest determinant, a flip, the largest translation and rotation), the
# inverse consistency of two visits (the registration composed with its
# halfway inverse, mean displacement at the brain's corners, mm; written,
# not checked, since the halfway transforms make it 0) and the
# smallest Dice of any aligned visit's labels against the template's.
#
# The image is FreeSurfer 8.2.0, pinned by its registry manifest digest
# (the digest the SAMSEG and SynthSeg packs pin). CPU.
name: registration-robust
schema-version: "0.5"
tool-version: "freesurfer-8.2.0"
description: >-
  Register a person's visits onto their common space with
  mri_robust_register (two visits) or mri_robust_template (three or
  more), rigid, inverse-consistent and robust to lesion change; every
  visit scored with SynthSeg first. One participant is one unit; CPU,
  about 10 minutes a visit.

container-image:
  type: docker
  image: "docker.io/freesurfer/freesurfer@sha256:5648104ca75a24f6ee5a8786146f99b405c2bda1da12bff723a15056da8ddf6b"

inputs:
  - id: threads
    name: Threads
    type: Number
    description: The threads one participant uses.
    value-key: "[THREADS]"
    default-value: 4
    integer: true
    minimum: 1
    maximum: 32

command-line: |-
  bash -c '# SPDX-License-Identifier: AGPL-3.0-only
  set -u; cd [InputDataset];
  qc() { mri_synthseg --i "$1" --o "$2" --qc "$3" --robust --cpu --threads [THREADS] >/dev/null 2>&1 || return 1;
  fspython -c "import sys, csv; r = list(csv.reader(open(sys.argv[1])))[-1]; v = [float(x) for x in r[1:] if x.strip()]; print(\"%.3f\" % min(v))" "$3"; };
  dice() { fspython -c "import sys, numpy as np, nibabel as n; a = np.asarray(n.load(sys.argv[1]).dataobj).astype(int); b = np.asarray(n.load(sys.argv[2]).dataobj).astype(int);
  if a.shape != b.shape: print(\"\"); sys.exit()
  L = [l for l in np.unique(a) if l > 0]; d = [2.0 * np.sum((a == l) & (b == l)) / max(np.sum(a == l) + np.sum(b == l), 1) for l in L]; print(\"%.3f\" % (np.mean(d) if d else 0))" "$1" "$2"; };
  sanity() { fspython -c "import sys, numpy as np;
  rows = [l.split() for l in open(sys.argv[1]) if len(l.split()) == 4 and all(x.replace(\".\", \"\").replace(\"-\", \"\").replace(\"e\", \"\").replace(\"+\", \"\").isdigit() for x in l.split())][:4];
  M = np.array(rows, float); R = M[:3, :3]; det = float(np.linalg.det(R)); a = max(-1.0, min(1.0, (np.trace(R) - 1) / 2)); rot = float(np.degrees(np.arccos(a))); tl = float(np.linalg.norm(M[:3, 3]));
  print(\"%.4f %d %.2f %.2f\" % (det, 1 if det < 0 else 0, tl, rot))" "$1"; };
  for s in sub-*/; do
  [ -d "$s" ] || continue; s=${s%/}; d=[OutputLocation]/$s/anat; mkdir -p "$d"; w=$(mktemp -d [OutputLocation]/.work-XXXXXX);
  vis=(); for f in "$s"/ses-*/anat/*_T1w.nii.gz; do [ -e "$f" ] && vis+=("$f"); done; n=${#vis[@]};
  if [ $n -lt 2 ]; then echo "$s: $n visit with a T1w, nothing to align across visits"; rm -rf "$w"; continue; fi;
  qcs=(); kept=(); out=(); for f in "${vis[@]}"; do ses=$(basename "$(dirname "$(dirname "$f")")"); q=$(qc "$f" "$w/seg_$ses.nii.gz" "$w/qc_$ses.csv") || q="";
  if [ -n "$q" ] && fspython -c "import sys; sys.exit(0 if float(sys.argv[1]) < 0.50 else 1)" "$q"; then out+=("$ses $q"); echo "$s: SynthSeg scores the visit $ses at $q, under 0.50: the visit is left out"; continue; fi;
  kept+=("$f"); qcs+=("${q:-?}"); done;
  qmin=$(printf "%s\n" "${qcs[@]}" | grep -v "?" | sort -g | head -n 1); nout=${#out[@]};
  if [ ${#kept[@]} -lt 2 ]; then echo "$s: SynthSeg scores $nout of $n visits under 0.50, which leaves fewer than two to align: refused"; printf "{\"visits\": %d, \"visits_refused\": %d, \"method\": \"robust\"%s, \"refused\": 1}\n" ${#kept[@]} $nout "${qmin:+, \"qc_min\": $qmin}" > "$d/${s}_desc-registration_metrics.json"; rm -rf "$w"; continue; fi;
  vis=("${kept[@]}"); n=${#vis[@]}; left=""; [ $nout -gt 0 ] && left=", $nout left out";
  if [ $n -eq 2 ]; then
  a=${vis[0]}; b=${vis[1]}; sa=$(basename "$(dirname "$(dirname "$a")")"); sb=$(basename "$(dirname "$(dirname "$b")")");
  mri_robust_register --mov "$b" --dst "$a" --lta "$w/${sb}_to_${sa}.lta" --halfmov "$w/${sb}_half.nii.gz" --halfdst "$w/${sa}_half.nii.gz" --halfmovlta "$w/${sb}_to_mid.lta" --halfdstlta "$w/${sa}_to_mid.lta" --iscale --satit --mapmovhdr "$w/${sb}_in_${sa}.nii.gz" >/dev/null 2>&1 || { echo "$s: mri_robust_register of $sb onto $sa failed"; rm -rf "$w"; continue; };
  method=robust-register; ltas=("$w/${sa}_to_mid.lta" "$w/${sb}_to_mid.lta");
  mri_vol2vol --mov "$a" --targ "$a" --lta "$w/${sa}_to_mid.lta" --o "$w/${sa}_mid.nii.gz" >/dev/null 2>&1; mri_vol2vol --mov "$b" --targ "$a" --lta "$w/${sb}_to_mid.lta" --o "$w/${sb}_mid.nii.gz" >/dev/null 2>&1;
  mri_concat "$w/${sa}_mid.nii.gz" "$w/${sb}_mid.nii.gz" --mean --o "$w/template.nii.gz" >/dev/null 2>&1;
  ic=$(fspython -c "import sys, numpy as np; rd = lambda p: np.array([l.split() for l in open(p) if len(l.split()) == 4 and l.split()[0].replace(\"-\", \"\").replace(\".\", \"\").replace(\"e\", \"\").replace(\"+\", \"\").isdigit()][:4], float);
  A = rd(sys.argv[1]); B = rd(sys.argv[2]); H = rd(sys.argv[3]); C = np.linalg.inv(B) @ H @ A; pts = np.array([[x, y, z, 1] for x in (-70, 70) for y in (-100, 70) for z in (-60, 80)], float).T; dv = (C @ pts - pts)[:3]; print(\"%.3f\" % float(np.sqrt((dv ** 2).sum(0)).mean()))" "$w/${sb}_to_${sa}.lta" "$w/${sb}_to_mid.lta" "$w/${sa}_to_mid.lta" 2>/dev/null || echo "");
  else
  movs=(); for f in "${vis[@]}"; do movs+=("$f"); done; ltas=(); for f in "${vis[@]}"; do ses=$(basename "$(dirname "$(dirname "$f")")"); ltas+=("$w/${ses}_to_mid.lta"); done;
  mri_robust_template --mov "${movs[@]}" --template "$w/template.nii.gz" --lta "${ltas[@]}" --iscale --satit --average 1 --inittp 1 --fixtp >/dev/null 2>&1 || { echo "$s: mri_robust_template over $n visits failed"; rm -rf "$w"; continue; };
  method=robust-template; ic=""; fi;
  cp "$w/template.nii.gz" "$d/${s}_space-midspace_desc-template_T1w.nii.gz";
  mri_synthseg --i "$w/template.nii.gz" --o "$w/seg_template.nii.gz" --robust --cpu --threads [THREADS] >/dev/null 2>&1 || true;
  mind=""; maxtl=0; maxrot=0; mindet=1; flip=0;
  for i in $(seq 0 $((n - 1))); do f=${vis[$i]}; ses=$(basename "$(dirname "$(dirname "$f")")"); l=${ltas[$i]};
  cp "$l" "$d/${s}_${ses}_from-${ses}_to-midspace_mode-image_xfm.lta";
  mri_vol2vol --mov "$f" --targ "$w/template.nii.gz" --lta "$l" --o "$d/${s}_${ses}_space-midspace_desc-aligned_T1w.nii.gz" >/dev/null 2>&1 || continue;
  read det fl tl rot < <(sanity "$l") || continue;
  maxtl=$(fspython -c "import sys; print(max(float(sys.argv[1]), float(sys.argv[2])))" "$maxtl" "$tl"); maxrot=$(fspython -c "import sys; print(max(float(sys.argv[1]), float(sys.argv[2])))" "$maxrot" "$rot"); mindet=$(fspython -c "import sys; print(min(float(sys.argv[1]), float(sys.argv[2])))" "$mindet" "$det"); [ "$fl" = 1 ] && flip=1;
  if [ -f "$w/seg_template.nii.gz" ] && mri_synthseg --i "$d/${s}_${ses}_space-midspace_desc-aligned_T1w.nii.gz" --o "$w/seg_al_$ses.nii.gz" --robust --cpu --threads [THREADS] >/dev/null 2>&1; then ld=$(dice "$w/seg_template.nii.gz" "$w/seg_al_$ses.nii.gz"); [ -n "$ld" ] && mind=$(fspython -c "import sys; print(\"%.3f\" % min(float(sys.argv[1]), float(sys.argv[2])))" "${mind:-1}" "$ld"); fi; done;
  printf "{\"visits\": %d, \"visits_refused\": %d, \"method\": \"%s\", \"qc_min\": %s, \"rigid_flip\": %d, \"rigid_determinant\": %s, \"rigid_translation_mm\": %s, \"rigid_rotation_deg\": %s%s%s}\n" $n $nout "$method" "${qmin:-null}" $flip "$mindet" "$maxtl" "$maxrot" "${ic:+, \"inverse_consistency_mm\": $ic}" "${mind:+, \"alignment_dice\": $mind}" > "$d/${s}_desc-registration_metrics.json";
  echo "$s: $n visits onto their common space$left, $method (quality min ${qmin:-?}; largest translation $maxtl mm, rotation $maxrot degrees; label Dice min ${mind:-?})";
  rm -rf "$w"; done'

x-nils:
  contract: 1
  analysis-level: participant
  input:
    layout: bids
    roles: [t1w]
  units: apart
  secrets:
    - id: freesurfer_license
      mount: /opt/fs/license.txt
      env: FS_LICENSE
      optional: true
  outputs:
    - id: visit_xfm
      kind: transform
      path-template: "sub-{subject}/anat/*_from-ses-*_to-midspace_mode-image_xfm.lta"
      media-type: text/plain
      role: t1w
      space: midspace
    - id: visit_aligned
      kind: image
      path-template: "sub-{subject}/anat/*_space-midspace_desc-aligned_T1w.nii.gz"
      media-type: application/x-nifti+gzip
      role: t1w
      contrast: T1w
      space: midspace
    - id: template
      kind: image
      path-template: "sub-{subject}/anat/*_space-midspace_desc-template_T1w.nii.gz"
      media-type: application/x-nifti+gzip
      role: t1w
      contrast: T1w
      space: midspace
    - id: metrics
      kind: table
      format: json
      path-template: "sub-{subject}/anat/*_desc-registration_metrics.json"
      columns:
        - {name: visits, type: integer, description: "The visits with a T1w the unit aligned"}
        - {name: method, type: text, description: "robust-register for two visits, robust-template for three or more"}
        - {name: qc_min, description: "SynthSeg's lowest quality score over every visit, 0 to 1"}
        - {name: refused, type: integer, description: "1 where visits scored under 0.50 left fewer than two and nothing was registered"}
        - {name: visits_refused, type: integer, description: "The visits left out for a SynthSeg quality score under 0.50"}
        - {name: rigid_determinant, description: "The smallest determinant over the visits' transforms; 1 for a rotation"}
        - {name: rigid_flip, type: integer, description: "1 where any visit's transform flips: never right"}
        - {name: rigid_translation_mm, unit: mm, description: "The largest translation over the visits' transforms"}
        - {name: rigid_rotation_deg, description: "The largest rotation over the visits' transforms, in degrees"}
        - {name: inverse_consistency_mm, unit: mm, description: "Two visits: the mean displacement at the brain's corners of the registration composed with its halfway inverse"}
        - {name: alignment_dice, description: "The smallest mean Dice of any aligned visit's SynthSeg labels against the common-space image's"}
  needs:
    cores-input: threads
    gpu: none
    cores: 4
    memory-gb: 16
    unit-minutes: 30
