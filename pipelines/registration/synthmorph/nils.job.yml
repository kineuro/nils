# SPDX-License-Identifier: AGPL-3.0-only
#
# The SynthMorph member of the registration family (record 57 P6, Wave 7b
# P2): contrast- and resolution-agnostic registration with no skull
# stripping, from FreeSurfer 8.2.0 (mri_synthmorph). Within a session it
# takes the pairs the family's rules send here, the 2D and the thick ones
# (research 07, Table 5 R4): rigid where the pinned build has the rigid
# model, else affine with a flag (scale and shear allowed, the table's
# affine_used). To the template it is the joint affine and deformable
# model with regularisation 0.5 (`-m joint -r 0.5`, Table 5 R10) onto
# MNI152NLin2009cAsym, the site file mni_template where set, else
# FreeSurfer's own copy (average/mni_icbm152_nlin_asym_09c).
#
# Both inputs are scored with SynthSeg's quality scores first
# (`mri_synthseg --robust --qc`): under 0.65 the table carries the score
# and the check flags it, as the SynthSeg starter does; a pair with a
# score under 0.50 is refused
# before anything is registered, says so, and writes only its metrics row
# (refused 1), so the check fails the unit in words (Table 6). After the
# alignment the moving image is segmented again and the mean Dice of its
# labels against the fixed image's is the alignment_dice. The rigid sanity
# is read from the LTA; for the joint model the folding (brain voxels with
# a non-positive Jacobian determinant) and the inverse consistency (the
# forward field composed with the inverse, mean displacement in mm inside
# the template's SynthStrip brain mask) are computed from the two
# displacement fields in world coordinates: each field is read on its own
# grid (the forward on the template's, the inverse on the T1w's) and the
# points are carried between them through the images' affines.
#
# The image is FreeSurfer 8.2.0, pinned by its registry manifest digest
# (the digest the SAMSEG and SynthSeg packs pin). Production plans on the
# CPU (`--cpu`, `-j` threads): SynthMorph affine takes about 72 s and the
# deformable about 15 minutes single-threaded (research 07); a card is
# taken under the lease where one is free, as `gpu: optional` says.
name: registration-synthmorph
schema-version: "0.5"
tool-version: "freesurfer-8.2.0"
description: >-
  Register a session's images with SynthMorph: within a session, the
  FLAIR (or a T2w alone) onto the T1w, rigid (affine where the build has no
  rigid model, flagged); to the template, the joint model onto
  MNI152NLin2009cAsym. Any contrast and resolution, no skull stripping;
  both inputs scored with SynthSeg first. One session is one unit; CPU
  by default, a card when free, about 20 minutes a session.

container-image:
  type: docker
  image: "docker.io/freesurfer/freesurfer@sha256:5648104ca75a24f6ee5a8786146f99b405c2bda1da12bff723a15056da8ddf6b"

inputs:
  - id: task
    name: Task
    type: String
    description: "within_session aligns the session's FLAIR onto its T1w (its T2w where it has no FLAIR); to_template aligns the T1w onto MNI152NLin2009cAsym with the joint model."
    value-key: "[TASK]"
    value-choices: ["within_session", "to_template"]
    default-value: "within_session"
  - id: threads
    name: Threads
    type: Number
    description: The threads one session uses.
    value-key: "[THREADS]"
    default-value: 4
    integer: true
    minimum: 1
    maximum: 32

command-line: |-
  bash -c '# SPDX-License-Identifier: AGPL-3.0-only
  set -u; cd [InputDataset];
  flair() { local g s q; for g in "$1"/*_T2w.nii.gz "$1"/*_FLAIR.nii.gz; do [ -e "$g" ] || continue; s=$(basename "$g" .nii.gz);
  case "$s" in *_FLAIR) echo "$g"; return;; *_acq-*) q=${s#*_acq-};; *) continue;; esac;
  case "+${q%%_*}+" in *+FLAIR+*) echo "$g"; return;; esac; done; };
  t2w() { local g s q; for g in "$1"/*_T2w.nii.gz; do [ -e "$g" ] || continue; s=$(basename "$g" .nii.gz);
  case "$s" in *_acq-*) q=${s#*_acq-}; case "+${q%%_*}+" in *+FLAIR+*) continue;; esac;; esac; echo "$g"; return; done; };
  qc() { mri_synthseg --i "$1" --o "$2/seg_$3.nii.gz" --qc "$2/qc_$3.csv" --robust --cpu --threads [THREADS] >/dev/null 2>&1 || return 1;
  fspython -c "import sys, csv; r = list(csv.reader(open(sys.argv[1])))[-1]; v = [float(x) for x in r[1:] if x.strip()]; print(\"%.3f\" % min(v))" "$2/qc_$3.csv"; };
  dice() { fspython -c "import sys, numpy as np, nibabel as n; a = np.asarray(n.load(sys.argv[1]).dataobj).astype(int); b = np.asarray(n.load(sys.argv[2]).dataobj).astype(int);
  if a.shape != b.shape: print(\"\"); sys.exit()
  L = [l for l in np.unique(a) if l > 0]; d = [2.0 * np.sum((a == l) & (b == l)) / max(np.sum(a == l) + np.sum(b == l), 1) for l in L]; print(\"%.3f\" % (np.mean(d) if d else 0))" "$1" "$2"; };
  sanity() { fspython -c "import sys, numpy as np;
  rows = [l.split() for l in open(sys.argv[1]) if len(l.split()) == 4 and all(x.replace(\".\", \"\").replace(\"-\", \"\").replace(\"e\", \"\").replace(\"+\", \"\").isdigit() for x in l.split())][:4];
  M = np.array(rows, float); R = M[:3, :3]; det = float(np.linalg.det(R)); a = max(-1.0, min(1.0, (np.trace(R) - 1) / 2)); rot = float(np.degrees(np.arccos(a))); tl = float(np.linalg.norm(M[:3, 3]));
  print(\"%.4f %d %.2f %.2f\" % (det, 1 if det < 0 else 0, tl, rot))" "$1"; };
  warpstats() { fspython -c "import sys, numpy as np, nibabel as n, scipy.ndimage as d; f = n.load(sys.argv[1]); A = f.affine; u = np.asarray(f.dataobj, dtype=np.float32); u = u.reshape(u.shape[:3] + (-1,))[..., :3];
  k = n.load(sys.argv[2]); ki = np.linalg.inv(k.affine); X = A[:3, :3] @ np.indices(u.shape[:3]).reshape(3, -1) + A[:3, 3:4]; q = np.rint(ki[:3, :3] @ X + ki[:3, 3:4]).astype(int); o = np.all((q >= 0) & (q < np.array(k.shape[:3])[:, None]), 0);
  m = np.zeros(X.shape[1], bool); m[o] = (np.asarray(k.dataobj).reshape(k.shape[:3]) > 0)[tuple(q[:, o])]; X = X[:, m]; U = u.reshape(-1, 3)[m].T.astype(np.float64);
  g = np.stack([np.stack(np.gradient(u[..., c]), -1).reshape(-1, 3)[m] for c in range(3)], 1); J = np.eye(3) + g @ np.linalg.inv(A[:3, :3]); fold = 100.0 * np.mean(np.linalg.det(J) <= 0) if m.any() else 0.0;
  v = n.load(sys.argv[3]); w = np.asarray(v.dataobj, dtype=np.float32); w = w.reshape(w.shape[:3] + (-1,))[..., :3]; vi = np.linalg.inv(v.affine); p = vi[:3, :3] @ (X + U) + vi[:3, 3:4];
  back = np.stack([d.map_coordinates(w[..., c], p, order=1, mode=\"nearest\") for c in range(3)]); rt = np.sqrt(((U + back) ** 2).sum(0));
  print(\"%.4f %.3f\" % (fold, float(rt.mean()) if m.any() else 0.0))" "$1" "$2" "$3"; };
  rigid=0; mri_synthmorph register -h 2>&1 | grep -q rigid && rigid=1;
  tpl=/opt/templates/MNI152NLin2009cAsym_T1w.nii.gz; [ -f "$tpl" ] || tpl=$FREESURFER_HOME/average/mni_icbm152_nlin_asym_09c/mni_icbm152_t1_tal_nlin_asym_09c.nii.gz;
  for f in sub-*/ses-*/anat/*_T1w.nii.gz; do
  [ -e "$f" ] || continue;
  a=$(dirname "$f"); d=[OutputLocation]/$a; mkdir -p "$d"; b=$(basename "$f" .nii.gz); b=${b%_T1w};
  w=$(mktemp -d [OutputLocation]/.work-XXXXXX);
  qf=$(qc "$f" "$w" fixed) || { echo "$a: SynthSeg could not read the T1w, so its quality was not scored"; qf=""; };
  if [ "[TASK]" = within_session ]; then
  for role in flair t2w; do
  if [ $role = flair ]; then mv=$(flair "$a"); con=FLAIR; else mv=$(t2w "$a"); con=T2w; fi;
  [ -z "$mv" ] && continue;
  if [ $role = t2w ] && [ -n "$(flair "$a")" ]; then echo "$a: the session has a FLAIR, so the FLAIR is registered onto the T1w and its T2w is not (the rules judged the FLAIR)"; continue; fi;
  qm=$(qc "$mv" "$w" moving_$con) || qm="";
  if [ -n "$qf" ] && [ -n "$qm" ] && fspython -c "import sys; sys.exit(0 if min(float(sys.argv[1]), float(sys.argv[2])) < 0.50 else 1)" "$qf" "$qm"; then
  echo "$a: SynthSeg scores an input under 0.50 (T1w $qf, $con $qm): the pair is refused"; printf "{\"moving\": \"%s\", \"method\": \"synthmorph\", \"qc_fixed\": %s, \"qc_moving\": %s, \"refused\": 1}\n" "$con" "$qf" "$qm" > "$d/${b}_from-${con}_to-T1w_desc-registration_metrics.json"; continue; fi;
  model=affine; affine=1; if [ $rigid = 1 ]; then model=rigid; affine=0; fi;
  mri_synthmorph register -m $model -t "$w/${con}.lta" -o "$w/${con}_aligned.nii.gz" -j [THREADS] "$mv" "$f" >/dev/null 2>&1 || { echo "$a: SynthMorph $model of the $con failed"; continue; };
  [ $affine = 1 ] && echo "$a: the pinned SynthMorph has no rigid model, so the $con was aligned affinely (scale and shear allowed), flagged";
  cp "$w/${con}.lta" "$d/${b}_from-${con}_to-T1w_mode-image_xfm.lta"; cp "$w/${con}_aligned.nii.gz" "$d/${b}_space-T1w_desc-aligned_${con}.nii.gz";
  read det flip tl rot < <(sanity "$w/${con}.lta") || { det=""; flip=""; tl=""; rot=""; };
  mri_synthseg --i "$w/${con}_aligned.nii.gz" --o "$w/seg_aligned.nii.gz" --robust --cpu --threads [THREADS] >/dev/null 2>&1 && ld=$(dice "$w/seg_fixed.nii.gz" "$w/seg_aligned.nii.gz") || ld="";
  printf "{\"moving\": \"%s\", \"method\": \"synthmorph-%s\", \"affine_used\": %d%s%s%s%s%s%s%s}\n" "$con" "$model" "$affine" "${qf:+, \"qc_fixed\": $qf}" "${qm:+, \"qc_moving\": $qm}" "${det:+, \"rigid_determinant\": $det}" "${flip:+, \"rigid_flip\": $flip}" "${tl:+, \"rigid_translation_mm\": $tl}" "${rot:+, \"rigid_rotation_deg\": $rot}" "${ld:+, \"alignment_dice\": $ld}" > "$d/${b}_from-${con}_to-T1w_desc-registration_metrics.json";
  echo "$a: $con onto the T1w, SynthMorph $model (quality T1w ${qf:-?}, $con ${qm:-?}; determinant ${det:-?}, translation ${tl:-?} mm, rotation ${rot:-?} degrees; label Dice ${ld:-?})"; done;
  else
  if [ -n "$qf" ] && fspython -c "import sys; sys.exit(0 if float(sys.argv[1]) < 0.50 else 1)" "$qf"; then echo "$a: SynthSeg scores the T1w under 0.50 ($qf): refused"; printf "{\"moving\": \"T1w\", \"method\": \"synthmorph-joint\", \"qc_fixed\": %s, \"refused\": 1}\n" "$qf" > "$d/${b}_from-T1w_to-MNI152NLin2009cAsym_desc-registration_metrics.json"; rm -rf "$w"; continue; fi;
  [ -f "$tpl" ] || { echo "$a: no template: neither the site file mni_template nor the mni_icbm152_nlin_asym_09c of FreeSurfer is here"; rm -rf "$w"; continue; };
  mri_synthmorph register -m joint -r 0.5 -t "$w/fwd.nii.gz" -T "$w/inv.nii.gz" -o "$w/aligned.nii.gz" -j [THREADS] "$f" "$tpl" >/dev/null 2>&1 || { echo "$a: SynthMorph joint to the template failed"; rm -rf "$w"; continue; };
  cp "$w/fwd.nii.gz" "$d/${b}_from-T1w_to-MNI152NLin2009cAsym_mode-image_xfm.nii.gz"; cp "$w/inv.nii.gz" "$d/${b}_from-MNI152NLin2009cAsym_to-T1w_mode-image_xfm.nii.gz"; cp "$w/aligned.nii.gz" "$d/${b}_space-MNI152NLin2009cAsym_desc-aligned_T1w.nii.gz";
  mri_synthstrip -i "$tpl" -m "$w/brain.nii.gz" --threads [THREADS] >/dev/null 2>&1 || mri_synthseg --i "$tpl" --o "$w/brain.nii.gz" --robust --cpu --threads [THREADS] >/dev/null 2>&1;
  read fold ic < <(warpstats "$w/fwd.nii.gz" "$w/brain.nii.gz" "$w/inv.nii.gz") || { fold=""; ic=""; };
  mri_synthseg --i "$tpl" --o "$w/seg_tpl.nii.gz" --robust --cpu --threads [THREADS] >/dev/null 2>&1 && mri_synthseg --i "$w/aligned.nii.gz" --o "$w/seg_aligned.nii.gz" --robust --cpu --threads [THREADS] >/dev/null 2>&1 && ld=$(dice "$w/seg_tpl.nii.gz" "$w/seg_aligned.nii.gz") || ld="";
  printf "{\"moving\": \"T1w\", \"method\": \"synthmorph-joint\", \"affine_used\": 0%s%s%s%s}\n" "${qf:+, \"qc_fixed\": $qf}" "${fold:+, \"folding_pct\": $fold}" "${ic:+, \"inverse_consistency_mm\": $ic}" "${ld:+, \"alignment_dice\": $ld}" > "$d/${b}_from-T1w_to-MNI152NLin2009cAsym_desc-registration_metrics.json";
  echo "$a: T1w onto MNI152NLin2009cAsym, SynthMorph joint (quality ${qf:-?}; folding ${fold:-?} % of brain voxels, inverse consistency ${ic:-?} mm, label Dice ${ld:-?})"; fi;
  rm -rf "$w"; done'

x-nils:
  contract: 1
  analysis-level: session
  input:
    layout: bids
    roles: [t1w, flair, t2w]
  units: apart
  secrets:
    - id: freesurfer_license
      mount: /opt/fs/license.txt
      env: FS_LICENSE
      optional: true
    - id: mni_template
      mount: /opt/templates/MNI152NLin2009cAsym_T1w.nii.gz
      optional: true
  outputs:
    - id: flair_xfm
      kind: transform
      path-template: "sub-{subject}/ses-{session}/anat/*_from-FLAIR_to-T1w_mode-image_xfm.lta"
      media-type: text/plain
      role: flair
      grid: t1w
    - id: flair_aligned
      kind: image
      path-template: "sub-{subject}/ses-{session}/anat/*_space-T1w_desc-aligned_FLAIR.nii.gz"
      media-type: application/x-nifti+gzip
      role: flair
      contrast: FLAIR
      grid: t1w
    - id: t2w_xfm
      kind: transform
      path-template: "sub-{subject}/ses-{session}/anat/*_from-T2w_to-T1w_mode-image_xfm.lta"
      media-type: text/plain
      role: t2w
      grid: t1w
    - id: t2w_aligned
      kind: image
      path-template: "sub-{subject}/ses-{session}/anat/*_space-T1w_desc-aligned_T2w.nii.gz"
      media-type: application/x-nifti+gzip
      role: t2w
      contrast: T2w
      grid: t1w
    - id: template_xfm
      kind: transform
      path-template: "sub-{subject}/ses-{session}/anat/*_from-T1w_to-MNI152NLin2009cAsym_mode-image_xfm.nii.gz"
      media-type: application/x-nifti+gzip
      role: t1w
      space: MNI152NLin2009cAsym
    - id: template_xfm_inverse
      kind: transform
      path-template: "sub-{subject}/ses-{session}/anat/*_from-MNI152NLin2009cAsym_to-T1w_mode-image_xfm.nii.gz"
      media-type: application/x-nifti+gzip
      role: t1w
      grid: t1w
    - id: template_aligned
      kind: image
      path-template: "sub-{subject}/ses-{session}/anat/*_space-MNI152NLin2009cAsym_desc-aligned_T1w.nii.gz"
      media-type: application/x-nifti+gzip
      role: t1w
      contrast: T1w
      space: MNI152NLin2009cAsym
    - id: metrics
      kind: table
      format: json
      path-template: "sub-{subject}/ses-{session}/anat/*_desc-registration_metrics.json"
      columns:
        - {name: moving, type: text, description: "The image moved: FLAIR, T2w or T1w"}
        - {name: method, type: text, description: "synthmorph-rigid or synthmorph-affine within a session, synthmorph-joint to the template"}
        - {name: affine_used, type: integer, description: "1 where the build had no rigid model and the pair was aligned affinely (scale and shear allowed)"}
        - {name: qc_fixed, description: "SynthSeg's lowest quality score of the fixed image (the T1w), 0 to 1"}
        - {name: qc_moving, description: "SynthSeg's lowest quality score of the moving image, 0 to 1"}
        - {name: refused, type: integer, description: "1 where an input scored under 0.50 and the pair was not registered"}
        - {name: rigid_determinant, description: "The determinant of the transform's linear part; 1 for a rotation"}
        - {name: rigid_flip, type: integer, description: "1 where the determinant is negative: a flip, never right"}
        - {name: rigid_translation_mm, unit: mm, description: "The translation of the transform"}
        - {name: rigid_rotation_deg, description: "The rotation of the transform, in degrees"}
        - {name: alignment_dice, description: "The mean Dice of SynthSeg's labels of the aligned image against the fixed image's"}
        - {name: folding_pct, description: "The share of brain voxels whose Jacobian determinant is not positive, in percent: folding"}
        - {name: inverse_consistency_mm, unit: mm, description: "The mean displacement, inside the template's brain mask, of the forward field composed with the inverse, in world coordinates"}
  needs:
    cores-input: threads
    gpu: optional
    gpu-memory-gb: 24
    cores: 4
    memory-gb: 24
    unit-minutes: 20
