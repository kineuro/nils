# From docs/specs/wave4b-the-ask.md, the appendices; the gate's fixtures.
# The appendix's shape, with the values the gate's own registry holds: its
# cohorts, its field strength, and the technique it plants at that field.
ast_version: 1
name: sessions holding both roles at high field
scheme: default
params:
  cohorts:   {type: list,   value: [ms-cohort-a, ms-cohort-b]}
  tesla:     {type: number, value: 3.0}
  tesla_tol: {type: number, value: 0.25}
sets:
  scope:   {grain: cohort,  where: [["in", {}, ["field", {}, "name"], ["param", {}, "cohorts"]]]}
  people:  {grain: subject, of: scope}
  visits:  {grain: session, of: people}
  flair:
    grain: stack
    of: visits
    where:
      - ["=",   {}, ["axis", {}, "base"], "T2w"]
      - ["has", {}, ["axis", {}, "modifier"], "FLAIR"]
      - ["=",   {}, ["derived", {}, "acquisition_type"], "3D"]
      - ["~=",  {tol: ["param", {}, "tesla_tol"]},
                ["derived", {}, "field_strength"], ["param", {}, "tesla"]]
  mp2rage:
    grain: stack
    of: visits
    where:
      - ["=",  {}, ["axis", {}, "technique"], "MPRAGE"]
      - ["~=", {tol: ["param", {}, "tesla_tol"]},
               ["derived", {}, "field_strength"], ["param", {}, "tesla"]]
  both:
    grain: session
    from: visits
    has:
      - {set: flair,   min: 1}
      - {set: mp2rage, min: 1}
keep: [both]
out: {set: both, level: count}
