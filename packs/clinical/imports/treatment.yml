# Treatments started, the kind read per row so one file may carry several.
import:
  target: event
  subject: {column: code}
  observation_type: {column: kind}
  columns:
    event_date: {column: started, parser: date, format: "%d/%m/%Y"}
    value: {column: drug}
  on_existing: supersede
