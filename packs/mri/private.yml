# SPDX-License-Identifier: AGPL-3.0-only
#
# The private elements the digest reads, and the ones a release keeps
# (`docs/specs/wave3-anonymize-and-bids.md`, section 8.4;
# `docs/specs/wave4a-engine-completes.md`, section 5).
#
# A private element is by definition one whose meaning the standard does not
# fix: some carry a diffusion direction and some carry the operator's name,
# and nothing in the file says which. So there are two lists at one grain,
# because reading an element into the registry and letting it leave in a
# release are different risks:
#
#   ingest   broad: read at digest time into `series_private`, keyed by
#            address, and published as a field of this pack under `name`, so
#            a rule reads a vendor's parameter the way it reads a standard
#            one. The registry is the private thing.
#   release  narrow: what may survive de-identification, by name and never
#            by block. Siemens CSA headers have carried the patient name, the
#            operator and the institution in shipping firmware.
#
# Both address a creator and an offset, never a block's position, because
# the block a creator reserves moves from file to file: (0019,0010) in one
# and (0019,0011) in the next, with the elements at 10xx and 11xx.
#
# The ingest list is measured, not chosen from a chair, in two halves. First
# `nils private` was run over 40,000 files of each of three cohorts (an MS
# cohort on legacy scanners, nmosd, and a multi-vendor mix), and an element
# became a candidate because it varied per acquisition, was printable and was
# short; `nils private --suggest` is the repeatable way to grow that list.
# Then each cohort was digested with every candidate and `nils private
# --measured` read back, per address, in how many series it varied INSIDE
# the series: an element that varies inside nearly every series is a
# per-image value (a slice position, a window) and not a parameter of the
# acquisition, however much it varies across the archive, and an element
# with one value across a cohort is a property of the scanner or the site.
# Each `why` below carries what was measured, as "varied within / series" on
# the two cohorts that hold it (nmosd, mix), and the block at the end says
# what was measured and left out, and why. The names come from
# `private-dictionary.tsv` where the dictionary has them and from what the
# console prints where it does not.
#
# v0 removes 119 named standard tags and touches no private element at all,
# so every vendor block leaves the building and no classifier ever reads one.

private:
  # Which vendors the lists were measured on. Coverage is the honest measure
  # of readiness, and a pack that handles one vendor silently drops the next
  # vendor's information.
  coverage:
    - Siemens MR, syngo VB to XA (three cohorts; the XA-era SDS and SDI blocks measured on two)
    - Siemens MR, Numaris VA (one legacy cohort; its blocks are per-image or administrative and none is ingested)
    - GE MR (one cohort, GEMS_ACQU_01 and GEMS_PARM_01; the sequence and ASL elements of pack 0.11.0 from the dictionary and two research reports, not yet measured)
    - Philips MR (one cohort, Imaging DD 001 and MR Imaging DD 001 and DD 005)

  ingest:
    # --- Siemens, group 0019
    - creator: SIEMENS MR HEADER
      group: 0x0019
      element: 0x0F
      name: siemens_gradient_mode
      kind: parameter
      why: "the gradient mode the sequence was run under; constant within a series, two to three values across a cohort (0 of 277 varied on nmosd, 0 of 471 on mix)"

    - creator: SIEMENS MR HEADER
      group: 0x0019
      element: 0x14
      name: siemens_table_position
      kind: geometry
      why: "the table position relative to the first image, which separates the stations of a multi-station spine; a parameter (0 of 358 varied within on nmosd, 4 of 485 on mix; 93 and 150 distinct)"

    # --- Siemens, group 0051: the reconstruction parameters the console
    # prints on the image. The dictionary names two; the others are named
    # from what the console shows.
    - creator: SIEMENS MR HEADER
      group: 0x0051
      element: 0x0A
      name: siemens_acquisition_time_text
      kind: timing
      why: "the acquisition duration as the console prints it (TA 04:12); a parameter (0 of 984 varied within on nmosd, 44 of 824 on mix; 33 and 348 distinct)"

    - creator: SIEMENS MR HEADER
      group: 0x0051
      element: 0x0B
      name: siemens_acquisition_matrix_text
      kind: geometry
      why: "the acquisition matrix as text with the phase direction marked, which the standard matrix element loses; a parameter (0 of 358 and 0 of 624 varied within; 14 and 201 distinct)"

    - creator: SIEMENS MR HEADER
      group: 0x0051
      element: 0x0C
      name: siemens_fov_text
      kind: geometry
      why: "the field of view as the console prints it (FoV 230*230); a parameter (0 of 984 and 5 of 945 varied within; 16 and 152 distinct)"

    - creator: SIEMENS MR HEADER
      group: 0x0051
      element: 0x0E
      name: siemens_orientation_text
      kind: geometry
      why: "the slice orientation as the console prints it (Tra, Sag, Cor, or a tilt such as Tra>Cor); mostly a parameter, varying inside the series of a multi-angle acquisition (30 of 358 varied within on nmosd, 130 of 633 on mix)"

    - creator: SIEMENS MR HEADER
      group: 0x0051
      element: 0x0F
      name: siemens_coil_string
      kind: parameter
      why: "which coil elements were on, which tells a head-neck acquisition from a head one when the text is silent; a parameter (0 of 358 and 0 of 566 varied within; 17 and 89 distinct)"

    - creator: SIEMENS MR HEADER
      group: 0x0051
      element: 0x11
      name: siemens_pat_mode_text
      kind: reconstruction
      why: "the parallel imaging mode and factor as text (p2, p3), which the naming grammar's acceleration token reads; a parameter (0 of 311 and 0 of 350 varied within; 3 and 6 distinct)"

    # --- Siemens, group 0021: the XA-era series header (SDS 01) and image
    # header (SDI 02). The dictionary has almost none of these; the three
    # SDS values are decimal strings that hold still inside a series and
    # differ between acquisitions, which is the shape of a parameter, and
    # what they mean is not yet known. They are read so that a rule can be
    # written when it is.
    - creator: SIEMENS MR SDS 01
      group: 0x0021
      element: 0x1C
      name: siemens_sds_0021xx1c
      kind: unknown
      why: "a decimal string of 22 to 28 bytes; a parameter by shape (4 of 578 varied within on nmosd, 2 of 222 on mix; 64 and 180 distinct); meaning not yet known"

    - creator: SIEMENS MR SDS 01
      group: 0x0021
      element: 0x2C
      name: siemens_sds_0021xx2c
      kind: unknown
      why: "a decimal string of 16 to 22 bytes; a parameter by shape (4 of 578 and 2 of 222 varied within; 74 and 184 distinct); meaning not yet known"

    - creator: SIEMENS MR SDS 01
      group: 0x0021
      element: 0x2D
      name: siemens_sds_0021xx2d
      kind: unknown
      why: "a decimal string of 10 to 22 bytes; a parameter by shape (4 of 578 and 2 of 222 varied within; 74 and 173 distinct); meaning not yet known"

    - creator: SIEMENS MR SDI 02
      group: 0x0021
      element: 0x77
      name: siemens_sdi_0021xx77
      kind: unknown
      why: "a short string of 6 to 14 bytes that holds still inside a series (0 of 578 and 0 of 222 varied within; 112 and 56 distinct); meaning not yet known"

    # --- GE
    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0x39
      name: ge_diffusion_values
      kind: diffusion
      why: "the b value, first of four values, which Wave 1 reads and Wave 3 derives the shell from; a parameter of the series on this cohort (12 of 573 varied within on mix; 37 distinct)"

    - creator: GEMS_ACQU_01
      group: 0x0019
      element: 0xE0
      name: ge_diffusion_directions
      kind: diffusion
      why: "the number of diffusion directions on release 10 and above, which the dictionary names; a parameter (0 of 554 varied within on mix; 7 distinct)"

    - creator: GEMS_ACQU_01
      group: 0x0019
      element: 0x84
      name: ge_peak_sar
      kind: parameter
      why: "the peak SAR the scanner computed for the acquisition, which the dictionary names; a parameter (0 of 483 varied within on mix; 463 distinct)"

    - creator: GEMS_ACQU_01
      group: 0x0019
      element: 0x93
      name: ge_center_frequency
      kind: parameter
      why: "the auto-prescan centre frequency, which the dictionary names; a parameter (0 of 482 varied within on mix; 446 distinct)"

    # MRI pack 0.11.0: GE's sequence and ASL elements, which both research
    # reports of 2026-09-28 name (`studies/2026-09-28-sequence-research/` in
    # the design repository) and the archive did not hold: GE's standard
    # SequenceName is empty on 99.8 % of its stacks, so its pulse sequence
    # is known only here. Named by the dictionary; not yet measured for
    # variation within a series, which the next digest's `nils private
    # --measured` reports.
    - creator: GEMS_ACQU_01
      group: 0x0019
      element: 0x9C
      name: ge_pulse_sequence_name
      kind: parameter
      why: "the pulse sequence (PSD) name, `epi`, `epiRT`, `epi_pepolar`, `efgre3d`, `3dasl`: GE's counterpart of Siemens' sequence name (dcm2niix; both research reports)"

    - creator: GEMS_ACQU_01
      group: 0x0019
      element: 0x9E
      name: ge_internal_pulse_sequence_name
      kind: parameter
      why: "the internal pulse sequence name, `EPI` for a gradient-echo and `EPI2` for a spin-echo EPI (dcm2niix)"

    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0xA3
      name: ge_asl_contrast_technique
      kind: parameter
      why: "ASL contrast technique: PSEUDOCONTINUOUS on the perfusion-weighted pass of GE's 3D ASL, CONTINUOUS on the proton-density pass (dcm2niix; both research reports)"

    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0xA4
      name: ge_asl_labeling_technique
      kind: parameter
      why: "the ASL labelling technique as text (`3D pulsed continuous ASL technique`)"

    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0xA5
      name: ge_asl_label_duration
      kind: timing
      why: "the duration of the label or control pulse"

    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0x2F
      name: ge_private_image_type
      kind: parameter
      why: "GE's image type: 0 magnitude, 1 phase, 2 real, 3 imaginary (dcm2niix GE README)"

    # MRI pack 0.21.0: GE's series plane, which writes 256 on a three-plane
    # localizer whatever its slice count; dcm2niix's GE README documents
    # the value, and record 48's conventions round 3 makes it a vendor
    # localizer flag that outranks the slice-count rule. Read from the next
    # digest or re-read of a GE series.
    - creator: GEMS_ACQU_01
      group: 0x0019
      element: 0x17
      name: ge_series_plane
      kind: geometry
      why: "the series plane as GE codes it (2 axial, 4 sagittal, 8 coronal, 16 oblique, 256 a three-plane localizer; dcm2niix GE README); constant within a series"

    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0xB6
      name: ge_multiband
      kind: parameter
      why: "the multiband (HyperBand) parameters, the first value the factor (dcm2niix GE README)"

    # --- Philips
    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x03
      name: philips_b_factor
      kind: diffusion
      why: "the b value, with a sentinel above 1e37 for a volume that is not diffusion weighted; a parameter of the series on this cohort (11 of 409 varied within on mix)"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x04
      name: philips_diffusion_direction
      kind: diffusion
      why: "the diffusion direction as the scanner names it (7 of 58 varied within on mix)"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x13
      name: philips_epi_factor
      kind: parameter
      why: "the echo-planar factor, which tells a single-shot readout from a segmented one; a parameter (0 of 409 varied within on mix; 18 distinct)"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x14
      name: philips_number_of_echoes
      kind: parameter
      why: "how many echoes the series holds, which the standard echo numbers carry per image and not per series; a parameter (0 of 409 varied within; 5 distinct)"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x20
      name: philips_scanning_technique
      kind: parameter
      why: "the scanning technique as the scanner names it (T1TFE, SE, TSE), the Philips counterpart of Siemens' sequence name; a parameter (0 of 409 varied within; 10 distinct)"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x21
      name: philips_spir
      kind: parameter
      why: "whether spectral fat suppression was on, which the text says inconsistently and the flag says exactly; a parameter (0 of 409 varied within; 3 distinct)"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x81
      name: philips_dynamic_scans
      kind: parameter
      why: "the number of dynamic scans, how many time points the series holds (MRI pack 0.11.0; our research, table 1A)"

    # (2005,1429): the block at 14 is reserved by DD 005, whose entry the
    # dictionary lacks, so the VR is given here.
    - creator: Philips MR Imaging DD 005
      group: 0x2005
      element: 0x29
      name: philips_label_type
      vr: CS
      kind: parameter
      why: "MRImageLabelType, whose first letter tells an ASL label image (L) from a control (C) (MRI pack 0.11.0; dcm2niix)"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x83
      name: philips_imaging_frequency
      kind: parameter
      why: "the imaging frequency, which the dictionary names; a parameter (0 of 380 varied within on mix; 354 distinct)"

    # The 2026-10-03 fingerprint fields: the TFE prepulse, which decides an
    # inversion-prepared 3D T1 TFE (MPRAGE) from one with no prepulse
    # (TurboFLASH) on a classic Philips object, where neither the sequence
    # variant's MP nor the enhanced InversionRecovery does. Philips' Intera
    # R7 to R9 conformance statement defines both, and DICOM CP-2017 lists
    # them as safe to keep. Read from one raw file of each stack in the
    # archive: INV on 648 stacks pack 0.25.0 reads TurboFLASH and NO on 31 it
    # reads MPRAGE, every INV with a delay above nought and every NO with
    # none (design repository, studies/2026-10-03-pack-0250). A code string,
    # so the engine reads it in upper case (`Inv` is `INV`).
    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x1C
      name: philips_prepulse_type
      kind: parameter
      why: "the TFE prepulse type: NO, INV, SAT, ECHO (T2 preparation) or BBI (black blood); constant within a series"

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x1B
      name: philips_prepulse_delay
      kind: timing
      why: "the time from the TFE prepulse to the centre of k-space in the next shot, in milliseconds; above nought on every INV stack measured, nought on every NO"

  # Measured and left out, so the next survey does not propose them again
  # without a reason. Per image means the value changed inside nearly every
  # series that carried it, which is not a parameter of the acquisition and
  # not what series_private is for; the per-image values Wave 1 needs (the
  # b value, the directionality, the gradient direction) are read per
  # instance by the catalogue already.
  #
  #   per image      SIEMENS MR HEADER 0019xx0B SliceMeasurementDuration (294 of 566 varied within on mix),
  #                  0019xx16 TimeAfterStart (all), 0051xx0D the slice position text (921 of 942);
  #                  SIEMENS MR SDI 02 0021xx04, xx06, xx88, xx8A (all), xx4E (most);
  #                  SIEMENS MEDCOM HEADER 0029xx31 (all); Philips Imaging DD 001 2001xx0A Slice Number (all);
  #                  Philips MR Imaging DD 001 2005xx0F and xx10, the window (307 of 406);
  #                  and on the legacy cohort SIEMENS CM VA0 CMS 0009xx14 and 0021xx63 Image
  #                  Distance, SIEMENS MR VA0 GEN 0021xx36 the partition number (all of them).
  #   a constant     SIEMENS MR HEADER 0051xx13 PositivePCSDirections (one value everywhere);
  #                  SIEMENS CSA HEADER 0029xx09 and xx19, the header versions, which are the
  #                  software's and not the acquisition's.
  #   calibration    SIEMENS MR VA0 COAD 0019xx16 ADC Offset, xx60 Reconstruction Scale Factor
  #                  and xxA2 RF Power Error Indicator on the legacy cohort: parameters by shape
  #                  (2 to 7 of 124 varied within; 83 to 99 distinct) that describe the
  #                  scanner's state at the time and not the acquisition, which no rule reads.
  #   never          GEMS_PARM_01 0043xx62 Scanner Study ID, SPI RELEASE 1 0009xx15 UID and
  #                  SIENET 0009xx72: identifiers by name and by group, which the rule that
  #                  measures variation cannot tell from a parameter, and which is why every
  #                  `why` above was written by a person.
  #   not yet judged Philips MR Imaging DD 001 2005xx2A and DD 005 2005xx0A (decimal strings,
  #                  parameters by shape, unnamed); SIEMENS MR HEADER 0051xx12 (a parameter by
  #                  shape on the legacy cohort, 0 of 911 varied within and 96 distinct, and
  #                  a constant on the other two; unnamed).

  # MRI pack 0.19.0 (record 53, pack contract 8): the ingested elements a
  # person reading a stack is shown beside the header, and a replay over
  # header packets reads, so a rule that reads one acts there as it does in
  # production. An allowlist: nothing else of `ingest` is shown. Each is a
  # technical parameter of the acquisition, never who or where; the engine
  # refuses a name that is not ingested, not of a technical kind or at an
  # identification block, and withholds a value shaped like an identifier.
  # The first four are the ones the rules read (pack 0.18.0: GE's EPIMix,
  # NeuroMix, SPGR and Silenz by pulse sequence, GE's ASL pass, Philips'
  # `DwiSE`, balanced FFE and isotropic direction `I`); the other two say
  # what a GE image is where its standard header does not.
  #
  # Every one is shown at every detail, the vendors' sequence names among
  # them, as the standard sequence name (0018,0024) is (the ruling of
  # 2026-10-01, decision 48: a sequence name is never hidden). Pack 0.20.0
  # and 0.20.1 marked the three sequence names `quasi`; 0.20.2 drops the
  # marks.
  shown:
    - name: ge_pulse_sequence_name
      why: "GE's pulse sequence (epi, 3dasl, ksepimix): its counterpart of Siemens' sequence name, which GE leaves empty"
    - name: ge_asl_contrast_technique
      why: "GE's ASL labelling as the scanner states it (CONTINUOUS, PSEUDOCONTINUOUS)"
    - name: philips_scanning_technique
      why: "Philips' scanning technique (SE, TSE, T1TFE, DwiSE): its counterpart of Siemens' sequence name"
    - name: philips_diffusion_direction
      why: "Philips' diffusion direction (I for the isotropic image, O, P, S): which diffusion image a stack is"
    - name: ge_internal_pulse_sequence_name
      why: "GE's internal pulse sequence name, EPI for a gradient-echo and EPI2 for a spin-echo EPI"
    - name: ge_private_image_type
      why: "GE's image type: 0 magnitude, 1 phase, 2 real, 3 imaginary"
    # MRI pack 0.21.0: the two elements its rules add a reading of.
    - name: ge_series_plane
      why: "GE's series plane: 256 marks a three-plane localizer, whatever its slice count"
    - name: philips_number_of_echoes
      why: "how many echoes Philips acquired, which its echo train length does not say on a turbo field echo"
    # The 2026-10-03 fingerprint fields: the TFE prepulse, which tells an
    # MPRAGE from a TurboFLASH on a classic Philips object.
    - name: philips_prepulse_type
      why: "Philips' TFE prepulse (NO, INV, SAT, ECHO, BBI): INV marks an inversion-prepared 3D T1 TFE"
    - name: philips_prepulse_delay
      why: "Philips' delay from the TFE prepulse to the centre of k-space, in milliseconds"

  # What a release keeps. These six are the ones Wave 1 reads and Wave 3
  # section 6 derives from: a release that dropped them would export
  # diffusion nobody can use. Everything else, ingested or not, is dropped.
  release:
    - creator: SIEMENS MR HEADER
      group: 0x0019
      element: 0x0C
      why: the b value of this image

    - creator: SIEMENS MR HEADER
      group: 0x0019
      element: 0x0D
      why: whether this image is directional, isotropic or neither

    - creator: SIEMENS MR HEADER
      group: 0x0019
      element: 0x0E
      why: the gradient direction, as three cosines

    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0x39
      why: the b value, first of four values

    - creator: GEMS_PARM_01
      group: 0x0043
      element: 0x30
      why: how many gradient directions were played

    - creator: Philips Imaging DD 001
      group: 0x2001
      element: 0x03
      why: the b value, with a sentinel above 1e37 for a volume that is not diffusion weighted
