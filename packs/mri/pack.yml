# SPDX-License-Identifier: AGPL-3.0-only
#
# The MRI pack: v0's accumulated knowledge, carried over in meaning rather
# than in code (`docs/specs/wave2-fingerprint-and-classify.md`, §5).
#
# What is here today is the parser and flag layers, which the C11 prototype
# checked against v0's own code over the whole live corpus with no
# disagreement. The axes, the routes, the intent cascade and the passes land
# in slices 3, 4 and 6 of the wave.

pack: mri
version: 0.6.0
contract: 6
modality: MR

parsers:
  - parsers.yml
flags:
  - flags.yml
# The pack's own text: the twelve steps that turn the fingerprint's folded
# fields into what a keyword is matched against (spec section 6.4). There are
# three, because a word that is noise to one axis is the answer to another:
# `search_text` drops the boilerplate, `anatomy_text` keeps every word of the
# series' own names, and `stated_anatomy_text` is `BodyPartExamined` alone,
# which the body-part rules read only where the series' own words and its
# coil said nothing.
normalize:
  - normalize.yml
  - normalize-anatomy.yml
  - normalize-stated-anatomy.yml

axes:
  # The order is the order the axes are decided in, and an axis may read one
  # declared before it: construct's synthetic values require a provenance.
  - axes/provenance.yml
  - axes/technique.yml
  - axes/modifier.yml
  - axes/construct.yml
  # What the file says is wrong with the image, which is not what it is: read
  # after the axes that answer that, so a rule may cite them.
  - axes/quality.yml
  - axes/base.yml
  - axes/body_part.yml
  - axes/post_contrast.yml
  - axes/directory_type.yml
  # Wave 3 §7: what to do with a stack, as opposed to what it is. Decided in a
  # phase of its own, after the passes.
  - axes/disposition.yml
  - axes/convertible.yml
  # §10: what a stack is a candidate to be. Reads the disposition, so it is
  # declared after it and ordered after it.
  - axes/role.yml

# Rule sets written longhand: the tiers that are not value-major.
rules:
  # The routes run before the axes they override: a route decides for the
  # stacks it claims, and an axis leaves alone what is already decided.
  - rules/excluded.yml
  - rules/swi.yml
  - rules/symri.yml
  - rules/epimix.yml
  - rules/stage.yml
  - rules/implied.yml
  - rules/implied_modifier.yml
  - rules/base.yml
  - rules/post_contrast.yml
  - rules/body_part.yml
  - rules/intent.yml
  - rules/disposition.yml
  - rules/role.yml

# The order the rule sets run in. Record 48: base runs after construct, so
# a base rule that reads the construct (an ADC map is DWI, INV2 is PDw) reads
# what was decided rather than an empty axis; no modifier or construct rule
# reads the base. The two `implied_` sets fill the technique and add to the
# modifiers from the construct, for the same reason after it.
order: [excluded, provenance, swi, symri, epimix, stage, technique, modifier, construct, implied_technique, implied_modifier, base, quality, body_part, post_contrast, intent, disposition, role]

# Record 48 (pack contract 6): what one axis rules out on another, and what
# is usual without being always so. Both read axis values alone; neither
# decides an axis of a stack. A campaign freezes the exclusions with the
# implications and refuses an answer that holds both sides; a reader shows
# a hint with its reason and enforces nothing.
excludes:
  - excludes.yml
hints:
  - hints.yml

# The phases that read more than one stack (spec section 7). A pack that
# declares none gets none.
passes:
  - passes/physics_vote.yml

# Which stack stands for a session's role (Wave 3 section 10). A pack that
# declares none picks nothing.
picks:
  - picks/main.yml

# The private elements the digest reads and the ones a release keeps (Wave 3
# section 8.4, Wave 4a section 5). Everything not named in the release list
# is dropped, which is the safe answer and the one a pack has to change
# deliberately. The dictionary gives an element its vendor's name and VR.
private:
  - private.yml
dictionary:
  - private-dictionary.tsv

# How this pack's vocabulary maps onto BIDS (Wave 3 section 9.2). The standard
# itself is the engine's; this is only which of our values means `T1w`.
bids:
  - bids.yml

# The comparability levels of the question wave (Wave 4b section 6): what
# "relatively the same acquisition" means, in physics. The categorical axes
# and the acquisition type compare exactly at every level; only the numbers
# widen from one level to the next.
levels:
  - levels/exact.yml
  - levels/strict.yml
  - levels/loose.yml

# What the MCP door tells a model (Wave 4b section 12.3): the doors it
# opts in as tools, the grounding rules and the worked examples.
mcp:
  - mcp.yml

# What a field may be shown to (Wave 4a section 11.2, C27): local is this
# node only, federated is on the allowlist a peer may read, sensitive is
# never released and never read by a peer. Read by nothing in this wave; the
# catalog of the question wave and the federation of Wave 8 read it. The
# defaults the record names are local for free text, paths, exact dates and
# identifiers, so those are written down here first.
fields:
  series_description: {visibility: local}
  protocol_name: {visibility: local}
  study_description: {visibility: local}
  study_date: {visibility: local}
  station_name: {visibility: local}
  institution_name: {visibility: local}
  patient_comments: {visibility: sensitive}
  magnetic_field_strength: {visibility: federated}
  manufacturer: {visibility: federated}
  manufacturer_model_name: {visibility: federated}
  modality: {visibility: federated}

# When a person is asked about an axis (spec section 8.2). v0 asks about 84
# percent of its stacks, mostly because no keyword matched rather than because
# anything was in doubt, and a queue that long is read by nobody. These are the
# numbers that decide what is worth a person's time, and they are the pack's
# because what counts as a weak answer is knowledge about MRI.
#
# Each number is read as strictly below: an axis written at exactly the
# confidence named here is an answer, not a question. Both numbers below are
# set at a confidence a rule always writes, so each takes its whole
# population out of the queue by that boundary. That is the intent, and it is
# not silence: a run counts the answers that sit on their threshold and says
# so, so the queue's size and the boundary that produced it are read
# together.
review:
  low_confidence:
    # Measured over the whole live corpus, and set from the measurement. The
    # tiers are 0.95 exclusive, 0.85 keywords, 0.75 combination and
    # alternative, 0.70 physics. At 0.75 the queue is 16 percent of the
    # archive and 94 percent of it is one population: a contrast inferred
    # from the timing parameters with no keyword anywhere, 80,752 stacks of
    # it, agreeing with v0 on every one. That is not 80,752 questions for a
    # person. It is one question about a rule, and the run answers it by
    # counting what each tier decided.
    default: 0.70
    # Body part is decided at one confidence whatever the text said (0.65,
    # v0's number), so any threshold above it asks about every stack and
    # tells nobody anything, and this one, being read as strictly below,
    # asks about none of them. What is worth asking about is the last
    # resort: a spine inferred from a tall narrow sagittal field of view
    # with the text silent, at 0.60.
    body_part: 0.65
  # An axis with no value at all is a question only where a value is always
  # expected. A modifier or a construct is legitimately absent on most
  # stacks; a technique that nothing recognised is a gap in the pack.
  missing: [technique]
  # And nobody is asked about a stack the pack has ruled out. A localizer or
  # a scout is excluded on purpose: every other axis is blank because there
  # is nothing to say, not because the pack failed to say it. 81,296 stacks
  # of the corpus are this, and asking about each one is exactly how v0's
  # queue came to hold 84 percent of the archive.
  silent_when: {axis: directory_type, is: excluded}

# The lists a site may amend through an overlay, and nothing else: a pack
# decides what is editable, not the engine (§5.3). Physics, flags and the
# order rules are tried in stay the pack's, as they are in v0.
buckets:
  diffusion_tokens:
    [DIFFUSION, ADC, FA, TRACEW, ISODWI, EXP, EADC, CALC_BVALUE, MIXED, MIX,
     MOTIONCORRECTION]
  localizer_words: [scout, localizer, loc_]
  # The words that say contrast was given, and the words that say it was
  # not (Wave 4c section 6.6): a site's own agent name is added here.
  #
  # A word is matched as a substring of the normalized text, where `-` and
  # `+` stand apart (`pre - gd`), `_` is a space and a letter outside a to z
  # is a space (`före` reads `f re`). v0's spellings with a joined `-`, `+`
  # or `_` can never match and are kept as v0 wrote them; the spellings
  # after them, from `pre - contrast` on, are the ones that do. Record 48's
  # round 4 phrases (`studies/2026-09-24-phase-0/keywords-proposal.md` in
  # the design repository) are added in that form, the Swedish ones counted
  # on the training sites: `kontrast` on 1,100 stacks, given on 90 per cent,
  # and the rest are the words saying no, which are read first; `efter k` on
  # 30, all left empty before. A bare short token (`km`, `ce`, `nc`, `mdc`,
  # `inj`, `pre`, `m k`) or a common word (`enhanced`, `plain`, `simple`,
  # `blanco`) would match inside other words, and is left out.
  contrast_negative:
    ['utan gd', 'utan_gd', 'ej gd', 'utan kontrast', 'ej kontrast', 'utan k', 'ej k', 'ingen gd', 'ingen k', ' -k', ' -gd', ' -c', 'pre gd', 'pre-gd', 'pre contrast', 'pre-contrast', 'without contrast', 'no contrast', 'non-contrast', 'non contrast', 'no gd', 'ohne gd', 'ohne kontrast', 'ohne km', 'nativ', 'kein gd', 'sans gd', 'sans contraste', 'sans gado', 'senza gd', 'senza contrasto', 'uten gd', 'uden gd', 'zonder gd', 'geen gd', 'pre - gd',
     'pre - contrast', 'non - contrast', 'precontrast', 'pre kontrast', 'fore k', 'f re k', 'innan kontrast', 'vor km', 'vor kontrast', 'senza mdc', 'pre mdc', 'pre gado', 'basale', 'kontrastfri', 'sans injection', 'sans inj', 'avant injection', 'sin contraste', 'pre contraste', 'zonder contrast', 'voor contrast']
  contrast_positive:
    ['dotarem', 'clariscan', 'omniscan', 'magnevist', 'gadovist', 'prohance', 'multihance', 'optimark', 'eovist', 'primovist', 'gadavist', 'gadolinium', 'gadobutrol', 'gadoterate', 'gadoteridol', 'gadobenate', 'gadoxetate', ' gd', '_gd', '+k', '+gd', '+c', '+ gd', '+ k', 'k+', 'k +', '+contrast', 'med gd', 'med kontrast', 'med-kontrast', 'med_kontrast', 'med k', 'efter kontrast', 'spruta kontrast', 'gd direkt', 'post gd', 'post-gd', 'post contrast', 'post-contrast', 'with contrast', 'after contrast', 'contrast enhanced', 'mit gd', 'mit kontrast', 'nach gd', 'nach km', 'avec gd', 'avec contraste', 'post - gd',
     'post - contrast', 'med - kontrast', '+ contrast', ' c +', 'postcontrast', 'post gad', 'gado', 'kontrast', 'efter k', 'mit km', 'post km', '+ km', 'nach gabe', 'con mdc', 'post mdc', 'dopo mdc', '+ mdc', 'con gad', 'avec injection', 'apres injection', 'apr s injection', 'injecte', 'avec gado', 'post gado', 'con contraste', 'post contraste', 'tras contraste', 'met contrast', 'na contrast', 'met gado']
