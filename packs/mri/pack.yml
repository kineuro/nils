# SPDX-License-Identifier: AGPL-3.0-only
#
# The MRI pack: v0's accumulated knowledge, carried over in meaning rather
# than in code (`docs/specs/wave2-fingerprint-and-classify.md`, §5).
#
# What is here today is the parser and flag layers, which the C11 prototype
# checked against v0's own code over the whole live corpus with no
# disagreement. The axes, the routes, the intent cascade and the passes land
# in slices 3, 4 and 6 of the wave.

pack: mri
version: 0.1.0
contract: 1
modality: MR

parsers:
  - parsers.yml
flags:
  - flags.yml
# The pack's own text: the twelve steps that turn the fingerprint's folded
# fields into what a keyword is matched against (spec section 6.4).
normalize:
  - normalize.yml

axes:
  # The order is the order the axes are decided in, and an axis may read one
  # declared before it: construct's synthetic values require a provenance.
  - axes/provenance.yml
  - axes/technique.yml
  - axes/modifier.yml
  - axes/construct.yml
  - axes/base.yml
  - axes/body_part.yml
  - axes/post_contrast.yml
  - axes/directory_type.yml

# Rule sets written longhand: the tiers that are not value-major.
rules:
  # The routes run before the axes they override: a route decides for the
  # stacks it claims, and an axis leaves alone what is already decided.
  - rules/excluded.yml
  - rules/swi.yml
  - rules/symri.yml
  - rules/epimix.yml
  - rules/stage.yml
  - rules/base.yml
  - rules/post_contrast.yml
  - rules/body_part.yml
  - rules/intent.yml

# The order the rule sets run in.
order: [excluded, provenance, swi, symri, epimix, stage, technique, base, modifier, construct, body_part, post_contrast, intent]

# The phases that read more than one stack (spec section 7). A pack that
# declares none gets none.
passes:
  - passes/physics_vote.yml

# When a person is asked about an axis (spec section 8.2). v0 asks about 84
# percent of its stacks, mostly because no keyword matched rather than because
# anything was in doubt, and a queue that long is read by nobody. These are the
# numbers that decide what is worth a person's time, and they are the pack's
# because what counts as a weak answer is knowledge about MRI.
review:
  low_confidence:
    # Measured over the whole live corpus, and set from the measurement. The
    # tiers are 0.95 exclusive, 0.85 keywords, 0.75 combination and
    # alternative, 0.70 physics. At 0.75 the queue is 16 percent of the
    # archive and 94 percent of it is one population: a contrast inferred
    # from the timing parameters with no keyword anywhere, 80,752 stacks of
    # it, agreeing with v0 on every one. That is not 80,752 questions for a
    # person. It is one question about a rule, and the run answers it by
    # counting what each tier decided.
    default: 0.70
    # Body part is decided at one confidence whatever the text said (0.65,
    # v0's number), so any threshold above it asks about every stack and
    # tells nobody anything. What is worth asking about is the last resort:
    # a spine inferred from a tall narrow sagittal field of view with the
    # text silent, at 0.60.
    body_part: 0.65
  # An axis with no value at all is a question only where a value is always
  # expected. A modifier or a construct is legitimately absent on most
  # stacks; a technique that nothing recognised is a gap in the pack.
  missing: [technique]
  # And nobody is asked about a stack the pack has ruled out. A localizer or
  # a scout is excluded on purpose: every other axis is blank because there
  # is nothing to say, not because the pack failed to say it. 81,296 stacks
  # of the corpus are this, and asking about each one is exactly how v0's
  # queue came to hold 84 percent of the archive.
  silent_when: {axis: directory_type, is: excluded}

# The lists a site may amend through an overlay, and nothing else: a pack
# decides what is editable, not the engine (§5.3). Physics, flags and the
# order rules are tried in stay the pack's, as they are in v0.
buckets:
  diffusion_tokens:
    [DIFFUSION, ADC, FA, TRACEW, ISODWI, EXP, EADC, CALC_BVALUE, MIXED, MIX,
     MOTIONCORRECTION]
  localizer_words: [scout, localizer, loc_]
