# SPDX-License-Identifier: AGPL-3.0-only
#
# What to do with a stack, as opposed to what it is
# (`docs/specs/wave3-anonymize-and-bids.md`, section 7).
#
# The concept v0 lacks, and the one every one of its export bugs needs. v0 has
# it in pieces and under other names: a `NIFTI_INCOMPATIBLE_PROVENANCES` set in
# the converter, a `non_canonical_constructs` list in the pick configuration.
# Both are dispositions written in the one place that happened to need them,
# which is why they disagree.
#
# `phase: disposition` puts this after the passes. A pass fills a base or a
# technique, and a disposition worked out before that would be worked out from
# a gap: v0 has exactly that fault, and patches it with a second copy of its
# intent cascade inside gap filling, which then disagrees with the first.

axis: disposition
phase: disposition
kind: single
tiers: {stated: 0.9}
# A stack the scanner marked as its own primary output, with nothing saying
# otherwise, is an acquisition. That is most of the archive, and the rules
# below are what catch everything else.
default: acquisition
default_confidence: 0.7
# The kinds of scan a question counts unless it says otherwise. A
# scanner-derived image can be the very image a question means (an ADC map,
# a synthetic contrast, a reconstruction the scanner made), so it is counted
# beside the acquisitions. A reformat is another view of an acquisition the
# session already holds, and a scout or a working scan is not what a
# question usually wants: they are counted where the words name them, and
# so is a display composite. The ask adds the clause to a question authored
# as text whose stack sets name no disposition, says so, and names the
# clause to write for the other kinds; a document that arrives structured is
# taken as written. No rule and no sort reads the key.
ask_default: [acquisition, scanner_derived]

values:
  # What the scanner acquired and meant you to look at.
  acquisition: {description: 'An image the scanner acquired and wrote as its own primary output, with nothing saying otherwise. With scanner_derived it is what a question counts unless the words name other kinds. Some images the scanner computed inline (an MP2RAGE UNI, a filtered copy) are filed here too.'}
  # The scanner made it from images it had just taken: an ADC map, a Trace, a
  # synthetic contrast, a quantitative map. An ordinary image, and one whose
  # provenance a reader has to be told.
  scanner_derived: {description: 'An image the scanner computed from images it had just acquired, in the same series or beside it: a trace, an ADC or FA map, a Dixon part, an SWI image, a synthetic contrast, a perfusion or quantitative map, a subtraction. An ordinary image to read or measure; counted by default.'}
  # A workstation made it from images: a reformat, a projection.
  reformat: {description: 'An image made from other images by reslicing or projecting them: an MPR plane, a MIP or minIP (also when the scanner made it inline), a stitched whole-spine image, or a map a workstation or third-party software wrote. Left out of a count unless the words ask for reformats, projections or every image.'}
  # An intermediate the scanner used to make something else, and not an image
  # in its own right. The MDME container is the case that proves it (7.1).
  working_scan: {description: 'An intermediate the scanner used to compute something else, not an image to read: the raw magnitude and phase of a synthetic MRI (MDME, QALAS) acquisition, a calibration or coil reference scan. Left out of counts and never converted unless named.'}
  # A planning scan.
  scout: {description: 'A planning scan: a localizer, survey, tri-plane or 3D head scout, a position display. It carries a base and a technique like any image (a T2w TSE scout), so a question by weighting alone would count it; left out unless the words ask for scouts or localizers.'}
  # MRI pack 1.1.0 (record 55 C3): a picture made to be looked at, a map or a
  # segmentation saved in colour over a synthetic image. An image of a person,
  # classified and found like any other, and no material for an analysis: a
  # release leaves it out unless its selection names this disposition.
  display_composite: {description: 'A picture saved from a viewer in colour for looking at, such as a synthetic MRI map or segmentation drawn over an image. An image of a person but not material for a measurement; left out of counts and releases unless named.'}
  # Not an image at all: a screen capture, an error map, a report.
  excluded: {description: 'Not an image of a person: a screen capture, a pasted report, an error image. No question reads these stacks.'}
