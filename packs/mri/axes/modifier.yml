# SPDX-License-Identifier: AGPL-3.0-only
#
# The modifier axis, transcribed from v0 0.5.3
# `classification/detection_yaml/modifier-detection.yaml` and the detector that reads it.
#
# An axis file is a rule set written compactly: one rule per value, in the
# order below, with up to three clauses in v0's order (an exclusive flag,
# then a keyword, then a combination of flags). The first value whose first
# clause holds decides, and which clause fired fixes the confidence.

axis: modifier
kind: multi
# The confidences v0 fixes per tier, from its own `confidence_thresholds`.
tiers: {exclusive: 0.95, keywords: 0.85, combination: 0.75}
stores: label
# The text a keyword is matched against is the pack's own, normalized by
# its twelve steps from the fingerprint's folded fields (spec section 6.4).
search: search_text

# Only these are tried by this axis's own rules; any other value
# below is vocabulary a route sets (spec section 6.5).
order:
  - FLAIR
  - STIR
  - DIR
  - PSIR
  - IR
  - Radial
  - Spiral
  - FatSat
  - WaterExcitation
  - Dixon
  - MT
  - FlowComp
  - BlackBlood
  - BrightBlood
  - MoCo

values:
  FLAIR:
    terms: ['fluid attenuated inversion recovery', 'dark fluid', 'darkfluid', 'T2 FLAIR', 'T1 FLAIR']
    group: IR_CONTRAST
    priority: 1
    keywords:
      - flair
      - t2 flair
      - t1 flair
      - dark fluid
      - dark-fluid
      - dark - fluid
      - da fl
      - da-fl
      - da - fl
    detection:
      exclusive: is_flair
  STIR:
    terms: ['short tau inversion recovery', 'short TI inversion recovery', 'TIRM']
    group: IR_CONTRAST
    priority: 2
    keywords:
      - stir
      - short tau
      - short ti
      - tirm
    detection:
      exclusive: has_stir
  DIR:
    terms: ['double inversion recovery', 'double IR']
    group: IR_CONTRAST
    priority: 3
    keywords:
      - dir
      - double ir
      - dual ir
      - double inversion
    detection:
      exclusive: is_dir
  PSIR:
    terms: ['phase sensitive inversion recovery']
    group: IR_CONTRAST
    priority: 4
    keywords:
      - psir
      - phase sensitive
      - phase-sensitive ir
    detection:
      exclusive: has_psir
  IR:
    terms: ['inversion recovery', 'inversion prepared', 'IR prepared']
    group: IR_CONTRAST
    priority: 99
    keywords:
      - inversion recovery
    detection:
      exclusive: has_ir_se
  Radial:
    terms: ['PROPELLER', 'BLADE', 'MultiVane', 'JET', 'radial']
    group: TRAJECTORY
    priority: 1
    keywords:
      - propeller
      - blade
      - multivane
      - radial
      - periodically rotated
    detection:
      exclusive: is_radial
  Spiral:
    terms: ['spiral']
    group: TRAJECTORY
    priority: 2
    keywords:
      - spiral
    detection:
      exclusive: is_spiral
  FatSat:
    terms: ['fat saturation', 'fat suppression', 'fat suppressed', 'fat sat', 'SPIR', 'SPAIR', 'ChemSat', 'FS']
    keywords:
      - fatsat
      - fat sat
      - chemsat
      - chem sat
      - spair
    detection:
      exclusive: has_fat_sat
  WaterExcitation:
    terms: ['water excitation', 'ProSet', 'WE']
    label: WaterExc
    keywords:
      - water excitation
      - water exc
      - proset
      - wex
    detection:
      exclusive: has_water_excitation
  Dixon:
    terms: ['Dixon', 'mDIXON', 'IDEAL', 'LAVA-Flex', 'Flex', 'VIBE-Dixon', 'two-point Dixon']
    keywords:
      - dixon
      - ideal
      - mdixon
      - lava-flex
      - vibe-dixon
      - wfop
    detection:
      exclusive: has_dixon
      combination: [has_in_phase, has_out_phase]
  MT:
    terms: ['magnetization transfer', 'MT pulse', 'MTC']
    keywords:
      - magnetization transfer
      - mtc
    detection:
      exclusive: has_mtc
  # From ScanOptions only. A name is not a scan option: `0 flow comp` in a
  # protocol whose printout says flow compensation is off made 87 stacks and
  # 125 reformats of them FlowComp by the words alone (record 41), and `fc`
  # as a substring is inside far more words than it means. A site whose
  # names are reliable may give the value words through an overlay.
  FlowComp:
    terms: ['flow compensation', 'flow comp', 'gradient moment nulling', 'GMN']
    detection:
      exclusive: has_flow_comp
  BlackBlood:
    terms: ['black blood', 'dark blood', 'DANTE', 'vessel wall']
    keywords:
      - black blood
      - blackblood
      - dark blood
      - blood null
  BrightBlood:
    terms: ['bright blood']
    keywords:
      - bright blood
      - brightblood
  MoCo:
    terms: ['motion corrected', 'MoCo']
    keywords:
      - moco
      - mocoseries
      - motion correct
      - motioncorrect
    detection:
      exclusive: has_moco
