# SPDX-License-Identifier: AGPL-3.0-only
#
# The modifier axis, transcribed from v0 0.5.3
# `classification/detection_yaml/modifier-detection.yaml` and the detector that reads it.
#
# An axis file is a rule set written compactly: one rule per value, in the
# order below, with up to three clauses in v0's order (an exclusive flag,
# then a keyword, then a combination of flags). The first value whose first
# clause holds decides, and which clause fired fixes the confidence.

axis: modifier
kind: multi
# The confidences v0 fixes per tier, from its own `confidence_thresholds`.
tiers: {exclusive: 0.95, keywords: 0.85, combination: 0.75}
stores: label
# The text a keyword is matched against is the pack's own, normalized by
# its twelve steps from the fingerprint's folded fields (spec section 6.4).
search: search_text

# Only these are tried by this axis's own rules; any other value
# below is vocabulary a route sets (spec section 6.5).
order:
  - FLAIR
  - STIR
  - DIR
  - PSIR
  - IR
  - Radial
  - Spiral
  - FatSat
  - WaterExcitation
  - Dixon
  - MT
  - FlowComp
  - BlackBlood
  - BrightBlood
  - MoCo

values:
  FLAIR:
    terms: ['fluid attenuated inversion recovery', 'dark fluid', 'darkfluid', 'T2 FLAIR', 'T1 FLAIR', 'FastFLAIR']  # GE [V1, V2]
    group: IR_CONTRAST
    priority: 1
    # MRI pack 0.16.0: never a dual-echo spin echo that only its name calls
    # FLAIR (flags.yml, dev-4 H3).
    # MRI pack 0.18.0: nor an inversion recovery whose short inversion time
    # is far from the one that nulls CSF at its repetition time (flags.yml,
    # `ir_far_from_csf_null`; the deep research, case 15).
    # MRI pack 0.20.0: nor a series whose physics rule an inversion out: no
    # inversion stated at a repetition time under 1,000 ms, where only a
    # reused name says FLAIR (flags.yml, dev-5's A4).
    # MRI pack 0.25.0: nor an ASL, whose inversion labels the blood (a GE
    # pCASL CBF map; flags.yml, section 26c).
    # MRI pack 0.25.0 (the protocol sweep): nor a FLAIR word on a
    # magnetisation-prepared gradient echo (MPRAGE, a TFE), whose inversion
    # belongs to its technique (a BRAVO reformat named `T1 FLAIR CUBE`, a
    # `*tfl3d1` view named `Ax Flair`); nor the magnitude of nothing: a
    # real (R) inversion recovery is PSIR by DR3, whatever its name (Siemens,
    # and Philips `R_IR` since the sweep's disputes, section 26e).
    requires: {all: [{not: flair_named_dual_echo}, {not: ir_far_from_csf_null}, {not: flair_named_not_inverted}, {not: is_asl}, {not: {all: [{not: is_flair}, {any: [{axis: technique, is: MPRAGE}, {axis: technique, is: MEMPRAGE}, {axis: technique, is: MP2RAGE}, {axis: technique, is: FSP-GRE}]}]}}, {not: real_ir}]}
    keywords:
      - flair
      - t2 flair
      - t1 flair
      - dark fluid
      - dark-fluid
      - dark - fluid
      - da fl
      - da-fl
      - da - fl
    # MRI pack 0.13.0: or its inversion time (flags.yml, `is_flair_by_ti`).
    detection:
      exclusive: is_flair
      combination: [is_flair_by_ti]
  # TIRM is Siemens' inversion-recovery TSE for both a STIR and a dark-fluid
  # FLAIR [V1, V2], so it is IR-TSE's term and not this value's. The word
  # stays a keyword: a TIRM that says nothing of dark fluid is the short-TI
  # one, and one that does is a FLAIR, which wins the group.
  STIR:
    terms: ['short tau inversion recovery', 'short TI inversion recovery', 'FastSTIR']
    group: IR_CONTRAST
    priority: 2
    # MRI pack 0.12.0: as IR below, never on an MDME acquisition, whose
    # saturation delay reads as a short TI.
    # MRI pack 0.25.0 (the protocol sweep): nor a Siemens spin echo whose
    # header states no inversion (flags.yml, section 26d), nor a Siemens
    # real (R) inversion recovery, Siemens or Philips (section 26e), which
    # DR3 makes PSIR whatever its name.
    requires: {all: [{not: {axis: technique, is: MDME}}, {not: siemens_stir_named_without_inversion}, {not: real_ir}]}
    keywords:
      - stir
      - short tau
      - short ti
      - tirm
    # MRI pack 0.13.0: or its inversion time (flags.yml, `is_stir_by_ti`).
    detection:
      exclusive: has_stir
      combination: [is_stir_by_ti]
  DIR:
    terms: ['double inversion recovery', 'double IR']
    group: IR_CONTRAST
    priority: 3
    # MRI pack 0.25.0: never the `dirs` of a diffusion's directions
    # (`DTI15dirs`; flags.yml, section 26c).
    requires: {any: [is_dir, {not: dir_word_is_directions}]}
    keywords:
      - dir
      - double ir
      - dual ir
      - double inversion
    detection:
      exclusive: is_dir
  PSIR:
    terms: ['phase sensitive inversion recovery']
    group: IR_CONTRAST
    priority: 4
    # MRI pack 0.25.0: never the magnitude of a real-IR pair named PSIR,
    # which keeps IR, FLAIR or STIR by its inversion time (DR3; flags.yml,
    # section 26e); a Philips real IR (`R_IR`) is PSIR as a Siemens one is.
    requires: {not: ir_magnitude_component}
    keywords:
      - psir
      - phase sensitive
      - phase-sensitive ir
    # MRI pack 0.20.0: or a Siemens inversion recovery reconstructed as the
    # real part (ImageType R): the reconstruction that keeps the sign of the
    # longitudinal magnetisation (record 48, dev-5's case 3; flags.yml,
    # `siemens_real_ir`). The archive's 573 such ORIGINAL stacks carry no
    # PSIR token, so R is the mark; a reformat that keeps it follows its
    # source.
    detection:
      exclusive: has_psir
      combination: [real_ir]
    # MRI pack 0.25.0: or a Siemens range that kept the real component and
    # lost the inversion its protocol names (flags.yml, section 26d).
    alternative_flags: [siemens_real_ir_named]
  # MRI pack 0.12.0: not on an MDME acquisition. Its short saturation delay,
  # which the header writes as an inversion time beside ScanningSequence
  # SE\IR, is part of the technique and no inversion-recovery contrast
  # (QRAPMASTER's multi-delay saturation-recovery preparation [P21, P22]; the header-judge
  # prompt's MDME rule). dev-1 settled no modifier on all 18 MDME stacks the
  # rules gave IR.
  IR:
    terms: ['inversion recovery', 'inversion prepared', 'IR prepared']
    group: IR_CONTRAST
    priority: 99
    # MRI pack 0.25.0: nor a Siemens real (R) inversion recovery (DR3: PSIR).
    requires: {all: [{not: {axis: technique, is: MDME}}, {not: siemens_real_ir}]}
    keywords:
      - inversion recovery
    # MRI pack 0.18.0: or an inversion recovery whose short inversion time
    # is far from the CSF null (flags.yml, `ir_far_from_csf_null`; the deep
    # research, case 15), which FLAIR no longer takes.
    detection:
      exclusive: has_ir_se
      combination: [ir_far_from_csf_null]
  # PROPELLER is rotating blades, a hybrid rather than radial in the strict
  # sense [MQ16]; RADAR is Hitachi's [V1, V2, S8]
  Radial:
    terms: ['PROPELLER', 'BLADE', 'MultiVane', 'JET', 'radial', 'RADAR']
    description: 'rotating blades (PROPELLER, BLADE) or radial k-space'
    group: TRAJECTORY
    priority: 1
    # MRI pack 0.14.0: never a series of radial MIP views (flags.yml).
    # MRI pack 0.18.0: nor a PROPELLER named only in GE's exam protocol
    # (sealed-1 A11).
    requires: {all: [{not: radial_views_named}, {not: ge_exam_only_propeller}]}
    keywords:
      - propeller
      - blade
      - multivane
      - radial
      - periodically rotated
    # MRI pack 0.13.0: or Philips' `MV` shorthand (flags.yml).
    # MRI pack 0.14.0: or GE's other PROPELLER spellings (`ksprop`, `T2prop`).
    detection:
      exclusive: is_radial
      combination: [radial_named]
  Spiral:
    terms: ['spiral']
    group: TRAJECTORY
    priority: 2
    keywords:
      - spiral
    detection:
      exclusive: is_spiral
  # ASPIR is Canon's, MSOFT and SINC Hitachi's [V1, V2]. `fettsat` and
  # `fat supp` are record 48's round 4 phrases. `spir` (36 stacks of the
  # training sites, 34 Philips) stays a term: a keyword is a substring, and
  # `spir` is inside `spiral` and `respiratory`. `fs` is read from the
  # ScanOptions flag instead of the text: the defined term FS (or SFS) as a
  # whole token. GE's FSA_GEMS, FSP_GEMS, FSS_GEMS, FSI_GEMS, FSR_GEMS and
  # FSL_GEMS are the readout direction and never FatSat, and SAT_GEMS is
  # spatial saturation (parsers.yml, pack 0.9.0).
  FatSat:
    terms: ['fat saturation', 'fat suppression', 'fat suppressed', 'fat sat', 'SPIR', 'SPAIR', 'ChemSat', 'FS', 'ASPIR', 'MSOFT', 'SINC', 'fettsat', 'fettsattigad']
    keywords:
      - fatsat
      - fat sat
      - chemsat
      - chem sat
      - spair
      - fettsat
      - fat supp
    # MRI pack 0.25.0 (the protocol sweep): never from words that switch it
    # off (`no fatsat`); the header's token still decides.
    requires: {not: {all: [fat_sat_negated, {not: has_fat_sat}]}}
    detection:
      exclusive: has_fat_sat
  WaterExcitation:
    terms: ['water excitation', 'ProSet', 'WE', 'PASTA']  # PASTA: Hitachi [V1, V2]
    label: WaterExc
    keywords:
      - water excitation
      - water exc
      - proset
      - wex
    # MRI pack 0.13.0: or Philips' water-selective WATS (flags.yml).
    detection:
      exclusive: has_water_excitation
      combination: [wats_named]
  Dixon:
    # WFS is Canon's, WFOP and FatSep Hitachi's, FLEX GE's [V1, V2]
    terms: ['Dixon', 'mDIXON', 'IDEAL', 'LAVA-Flex', 'Flex', 'VIBE-Dixon', 'two-point Dixon', 'WFS', 'WFOP', 'FatSep', 'FLEX']
    keywords:
      - dixon
      - ideal
      - mdixon
      - lava-flex
      - vibe-dixon
      - wfop
    detection:
      exclusive: has_dixon
      combination: [has_in_phase, has_out_phase]
  MT:
    terms: ['magnetization transfer', 'MT pulse', 'MTC']
    # MRI pack 0.14.0: not where the words switch it off (`utan MTC`).
    requires: {not: mt_negated}
    keywords:
      - magnetization transfer
      - mtc
    detection:
      exclusive: has_mtc
  # From ScanOptions only. A name is not a scan option: `0 flow comp` in a
  # protocol whose printout says flow compensation is off made 87 stacks and
  # 125 reformats of them FlowComp by the words alone (record 41), and `fc`
  # as a substring is inside far more words than it means. A site whose
  # names are reliable may give the value words through an overlay.
  FlowComp:
    terms: ['flow compensation', 'flow comp', 'gradient moment nulling', 'GMN']
    detection:
      exclusive: has_flow_comp
  BlackBlood:
    terms: ['black blood', 'dark blood', 'DANTE', 'vessel wall']
    keywords:
      - black blood
      - blackblood
      - dark blood
      - blood null
    # MRI pack 0.13.0: DANTE and Philips' `BB`, as whole words (flags.yml).
    detection:
      combination: [black_blood_named]
  BrightBlood:
    terms: ['bright blood']
    keywords:
      - bright blood
      - brightblood
  MoCo:
    terms: ['motion corrected', 'MoCo']
    keywords:
      - moco
      - mocoseries
      - motion correct
      - motioncorrect
    # MRI pack 0.13.0: or GE's prospective motion correction, PROMO.
    # MRI pack 0.21.0: no longer PROMO, which corrects the acquisition as it
    # runs and writes no corrected copy; and a Philips "Reg - " diffusion,
    # the registered copy (record 48, conventions round 3, cases 26 and 37).
    detection:
      exclusive: has_moco
      combination: [philips_registered_copy]
