# SPDX-License-Identifier: AGPL-3.0-only
#
# The construct axis, transcribed from v0 0.5.3
# `classification/detection_yaml/construct-detection.yaml` and the detector that reads it.
#
# An axis file is a rule set written compactly: one rule per value, in the
# order below, with up to three clauses in v0's order (an exclusive flag,
# then a keyword, then a combination of flags). The first value whose first
# clause holds decides, and which clause fired fixes the confidence.

axis: construct
kind: multi
# The confidences v0 fixes per tier, from its own `confidence_thresholds`.
tiers: {exclusive: 0.95, keywords: 0.85, combination: 0.75}
stores: label
# The text a keyword is matched against is the pack's own, normalized by
# its twelve steps from the fingerprint's folded fields (spec section 6.4).
search: search_text

# Only these are tried by this axis's own rules; any other value
# below is vocabulary a route sets (spec section 6.5).
order:
  - ADC
  - eADC
  - FA
  - Trace
  - MD
  - CBF
  - CBV
  - MTT
  - Tmax
  - TTP
  - PBP
  - K2
  - DeltaM
  - M0
  - Water
  - Fat
  - InPhase
  - OutPhase
  - T1map
  - T2map
  - R1map
  - R2map
  - PDmap
  - Qmap
  - SyntheticT1w
  - SyntheticT2w
  - SyntheticFLAIR
  - SyntheticPDw
  - MyelinMap
  - QSM
  - MIP
  - MinIP
  - StdDevProj
  - StdDevTime
  - MPR
  - Composed
  - EchoCombined
  - TTestMap
  - SBRef
  - FieldmapRef
  - B0map
  - B1map
  - Velocity
  - Speed
  - Magnitude
  - Real
  - Imaginary
  - ORIG
  - Filtered
  - ND

values:
  # MRI pack 0.11.0: not an exponential ADC, whose name holds `adc` too
  # (Philips `eADC` was ADC and eADC on the 2026-09-28 re-measure).
  # MRI pack 0.16.0: nor a Siemens acquired diffusion image, whose protocol
  # is named for the ADC map it also makes (flags.yml, dev-4 H4).
  ADC:
    terms: ['apparent diffusion coefficient', 'ADC map']
    # MRI pack 0.18.0: nor any acquired diffusion image whose protocol, not
    # its own name, says ADC (sealed-1 A11).
    # MRI pack 0.25.0: nor GE's AvDC written with an ADC image type, its
    # tensor's mean diffusivity (flags.yml, section 26c).
    requires: {all: [{not: has_eadc}, {not: eadc_words}, {not: siemens_acquired_diffusion}, {not: adc_only_in_protocol}, {not: ge_average_dc_named}]}
    keywords:
      - adc
      - apparent diffusion coefficient
      - adc map
    # MRI pack 0.25.0: or GE's Genesis `Diffusion Coefficient` (section 26c).
    detection:
      exclusive: has_adc
      # MRI pack 1.0.1 (Q3): or GE's output label `isoADC` (section 27).
      combination: [ge_adc_by_name_or_label]
  eADC:
    terms: ['exponential ADC', 'eADC']
    keywords:
      - eadc
      - exp adc
      - exponential adc
    # MRI pack 0.13.0: or GE's `Exp attenuation` [MQ4].
    # MRI pack 0.18.0: or Siemens' `EXP` token (the deep research, case 30).
    detection:
      exclusive: has_eadc
      # MRI pack 1.0.1 (Q3): or GE's output label `ExpAtt` (section 27).
      combination: [eadc_by_words_or_label]
  FA:
    terms: ['fractional anisotropy', 'FA map', 'color FA', 'colFA']
    keywords:
      - fractional anisotropy
      - fa map
    # MRI pack 0.13.0: or a derived GE image named `FA` and nothing else.
    detection:
      exclusive: has_fa
      # MRI pack 1.0.1 (Q3): or GE's output label `FA` (section 27).
      combination: [fa_by_name_or_label]
  # the same image as isoDWI, under Siemens' and Philips' names [MQ3, D2]
  # MRI pack 0.11.0: not on a map, whose protocol name may still say
  # `3scan_trace` (Siemens `ep2d_diff_3scan_trace_ADC` was ADC and Trace).
  Trace:
    terms: ['trace weighted', 'TRACEW', 'isotropic DWI', 'combined b', 'DIFFUSION_ISO']
    # MRI pack 0.24.0: nor a b=0 image named for the trace its series makes
    # (flags.yml, section 22).
    # MRI pack 1.0.1 (Q3): nor a GE output whose ReceiveCoilName label names
    # another image (flags.yml, section 27).
    requires: {all: [{not: {any: [has_adc, has_eadc, has_fa]}}, {not: b0_image_trace_named}, {not: ge_coil_label_not_isodwi}]}
    keywords:
      - trace
      - tracew
      - isodwi
      - isotropic dwi
    # MRI pack 0.13.0: or the isotropic image by its name, Philips'
    # `isob-1000` and `isoDiff`, GE's `Isotropic Image` [MQ3] (flags.yml).
    # MRI pack 0.15.0, Nima's ruling N4 (2026-09-30, record 48): or a
    # Philips diffusion image with a positive b value written `PROJECTION
    # IMAGE`, how Philips writes its computed isotropic image
    # (`philips_trace_projection`).
    detection:
      exclusive: has_trace
      combination: [trace_image]
  MD:
    terms: ['mean diffusivity']
    keywords:
      - mean diffusivity
      - md map
      - mean diff
    # MRI pack 0.13.0: GE's `AvDC`, the average diffusion coefficient.
    detection:
      combination: [md_named]
  CBF:
    terms: ['cerebral blood flow', 'rCBF']
    keywords:
      - cbf
      - cerebral blood flow
      - blood flow
      - rcbf
    detection:
      exclusive: has_cbf
  CBV:
    terms: ['cerebral blood volume', 'rCBV']
    keywords:
      - cbv
      - cerebral blood volume
      - blood volume
      - rcbv
    detection:
      exclusive: has_cbv
  MTT:
    terms: ['mean transit time']
    keywords:
      - mtt
      - mean transit time
      - transit time
    detection:
      exclusive: has_mtt
  Tmax:
    terms: ['time to maximum', 'Tmax']
    keywords:
      - tmax
      - t max
      - time to max
    detection:
      exclusive: has_tmax
  TTP:
    terms: ['time to peak']
    keywords:
      - ttp
      - time to peak
    detection:
      exclusive: has_ttp
  # MRI pack 0.18.0 (Nima, 2026-09-30: "we cannot force things to category
  # they don't belong to"): two DSC maps the vocabulary had no value for (the
  # deep research, case 17: "PBP has no vocabulary value (it is a
  # peak-signal-drop surrogate, not CBV); Cercare K2 (leakage) ... have no
  # value"). On the archive 15 PBP and 10 K2 or leakage stacks.
  PBP:
    terms: ['percentage of baseline at peak', 'PBP', 'peak signal drop', 'percent signal recovery at peak']
    description: 'the percentage of baseline at peak of a DSC bolus: the peak signal drop relative to baseline (Siemens inline perfusion), a surrogate of blood volume and no CBV'
    requires: pbp_stated
    keywords:
      - pbp
      - percentage of baseline
    detection:
      exclusive: pbp_stated
  K2:
    terms: ['K2', 'leakage coefficient', 'leakage map', 'rLeakage', 'permeability surrogate']
    description: 'the leakage coefficient of a DSC (K2), from a leakage-corrected fit: contrast leaking out of the vessels'
    # Its keyword only where the flag holds: a DSC map, never an ASL.
    requires: k2_stated
    keywords:
      - leakage
    detection:
      exclusive: k2_stated
  # MRI pack 0.11.0, ruled 2026-09-28 (`studies/2026-09-28-sequence-research/
  # decisions.md` in the design repository): the ASL label-control difference
  # and the M0 scan, which BIDS names (`aslcontext` volume type `deltam`, the
  # suffix `m0scan`) and which had no construct of their own.
  DeltaM:
    terms: ['perfusion-weighted image', 'PWI (ASL)', 'deltaM', 'label-control difference', 'ASL subtraction', 'PERFUSION_ASL']
    description: 'the ASL perfusion-weighted image: control minus label, subtracted by the scanner (BIDS aslcontext deltam)'
    keywords:
      - deltam
      - delta m
    requires: {not: silent_mra_output}
    detection:
      exclusive: is_asl_difference
  M0:
    terms: ['M0 scan', 'm0scan', 'proton density reference', 'ASL PD pass', 'equilibrium magnetisation image']
    description: 'the ASL M0 (equilibrium magnetisation) scan a CBF quantification divides by (BIDS m0scan)'
    # MRI pack 0.21.0: never GE's Silent MRA, which writes the ASL token on
    # its angiogram (case 18).
    requires: {all: [is_asl_m0, {not: silent_mra_output}]}
    keywords:
      - m0
    detection:
      exclusive: is_asl_m0_stated
  Water:
    terms: ['Dixon water', 'water only']
    keywords:
      - water only
      - water image
      - dixon water
    detection:
      exclusive: has_water
  Fat:
    terms: ['Dixon fat', 'fat only']
    keywords:
      - fat only
      - fat image
      - dixon fat
    detection:
      exclusive: has_fat
  InPhase:
    terms: ['in phase', 'in-phase', 'IP']
    keywords:
      - in phase
      - inphase
    # MRI pack 0.20.0: or the in-phase echo of a Siemens Dixon or
    # in/opposed-phase FLASH that states no Dixon token, by its name and its
    # echo time at its field (flags.yml, dev-5's A2).
    detection:
      exclusive: has_in_phase
      combination: [siemens_in_phase_echo]
  OutPhase:
    terms: ['opposed phase', 'out of phase', 'out-phase', 'OP']
    keywords:
      - opposed phase
      - out of phase
      - opp phase
      # MRI pack 0.16.0: GE IDEAL's `OutPhase:` (dev-4, H5).
      - outphase
    # MRI pack 0.20.0: and its opposed-phase echo (dev-5's A2).
    detection:
      exclusive: has_out_phase
      combination: [siemens_opposed_phase_echo]
  # The quantitative maps are one exclusion group, and a map that says
  # which quantity it is of beats one that says only that it is a map. Before
  # this the group did not exist and `combination: [is_qmap]` stood under
  # both T1map and T2map, so every stack whose image type said `QMAP` came
  # out as a T1 map *and* a T2 map whichever it was. The pack has parsed
  # `QMAP T1`, `QMAP T2` and `QMAP PD` apart since it was written and read
  # none of the three.
  T1map:
    terms: ['T1 map', 'T1 mapping', 'T1 relaxometry']
    group: QUANT_MAP
    priority: 1
    keywords:
      - t1 map
      - t1map
      - t1 relaxation
      - t1 mapping
    # MRI pack 0.24.0: or MOLLI's inline T1 map (flags.yml section 23).
    alternative_flags: [siemens_inline_t1_map]
    detection:
      exclusive: has_t1_map
      combination: [qmap_t1_stated]
  T2map:
    terms: ['T2 map', 'T2 mapping', 'T2 relaxometry']
    group: QUANT_MAP
    priority: 2
    keywords:
      - t2 map
      - t2map
      - t2 relaxation
      - t2 mapping
    detection:
      exclusive: has_t2_map
      combination: [qmap_t2_stated]
  R1map:
    terms: ['R1 map']
    group: QUANT_MAP
    priority: 3
    keywords:
      - r1 map
      - r1map
    detection:
      exclusive: has_r1
  R2map:
    terms: ['R2 map']
    group: QUANT_MAP
    priority: 4
    keywords:
      - r2 map
      - r2map
    detection:
      exclusive: has_r2
  PDmap:
    terms: ['PD map', 'proton density map']
    group: QUANT_MAP
    priority: 5
    keywords:
      - pd map
      - pdmap
      - proton density map
    detection:
      exclusive: has_pd_map
      combination: [qmap_pd_stated]
  # A file that says it is a quantitative map and not of what. Last of the
  # group, so it is what is left when no quantity was named.
  Qmap:
    terms: ['quantitative map', 'qMap']
    group: QUANT_MAP
    priority: 99
    detection:
      combination: [is_qmap]
  SyntheticT1w:
    terms: ['synthetic T1', 'SyMRI T1']
    keywords:
      - synthetic t1
      - synt t1
      - t1w synthetic
    detection:
      exclusive: has_t1_synthetic
  SyntheticT2w:
    terms: ['synthetic T2', 'SyMRI T2']
    keywords:
      - synthetic t2
      - synt t2
      - t2w synthetic
    detection:
      exclusive: has_t2_synthetic
  SyntheticFLAIR:
    terms: ['synthetic FLAIR', 'SyMRI FLAIR']
    keywords:
      - synthetic flair
      - synt flair
    detection:
      exclusive: has_flair_synthetic
  SyntheticPDw:
    terms: ['synthetic PD', 'SyMRI PD']
    keywords:
      - synthetic pd
      - synt pd
    detection:
      exclusive: has_pd_synthetic
  # MRI pack 0.18.0: only on a computed image: a clinical word on an
  # acquired one is no map (sealed-1 A11).
  MyelinMap:
    terms: ['myelin water fraction', 'MWF', 'myelin map', 'MyC']
    requires: {any: [has_myelin, is_derived, is_synthetic]}
    keywords:
      - myelin map
      - myelin
      - mwf
      - myelin water fraction
    detection:
      exclusive: has_myelin
  QSM:
    terms: ['quantitative susceptibility mapping', 'susceptibility map', 'QSM']
    keywords:
      - qsm
      - susceptibility map
      - chi map
    detection:
      exclusive: has_qsm
  # MRI pack 0.12.0: not a minimum projection, whose `minip` holds the
  # keyword `mip` (dev-1: three SWI minIPs were MIP and MinIP).
  MIP:
    terms: ['maximum intensity projection', 'MIP']
    # MRI pack 0.18.0: nor a slice whose protocol, not its own name, says
    # MIP (sealed-1 A11).
    # MRI pack 0.21.0: nor a Siemens `CSA MPR` image, a reformat whatever
    # its series is named (record 48, conventions round 3, case 3).
    # MRI pack 0.25.0: nor a Philips `MAX_IP` over a volume of thin slices,
    # a reformat (flags.yml, section 26a), nor a Philips projection of thin
    # contiguous slices named mip, a reformat (section 26e).
    requires: {all: [{not: is_minip}, {not: mip_only_in_protocol}, {not: csa_mpr_image}, {not: philips_max_ip_volume}, {not: philips_projection_thin_named_mip}]}
    keywords:
      - mip
      - maximum intensity projection
      - max ip
    detection:
      exclusive: is_mip
  MinIP:
    terms: ['minimum intensity projection', 'mIP', 'MinIP']
    # MRI pack 0.21.0: nor a Siemens `CSA MPR` image (case 3).
    # MRI pack 0.25.0: nor a name's minIP where the image type states a MIP
    # (GE's ImageType first: `PJN\MIP`, round 3).
    requires: {all: [{not: csa_mpr_image}, {not: {all: [image_type.is_mip, {not: image_type.is_minip}]}}]}
    keywords:
      - minip
      - minimum intensity projection
      - min ip
    detection:
      exclusive: is_minip
  # MRI pack 0.18.0: a standard deviation projection through a volume
  # (Siemens `STDDEV_COR`, `STDDEV_SAG`, `STDDEV_TRA`): neither a maximum nor
  # a minimum projection (the deep research, case 35: "no construct fits";
  # 2 archive stacks, on a TOF).
  StdDevProj:
    terms: ['standard deviation projection', 'STDDEV projection', 'SD projection']
    description: 'a standard deviation projection through a volume, each pixel the standard deviation of the voxels along the ray'
    detection:
      exclusive: stddev_projection
  # MRI pack 0.21.0: the voxelwise standard deviation over the measurements
  # of a series (Siemens Std-Dev-Time, `STDDEV_TIME`), a temporal map and no
  # spatial projection (record 48, conventions round 3, case 4; a value the
  # vocabulary lacked).
  StdDevTime:
    terms: ['standard deviation over time', 'temporal standard deviation', 'Std-Dev-Time', 'STDDEV_TIME', 'tSD map']
    description: 'the voxelwise standard deviation over the measurements or time points of a series, a temporal map and no spatial projection'
    detection:
      exclusive: stddev_time
  # MRI pack 0.12.0: a projection is a MIP or a MinIP and not a plane as
  # well, though a workstation writes `MPR` on both (Siemens
  # `DERIVED\SECONDARY\MPR` on a MIP; dev-1 settled MIP alone on six stacks
  # the rules would have made MIP and MPR). And the plane of a Philips
  # reformat (flags.yml, `is_projection_plane`).
  MPR:
    terms: ['multiplanar reformat', 'MPR', 'reformat']
    # MRI pack 0.18.0: nor a standard deviation projection.
    # MRI pack 0.21.0: a projection's name does not keep a Siemens `CSA MPR`
    # image from being the reformat its image type says (case 3).
    # MRI pack 0.21.0: nor a Siemens position display, whose protocol's name
    # (`t1_mpr`) is another series' (dev-6's A9).
    # MRI pack 0.25.0: a projection name does not hold off a Philips
    # projection of thin contiguous slices (flags.yml, section 26e).
    requires: {not: {any: [is_mip, is_minip, {all: [projection_named, {not: csa_mpr_image}, {not: philips_projection_thin_named_mip}]}, stddev_projection, stddev_time, image_type.is_posdisp]}}
    keywords:
      - multiplanar reformat
      - reformatted
    detection:
      exclusive: is_mpr
  # MRI pack 0.11.0, ruled 2026-09-28: the single-band reference of a
  # multiband run (Siemens numbers it 1000 above its run, dcm2niix issue
  # 816; or its name), and the EPI of reversed phase encoding a distortion
  # correction pairs with a run (BIDS `func/_sbref`, `fmap/_epi`).
  SBRef:
    terms: ['single-band reference', 'SBRef', 'single band reference']
    description: 'the single-band reference image of a multiband EPI run (BIDS sbref)'
    # MRI pack 0.18.0: or a diffusion run's SBRef (flags.yml,
    # `diffusion_sbref`; the deep research, case 6).
    requires: {any: [is_sbref, diffusion_sbref]}
    keywords:
      - sbref
    detection:
      exclusive: is_sbref_numbered
      combination: [diffusion_sbref]
  FieldmapRef:
    terms: ['reverse phase-encoding EPI', 'blip-up blip-down', 'pepolar', 'TOPUP reference', 'EPI field map']
    description: 'an EPI of a few volumes with the phase encoding reversed, for distortion correction (BIDS fmap epi)'
    requires: is_epi_fieldmap_ref
    keywords:
      - pepolar
      - topup
      - blip
      - fieldmap
      - field map
      - fmap
      - reverse
      - rev
      - ap
      - pa
    detection:
      exclusive: ge_pepolar
  # A reversed-phase EPI reference is FieldmapRef, not a B0 map, whatever it
  # is named (MRI pack 0.11.0).
  B0map:
    terms: ['B0 map', 'field map', 'fieldmap']
    # MRI pack 0.18.0: nor the magnitude echo of a field map (sealed-1 A11).
    requires: {all: [{not: is_epi_fieldmap_ref}, {not: fieldmap_magnitude}]}
    keywords:
      - b0 map
      - b0map
      - field map
      - fieldmap
    detection:
      exclusive: has_b0_map
  # `FLIP ANGLE MAP` reaches this through `has_b1_map`: a flip angle map is
  # a B1 map in degrees, and BIDS gives the two one suffix.
  B1map:
    terms: ['B1 map', 'flip angle map']
    keywords:
      - b1 map
      - b1map
      - b1+
      - b1-
    detection:
      exclusive: has_b1_map
  # One image built out of several, which is the largest single
  # discriminator in the archive: `COMPOSED` and the `COMP_*` spellings tell
  # 2,525 colliding names apart, and until now the pack parsed them into a
  # flag nothing read. A whole-spine composed image and the station images it
  # was stitched from agree on every other axis there is.
  Composed:
    terms: ['composed', 'composite', 'composing', 'stitched']
    # MRI pack 0.14.0: or Philips' MobiView (flags.yml).
    detection:
      exclusive: is_composite
      combination: [composed_named]
  # The image the scanner writes beside the echoes it combined, `MEAN` in the
  # image type, always a series of its own. It agrees with its per-echo
  # siblings on every axis the pack has and often carries no echo number at
  # all, so without this nothing separates them: 308 colliding names, 931
  # stacks.
  EchoCombined:
    terms: ['echo combined', 'combined echoes']
    detection:
      exclusive: is_mean
  # A statistic over a series rather than an image of the person. Its
  # disposition and its exclusion are not changed here; what changes is that
  # it no longer wears the name of the images it was computed from.
  # Except in an ASL series: Siemens writes `TTEST` on the perfusion-weighted
  # image of its 3D GRASE ASL, the label-control subtraction that is the
  # series' own image, and 249 of them were a t test map (record 41).
  TTestMap:
    terms: ['t-test map', 't map', 'statistical map']
    # MRI pack 0.18.0: nor on any ASL output, the subtraction or a map, with
    # or without the `ASL` token (flags.yml, `ttest_on_asl`; sealed-1 A20).
    requires: {not: ttest_on_asl}
    detection:
      exclusive: is_ttest
  # MRI pack 0.18.0: the velocity image of a phase-contrast acquisition,
  # the phase difference scaled to velocity (the deep research, case 19:
  # "velocity -> Phase (Velocity is missing)"). Read where the image type or
  # the words say velocity on a phase contrast; a phase image that says
  # nothing more stays Phase.
  Velocity:
    terms: ['velocity', 'velocity image', 'velocity map', 'flow velocity', 'VENC image']
    description: 'the velocity image of a phase-contrast acquisition: the phase difference scaled to velocity by the encoding velocity'
    detection:
      exclusive: velocity_image
  # MRI pack 0.21.0: the angiogram of a phase contrast, the magnitude of the
  # velocity vector or the complex difference (Philips' `PCA` image that is
  # neither its magnitude, its velocity nor a projection): neither a signed
  # velocity component nor a tissue magnitude (record 48, conventions round
  # 3, case 5; a value the vocabulary lacked).
  Speed:
    terms: ['speed image', 'phase contrast angiogram', 'PCA angiogram', 'complex difference', 'flow speed']
    description: 'the angiogram of a phase-contrast acquisition: the magnitude of the velocity vector or the complex difference, neither a signed velocity component nor a tissue magnitude'
    detection:
      exclusive: pc_speed_image
  Magnitude:
    terms: ['magnitude', 'magnitude image']
    keywords:
      - magnitude image
      - magnitude only
    # MRI pack 0.21.0: and Philips' phase-contrast magnitude, `M_PCA`
    # (record 48, conventions round 3, case 5).
    # MRI pack 0.24.0: or a Siemens MEAN magnitude over a multi-echo gradient
    # echo's echoes, with EchoCombined (flags.yml section 23).
    alternative_flags: [siemens_mean_magnitude]
    detection:
      exclusive: pc_magnitude_image
  Real:
    terms: ['real', 'real part']
    keywords:
      - real image
      - real component
    # MRI pack 0.24.0: or a GE MAGiC or MDME image GE's private image type
    # writes real (flags.yml, section 20, `ge_mdme_real`).
    # MRI pack 0.25.0: or a Siemens reformat named PSIR or TrueIR of an
    # inversion recovery (DR3 pairs PSIR with Real; flags.yml, section 26d).
    alternative_flags: [psir_named_ir_reformat]
    detection:
      exclusive: real_component
  Imaginary:
    terms: ['imaginary', 'imaginary part']
    keywords:
      - imaginary image
      - imaginary component
    detection:
      exclusive: has_imaginary
  ORIG:
    terms: ['original']
    detection:
      exclusive: is_ge_orig
  Filtered:
    terms: ['filtered']
    # MRI pack 0.13.0: or Elscint's enhancement filter and GE's `FL:`
    # prefix (flags.yml, `is_filtered_named`).
    detection:
      exclusive: is_ge_filtered
      combination: [is_filtered_named]
  ND:
    terms: ['no distortion correction', 'not distortion corrected']
    detection:
      exclusive: has_nd
  INV1:
    terms: ['first inversion', 'MP2RAGE INV1']
    keywords:
      - inv1
      - inv 1
      - inversion 1
    detection:
      exclusive: is_mp2rage_inv1
  INV2:
    terms: ['second inversion', 'MP2RAGE INV2']
    keywords:
      - inv2
      - inv 2
      - inversion 2
    detection:
      exclusive: is_mp2rage_inv2
  # MRI pack 0.12.0: the denoised uniform image is UniformDenoised alone.
  # Siemens writes `UNIFORM` on both, and dev-1 settled UniformDenoised
  # without Uniform on all three stacks that held both.
  Uniform:
    terms: ['UNI', 'uniform image', 'MP2RAGE UNI']
    requires: {not: is_uniform_denoised}
    keywords:
      - uni image
      - uni images
      - uniform image
      - uniform images
    detection:
      exclusive: has_uniform
  UniformDenoised:
    terms: ['UNI-DEN', 'UNI denoised', 'MP2RAGE UNI-DEN']
    label: Denoised
    keywords:
      - uni - den
      - uni-den
      - uniden
      - uniform denoised
      - denoised uniform
      - uniform weighted
    detection:
      exclusive: is_uniform_denoised
  # FSBB is Canon's, BSI Fujifilm's [MQ5, V1, V2, P4]. Whether GE's SWAN is
  # a SWI construct or only a SWI base, the sources disagree [P4, P5, V1].
  SWI:
    terms: ['susceptibility weighted imaging', 'SWI', 'SWAN', 'SWIp', 'VenoBOLD', 'FSBB', 'eFSBB', 'BSI']
    keywords:
      - swi processed
      - swi combined
      - swi filtered
    detection:
      combination: [has_swi, is_derived]
  # MRI pack 0.12.0: `phase` is also a word for a Dixon's in and opposed
  # phase, a dynamic's arterial or venous phase, a phase contrast flow study
  # and the phase-encoding direction, none of which is a phase image. The
  # image type says phase (`P`, `PHASE`, `PHASE MAP`), and the reading
  # guide takes it from there; the word counts only where none of those is
  # meant (dev-1: a GE multi-echo gradient echo and a Siemens subtraction
  # were Phase by the word).
  Phase:
    terms: ['phase', 'phase image']
    # MRI pack 0.18.0: nor a phase contrast's velocity image (above).
    requires: {all: [{not: phase_not_an_image}, {not: velocity_image}]}
    keywords:
      - phase
      - phase map
      - phasemap
      - phase image
    detection:
      exclusive: has_phase
  # R2* is 1/T2*, and a T2* map is a map of its own [P49, MQ15, V1]
  R2starmap:
    terms: ['R2* map', 'R2star map', 'R2* relaxation rate map']
    keywords:
      - r2star
      - r2star map
      - r2starmap
    detection:
      exclusive: has_r2star

  # Vocabulary the routes set and this axis's own rules never try. v0 has no
  # declaration for these at all: its SyMRI route writes them and its intent
  # cascade tests for them, with nothing tying the two together. Three of them
  # are in the live corpus (SyntheticDIR 241, SyntheticPSIR 287,
  # SyntheticSTIR 28).
  'SyntheticSTIR': {terms: ['synthetic STIR', 'SyMRI STIR']}
  'SyntheticDIR': {terms: ['synthetic DIR', 'SyMRI DIR']}
  'SyntheticPSIR': {terms: ['synthetic PSIR', 'SyMRI PSIR']}
  # No rule writes it, in v0 or here, and v0's intent cascade tested for it
  # twice where it could never be; those tests are gone (record 41). The
  # value stays, because a vocabulary is a contract and a question asked of
  # an earlier version may name it. `nils pack shape` reports it unreachable.
  'FatFraction': {terms: ['fat fraction', 'PDFF', 'proton density fat fraction']}
  # The SyMRI route writes it; v0 declares it nowhere and wrote it 170 times.
  'MultiQmap': {terms: ['multiple quantitative maps', 'qmaps']}
  # The EPIMix route writes it; v0 declares it nowhere and wrote it 67 times.
  'isoDWI': {terms: ['isotropic DWI', 'isoDWI']}
  # MRI pack 1.0.3 (record 55 C3): a picture made to be looked at, which
  # rules/display.yml writes on a SyMRI stack saved in colour. Its disposition
  # is `display_composite`, which a release leaves out unless asked for.
  'DisplayComposite':
    terms: ['display composite', 'colour composite', 'color composite', 'colour overlay', 'saved in colour']
    description: 'a picture made to be looked at, saved in colour with the viewer''s settings: a map or a segmentation drawn in colour over a synthetic image; neither a map a measurement can read nor a weighting'
