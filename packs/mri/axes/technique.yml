# SPDX-License-Identifier: AGPL-3.0-only
#
# The technique axis, transcribed from v0 0.5.3
# `classification/detection_yaml/technique-detection.yaml` and the detector that reads it.
#
# An axis file is a rule set written compactly: one rule per value, in the
# order below, with up to three clauses in v0's order (an exclusive flag,
# then a keyword, then a combination of flags). The first value whose first
# clause holds decides, and which clause fired fixes the confidence.

axis: technique
kind: single
# v0's pipeline stores the display name and not the identity, which is how
# `3D-TSE` came to be written `SPACE` and `SP-GRE` written `FLASH`.
stores: label
# The pipeline stores the display name, and v0 spells the fallback `Unknown`.
default: Unknown
# The text a keyword is matched against is the pack's own, normalized by
# its twelve steps from the fingerprint's folded fields (spec section 6.4).
# MRI pack 0.10.0: `technique_text` is `search_text` without GE's
# ProtocolName, which names the exam and not the series
# (normalize-technique.yml).
search: technique_text

# Only these are tried by this axis's own rules; any other value
# below is vocabulary a route sets (spec section 6.5).
#
# MRI pack 0.10.0 (`studies/2026-09-28-sequence-research/reconciled.md` in
# the design repository). The EPI time series in the order both research
# reports give: diffusion, then ASL (a `PERFUSION` image type is ASL, DSC or
# DCE alike, so the ASL-only signs go first), then DSC (it shares BOLD's
# gradient-echo EPI, so the contrast and the perfusion words go before BOLD
# takes every EPI time series), then BOLD, then the one-volume references.
# DCE is a 3D gradient echo and stays before DSC, so a series that says DCE
# is DCE whatever its image type says. The gradient-echo family: angiography
# first (flow contrast outranks the rest, and TOF and PC are FLASH inside),
# then the magnetisation-prepared, then the coherent steady states, then
# combined multi-echo before multi-echo, the variable flip angle, and the
# named interpolated 3D before the turbo, spoiled and steady-state families.
order:
  # MRI pack 0.18.0: a spectrum first, since its header states an imaging
  # readout it does not have.
  - MRS
  - MS-EPI
  - DWI-TSE
  - DWI-EPI
  - DWI-STEAM
  # MRI pack 0.18.0: before ASL, whose token GE writes on its Silent MRA.
  - ZTE
  - ASL
  - DCE
  - Perfusion-EPI
  - BOLD-EPI
  - GRASE
  - SE-EPI
  - GRE-EPI
  - MRF
  - MDME
  - MAVRIC
  - '3D-TSE'
  - SS-TSE
  - IR-TSE
  - ME-SE
  - VFA-TSE
  - TSE
  - SE
  # MRI pack 0.18.0: before TOF-MRA, whose GE option its protocols carry.
  - CE-MRA
  - TOF-MRA
  - PC-MRA
  - QALAS
  - MP2RAGE
  - MEMPRAGE
  - MPRAGE
  - CISS
  - bSSFP
  - DESS
  - SSFP
  - comb-ME-GRE
  - ME-GRE
  - VFA-GRE
  - VI-GRE
  - FSP-GRE
  - SP-GRE
  - SS-GRE
  - GRE
  - EPI

# `terms` are other names a person knows a value by: vendors' names for the
# same sequence and common spellings, so the reader finds MPRAGE by BRAVO.
# Display only: no rule reads them, and they move no stack; the words that
# decide are `keywords`.
#
# Record 48 checked the terms against six independent cross-vendor tables
# and the literature (`studies/2026-09-25-pack-constraints/` in the design
# repository, section 6). A comment `[V1, V2]` cites that study's source
# ids: V1 the Siemens cross-vendor acronym table, V2 Fujifilm's acronym
# guide, V3 Siemens' sequence brochure, M1 MR-TIP's comparison, IM4 IMAIOS'
# acronyms, MQ mriquestions.com, RP Radiopaedia, S8 the brain tumour imaging
# protocol consensus, P a paper. The table is in PROVENANCE.md.
values:
  # MRI pack 0.18.0 (Nima, 2026-09-30: "we cannot force things to category
  # they don't belong to"): magnetic resonance spectroscopy. The deep
  # research, case 16: no technique value exists for it. Our registries hold
  # no MR Spectroscopy Storage object; GE writes its PROBE single-voxel and
  # CSI results as a few MR images (35 archive stacks named for
  # spectroscopy, 12 of them one image), so the value is read from those
  # words on a stack of at most 16 images, and the stack's base is none.
  MRS:
    terms: ['MR spectroscopy', 'MRS', 'single voxel spectroscopy', 'SVS', 'PRESS', 'STEAM spectroscopy', 'chemical shift imaging', 'CSI', 'MRSI', 'PROBE']
    label: MRS
    description: 'magnetic resonance spectroscopy (single voxel or chemical shift imaging): a spectrum, or the images a scanner writes of one, with no image contrast'
    family: OTHER
    detection:
      exclusive: is_mrs
  MS-EPI:
    # MUSE and IRIS are interleaved multishot EPI, RESOLVE readout-segmented;
    # the value covers both, its label only the second [P50, V2]
    terms: ['readout-segmented EPI', 'readout segmented', 'IRIS', 'MUSE', 'rs-EPI', 'segmented EPI DWI']
    label: RESOLVE
    family: EPI
    keywords:
      - resolve
      - muse
      - multishot epi
      - multi-shot epi
      - segmented epi
    # Only the readout-segmented sequence's own name says so (`*re_b`).
    # v0 also took segmented k-space beside an EPI readout, and Siemens
    # writes `SK` in SequenceVariant on every EPI it makes, single shot or
    # not: on five scanner protocols that combination called 2,916
    # single-shot diffusion stacks, 462 BOLD stacks and every ASL series
    # RESOLVE, and not one of them was (record 41).
    # MRI pack 0.21.0: and GE MUSE by its pulse sequence or name, Philips
    # IRIS by its name (record 48, conventions round 3, case 27).
    alternative_flags: [ms_epi_stated]
    requires: {not: gre_scout_readout}
    detection:
      exclusive: is_epi_diff_resolve
  # MRI pack 0.15.0, Nima's ruling N3 (2026-09-30, record 48): a diffusion
  # read out by a turbo spin echo, not by an EPI: Philips' DWI-TSE, a
  # PROPELLER, BLADE or MultiVane diffusion, a HASTE diffusion. Its base is
  # DWI (rules/base.yml) and its family SE. Tried before DWI-EPI, whose
  # diffusion flag would take it, and read from that flag with a stated
  # spin echo, a train and a readout named as no EPI (flags.yml, `dwi_tse`).
  DWI-TSE:
    terms: ['TSE diffusion', 'turbo spin echo diffusion', 'DWI TSE', 'PROPELLER DWI', 'BLADE diffusion', 'MultiVane DWI', 'HASTE diffusion', 'non-EPI DWI']
    description: 'diffusion-weighted imaging read out by a turbo spin echo (PROPELLER, BLADE, MultiVane, HASTE, Philips DWI-TSE), not an EPI'
    family: SE
    requires: {not: gre_scout_readout}
    detection:
      combination: [dwi_tse]
  DWI-EPI:
    terms: ['ep2d_diff', 'diffusion weighted EPI', 'SS-EPI DWI']
    family: MIXED
    # MRI pack 0.22.0: never an image the scanner typed LOCALIZER or SCOUT
    # on a plain gradient-echo readout, whose name and private technique may
    # be those of the series it plans (flags.yml, `typed_localizer_gre`;
    # dev-7: a Philips SmartPlan image described `dADC iso` was DWI-EPI).
    # MRI pack 0.24.0: nor a Siemens position display on a gradient echo
    # (Nima, 2026-10-02; flags.yml, `gre_scout_readout`).
    requires: {not: gre_scout_readout}
    keywords:
      - dwi
      - dti
      - diffusion
      - hardi
      - dsi
    detection:
      exclusive: is_dwi
  DWI-STEAM:
    family: MIXED
    requires: {not: gre_scout_readout}
    keywords:
      - steam
      - dwi-steam
      - diffusion steam
  # MRI pack 0.10.0: an EPI time series with no sign of diffusion, perfusion
  # or contrast is BOLD from the header alone, and so is a single-band
  # reference (flags.yml, section 11). A word counts only as a whole word
  # (`bold` is inside VenBOLD, Philips' SWI), not on a series whose header
  # states a readout that is not EPI, and not on one the file says holds
  # fewer than 10 time points unless it is a map computed from a run: GE's
  # exam protocol put `fmri` on a scout and a BRAVO, and GE's reverse-phase
  # field maps of 4 time points are named `rsfMRI_FieldMap`.
  BOLD-EPI:
    terms: ['ep2d_bold', 'fMRI EPI', 'BOLD']
    label: BOLD
    family: MIXED
    requires:
      any:
        - is_bold
        - is_bold_structural
        - all: [bold_words, {not: says_not_epi}, {any: [{not: has_few_time_points}, is_derived, is_ttest]}]
    keywords:
      - bold
      - fmri
      - functional
      - resting state
      - task
    detection:
      exclusive: is_bold
      combination: [is_bold_structural]
  # MRI pack 0.18.0: a zero echo time 3D radial readout: GE's Silenz and
  # Siemens' PETRA, silent structural scans, and GE's Silent MRA, which
  # prepares it with an arterial spin labelling module and subtracts control
  # from label (the deep research, case 29: "no technique value fits"; 13
  # archive stacks, pulse sequence `Silenz`, stored SP-GRE 12 and ASL 1).
  # Its trajectory is Radial on the modifier axis.
  ZTE:
    terms: ['zero echo time', 'ZTE', 'Silenz', 'Silent MRA', 'Silent scan', 'PETRA', 'pointwise encoding time reduction with radial acquisition']
    label: ZTE
    description: 'a zero echo time 3D radial readout (GE Silenz, Siemens PETRA); with an arterial spin labelling preparation, GE Silent MRA'
    family: GRE
    keywords:
      - zte
      - petra
      - silenz
    detection:
      exclusive: is_zte
  # Record 48: named for the labelling and not a readout. The consensus
  # readouts are 3D GRASE and a 3D spiral fast spin echo, with 2D EPI an
  # alternative [P20, RP5]. The identity was ASL-EPI before pack 0.6.0, and
  # the alias keeps a campaign, an overlay or a decision that names it
  # reading as this value; what a row stores, the label, did not change.
  ASL:
    terms: ['arterial spin labeling', 'arterial spin labelling', '3D ASL', 'pCASL', 'PASL', '3D GRASE ASL', 'spiral ASL']
    label: ASL
    description: 'arterial spin labelling perfusion, any readout (3D GRASE, 3D spiral FSE, EPI)'
    aliases: [ASL-EPI]
    family: MIXED
    # MRI pack 0.10.0: a word counts only as a whole word (`asl` is inside
    # `basline`), and only on a readout ASL is made with: EPI, 3D (GRASE,
    # spiral) or GE's spiral, or on an image the scanner computed.
    # MRI pack 0.11.0: or an ASL's M0 scan (flags.yml, 12).
    requires:
      any:
        - is_asl
        - is_asl_m0
        - all: [asl_words, {any: [has_epi, is_3d, is_spiral, is_derived]}]
    keywords:
      - asl
      - pcasl
      - pasl
      - casl
      - arterial spin
    detection:
      exclusive: is_asl
      combination: [is_asl_m0]
  # Record 48: DCE is a T1-weighted 3D spoiled gradient echo, not EPI, and
  # takes a value of its own [MQ2, RP3, D4]; `dce` moved here from
  # Perfusion-EPI, which is now the dynamic susceptibility contrast series.
  # Tried before it, so a series that says DCE is DCE whatever its image
  # type says.
  # MRI pack 0.10.0: also from the header, a 3D spoiled gradient echo of 10
  # or more time points that is no angiography run (flags.yml, section 11),
  # and the word only as a whole word.
  DCE:
    terms: ['dynamic contrast enhanced', 'DCE-MRI', 'DCE perfusion', 'permeability']
    description: 'dynamic contrast enhanced perfusion: a T1-weighted 3D spoiled gradient echo repeated through a bolus'
    family: GRE
    # MRI pack 0.25.0 (round 5, case 1): or a Siemens TWIST-VIBE dynamic run
    # that names no angiography (flags.yml, `twist_vibe_dynamic`): DCE by
    # default; an angiography name keeps it CE-MRA.
    requires: {any: [is_dce_series, dce_words, twist_vibe_dynamic]}
    keywords:
      - dce
      - dynamic contrast enhanced
    alternative_flags: [twist_vibe_dynamic]
    detection:
      combination: [is_dce_series]
  Perfusion-EPI:
    terms: ['ep2d_perf', 'DSC perfusion', 'dynamic susceptibility contrast', 'bolus tracking']
    label: Perfusion
    description: 'dynamic susceptibility contrast (DSC) perfusion, a gradient- or spin-echo EPI through a bolus'
    family: EPI
    # MRI pack 0.10.0: tried before BOLD, from a perfusion image type (not
    # ASL's), a map only DSC makes, or an EPI time series given contrast or
    # named for perfusion (flags.yml, section 11). A word counts as a whole
    # word, and not on a series whose header states a readout that is not
    # EPI, unless it is a perfusion map: GE's exam protocol put `perfusion` on
    # a localizer, a T2 FSE, a FLAIR and a spin echo.
    requires:
      any:
        - is_dsc_stated
        - is_dsc_series
        - all: [dsc_words, {any: [{not: says_not_epi}, is_perfusion_derived, perfusion_map_words]}, {not: is_asl}]
        # a DSC map named for what it is, where its image type says nothing
        - all: [perfusion_map_words, {not: is_asl}, {not: asl_words}, {not: is_spiral}]
    keywords:
      - perfusion
      - dsc
      - pwi
      - rcbv
      - rcbf
      - rmtt
    detection:
      exclusive: is_dsc_stated
      combination: [is_dsc_series]
  GRASE:
    # Canon's name [V1, M1]
    terms: ['gradient and spin echo', 'TGSE', 'Hybrid EPI']
    family: MIXED
    keywords:
      - grase
      - turbogse
      - tgse
    # MRI pack 0.19.0: an enhanced object's EchoPulseSequence BOTH with EPI
    # (the deep research's case 22).
    detection:
      exclusive: mech_grase
  SE-EPI:
    family: MIXED
    keywords:
      - se-epi
      - spin echo epi
    # MRI pack 0.10.0: the readout from the Siemens name (`epse`) or Philips'
    # SEEPI before ScanningSequence.
    detection:
      combination: [is_se_epi]
  GRE-EPI:
    family: MIXED
    keywords:
      - gre-epi
      - epi-gre
    # MRI pack 0.10.0: `epfid` or Philips' FEEPI before ScanningSequence.
    detection:
      combination: [is_gre_epi]
  MRF:
    terms: ['MR fingerprinting', 'magnetic resonance fingerprinting']
    family: MIXED
    keywords:
      - mrf
      - fingerprinting
    detection:
      exclusive: is_mrf
  MDME:
    terms: ['QRAPMASTER', 'MAGiC', 'SyMRI acquisition', 'SyntAc']  # SyntAc: Philips [P23, MQ19]
    family: SE
    keywords:
      - mdme
      - multi dynamic multi echo
      - multi-dynamic multi-echo
      - symri
      - magic
    detection:
      exclusive: is_mdme
  # The metal artefact technique, stated in the image type and parsed into a
  # flag nothing read. It is a spin echo readout at a set of offset centre
  # frequencies, so it is a technique and not a construct; the composite
  # image it also writes says so on the construct axis instead. Ahead of the
  # TSE values because it is the narrower claim and they would take it first.
  MAVRIC:
    family: SE
    keywords:
      - mavric
      - mavric sl
    detection:
      exclusive: is_mavric
  '3D-TSE':
    terms: ['SPACE', 'CUBE', 'VISTA', '3D TSE', '3D FSE', 'MVOX', 'isoFSE', '3D FLAIR TSE', 'spc']
    label: SPACE
    family: SE
    # MRI pack 0.24.0: never where the header states a readout of another
    # family (flags.yml, section 19); the same guard is on every spin-echo
    # value below.
    # MRI pack 0.25.0 (the protocol sweep): nor a GE 2D fast spin echo by its
    # pulse sequence named Cube (flags.yml, section 26d), nor a Siemens 3D
    # HASTE, single-shot (section 26e).
    requires: {all: [{not: readout_not_spin_echo}, {not: siemens_plain_se_named_turbo}, {not: ge_2d_fse_psd}, {not: siemens_haste_3d}]}
    keywords:
      - space
      - cube
      - vista
      - '3d tse'
      - '3d fse'
      - fase3d
      - mvox
      - isofse
      # MRI pack 0.13.0: GE's research `3dfse` (dev-1: two reformats).
      - 3dfse
    # MRI pack 0.11.0: or a 3D spin echo with a train of 100 or more, which
    # is what a GE CUBE FLAIR's reformat states (flags.yml, 12).
    detection:
      exclusive: is_space
      combination: [is_3d_tse]
  SS-TSE:
    terms: ['HASTE', 'SSFSE', 'SSh TSE', 'single shot TSE', 'FASE', 'single-shot FSE']
    label: HASTE
    family: SE
    requires: {all: [{not: readout_not_spin_echo}, {not: siemens_plain_se_named_turbo}]}
    keywords:
      - haste
      - ssfse
      - ss-tse
      - sstse
      - single shot tse
      - single shot fse
    detection:
      exclusive: is_haste
  IR-TSE:
    # GE's name is FastIR [V1, V2, M1, IM4]; FSE-IR is IMAIOS' alone, and
    # TIR also names a true (phase-sensitive) IR in V1 and V2
    terms: ['TIRM', 'FSE-IR', 'IR TSE', 'TSE-IR', 'turbo inversion recovery', 'TIR', 'FastIR', 'Fast IR', 'FIR']
    label: TIRM
    family: SE
    # MRI pack 0.16.0: never a dual-echo spin echo that only its name calls
    # FLAIR (flags.yml, dev-4 H3), where `flair tse2` holds `ir tse`.
    # MRI pack 0.25.0 (the protocol sweep): nor a Siemens spin echo named
    # STIR whose header states no inversion (flags.yml, section 26d).
    requires: {all: [{not: flair_named_dual_echo}, {not: readout_not_spin_echo}, {not: siemens_plain_se_named_turbo}, {not: siemens_stir_named_without_inversion}]}
    keywords:
      - tirm
      - stir
      - ir-tse
      - ir tse
      - ir-fse
      - ir fse
      # MRI pack 0.13.0: `IRFSE` as one word, as Picker and Elscint name
      # their sequence (dev-1: two stacks read as TSE).
      - irfse
    # MRI pack 0.14.0: or a FLAIR on a spin-echo readout whose header states
    # no train (flags.yml, `flair_tse`).
    detection:
      combination: [is_ir_tse_readout]
  ME-SE:
    # not bare `dual echo`, which is also a dual-echo GRE and DESS [V3].
    # Pack 0.9.0, Nima's ruling (2026-09-27): a conventional multi-echo spin
    # echo, 3 or more echoes for T2 mapping or a pre-turbo dual echo with no
    # echo train. A dual-echo PD/T2 FSE or TSE is a TSE [M1, MQ20, RP14, B1],
    # each echo its own stack; before this the combination below called every
    # split one ME-SE, which v0 never did. `memp` is GE's name for its spin
    # echo with any number of echoes, so it is no word for this value.
    terms: ['multi-echo spin echo', 'MESE', 'dual echo SE', 'CPMG', 'T2 mapping spin echo']
    label: MESE
    family: SE
    # MRI pack 0.21.0: nor a Philips mDixon TSE, whose echoes are its Dixon
    # parts (flags.yml, section 18).
    requires: {all: [{not: is_dual_echo_tse}, {not: philips_dixon_tse}, {not: readout_not_spin_echo}]}
    keywords:
      - mese
      - me-se
      - multi echo se
      - multi-echo se
      - dual echo se
    # MRI pack 0.25.0: or a Siemens pre-turbo dual echo split by echo whose
    # file says research mode (flags.yml, section 26d).
    alternative_flags: [siemens_pre_turbo_dual_echo_se]
    detection:
      exclusive: is_me_se
      combination: [is_multi_echo, has_se]
  # RESTORE, FRFSE, DRIVE and T2 Plus are a 90-degree flip-back (driven
  # equilibrium) TSE, not a variable flip angle [V1, V3, P48]; the identity
  # keeps its name, since renaming it is a data change of its own.
  # `hyperecho` is a refocusing flip angle scheme, not driven equilibrium
  # [MQ14, V1], and is gone.
  VFA-TSE:
    terms: ['RESTORE', 'FRFSE', 'DRIVE', 'T2 Plus', 'driven equilibrium', 'fast recovery FSE', 'DE-FSE', 'DE-FIR', 'Driven Equilibrium FSE']
    label: RESTORE
    description: '90-degree flip-back (driven equilibrium) turbo spin echo'
    family: SE
    # MRI pack 0.21.0: on GE only with `FR_GEMS`; its FRFSE pulse sequence or
    # name without it is a plain TSE (record 48, conflict 2).
    requires: {all: [{not: ge_no_fast_recovery}, {not: readout_not_spin_echo}, {not: siemens_plain_se_named_turbo}]}
    keywords:
      - restore
      - frfse
      - drive
      - de-fse
      - de-fir
      - t2 plus
    detection:
      exclusive: is_restore_tse
  # MRI pack 0.24.0 (the final certificate's A4): no turbo value on a
  # Siemens plain spin echo, `*se2d1`, whatever its name says, nor any
  # spin-echo value where the vendor's sequence identity states a gradient
  # echo (flags.yml, section 22).
  TSE:
    terms: ['turbo spin echo', 'fast spin echo', 'FSE', 'TSE', 'RARE', 'double echo TSE', 'DE TSE', 'DTSE', 'PD/T2 FSE', 'dual echo FSE']
    family: SE
    # MRI pack 0.20.0: never by the letters inside another word where
    # Siemens' sequence name states a gradient echo (dev-5's A8: a `fl2d`
    # cine named in Swedish, "hjärtsekvens"; flags.yml).
    requires: {all: [{not: tse_letters_inside_a_word_on_gre_stem}, {not: readout_not_spin_echo}, {not: siemens_plain_se_named_turbo}]}
    keywords:
      - tse
      - fse
      - turbo spin echo
      - fast spin echo
      - turbo se
      - fast se
      - rare
    detection:
      exclusive: is_tse
      # a dual-echo FSE whose only sign of its train is the train's length
      combination: [is_dual_echo_tse]
  SE:
    terms: ['spin echo', 'SE', 'conventional spin echo']
    family: SE
    requires: {not: readout_not_spin_echo}
    keywords:
      - spin-echo
    detection:
      exclusive: has_se
  QALAS:
    terms: ['3D-QALAS']
    family: GRE
    keywords:
      - qalas
      - '3d qalas'
    detection:
      exclusive: is_qalas
  MP2RAGE:
    terms: ['MP2RAGE', 'MP2 RAGE']
    family: GRE
    keywords:
      - mp2rage
    detection:
      combination: [is_multi_ti, has_gre, has_ir, is_3d]
  MEMPRAGE:
    terms: ['multi-echo MPRAGE', 'ME-MPRAGE']
    family: GRE
    keywords:
      - memprage
      - me-mprage
      - multi echo mprage
      - multi-echo mprage
    detection:
      combination: [is_multi_echo, has_ir, has_gre, is_3d]
  # Siemens `tfl` is TurboFLASH in 2D and 3D, so bare TFL is FSP-GRE's and
  # only `tfl3d` stays here [V3, M1, V1]. Philips' 3D TFE is an MPRAGE only
  # with the inversion prepulse, so IR-TFE is added and 3D TFE kept [S8,
  # IM4]; 3D Fast FE and 3DFFE-IR are Canon's, 3D-GEIR Hitachi's [V1, V2].
  MPRAGE:
    terms: ['MPRAGE', 'MP-RAGE', 'MP RAGE', 'BRAVO', 'FSPGR BRAVO', 'IR-FSPGR', '3D IR-FSPGR', '3D TFE', '3D T1 TFE', 'T1 TFE 3D', 'IR-TFE', '3D IR-TFE', 'tfl3d', '3D MPRAGE', 'magnetization prepared rapid gradient echo', '3D Fast FE', '3DFFE-IR', '3D-GEIR']
    description: '3D inversion-prepared rapid gradient echo (T1-weighted)'
    family: GRE
    # MRI pack 0.14.0: never Philips' SmartBrain survey, a localizer.
    # MRI pack 0.21.0: nor a Philips 3D turbo field echo whose enhanced
    # module says InversionRecovery NO (record 48, conventions round 3, case
    # 17): FSP-GRE.
    # MRI pack 0.25.0: nor a Siemens `tfl3d1` that states no preparation
    # (flags.yml, section 26b).
    requires: {all: [{not: smart_survey}, {not: philips_tfe_no_inversion}, {not: siemens_tfl_unprepared}]}
    keywords:
      - mprage
      # MRI pack 0.13.0: `MP-RAGE`, as the normalizer spells it (dev-1).
      - 'mp - rage'
      - mp-rage
      - bravo
      - '3d tfe'
      - ir-fspgr
      - ir spgr
    # MRI pack 0.24.0: or a Siemens 3D gradient echo whose repetition time is
    # a shot interval (flags.yml section 23).
    alternative_flags: [siemens_mprage_by_shot_tr]
    detection:
      exclusive: is_mprage
      combination: [has_ir, has_gre, is_3d]
  # MRI pack 0.18.0: contrast-enhanced MR angiography, single phase or time
  # resolved (TRICKS, TWIST, 4D-TRAK): a T1-weighted 3D spoiled gradient echo
  # timed to the arterial bolus. The deep research, cases 2 and 33: "our
  # vocabulary lacks a CE-MRA technique; that is a missing value". On the
  # archive 114 TRICKS stacks and 20 contrast-MRA-named GE stacks with
  # `VASCTOF_GEMS` had no value of their own. A TOF given contrast stays TOF
  # by its words.
  CE-MRA:
    terms: ['contrast-enhanced MRA', 'CE-MRA', 'CEMRA', 'time-resolved MRA', 'TRICKS', 'TWIST', '4D-TRAK', 'bolus chase', 'Fluoro Triggered MRA']
    label: CE-MRA
    description: 'contrast-enhanced MR angiography: a T1-weighted 3D spoiled gradient echo timed to the arterial bolus, single phase or time resolved'
    family: GRE
    keywords:
      - ce-mra
      - ce - mra
      - cemra
    detection:
      combination: [is_ce_mra]
  # Bare Inhance Inflow (2D inflow) is a TOF [V1, V2]; GE's Inhance Inflow
  # IR is a non-contrast bSSFP angiography [V4, V1], and the normalizer
  # writes its `IR` as `inversion-recovery`, so it is kept out.
  TOF-MRA:
    terms: ['time-of-flight', 'TOF MRA', 'inflow angiography', 'Inhance Inflow']
    label: TOF
    family: GRE
    # MRI pack 0.20.0: nor GE's Inhance 3D Velocity, a phase contrast whatever
    # `IFLOW_GEMS` says (dev-5's A11; flags.yml, `ge_inhance_velocity`).
    # MRI pack 0.24.0: nor `tof` as letters inside another word (`MToff`;
    # flags.yml, section 22).
    requires: {all: [{not: {text: search_text, substring: 'inflow inversion-recovery'}}, {not: ge_inhance_velocity}, {not: tof_letters_inside_a_word}]}
    keywords:
      - tof
      - time of flight
      - tof-mra
      - inhance inflow
    # MRI pack 0.14.0: or a 3D gradient echo named for angiography, of a
    # time-of-flight's repetition time (flags.yml, `tof_by_words`).
    detection:
      exclusive: is_tof
      combination: [tof_by_words]
  PC-MRA:
    terms: ['phase-contrast MRA', 'PC angio', 'Qflow', '4D flow', 'flow quantification']
    label: PC
    family: GRE
    keywords:
      - pc-mra
      - phase contrast
      - pc flow
      - velocity
    # MRI pack 0.20.0: or GE's Inhance 3D Velocity by its name (dev-5's A11).
    detection:
      exclusive: is_pc
      combination: [ge_inhance_velocity]
  comb-ME-GRE:
    terms: ['MEDIC', 'MERGE', 'mFFE', 'M-FFE', 'combined multi-echo GRE', 'mEcho', 'ADAGE']  # [MQ9, V2, V1]
    label: MEDIC
    family: GRE
    keywords:
      - medic
      - merge
      - mffe
      - me2d
    # MRI pack 0.14.0: or Philips' combined multi-echo FFE by its echo
    # train (flags.yml, `philips_mffe`).
    # MRI pack 0.20.0: never one echo of a Philips multi-echo FFE written on
    # its own, nor a single-echo FFE, whatever it is named (record 48, "The
    # nine, after our counts"; flags.yml, `philips_not_combined_ffe`).
    requires: {not: philips_not_combined_ffe}
    # MRI pack 0.20.0: or a Siemens MEAN phase or magnitude over the echoes of
    # a multi-echo gradient echo (record 48, dev-5's case 5; flags.yml,
    # `combined_echoes_stated`).
    # MRI pack 0.25.0 (round 5, case 2): or a GE SWAN output, its echoes
    # combined as a weighted average (flags.yml, `ge_swan_combined`).
    # MRI pack 0.25.0 (the protocol sweep): and a Siemens multi-echo FLASH
    # output named Combined, and a Siemens two-echo field map's phase
    # difference (flags.yml, section 26b).
    alternative_flags: [ge_swan_combined, siemens_echoes_combined_named, siemens_fieldmap_phase_difference]
    detection:
      exclusive: is_medic
      combination: [combined_echoes_stated]
  ME-GRE:
    terms: ['multi-echo GRE', 'MEGRE', 'multi-echo gradient echo']
    label: MEGRE
    family: GRE
    keywords:
      - megre
      - me-gre
      - multi echo gre
      - multi-echo gre
    # MRI pack 0.14.0: or by the name's echo count (flags.yml, `me_gre_named`).
    # MRI pack 0.21.0: or an echo STAGE acquired, which is no longer its
    # route's (dev-6's A8; flags.yml, section 18).
    alternative_flags: [stage_acquired_echo]
    detection:
      combination: [is_me_gre]
  # DRIVE is Philips' driven equilibrium TSE and Philips has no
  # dual-excitation bSSFP, so `3D DRIVE` is gone; PBSG is Hitachi's
  # [P48, V1, V2, M1].
  # MRI pack 0.18.0: FIESTA-C by its name (flags.yml, `fiesta_c_named`; the
  # deep research, case 13), and never Philips' balanced FFE, which a site's
  # name "ciss" does not make phase cycled (case 5: bSSFP unless the header
  # shows phase cycling, which no Philips field does).
  CISS:
    terms: ['CISS', 'FIESTA-C', 'PBSG', 'Phase Balanced SARGE']
    family: GRE
    requires: {not: philips_balanced}
    keywords:
      - ciss
    detection:
      exclusive: is_ciss
      combination: [fiesta_c_named]
  bSSFP:
    terms: ['TrueFISP', 'FIESTA', 'balanced FFE', 'bFFE', 'True SSFP', 'balanced SSFP', 'trufi', 'BASG']  # BASG: Hitachi [V1, V2]
    label: FIESTA
    family: GRE
    keywords:
      - bssfp
      - truefisp
      - true fisp
      - fiesta
      - balanced ffe
      - b-ffe
      - bffe
      - trufi
    # MRI pack 0.25.0: or GE's `efgre3d` without SP at a flip angle of 40
    # degrees or more, FIESTA by its physics (flags.yml, section 26a).
    alternative_flags: [ge_efgre3d_steady_state]
    detection:
      exclusive: is_ssfp
  DESS:
    terms: ['double echo steady state', 'MENSA']
    family: GRE
    keywords:
      - dess
      - mensa
    # MRI pack 0.10.0: Siemens `de` [the brochure's legend].
    detection:
      exclusive: is_dess
  SSFP:
    terms: ['PSIF', 'T2-FFE', 'CE-FAST', 'reversed FISP', 'TRSG']  # TRSG: Hitachi [V1, V2]
    label: PSIF
    family: GRE
    keywords:
      - ssfp
      - psif
      - t2-ffe
      - ce-fast
    # MRI pack 0.10.0: Siemens `ps`, the time reversed steady state of
    # DICOM, or Philips' T2FFE.
    detection:
      exclusive: is_psif
  VFA-GRE:
    terms: ['DESPOT', 'variable flip angle GRE']
    family: GRE
    keywords:
      - vfa
      - despot
      - variable flip angle
    detection:
      combination: [is_multi_fa, has_gre, is_3d]
  VI-GRE:
    terms: ['VIBE', 'LAVA', 'THRIVE', 'Quick 3D', 'TIGRE', 'volumetric interpolated']
    label: VIBE
    family: GRE
    keywords:
      - vibe
      - lava
      - thrive
      - fame
    # MRI pack 0.10.0: by name only. Both reports: VIBE, LAVA and THRIVE are
    # a 3D spoiled gradient echo that no header field marks as interpolated,
    # so a spoiled 3D gradient echo is SP-GRE unless it is named; the
    # combination this value had took every 3D FLASH, T1-FFE and SPGR first.
  FSP-GRE:
    terms: ['TurboFLASH', 'FSPGR', 'TFE', 'turbo field echo', 'fast SPGR', 'TFL', 'Fast FE', 'FastFE', 'RGE']  # Fast FE: Canon, RGE: Hitachi [V1, M1, IM4]
    label: TurboFLASH
    family: GRE
    keywords:
      - turboflash
      - turbo flash
      - tfe
      - fspgr
    # MRI pack 0.14.0: or GE's `FAST_GEMS` on a spoiled gradient echo (flags.yml).
    # MRI pack 0.21.0: or GE's `fspgr`, and an `efgre3d` or `fgre` with SP
    # (record 48, conventions round 3, case 8).
    alternative_flags: [ge_psd_fast_spoiled]
    detection:
      exclusive: is_tfl
      combination: [ge_fspgr]
  SP-GRE:
    terms: ['FLASH', 'SPGR', 'T1-FFE', 'spoiled gradient echo', 'spoiled GRE', 'RSSG']
    label: FLASH
    family: GRE
    keywords:
      - flash
      - spgr
      - t1-ffe
      - t1ffe
    # MRI pack 0.20.0: never a Philips FFE whose header states the steady
    # state, whatever it is named, and no longer `T1W_FFE` (nor `T1_FFE`,
    # which the normalizer spells the same), which pack 0.11.0 read as
    # spoiled: "T1W" is the contrast, not the technique T1-FFE (record 48,
    # dev-5's case 1; flags.yml, `philips_ffe_steady_state`).
    requires: {not: philips_ffe_steady_state}
    # MRI pack 0.21.0: and Siemens' Dixon parts, a spoiled gradient echo
    # (record 48, conventions round 3, case 10).
    alternative_flags: [siemens_dixon_gre]
    detection:
      exclusive: is_flash
      combination: [has_spoiled, has_gre]
  SS-GRE:
    terms: ['FISP', 'GRASS', 'FFE', 'steady state GRE', 'SARGE', 'Rephased SARGE']  # Hitachi [V1, V2, M1]
    label: FISP
    family: GRE
    keywords:
      - fisp
      - grass
      - ss-gre
    # MRI pack 0.10.0: SS in SequenceVariant is the steady state, not a
    # single shot, so that word is gone; Siemens `fi` is FISP, "gradient echo
    # sequence without RF spoiling".
    # MRI pack 0.15.0: or GE's GRASS and MPGR, a steady-state gradient echo
    # at a repetition time no balanced one has (flags.yml, `ge_grass`).
    # MRI pack 0.18.0: or GE's fast `SS\SK` echo with `FAST_GEMS`, not
    # spoiled (record 48, "Rulings after the re-adjudication"; flags.yml,
    # `ge_fast_ss`).
    # MRI pack 0.20.0: or a Philips FFE in the steady state, by Spoiling,
    # SequenceVariant and its scanning technique in that order (record 48,
    # dev-5's case 1; flags.yml, `philips_ffe_steady_state`).
    # MRI pack 0.21.0: or GE's `fgre` without SP; never an `efgre3d` without
    # SP, which states no steady state of its own (record 48, conventions
    # round 3, case 8).
    requires: {not: ge_psd_efgre3d_unspoiled}
    alternative_flags: [ge_psd_unspoiled_fgre]
    detection:
      exclusive: is_fisp
      combination: [ss_gre_by_vendor]
  GRE:
    terms: ['gradient echo', 'gradient recalled echo', 'field echo', 'FE']
    family: GRE
    keywords:
      - gre
      - gradient-echo
      - ffe
    # MRI pack 0.24.0: or GE's research B0 map, written in research mode
    # (flags.yml, section 20, `ge_b0map_acquisition`).
    detection:
      exclusive: has_gre
      combination: [ge_b0map_acquisition]
  EPI:
    terms: ['echo planar', 'echo-planar imaging']
    family: EPI
    keywords:
      - epi
      - echo planar
    detection:
      exclusive: has_epi
