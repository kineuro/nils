# SPDX-License-Identifier: AGPL-3.0-only
#
# The technique axis, transcribed from v0 0.5.3
# `classification/detection_yaml/technique-detection.yaml` and the detector that reads it.
#
# An axis file is a rule set written compactly: one rule per value, in the
# order below, with up to three clauses in v0's order (an exclusive flag,
# then a keyword, then a combination of flags). The first value whose first
# clause holds decides, and which clause fired fixes the confidence.

axis: technique
kind: single
# v0's pipeline stores the display name and not the identity, which is how
# `3D-TSE` came to be written `SPACE` and `SP-GRE` written `FLASH`.
stores: label
# The pipeline stores the display name, and v0 spells the fallback `Unknown`.
default: Unknown
# The text a keyword is matched against is the pack's own, normalized by
# its twelve steps from the fingerprint's folded fields (spec section 6.4).
search: search_text

# Only these are tried by this axis's own rules; any other value
# below is vocabulary a route sets (spec section 6.5).
order:
  - MS-EPI
  - DWI-EPI
  - DWI-STEAM
  - BOLD-EPI
  - ASL-EPI
  - Perfusion-EPI
  - GRASE
  - SE-EPI
  - GRE-EPI
  - MRF
  - MDME
  - MAVRIC
  - '3D-TSE'
  - SS-TSE
  - IR-TSE
  - ME-SE
  - VFA-TSE
  - TSE
  - SE
  - QALAS
  - MP2RAGE
  - MEMPRAGE
  - MPRAGE
  - TOF-MRA
  - PC-MRA
  - comb-ME-GRE
  - ME-GRE
  - CISS
  - bSSFP
  - DESS
  - SSFP
  - VFA-GRE
  - VI-GRE
  - FSP-GRE
  - SP-GRE
  - SS-GRE
  - GRE
  - EPI

# `terms` are other names a person knows a value by: vendors' names for the
# same sequence and common spellings, so the reader finds MPRAGE by BRAVO.
# Display only: no rule reads them, and they move no stack; the words that
# decide are `keywords`.
values:
  MS-EPI:
    terms: ['readout-segmented EPI', 'readout segmented', 'IRIS']
    label: RESOLVE
    family: EPI
    keywords:
      - resolve
      - muse
      - multishot epi
      - multi-shot epi
      - segmented epi
    # Only the readout-segmented sequence's own name says so (`*re_b`).
    # v0 also took segmented k-space beside an EPI readout, and Siemens
    # writes `SK` in SequenceVariant on every EPI it makes, single shot or
    # not: on five scanner protocols that combination called 2,916
    # single-shot diffusion stacks, 462 BOLD stacks and every ASL series
    # RESOLVE, and not one of them was (record 41).
    detection:
      exclusive: is_epi_diff_resolve
  DWI-EPI:
    terms: ['ep2d_diff', 'diffusion weighted EPI', 'SS-EPI DWI']
    family: MIXED
    keywords:
      - dwi
      - dti
      - diffusion
      - hardi
      - dsi
    detection:
      exclusive: is_dwi
  DWI-STEAM:
    family: MIXED
    keywords:
      - steam
      - dwi-steam
      - diffusion steam
  BOLD-EPI:
    terms: ['ep2d_bold', 'fMRI EPI', 'BOLD']
    label: BOLD
    family: MIXED
    keywords:
      - bold
      - fmri
      - functional
      - resting state
      - task
    detection:
      exclusive: is_bold
  ASL-EPI:
    terms: ['arterial spin labeling', '3D ASL', 'pCASL']
    label: ASL
    family: MIXED
    keywords:
      - asl
      - pcasl
      - pasl
      - casl
      - arterial spin
    detection:
      exclusive: is_asl
  Perfusion-EPI:
    terms: ['ep2d_perf', 'DSC perfusion', 'bolus tracking']
    label: Perfusion
    family: MIXED
    keywords:
      - perfusion
      - dsc
      - dce
      - pwi
    detection:
      exclusive: is_perfusion
  GRASE:
    terms: ['gradient and spin echo', 'TGSE']
    family: MIXED
    keywords:
      - grase
      - turbogse
      - tgse
  SE-EPI:
    family: MIXED
    keywords:
      - se-epi
      - spin echo epi
    detection:
      combination: [has_se, has_epi]
  GRE-EPI:
    family: MIXED
    keywords:
      - gre-epi
      - epi-gre
    detection:
      combination: [has_gre, has_epi]
  MRF:
    terms: ['MR fingerprinting', 'magnetic resonance fingerprinting']
    family: MIXED
    keywords:
      - mrf
      - fingerprinting
    detection:
      exclusive: is_mrf
  MDME:
    terms: ['QRAPMASTER', 'MAGiC', 'SyMRI acquisition']
    family: SE
    keywords:
      - mdme
      - multi dynamic multi echo
      - multi-dynamic multi-echo
      - symri
      - magic
    detection:
      exclusive: is_mdme
  # The metal artefact technique, stated in the image type and parsed into a
  # flag nothing read. It is a spin echo readout at a set of offset centre
  # frequencies, so it is a technique and not a construct; the composite
  # image it also writes says so on the construct axis instead. Ahead of the
  # TSE values because it is the narrower claim and they would take it first.
  MAVRIC:
    family: SE
    keywords:
      - mavric
      - mavric sl
    detection:
      exclusive: is_mavric
  '3D-TSE':
    terms: ['SPACE', 'CUBE', 'VISTA', '3D TSE', '3D FSE', 'MVOX', 'isoFSE', '3D FLAIR TSE', 'spc']
    label: SPACE
    family: SE
    keywords:
      - space
      - cube
      - vista
      - '3d tse'
      - '3d fse'
      - fase3d
      - mvox
      - isofse
    detection:
      exclusive: is_space
      combination: [is_tse, is_3d]
  SS-TSE:
    terms: ['HASTE', 'SSFSE', 'SSh TSE', 'single shot TSE', 'FASE', 'single-shot FSE']
    label: HASTE
    family: SE
    keywords:
      - haste
      - ssfse
      - ss-tse
      - sstse
      - single shot tse
      - single shot fse
    detection:
      exclusive: is_haste
  IR-TSE:
    terms: ['TIRM', 'FSE-IR', 'IR TSE', 'TSE-IR', 'turbo inversion recovery', 'TIR']
    label: TIRM
    family: SE
    keywords:
      - tirm
      - stir
      - ir-tse
      - ir tse
      - ir-fse
      - ir fse
    detection:
      combination: [has_ir, is_tse]
  ME-SE:
    terms: ['multi-echo spin echo', 'MESE', 'dual echo']
    label: MESE
    family: SE
    keywords:
      - mese
      - me-se
      - multi echo se
      - multi-echo se
      - dual echo se
      - memp
    detection:
      exclusive: is_me_se
      combination: [is_multi_echo, has_se]
  VFA-TSE:
    terms: ['RESTORE', 'FRFSE', 'DRIVE', 'T2 Plus', 'driven equilibrium', 'fast recovery FSE']
    label: RESTORE
    family: SE
    keywords:
      - restore
      - frfse
      - drive
      - de-fse
      - de-fir
      - t2 plus
      - hyperecho
  TSE:
    terms: ['turbo spin echo', 'fast spin echo', 'FSE', 'TSE', 'RARE']
    family: SE
    keywords:
      - tse
      - fse
      - turbo spin echo
      - fast spin echo
      - turbo se
      - fast se
      - rare
    detection:
      exclusive: is_tse
  SE:
    terms: ['spin echo', 'SE', 'conventional spin echo']
    family: SE
    keywords:
      - spin-echo
    detection:
      exclusive: has_se
  QALAS:
    terms: ['3D-QALAS']
    family: GRE
    keywords:
      - qalas
      - '3d qalas'
    detection:
      exclusive: is_qalas
  MP2RAGE:
    terms: ['MP2RAGE', 'MP2 RAGE']
    family: GRE
    keywords:
      - mp2rage
    detection:
      combination: [is_multi_ti, has_gre, has_ir, is_3d]
  MEMPRAGE:
    terms: ['multi-echo MPRAGE', 'ME-MPRAGE']
    family: GRE
    keywords:
      - memprage
      - me-mprage
      - multi echo mprage
      - multi-echo mprage
    detection:
      combination: [is_multi_echo, has_ir, has_gre, is_3d]
  MPRAGE:
    terms: ['MPRAGE', 'MP-RAGE', 'MP RAGE', 'BRAVO', 'FSPGR BRAVO', 'IR-FSPGR', '3D IR-FSPGR', '3D TFE', '3D T1 TFE', 'T1 TFE 3D', 'TFL', 'tfl3d', '3D MPRAGE', 'magnetization prepared rapid gradient echo']
    family: GRE
    keywords:
      - mprage
      - bravo
      - '3d tfe'
      - ir-fspgr
      - ir spgr
    detection:
      exclusive: is_mprage
      combination: [has_ir, has_gre, is_3d]
  TOF-MRA:
    terms: ['time-of-flight', 'TOF MRA', 'inflow angiography', 'Inhance Inflow']
    label: TOF
    family: GRE
    keywords:
      - tof
      - time of flight
      - tof-mra
      - inhance inflow
    detection:
      exclusive: is_tof
  PC-MRA:
    terms: ['phase-contrast MRA', 'PC angio', 'Qflow', '4D flow', 'flow quantification']
    label: PC
    family: GRE
    keywords:
      - pc-mra
      - phase contrast
      - pc flow
      - velocity
    detection:
      exclusive: is_pc
  comb-ME-GRE:
    terms: ['MEDIC', 'MERGE', 'mFFE', 'combined multi-echo GRE']
    label: MEDIC
    family: GRE
    keywords:
      - medic
      - merge
      - mffe
      - me2d
    detection:
      exclusive: is_medic
  ME-GRE:
    terms: ['multi-echo GRE', 'MEGRE', 'multi-echo gradient echo']
    label: MEGRE
    family: GRE
    keywords:
      - megre
      - me-gre
      - multi echo gre
      - multi-echo gre
    detection:
      combination: [is_multi_echo, has_gre]
  CISS:
    terms: ['CISS', 'FIESTA-C', '3D DRIVE']
    family: GRE
    keywords:
      - ciss
      - fiesta-c
      - fiesta c
      - '3d drive'
    detection:
      exclusive: is_ciss
  bSSFP:
    terms: ['TrueFISP', 'FIESTA', 'balanced FFE', 'bFFE', 'True SSFP', 'balanced SSFP', 'trufi']
    label: FIESTA
    family: GRE
    keywords:
      - bssfp
      - truefisp
      - true fisp
      - fiesta
      - balanced ffe
      - b-ffe
      - bffe
      - trufi
    detection:
      exclusive: is_ssfp
  DESS:
    terms: ['double echo steady state', 'MENSA']
    family: GRE
    keywords:
      - dess
      - mensa
  SSFP:
    terms: ['PSIF', 'T2-FFE', 'CE-FAST', 'reversed FISP']
    label: PSIF
    family: GRE
    keywords:
      - ssfp
      - psif
      - t2-ffe
      - ce-fast
  VFA-GRE:
    terms: ['DESPOT', 'variable flip angle GRE']
    family: GRE
    keywords:
      - vfa
      - despot
      - variable flip angle
    detection:
      combination: [is_multi_fa, has_gre, is_3d]
  VI-GRE:
    terms: ['VIBE', 'LAVA', 'THRIVE', 'Quick 3D', 'TIGRE', 'volumetric interpolated']
    label: VIBE
    family: GRE
    keywords:
      - vibe
      - lava
      - thrive
      - fame
    detection:
      combination: [has_spoiled, is_3d, has_gre]
  FSP-GRE:
    terms: ['TurboFLASH', 'FSPGR', 'TFE', 'turbo field echo', 'fast SPGR', 'TFL']
    label: TurboFLASH
    family: GRE
    keywords:
      - turboflash
      - turbo flash
      - tfe
      - fspgr
    detection:
      exclusive: is_tfl
  SP-GRE:
    terms: ['FLASH', 'SPGR', 'T1-FFE', 'spoiled gradient echo', 'spoiled GRE', 'RSSG']
    label: FLASH
    family: GRE
    keywords:
      - flash
      - spgr
      - t1-ffe
    detection:
      exclusive: is_flash
      combination: [has_spoiled, has_gre]
  SS-GRE:
    terms: ['FISP', 'GRASS', 'FFE', 'steady state GRE']
    label: FISP
    family: GRE
    keywords:
      - fisp
      - grass
      - ss-gre
      - single shot gre
  GRE:
    terms: ['gradient echo', 'gradient recalled echo', 'field echo', 'FE']
    family: GRE
    keywords:
      - gre
      - gradient-echo
      - ffe
    detection:
      exclusive: has_gre
  EPI:
    terms: ['echo planar', 'echo-planar imaging']
    family: EPI
    keywords:
      - epi
      - echo planar
    detection:
      exclusive: has_epi
