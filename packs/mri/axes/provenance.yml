# SPDX-License-Identifier: AGPL-3.0-only
#
# The provenance axis, transcribed from v0 0.5.3
# `classification/detection_yaml/provenance-detection.yaml` and the detector that reads it.
#
# An axis file is a rule set written compactly: one rule per value, in the
# order below, with up to three clauses in v0's order (an exclusive flag,
# then a keyword, then a combination of flags). The first value whose first
# clause holds decides, and which clause fired fixes the confidence.

axis: provenance
kind: single
default: RawRecon
# The confidences v0 fixes per tier, from its own `confidence_thresholds`.
tiers: {exclusive: 0.95, keywords: 0.85, combination: 0.75, alternative: 0.85, default: 0.8}
# The text a keyword is matched against is the pack's own, normalized by
# its twelve steps from the fingerprint's folded fields (spec section 6.4).
search: search_text

# Only these are tried by this axis's own rules; any other value
# below is vocabulary a route sets (spec section 6.5).
order:
  - SyMRI
  - NeuroMix
  - EPIMix
  - STAGE
  - SWIRecon
  - DTIRecon
  - PerfusionRecon
  - ASLRecon
  - BOLDRecon
  - Calibration
  - Localizer
  - ProjectionDerived
  - SubtractionDerived

values:
  SyMRI:
    terms: ['synthetic MRI', 'MAGiC', 'SyMRI', 'SyntAc']  # SyntAc: Philips [P23, MQ19]
    keywords:
      - symri
      - magic
      - syntac
      - synthetic mr
      - syntetisk
      - synthetic
      - synt
      - qrapmaster
    alternative_flags: [has_t1_synthetic, has_t2_synthetic, has_pd_synthetic, has_flair_synthetic, is_mdme, is_qalas, has_multi_qmap]
    detection:
      combination: [is_synthetic, is_derived]
  # MRI pack 0.18.0: GE's NeuroMix, EPIMix's successor, whose blocks are
  # single-shot EPIs and single-shot fast spin echoes (the deep research,
  # case 12: "NeuroMix is a missing provenance value (using EPIMix for them
  # is a stretch)"; 73 archive stacks, pulse sequence `ksneuromix*`). The
  # EPIMix route reads both.
  NeuroMix:
    terms: ['NeuroMix', 'ksneuromix']
    description: 'GE NeuroMix: a rapid multicontrast examination of single-shot EPI and single-shot fast spin echo blocks, and each of its outputs'
    keywords:
      - neuromix
      - ksneuromix
    detection:
      combination: [neuromix_psd]
  EPIMix:
    terms: ['EPIMix']
    keywords:
      - epimix
      - ksepimix
      - axepimix
      - mix2
      - mix3
    # MRI pack 0.18.0: or by GE's pulse sequence, `ksepimix*` (the deep
    # research, case 12: every output is EPIMix).
    detection:
      combination: [epimix_psd]
  STAGE:
    terms: ['strategically acquired gradient echo']
    # MRI pack 0.21.0: only STAGE's computed outputs; an echo it acquired,
    # written ORIGINAL, is RawRecon (dev-6's A8).
    requires: {not: image_type.is_original}
    keywords:
      - stage
  # MRI pack 0.18.0: never a DSC EPI, whatever its words say (flags.yml,
  # `dsc_not_swi`; sealed-1 A2, the deep research, case 18).
  SWIRecon:
    terms: ['SWI reconstruction', 'SWAN', 'SWI']
    # MRI pack 0.25.0: never a position display, the planning picture of the
    # SWI series it names (flags.yml, section 26a).
    requires: {all: [{not: dsc_not_swi}, {not: image_type.is_posdisp}]}
    keywords:
      - swi
      - swan
      - fsbb
      - susceptibility
      - qsm
      - r2star
      # MRI pack 0.10.0: Philips' SWI, VenBOLD, which the normalizer spells
      # `venbold`, `venobold` or, from `VEN_BOLD`, `ven bold`. On the archive
      # all 18 of its stacks were called BOLD.
      - venbold
      - venobold
      - ven bold
    detection:
      exclusive: is_swi
      combination: [has_swi, is_derived]
  # MRI pack 0.11.0, Nima's ruling 7 (2026-09-27): an ADC, eADC or trace the
  # scanner made from a plain DWI is RawRecon with its construct; only a
  # tensor's outputs (FA, MD, colour FA, a trace of a DTI) are DTIRecon, and
  # never the acquisition itself. On the 2026-09-28 re-measures Philips
  # `dADC` maps and a GE DTI acquisition were DTIRecon.
  DTIRecon:
    terms: ['diffusion reconstruction', 'tensor', 'DTI']
    requires:
      all:
        - {not: is_plain_dwi_map}
        - {any: [is_derived, is_diffusion_derived, has_fa, tensor_output_named]}
    keywords:
      - adc map
      - apparent diffusion
      - fractional anisotropy
      - dti
      - tensor
      # MRI pack 0.13.0: GE's mean diffusivity, `AvDC`, a tensor's output.
      - avdc
    alternative_flags: [has_adc, has_eadc, has_fa, has_trace]
    # MRI pack 0.13.0: or a derived GE image named `FA` (flags.yml), which
    # ruling 7 makes a tensor's output.
    # MRI pack 0.14.0: and GE's `FA-` and `Evec` outputs written ORIGINAL.
    detection:
      exclusive: is_diffusion_derived
      combination: [tensor_output_named]
  # An ASL series' CBF map is ASLRecon (Nima's ruling, 2026-09-28), so the
  # DSC and DCE maps are this value's and an ASL's are not.
  PerfusionRecon:
    terms: ['perfusion reconstruction', 'perfusion maps']
    requires: {not: is_asl}
    keywords:
      - cerebral blood flow
      - cerebral blood volume
      - mean transit time
      - time to peak
      - perfusion map
    alternative_flags: [has_cbf, has_cbv, has_mtt, has_ttp, has_tmax]
    # MRI pack 0.18.0: or a DSC map named for what it is (flags.yml,
    # `perfusion_recon_extra`; sealed-1 A1, the deep research, case 17).
    # MRI pack 0.20.0: only the maps. A motion-corrected DSC run is the
    # acquisition's series registered, RawRecon with MoCo, whatever its
    # image type's first value says (record 48, dev-5's case 9: DICOM's
    # DERIVED says nothing of a perfusion model, and ORIGINAL BOLD and ASL
    # runs are ruled so). Nima's ruling of 2026-09-28, that a DERIVED one is
    # PerfusionRecon, is withdrawn.
    detection:
      exclusive: is_perfusion_derived
      combination: [perfusion_recon_extra]
  # Pack 0.9.0, Nima's ruling (2026-09-28): the acquisition's own images are
  # RawRecon and what the scanner computed from them takes the product. An
  # ASL series as acquired is RawRecon; its CBF map, and the perfusion-weighted
  # image the scanner subtracts label from control, are ASLRecon.
  # MRI pack 0.11.0: Philips writes its difference image ORIGINAL though
  # the scanner computed it, so the DeltaM flag stands for derived.
  ASLRecon:
    terms: ['ASL reconstruction', 'CBF from ASL']
    requires: {any: [is_derived, has_cbf, is_subtraction, is_ttest, is_asl_difference]}
    keywords:
      - asl
      - pcasl
      - pasl
      - arterial spin
    detection:
      exclusive: is_asl
      combination: [is_asl_difference]
  # The same ruling: a BOLD time series as acquired is RawRecon; an fMRI map
  # the scanner computed (a t-test map, a derived image) is BOLDRecon. MRI
  # pack 0.10.0, Nima's ruling (2026-09-28): "if Motion Correction is
  # ORIGINAL\PRIMARY then it is not derived". A motion-corrected copy takes
  # the MoCo modifier either way, and BOLDRecon only where its image type
  # says DERIVED; Siemens writes it ORIGINAL (1,759 stacks on the archive,
  # every one of them), so those are RawRecon.
  BOLDRecon:
    terms: ['BOLD reconstruction', 'fMRI maps']
    requires: {any: [is_derived, is_ttest]}
    keywords:
      - bold
      - fmri
      - resting state
      - task fmri
      - functional mri
    detection:
      exclusive: is_bold
  # MRI pack 0.21.0: a calibration, coil-sensitivity, receive-field or
  # prescan reference acquired to support the reconstruction, not to be read
  # (record 48, conventions round 3, case 7; a value the vocabulary lacked).
  Calibration:
    terms: ['calibration scan', 'ASSET calibration', 'ARC calibration', 'PURE calibration', 'coil sensitivity reference', 'SENSE reference scan', 'prescan normalize reference']
    description: 'a coil-sensitivity, receive-field or prescan reference image acquired to support reconstruction or correction, not for reading'
    detection:
      exclusive: calibration_scan
  Localizer:
    # MRI pack 0.13.0, Nima's ruling (2026-09-29): never a GE calibration
    # scan, which the words below would otherwise take (flags.yml).
    # MRI pack 0.18.0: nor Philips' MobiView without a survey word, a
    # composed image (sealed-1 A18, the deep research, case 28).
    # MRI pack 0.21.0: nor a series named for planning of more than 5
    # slices a plane that no vendor flag marks, nor a composite of other
    # than survey stations (record 48, conventions round 3; flags.yml,
    # section 18). GE's calibration is the value Calibration now.
    requires: {all: [{not: ge_calibration}, {not: mobiview_not_survey}, {not: planning_word_too_many_slices}, {not: composite_not_survey}]}
    terms: ['localizer', 'localiser', 'scout', 'survey', 'tri-pilot', '3-plane localizer', 'AAHead_Scout', 'pilot']
    keywords:
      - localizer
      - scout
      - survey
      - '3 plan'
      - autoalign
      - calibration
      - asset cal
      - locator
      - versikt
      - kalibrering
      # MRI pack 0.11.0: `3-pl`, `Ö-SIKT` and `SUR**` as the normalizer
      # spells them, all missed on the 2026-09-28 re-measure.
      - '3 - pl'
      - '- sikt'
      - surstar
      # MRI pack 0.14.0: Philips' SmartExam brain survey (dev-2).
      - smartbrain
    detection:
      exclusive: is_localizer
      # MRI pack 0.11.0: a tri-plane scout by its shape (flags.yml, 12).
      # MRI pack 0.20.0: or a series of at most 5 slices a plane named for
      # planning (record 48, dev-5's case 6: "true mid-line"), or a survey
      # named `ÖSIKT` (dev-5's A10) (flags.yml, section 17).
      combination: [localizer_by_shape]
  ProjectionDerived:
    terms: ['projection', 'MIP', 'MinIP', 'MPR', 'reformat']
    # MRI pack 0.13.0: not Philips' isotropic diffusion image, which it
    # writes as a `PROJECTION IMAGE` (flags.yml, `is_diffusion_projection`).
    keywords:
      - maximum intensity
      - minimum intensity
      - multiplanar reformat
    # MRI pack 0.18.0: and Siemens' standard deviation projection, a minIP
    # named so, and a radial thick-slab reformat (sealed-1 A14; case 35).
    # MRI pack 0.21.0: and a stitched composite of other than survey
    # stations, ORIGINAL or DERIVED (record 48, conflict 1).
    alternative_flags: [is_mip, is_minip, is_mpr, is_projection, projection_extra, composite_not_survey]
    # MRI pack 0.21.0: never GE's collapse of a 2D phase contrast, the
    # acquisition's own image (case 5).
    # MRI pack 0.25.0: nor a stated subtraction of a composite, which is
    # SubtractionDerived with Composed (round 5, case 5; flags.yml, section 25).
    requires: {all: [{not: is_diffusion_projection}, {not: ge_pc_2d_collapse}, {not: subtraction_of_a_composite}]}
  SubtractionDerived:
    terms: ['subtraction', 'SUB', 'post minus pre']
    keywords:
      - subtraction
      - subtracted
      - difference
      - pre post
    # MRI pack 0.18.0: or named SUB, a subtraction written ORIGINAL
    # (sealed-1 A15).
    detection:
      exclusive: is_subtraction
      combination: [sub_named]
  RawRecon: {terms: ['acquired', 'scanner reconstruction', 'original acquisition', 'raw']}
