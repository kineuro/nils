# SPDX-License-Identifier: AGPL-3.0-only
#
# What to do with each stack (`docs/specs/wave3-anonymize-and-bids.md`, §7),
# decided after the passes from what the rules and the passes settled between
# them.
#
# The two answers are separate on purpose. A working scan is not convertible
# because it is not an image; a scout is an image, converts perfectly well, and
# is still not something a release puts in the raw tree. v0 folds them into one
# `NIFTI_INCOMPATIBLE_PROVENANCES = {"SyMRI"}`, which is why it refuses to
# convert 36,692 stacks when about 3,000 of them are ordinary images.
#
# Read only this stack's own axes and its own fingerprint. §7's other
# structural rule is that a disposition never depends on what else is in the
# selection, and there is nothing in this language that could express it.

rule_set: disposition
decides: [disposition, convertible]
tiers: {stated: 0.9}

order:
  - encrypted
  - not_an_image
  - ruled_out
  - scout
  - calibration
  - secondary_reformat
  - symri_working_scan
  - symri_product
  - projection
  - workstation_reformat
  - derived_construct
  - derived_provenance
  - scanner_computed
  # The pick borders study of 2026-10-10, R2a: last, so they take only a
  # stack no rule above claimed, which would be an acquisition.
  - planning_named_loc
  - planning_named_localizer
  - planning_named_scout
  - planning_named_survey
  - planning_named_sikt
  - planning_tri_plane

rules:

  # Pixels nothing downstream can read. It decides the conversion and nothing
  # else, so the rules below still say what the stack is for; it is first
  # because whatever that turns out to be, a NIfTI of it would be noise.
  encrypted:
    clauses:
      - {when: {axis: quality, is: Encrypted}, cite: Encrypted, source: quality}
    set: {convertible: 'no'}

  # The fingerprint's own reading of ImageType (§6): a screen capture, a
  # pasted report or an error image, whatever else it claims to be.
  not_an_image:
    clauses:
      - {when: {field: image_role, eq: not_an_image}, cite: not_an_image, source: image_role}
    set: {disposition: excluded, convertible: 'no'}

  # What the class phase already ruled out.
  ruled_out:
    clauses:
      - {when: {axis: directory_type, is: excluded}, cite: excluded, source: directory_type}
    set: {disposition: excluded, convertible: 'no'}

  # A planning scan. An image, and convertible, and not raw material.
  # MRI pack 0.13.0: and a GE calibration scan (ASSET, `3D Calibration`),
  # which Nima's ruling of 2026-09-29 makes an acquired fast spoiled GRE and
  # no localizer: it is still not raw material, so no role takes it and a
  # pipeline skips it.
  scout:
    clauses:
      - {when: {axis: directory_type, is: localizer}, cite: localizer, source: directory_type}
    set: {disposition: scout, convertible: 'yes'}

  # MRI pack 0.21.0: a calibration scan is an intermediate the scanner
  # uses for reconstruction, not an image to read (record 48, conventions
  # round 3, case 7); GE's calibration was a scout here before.
  calibration:
    clauses:
      - {when: {axis: provenance, is: Calibration}, cite: Calibration, source: provenance}
    set: {disposition: working_scan, convertible: 'no'}

  # MRI pack 0.12.0, Nima's ruling (2026-09-28): "we can call them reformat
  # to know we should skip them". A stack tagged SECONDARY and never PRIMARY
  # was made on a workstation from images already acquired. The class phase
  # now classifies it on every axis (rules/excluded.yml), and this is the
  # mark a pipeline or a pick reads to leave it out: `reformat`, whatever its
  # construct turned out to be (an MPR, a MIP, a map a workstation copied).
  # It is before the SyMRI and the scanner-derived rules, so no other
  # disposition takes it. Convertible, as every reformat is: a release writes
  # it under `derivatives/`, never in the raw tree a pipeline reads, and no
  # role takes a stack whose disposition is not `acquisition`
  # (rules/role.yml).
  secondary_reformat:
    clauses:
      - {when: {all: [is_secondary, {not: is_primary}]}, cite: 'secondary without primary', source: image_type}
    set: {disposition: reformat, convertible: 'yes'}

  # §7.1, the case that proves the concept is needed. A SyMRI series that
  # names no product is the MDME container: a TI by TE by complex grid the
  # scanner used to fit the maps, not an image of anything. v0 refuses to
  # convert every SyMRI stack, which is right here and wrong for the products
  # below it.
  symri_working_scan:
    clauses:
      - when:
          all:
            - {axis: provenance, is: SyMRI}
            - not:
                any:
                  - {axis: construct, is: SyntheticT1w}
                  - {axis: construct, is: SyntheticT2w}
                  - {axis: construct, is: SyntheticFLAIR}
                  - {axis: construct, is: SyntheticPDw}
                  - {axis: construct, is: T1map}
                  - {axis: construct, is: T2map}
                  - {axis: construct, is: R1map}
                  - {axis: construct, is: R2map}
                  - {axis: construct, is: R2starmap}
                  - {axis: construct, is: PDmap}
                  - {axis: construct, is: MyelinMap}
        cite: 'SyMRI naming no product'
        source: provenance
      # Pack 0.9.0: the MDME or QALAS images as acquired are RawRecon, and
      # they are still the working scan the maps were fitted from.
      - when:
          all:
            - {axis: provenance, is: RawRecon}
            - any: [{axis: technique, is: MDME}, {axis: technique, is: QALAS}]
        cite: 'an MDME or QALAS acquisition as acquired'
        source: technique
    set: {disposition: working_scan, convertible: 'no'}

  # And the rest of SyMRI: the synthetic contrasts and the quantitative maps,
  # which are ordinary images the reader has to be told the provenance of.
  symri_product:
    clauses:
      - {when: {axis: provenance, is: SyMRI}, cite: SyMRI, source: provenance}
    set: {disposition: scanner_derived, convertible: 'yes'}

  # A projection through a volume: made from images, by choosing along a ray.
  projection:
    clauses:
      - {when: {axis: provenance, is: ProjectionDerived}, cite: ProjectionDerived, source: provenance}
      - {when: {axis: construct, is: MIP}, cite: MIP, source: construct}
      - {when: {axis: construct, is: MinIP}, cite: MinIP, source: construct}
      # MRI pack 0.18.0 (vocabulary)
      - {when: {axis: construct, is: StdDevProj}, cite: StdDevProj, source: construct}
      # MRI pack 0.21.0
      - {when: {axis: construct, is: StdDevTime}, cite: StdDevTime, source: construct}
    set: {disposition: reformat, convertible: 'yes'}

  # A workstation resliced a volume. v0 carries the same list under the name
  # `non_canonical_constructs` in its pick configuration, which is a
  # disposition written in the one place that needed it.
  workstation_reformat:
    clauses:
      - {when: {axis: construct, is: MPR}, cite: MPR, source: construct}
    set: {disposition: reformat, convertible: 'yes'}

  # The scanner computed it from images it had just taken.
  derived_construct:
    clauses:
      - {when: {axis: construct, is: ADC}, cite: ADC, source: construct}
      - {when: {axis: construct, is: eADC}, cite: eADC, source: construct}
      - {when: {axis: construct, is: Trace}, cite: Trace, source: construct}
      # MRI pack 0.13.0: and isoDWI, the same image under another name
      # (axes/construct.yml), which EPIMix writes and a reader may answer.
      - {when: {axis: construct, is: isoDWI}, cite: isoDWI, source: construct}
      - {when: {axis: construct, is: FA}, cite: FA, source: construct}
      - {when: {axis: construct, is: MD}, cite: MD, source: construct}
      - {when: {axis: construct, is: CBF}, cite: CBF, source: construct}
      - {when: {axis: construct, is: CBV}, cite: CBV, source: construct}
      - {when: {axis: construct, is: MTT}, cite: MTT, source: construct}
      - {when: {axis: construct, is: Tmax}, cite: Tmax, source: construct}
      - {when: {axis: construct, is: TTP}, cite: TTP, source: construct}
      # MRI pack 0.18.0 (vocabulary)
      - {when: {axis: construct, is: PBP}, cite: PBP, source: construct}
      - {when: {axis: construct, is: K2}, cite: K2, source: construct}
      - {when: {axis: construct, is: Velocity}, cite: Velocity, source: construct}
      # MRI pack 0.21.0
      - {when: {axis: construct, is: Speed}, cite: Speed, source: construct}
      - {when: {axis: construct, is: T1map}, cite: T1map, source: construct}
      - {when: {axis: construct, is: T2map}, cite: T2map, source: construct}
      - {when: {axis: construct, is: R1map}, cite: R1map, source: construct}
      - {when: {axis: construct, is: R2map}, cite: R2map, source: construct}
      - {when: {axis: construct, is: R2starmap}, cite: R2starmap, source: construct}
      - {when: {axis: construct, is: PDmap}, cite: PDmap, source: construct}
      - {when: {axis: construct, is: QSM}, cite: QSM, source: construct}
      - {when: {axis: construct, is: B0map}, cite: B0map, source: construct}
      - {when: {axis: construct, is: B1map}, cite: B1map, source: construct}
      - {when: {axis: construct, is: MyelinMap}, cite: MyelinMap, source: construct}
      - {when: {axis: construct, is: Water}, cite: Water, source: construct}
      - {when: {axis: construct, is: Fat}, cite: Fat, source: construct}
      - {when: {axis: construct, is: InPhase}, cite: InPhase, source: construct}
      - {when: {axis: construct, is: OutPhase}, cite: OutPhase, source: construct}
      - {when: {axis: construct, is: SWI}, cite: SWI, source: construct}
    set: {disposition: scanner_derived, convertible: 'yes'}

  # And by provenance, for the reconstructions whose product has no construct
  # of its own.
  derived_provenance:
    clauses:
      - {when: {axis: provenance, is: SWIRecon}, cite: SWIRecon, source: provenance}
      - {when: {axis: provenance, is: STAGE}, cite: STAGE, source: provenance}
      - {when: {axis: provenance, is: SubtractionDerived}, cite: SubtractionDerived, source: provenance}
    set: {disposition: scanner_derived, convertible: 'yes'}

  # What the scanner computed from images it had just taken and wrote with
  # no construct or provenance of its own to say so, read from the image
  # type (record 41): the motion-corrected copy of a run (`MOCO`, which
  # Siemens writes on an ORIGINAL image), and a subtraction (`SUB`), which is
  # what the perfusion-weighted image of an ASL series is, the label minus
  # the control. Both are switched on in the console's printouts and neither
  # is the acquisition.
  # MRI pack 0.10.0, Nima's ruling (2026-09-28): a motion-corrected copy
  # written ORIGINAL\PRIMARY is not derived, so only a DERIVED one is.
  scanner_computed:
    clauses:
      - {flag: is_derived_moco, tier: stated}
      - {flag: is_subtraction, tier: stated}
    set: {disposition: scanner_derived, convertible: 'yes'}

  # The pick borders study of 2026-10-10 (record 55, R2a; the design
  # repository's `studies/2026-10-10-pick-borders/`): a planning scan the
  # provenance reads as an acquisition is still not raw material. Pack
  # 0.21.0 made a series named for planning a Localizer only at 5 slices a
  # plane or fewer (`planning_word_too_many_slices`), and 0.11.0 took a
  # tri-plane split only where its slice positions were counted
  # (`is_tri_plane_scout`), so a 6-slice and a 9-slice planning series and a
  # tri-plane scout split into single images with no slice positions stood
  # as T1w and T2w candidates for the main-scan pick. What they are stays as
  # the rules read it; only what to do with them changes. They are written
  # as `nils pack apply` writes a typed `add_rule` (patch format 1), so the
  # rehearsal that measured them measured this. Convertible keeps its
  # default, which is a scout's `yes`.
  #
  # A series named loc, localizer, scout, survey or sikt (the technique text,
  # where the normalizer has already spelled `loc`, `scout` and `surv` as
  # `localizer`) of at most 12 slice positions. One rule a word, each word a
  # condition of the header tier rather than a list of the keywords tier:
  # a campaign derives the disposition and the role from a rater's answer,
  # and may not derive an axis a keywords rule writes (nils-pack derive.rs).
  planning_named_loc:
    clauses:
      - when: {all: [{text: technique_text, substring: 'loc '}, {field: n_slices, le: 12}]}
        cite: 'technique_text has loc  and n_slices <= 12'
        source: header
        tier: exclusive
    set: {disposition: scout}
    why: 'a series named for planning (loc, localizer, scout, survey, sikt) of at most 12 slices is a planning scan, whatever the provenance read: no role takes it'
  planning_named_localizer:
    clauses:
      - when: {all: [{text: technique_text, substring: 'localizer'}, {field: n_slices, le: 12}]}
        cite: 'technique_text has localizer and n_slices <= 12'
        source: header
        tier: exclusive
    set: {disposition: scout}
    why: 'a series named for planning (loc, localizer, scout, survey, sikt) of at most 12 slices is a planning scan, whatever the provenance read: no role takes it'
  planning_named_scout:
    clauses:
      - when: {all: [{text: technique_text, substring: 'scout'}, {field: n_slices, le: 12}]}
        cite: 'technique_text has scout and n_slices <= 12'
        source: header
        tier: exclusive
    set: {disposition: scout}
    why: 'a series named for planning (loc, localizer, scout, survey, sikt) of at most 12 slices is a planning scan, whatever the provenance read: no role takes it'
  planning_named_survey:
    clauses:
      - when: {all: [{text: technique_text, substring: 'survey'}, {field: n_slices, le: 12}]}
        cite: 'technique_text has survey and n_slices <= 12'
        source: header
        tier: exclusive
    set: {disposition: scout}
    why: 'a series named for planning (loc, localizer, scout, survey, sikt) of at most 12 slices is a planning scan, whatever the provenance read: no role takes it'
  planning_named_sikt:
    clauses:
      - when: {all: [{text: technique_text, substring: 'sikt'}, {field: n_slices, le: 12}]}
        cite: 'technique_text has sikt and n_slices <= 12'
        source: header
        tier: exclusive
    set: {disposition: scout}
    why: 'a series named for planning (loc, localizer, scout, survey, sikt) of at most 12 slices is a planning scan, whatever the provenance read: no role takes it'

  # A series split by orientation into stacks of at most 5 images each.
  # Where the positions were counted, more than 5 of them is no planning
  # plane (an enhanced file holds its frames in one instance), and a
  # cholangiography's radial slabs are left out, as `is_tri_plane_scout`
  # leaves them out.
  planning_tri_plane:
    clauses:
      - when:
          all:
            - {text: split_reason, equals: multi_orientation}
            - {field: n_instances, le: 5}
            - not: {field: n_slices, gt: 5}
            - not: mrcp_named
        cite: 'split_reason is multi_orientation and n_instances <= 5 and not n_slices > 5 and not mrcp_named'
        source: header
        tier: exclusive
    set: {disposition: scout}
    why: 'a series split by orientation into stacks of at most 5 images is a tri-plane planning scan where the slice positions were not counted'
