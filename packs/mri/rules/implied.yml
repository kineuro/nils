# SPDX-License-Identifier: AGPL-3.0-only
#
# Record 48: what a construct says of the technique and the modifiers. The
# construct is decided after both, so these run after it (pack.yml `order`)
# and fill only what is still open: an axis leaves alone what is already
# decided. Each is also a constraint a campaign freezes, since it reads the
# construct and nothing else. The ids in brackets are the sources of
# `studies/2026-09-25-pack-constraints/` in the design repository, listed in
# PROVENANCE.md.

rule_set: implied_technique
decides: [technique]

order: ['construct:mp2rage', 'construct:diffusion_map']

rules:

  # INV1, INV2 and UNI are the outputs of the MP2RAGE sequence, FLAWS
  # included [P9, MQ6, T2, B1].
  'construct:mp2rage':
    clauses:
      - {when: {any: [{axis: construct, is: INV1}, {axis: construct, is: INV2}, {axis: construct, is: Uniform}, {axis: construct, is: UniformDenoised}]}, cite: 'an MP2RAGE output', source: construct}
    set: {technique: 'MP2RAGE'}
    confidence: 0.95
    why: 'INV1, INV2 and UNI are the outputs of the MP2RAGE sequence'

  # MRI pack 0.14.0: an ADC, eADC, FA, MD or trace image is computed from a
  # diffusion acquisition, and where nothing in the file states its readout
  # that acquisition is a diffusion EPI (dev-2: a GE `isoADC` written with
  # ScanningSequence `2` had no technique, settled DWI-EPI). Only a technique
  # still open is filled, and a file that states a readout that is not EPI
  # keeps it out, since a TSE diffusion has no value of its own.
  'construct:diffusion_map':
    clauses:
      - {when: {all: [{any: [{axis: construct, is: ADC}, {axis: construct, is: eADC}, {axis: construct, is: FA}, {axis: construct, is: MD}, {axis: construct, is: Trace}]}, {not: says_not_epi}]}, cite: 'a diffusion map', source: construct}
    set: {technique: 'DWI-EPI'}
    confidence: 0.85
    why: 'a diffusion map whose readout the file does not state is from a diffusion EPI'
