# SPDX-License-Identifier: AGPL-3.0-only
#
# The precedence v0 applies once it knows which categories the text
# mentions: a spine wins outright, a neck beside a brain is both, and
# otherwise the neck comes before the brain.
#
# Every clause here reads an anatomy text and not `search_text`: the words
# this axis is made of are the words the other normalizer drops as
# boilerplate (`normalize-anatomy.yml`).
#
# What a series says about itself comes before what its exam was registered
# as (record 41). `BodyPartExamined` is written from the exam's
# registration, so it says the same thing on every series of an exam: a
# brain protocol run in an exam registered as a spine said spine on every
# series, and a spinal series in an exam registered as a brain said brain.
# So the precedence runs three times, over three kinds of evidence, and the
# first that says anything decides:
#
# 1. the series' own words (`anatomy_text`: its description, protocol,
#    sequence name and comments);
# 2. the coil it was received on, where the coil is a spine coil; a head and
#    neck coil images either, so it says nothing;
# 3. the stated body part (`stated_anatomy_text`), which is where most
#    stacks get theirs: a stack whose `BodyPartExamined` says BRAIN or HEAD
#    said what it is, and nothing of the series contradicted it.
#
# Order is precedence and a rule is reached only where the ones before it
# do not fire, so a rule ahead of another must be the narrower of the two.
# `brain_neck` is narrower than `neck` by construction: it asks for a neck
# word and a brain word where `neck` asks for the neck word alone. That
# holds only while both read the same neck words, which is why the French
# `cou` is not one of them: three letters matched as a plain substring hit
# the inside of ordinary words, and every stack they hit carried a brain
# word too, so a fragment fired the broader rule and the narrower one was
# never reached. `normalize-anatomy.yml` spells that word as a word.

rule_set: body_part
decides: [body_part]
tiers: {keywords: 0.65}

order: [spine, spine_levels, brain_neck, neck, brain, spine_coil, stated_spine, stated_brain_neck, stated_neck, stated_brain, portrait_sagittal]

rules:

  # --- 1. the series' own words

  # The German words are the ones a German protocol is named with:
  # `HWS`, `BWS` and `LWS` are the cervical, thoracic and lumbar spine
  # (Halswirbelsäule, Brustwirbelsäule, Lendenwirbelsäule; sources G1 to
  # G3), and `WS` the spine as a whole (G5), which `normalize-anatomy.yml`
  # spells as a word so that two letters are never matched inside another.
  spine:
    clauses:
      - {field: anatomy_text, keywords: &spine ['spine', 'spinal', 'spinal cord', 'cervical', 'cerv', 'thoracic', 'thor ', 'lumbar', 'lumb', 'c-spine', 't-spine', 'l-spine', 'vertebral', 'vertebra', 'cord', 'medulla', 'rygg', 'ryggm rg', 'halsrygg', 'br strygg', 'brostrygg', 'l ndrygg', 'lumbalrygg', 'totalcolumna', 'columna', 'sag cc', 'th col', 'wirbel', 'hws', 'bws', 'lws', 'wirbels ule', 'rachis', 'cervicale', 'dorsale', 'lombaire', 'moelle', 'wervelkolom', 'ruggengraat', 'myelit', 'myelopathy', 'syringomyelia'], tier: keywords}
    set: {body_part: spine}
    confidence: 0.65
    why: 'a spine mentioned at all decides it, even beside a brain'

  # A range of vertebral levels is a spine: `C2-Th1`, `Th4-9`, `C4-L1`,
  # `C3-6`. German writes the thoracic vertebrae Th1 to Th12 (source G4), so
  # a Philips protocol names its coverage `T1 4mm C2-Th1 KM`. The folded text
  # has the hyphen as a token of its own, and de-duplication keeps only the
  # first hyphen of a text, so the hyphen is optional. `T1` and `T2` are
  # weightings and never a level here: the thoracic letter is `th`, and a
  # level alone is not read, because `Th1` beside an MPRAGE was a brain on
  # the archive. Every one of the 85 stacks of the archive a range matched
  # was a spinal series; 6 of them had been registered as a brain or a head
  # (2026-09-27).
  spine_levels:
    clauses:
      - {when: {all: [{text: anatomy_text, matches: '\b(?:c[1-7]|th(?:1[0-2]|[1-9])|l[1-5])\s+(?:-\s+)?(?:c[1-7]|th(?:1[0-2]|[1-9])|l[1-5]|s[1-5]|1[0-2]|[1-9])\b'}]}, cite: 'a range of vertebral levels', source: text, tier: keywords}
    set: {body_part: spine}
    confidence: 0.65
    why: 'a range of vertebral levels names a spine'

  brain_neck:
    clauses:
      - {when: {all: [{text: anatomy_text, any_substring: &neck ['neck', 'nacke', 'hals', 'nakke', 'nek']}, {text: anatomy_text, any_substring: &brain ['fmri', 'bold', 'resting state', 'rs-fmri', 'task-fmri', 'rest-fmri', 'rsfmri', 'rfmri', 'hippocampus', 'amygdala', 'thalamus', 'putamen', 'caudate', 'cortex', 'cortical', 'subcortical', 'white matter', 'gray matter', 'grey matter', 'corpus callosum', 'cerebral', 'cerebellum', 'cerebellar', 'frontal', 'parietal', 'temporal', 'occipital', 'brainstem', 'midbrain', 'pons', 'brain', 'head', 'neuro', 'hcp', 'adni', 'abcd', 'hj rna', 'hjarna', 'huvud', 'kopf', 'gehirn', 'hirn', 'sch del', 'schadel', 'cerveau', 'encephale', 'cr ne', 'crane', 'hersenen', 'hoofd']}]}, cite: 'a neck and a brain', source: text, tier: keywords}
    set: {body_part: brain-neck}
    confidence: 0.65

  neck:
    clauses:
      - {field: anatomy_text, keywords: *neck, tier: keywords}
    set: {body_part: neck}
    confidence: 0.65

  brain:
    clauses:
      - {field: anatomy_text, keywords: *brain, tier: keywords}
    set: {body_part: brain}
    confidence: 0.65

  # --- 2. the coil. Only a spine coil says which part it was on: 36 stacks
  # of five protocols were received on one and every one was a spine, four
  # of them in an exam registered as a brain. A head and neck coil received
  # 1,900 brain stacks and 144 spinal ones, so it decides nothing. A coil
  # named for the spine and for the head or neck as well, such as Philips'
  # dS HeadNeckSpine, images all of them and says nothing either.

  spine_coil:
    clauses:
      - {when: {all: [{text: receive_coil_name, substring: spine}, {not: {text: receive_coil_name, substring: head}}, {not: {text: receive_coil_name, substring: neck}}]}, cite: 'a spine coil', source: coil, tier: keywords}
    set: {body_part: spine}
    confidence: 0.65
    why: 'the series was received on a spine coil'

  # --- 3. the stated body part, where nothing of the series said anything

  stated_spine:
    clauses:
      - {field: stated_anatomy_text, keywords: *spine, tier: keywords}
    set: {body_part: spine}
    confidence: 0.65
    why: 'the stated body part names a spine, even beside a brain'

  stated_brain_neck:
    clauses:
      - {when: {all: [{text: stated_anatomy_text, any_substring: *neck}, {text: stated_anatomy_text, any_substring: *brain}]}, cite: 'a neck and a brain stated', source: text, tier: keywords}
    set: {body_part: brain-neck}
    confidence: 0.65

  stated_neck:
    clauses:
      - {field: stated_anatomy_text, keywords: *neck, tier: keywords}
    set: {body_part: neck}
    confidence: 0.65

  stated_brain:
    clauses:
      - {field: stated_anatomy_text, keywords: *brain, tier: keywords}
    set: {body_part: brain}
    confidence: 0.65

  # v0's last resort, and only when the text said nothing at all: a sagittal
  # image far taller than it is wide is a spine. This is the one rule that
  # compares two of the stack's own numbers with each other.
  portrait_sagittal:
    clauses:
      - when:
          all:
            - {text: orientation, case: lower, equals: sagittal}
            - {field: fov_x, gt: 0}
            - {field: fov_y, gt: {field: fov_x}}
            - {field: aspect_ratio, ge: 1.4}
        cite: 'a portrait sagittal field of view'
        source: geometry
        tier: physics
    set: {body_part: spine}
    confidence: 0.6
