# SPDX-License-Identifier: AGPL-3.0-only
#
# The SyMRI route, transcribed from v0 0.5.3 `classification/branches/symri.py`.
#
# One quantitative acquisition, many outputs: the maps it measured and the
# weighted images it synthesized from them. A map has no base contrast at all,
# which is a fact worth being able to say: it is a measurement, not a
# weighting, and v0 stores null there rather than a guess.

rule_set: symri
enter_when: {axis: provenance, is: SyMRI}
decides: [base, construct, modifier, technique, directory_type, provenance, base_basis, contrast_mix]
# Pack 0.9.0, Nima's ruling (2026-09-28): the MDME or QALAS images as the
# scanner acquired them are RawRecon; the maps and the synthetic contrasts it
# computed from them keep SyMRI. The route was entered on SyMRI, so it decides
# the provenance again for the acquired images.
redecides: [provenance]
# v0's branch adds its modifiers to what the modifier rules found; only the
# construct list is replaced.
adds: [modifier]
tiers: {exclusive: 0.95, keywords: 0.9, stated: 0.9}

derive:
  symri_technique:
    axis: technique
    cases:
      - {when: is_qalas, value: QALAS}
      - {value: MDME}

order:
  - myelin
  - multi_qmap
  - t1_map
  - t2_map
  - pd_map
  - r1_map
  - r2_map
  - b1_map
  - tissue_map
  - synthetic_t1_flair
  - synthetic_flair
  - synthetic_dir
  - synthetic_psir
  - synthetic_stir
  - synthetic_t1
  - synthetic_t2
  - synthetic_pd
  - phase
  - ge_real
  - magnitude
  - fallback

rules:

  myelin:
    clauses:
      - {flag: has_myelin, tier: exclusive}
      - {keywords: [myelin, myc], tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [MyelinMap], technique: {from: symri_technique}, directory_type: anat}

  multi_qmap:
    clauses:
      - {flag: has_multi_qmap, tier: exclusive}
      # MRI pack 0.25.0: the name names the set; a split map's image type
      # (`QMAP\T1`) says which map it is (flags.yml, section 26c).
      - {when: {all: [{text: search_text, any_substring: [multi_qmap, qmaps]}, {not: qmap_split_stated}]}, cite: 'qmaps', source: text, tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [MultiQmap], technique: {from: symri_technique}, directory_type: anat}
    why: 'one series carrying the T1, T2 and PD maps together, as GE MAGiC writes them'

  t1_map:
    clauses:
      - {flag: qmap_t1_stated, tier: exclusive}
      # A derived map with no QMAP prefix: v0 reaches into the token set here.
      - when:
          all:
            - is_derived
            - {parser: image_type, token: T1}
            - {not: {parser: image_type, token: SYNTHETIC}}
            - {not: {parser: image_type, token: QMAP}}
            - {not: {parser: image_type, token: T1W_SYNTHETIC}}
        cite: 'a derived T1 map'
        source: image_type
        tier: exclusive
      - {flag: has_t1_map, tier: exclusive}
      - {keywords: ['t1 map', t1map], tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [T1map], technique: {from: symri_technique}, directory_type: anat}

  t2_map:
    clauses:
      - {flag: qmap_t2_stated, tier: exclusive}
      # A derived map with no QMAP prefix: v0 reaches into the token set here.
      - when:
          all:
            - is_derived
            - {parser: image_type, token: T2}
            - {not: {parser: image_type, token: SYNTHETIC}}
            - {not: {parser: image_type, token: QMAP}}
            - {not: {parser: image_type, token: T2W_SYNTHETIC}}
        cite: 'a derived T2 map'
        source: image_type
        tier: exclusive
      - {flag: has_t2_map, tier: exclusive}
      - {keywords: ['t2 map', t2map], tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [T2map], technique: {from: symri_technique}, directory_type: anat}

  pd_map:
    clauses:
      - {flag: qmap_pd_stated, tier: exclusive}
      # A derived map with no QMAP prefix: v0 reaches into the token set here.
      - when:
          all:
            - is_derived
            - {parser: image_type, token: PD}
            - {not: {parser: image_type, token: SYNTHETIC}}
            - {not: {parser: image_type, token: QMAP}}
            - {not: {parser: image_type, token: PDW_SYNTHETIC}}
        cite: 'a derived PD map'
        source: image_type
        tier: exclusive
      - {flag: has_pd_map, tier: exclusive}
      - {keywords: ['pd map', pdmap, 'proton density map'], tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [PDmap], technique: {from: symri_technique}, directory_type: anat}

  r1_map:
    clauses:
      - {flag: has_r1, tier: exclusive}
      - {keywords: ['r1 map', r1map], tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [R1map], technique: {from: symri_technique}, directory_type: anat}

  r2_map:
    clauses:
      - {flag: has_r2, tier: exclusive}
      - {keywords: ['r2 map', r2map], tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [R2map], technique: {from: symri_technique}, directory_type: anat}

  b1_map:
    clauses:
      - {flag: has_b1_map, tier: exclusive}
      - {keywords: ['b1 map', b1map], tier: keywords}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [B1map], technique: {from: symri_technique}, directory_type: fmap}
    why: 'a transmit field map is a field map, not an anatomy'

  # MRI pack 0.13.0: the tissue maps SyMRI writes (`DERIVED\PRIMARY\CSF`,
  # WM, GM) are quantitative maps with no base contrast, where the fallback
  # called them a magnitude (dev-1: a CSF map settled Qmap).
  tissue_map:
    clauses:
      - {flag: is_symri_tissue_map, tier: exclusive}
    set: {base: null, base_basis: null, contrast_mix: null, construct: [Qmap], technique: {from: symri_technique}, directory_type: anat}

  # MRI pack 0.24.0 (the final certificate's A13): a synthetic T1-weighted
  # FLAIR (`T1W_FLAIR Synthetic`, `T1FLAIR\SYNTHETIC`; GE `MAGiC T1FLAIR`)
  # is T1w with FLAIR, as a T1-FLAIR is anywhere else (the reading guide);
  # the rule below made every synthetic FLAIR T2w (flags.yml, section 22).
  synthetic_t1_flair:
    clauses:
      - {flag: t1_flair_synthetic, tier: exclusive}
    set: {base: 'T1w', base_basis: physics, contrast_mix: null, construct: [SyntheticFLAIR], modifier: [FLAIR], technique: {from: symri_technique}, directory_type: anat}

  synthetic_flair:
    clauses:
      # MRI pack 0.25.0: or Philips' `(Synthetic)` contrast by its parameters
      # (flags.yml, section 26c).
      - {flag: synthetic_flair_by_params, tier: exclusive}
      - {flag: has_flair_synthetic, tier: exclusive}
      - {when: {all: [{text: search_text, substring: flair}, {text: search_text, substring: synthetic}]}, cite: 'synthetic flair', source: text, tier: keywords}
    set: {base: 'T2w', base_basis: physics, contrast_mix: null, construct: [SyntheticFLAIR], modifier: [FLAIR], technique: {from: symri_technique}, directory_type: anat}

  synthetic_dir:
    clauses:
      - {flag: has_dir_synthetic, tier: exclusive}
      - {when: {all: [{text: search_text, substring: dir}, {text: search_text, substring: synthetic}]}, cite: 'synthetic dir', source: text, tier: keywords}
    set: {base: 'T2w', base_basis: physics, contrast_mix: null, construct: [SyntheticDIR], modifier: [DIR], technique: {from: symri_technique}, directory_type: anat}

  synthetic_psir:
    clauses:
      # MRI pack 0.25.0: or Philips' `(Synthetic)` contrast by its parameters
      # (flags.yml, section 26c).
      - {flag: synthetic_psir_by_params, tier: exclusive}
      - {flag: has_psir_synthetic, tier: exclusive}
      - {when: {all: [{text: search_text, substring: psir}, {text: search_text, substring: synthetic}]}, cite: 'synthetic psir', source: text, tier: keywords}
    set: {base: 'T1w', base_basis: physics, contrast_mix: null, construct: [SyntheticPSIR], modifier: [PSIR], technique: {from: symri_technique}, directory_type: anat}

  synthetic_stir:
    clauses:
      - {flag: has_stir_synthetic, tier: exclusive}
      - {when: {all: [{text: search_text, substring: stir}, {text: search_text, substring: synthetic}]}, cite: 'synthetic stir', source: text, tier: keywords}
    set: {base: 'T2w', base_basis: physics, contrast_mix: null, construct: [SyntheticSTIR], modifier: [STIR], technique: {from: symri_technique}, directory_type: anat}

  synthetic_t1:
    clauses:
      # MRI pack 0.25.0: or Philips' `(Synthetic)` contrast by its parameters
      # (flags.yml, section 26c).
      - {flag: synthetic_t1w_by_params, tier: exclusive}
      - {flag: has_t1_synthetic, tier: exclusive}
      - when:
          all:
            - {text: search_text, substring: t1}
            - {text: search_text, substring: synthetic}
            - {not: {text: search_text, substring: flair}}
            - {not: {text: search_text, substring: dir}}
            - {not: {text: search_text, substring: psir}}
        cite: 'synthetic t1'
        source: text
        tier: keywords
    set: {base: 'T1w', base_basis: physics, contrast_mix: null, construct: [SyntheticT1w], technique: {from: symri_technique}, directory_type: anat}

  synthetic_t2:
    clauses:
      # MRI pack 0.25.0: or Philips' `(Synthetic)` contrast by its parameters
      # (flags.yml, section 26c).
      - {flag: synthetic_t2w_by_params, tier: exclusive}
      - {flag: has_t2_synthetic, tier: exclusive}
      - when:
          all:
            - {text: search_text, substring: t2}
            - {text: search_text, substring: synthetic}
            - {not: {text: search_text, substring: flair}}
            - {not: {text: search_text, substring: stir}}
        cite: 'synthetic t2'
        source: text
        tier: keywords
    set: {base: 'T2w', base_basis: physics, contrast_mix: null, construct: [SyntheticT2w], technique: {from: symri_technique}, directory_type: anat}

  synthetic_pd:
    clauses:
      # MRI pack 0.25.0: or Philips' `(Synthetic)` contrast by its parameters
      # (flags.yml, section 26c).
      - {flag: synthetic_pdw_by_params, tier: exclusive}
      - {flag: has_pd_synthetic, tier: exclusive}
      - {when: {all: [{text: search_text, substring: pd}, {text: search_text, substring: synthetic}]}, cite: 'synthetic pd', source: text, tier: keywords}
    set: {base: 'PDw', base_basis: physics, contrast_mix: null, construct: [SyntheticPDw], technique: {from: symri_technique}, directory_type: anat}

  phase:
    clauses:
      - {flag: has_phase, tier: exclusive}
      - {keywords: [phase], tier: keywords}
    set: {provenance: [{value: RawRecon, when: {not: is_derived}}], base: null, base_basis: null, contrast_mix: null, construct: [Phase, {value: ND, when: has_nd}], technique: {from: symri_technique}, directory_type: anat}
    confidence: 0.8

  # MRI pack 0.24.0 (the final certificate's A3): a GE MAGiC or MDME image
  # as acquired, which GE's private image type writes real (2), is the real
  # part: construct Real, RawRecon, no base (flags.yml, section 20,
  # `ge_mdme_real`; round 3, case 21, exempts PROPELLER only).
  ge_real:
    clauses:
      - {flag: ge_mdme_real, tier: exclusive}
    set: {provenance: RawRecon, base: null, base_basis: null, contrast_mix: null, construct: [Real, {value: ND, when: has_nd}], technique: {from: symri_technique}, directory_type: anat}
    confidence: 0.85

  # MRI pack 0.12.0: an MDME or QALAS image as acquired is an ordinary
  # acquired image, and its construct is none (or ND where its ImageType
  # says so), as the reading guide has it for any acquisition: dev-1 settled
  # none on 28 of the 30 where the route wrote Magnitude, and ND on the
  # other two. Magnitude stays for what the software wrote as one.
  magnitude:
    clauses:
      - {flag: has_magnitude, tier: exclusive}
      - {keywords: [magnitude], tier: keywords}
    set: {provenance: [{value: RawRecon, when: {not: is_derived}}], base: null, base_basis: null, contrast_mix: null, construct: [{value: Magnitude, when: is_derived}, {value: ND, when: has_nd}], technique: {from: symri_technique}, directory_type: anat}
    confidence: 0.8

  fallback:
    clauses:
      - {when: true, cite: SyMRI, source: provenance}
    set: {provenance: [{value: RawRecon, when: {not: is_derived}}], base: null, base_basis: null, contrast_mix: null, construct: [{value: Magnitude, when: is_derived}, {value: ND, when: has_nd}], technique: {from: symri_technique}, directory_type: anat}
    confidence: 0.7
    why: 'a SyMRI acquisition whose output is unclear is the raw source data'
