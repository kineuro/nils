# SPDX-License-Identifier: AGPL-3.0-only
#
# The STAGE route, transcribed from v0 0.5.3 `classification/branches/stage.py`.
#
# A multi-echo gradient echo whose outputs are a magnitude and a phase. It is
# the one route that does not decide the base: the contrast is still whatever
# the base rules make of it, and only the construct and the technique are the
# route's to say.

rule_set: stage
enter_when: {axis: provenance, is: STAGE}
decides: [construct, technique, directory_type, provenance]
# Record 55: an echo STAGE acquired (written ORIGINAL) enters the route too,
# so its evidence says which acquisition it belongs to and a name can say
# STAGE; the route decides its provenance again, RawRecon as pack 0.21.0
# made it (dev-6's A8), and leaves every other axis to the axes' own rules.
redecides: [provenance]
tiers: {exclusive: 0.9, stated: 0.85}

order: [acquired_echo, phase, magnitude]

rules:

  acquired_echo:
    clauses:
      - {flag: stage_acquired_echo, tier: exclusive}
    set: {provenance: RawRecon}
    why: 'an echo STAGE acquired is its own image, not one it computed'

  phase:
    clauses:
      - {when: {all: [has_phase, {not: has_magnitude}]}, cite: has_phase, source: flags, tier: exclusive}
    set: {construct: [Phase], technique: 'ME-GRE', directory_type: anat}

  magnitude:
    clauses:
      - {when: true, cite: STAGE, source: provenance}
    set: {construct: [Magnitude], technique: 'ME-GRE', directory_type: anat}
    why: 'anything that is not the phase is the magnitude'
