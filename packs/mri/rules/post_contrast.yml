# SPDX-License-Identifier: AGPL-3.0-only
#
# Whether contrast was given. The DICOM tags settle it when they are there;
# only when they are not does the text get a say, and a word saying no
# beats a word saying yes.

rule_set: post_contrast
decides: [post_contrast]
tiers: {exclusive: 0.95, keywords: 0.85}

order: [structured, negative, positive]

rules:

  structured:
    clauses:
      - {when: {field: text_contrast, present: true}, cite: 'the DICOM contrast tags', source: contrast_blob, tier: exclusive}
    set: {post_contrast: given}
    why: 'the administration was recorded in the file, so it happened'

  negative:
    clauses:
      - {keywords: {bucket: contrast_negative}, tier: keywords}
    set: {post_contrast: not_given}
    why: 'a word saying no beats a word saying yes'

  positive:
    clauses:
      - {keywords: {bucket: contrast_positive}, tier: keywords}
    set: {post_contrast: given}
