#
# Which stacks are candidates for each role (section 10).
#
# Transcribed from v0's eligibility query in
# `qc/cohort_main/service.py::_load_eligible_rows`, which is four conditions:
# the intent is anatomical, the stack is not a localizer, its construct holds
# none of `non_canonical_constructs` (MIP, MPR, Reformat, Synthetic), and the
# base is T1w, or T2w with a FLAIR modifier.
#
# Three of those four are one condition here. `disposition: acquisition` rules
# out the localizer, which is a `scout`, and every one of the banned constructs,
# which are `reformat` or `scanner_derived`. That is section 7's point made
# concrete: v0's banned list is a disposition written in the one place that
# needed it, and once the concept exists in its own right the list is not
# needed anywhere.
#
# Runs after the disposition, which is why `order` puts it there: a rule set of
# this phase reads what an earlier one of the same phase decided.
#
# It reads `missing_or: acquisition` rather than `is: acquisition`, because an
# axis takes its default only after every rule set has run, so a value that came
# from a default is not there for a later set to read. Nothing decided the
# disposition means the disposition is `acquisition`, which is what this says.
# The coupling to that default is deliberate and is the reason it is written
# down here.
#
# One condition is this pack's and not v0's: a T1w whose modifier holds FLAIR
# (a T1-FLAIR, which the modifier axis reads from `t1 flair`, `is_flair` or an
# IR-FLAIR sequence) is not a candidate main T1w. T1-weighted FLAIR is rare
# and special, and is not used as a session's main T1w for analysis (record 49,
# Nima's ruling of 2026-09-25). Nor is it a candidate FLAIR, whose base is T2w,
# so a T1-FLAIR stands for no role, and a session whose only T1 is one has no
# T1w for the release and the pre-flight to name.

# MRI pack 0.24.0 (round 4): no stack whose base is mixed (`contrast_mix`
# has a value: a STIR named T1, a T1 inversion at a long echo time, a STIR
# named T2 at a short one, a short-TE gradient echo named T2) is a candidate
# for any role: a FreeSurfer or lesion input wants the clean contrast.
rule_set: role
decides: [role]
collect: true
tiers: {stated: 1.0}

# The pick borders study of 2026-10-10, R2b: the five rules that say no
# role go first, before every rule that sets one.
order: [angiography_tof, angiography_ce, angiography_pc, dynamic, small_field, t1w, flair, t2w]

rules:

  # The pick borders study of 2026-10-10 (record 55, R2b; the design
  # repository's `studies/2026-10-10-pick-borders/`): what is never a
  # session's main scan, whatever its base. An angiography (TOF, contrast
  # MRA, phase contrast; Nima's ruling of 2026-09-26 keeps a TOF's base
  # T1w), a series of more than one temporal position as its header states
  # it (a dynamic: a pituitary run of 5 slices by 11 phases scored as 55
  # slices), and a slab whose two in-plane fields of view are both under
  # 175 mm (an inner ear, an orbit). Each decides the role as nothing, so it
  # runs before the rules that set one, and a stack's classification says
  # which of them did. They are written as `nils pack apply` writes a typed
  # `add_rule` with `nothing: true` (patch format 1,
  # tests/fixtures/patches/never-a-main-scan.yml), so the rehearsal that
  # measured them measured this.
  angiography_tof:
    clauses:
      - {when: {axis: technique, is: TOF-MRA}, cite: 'technique is TOF-MRA', source: axes, tier: stated}
    set: {role: null}
    why: 'an angiography images vessels, not the brain'
  angiography_ce:
    clauses:
      - {when: {axis: technique, is: CE-MRA}, cite: 'technique is CE-MRA', source: axes, tier: stated}
    set: {role: null}
    why: 'an angiography images vessels, not the brain'
  angiography_pc:
    clauses:
      - {when: {axis: technique, is: PC-MRA}, cite: 'technique is PC-MRA', source: axes, tier: stated}
    set: {role: null}
    why: 'an angiography images vessels, not the brain'
  dynamic:
    clauses:
      - {when: {field: temporal_positions, gt: 1}, cite: 'temporal_positions > 1', source: header, tier: exclusive}
    set: {role: null}
    why: 'a series of more than one temporal position is a dynamic run, not one volume to measure on'
  small_field:
    clauses:
      - {when: {all: [{field: fov_x, lt: 175}, {field: fov_y, lt: 175}]}, cite: 'fov_x < 175 and fov_y < 175', source: header, tier: exclusive}
    set: {role: null}
    why: 'a slab whose in-plane fields of view are both under 175 mm (an inner ear, an orbit, a pituitary) does not cover a brain'

  t1w:
    clauses:
      - when:
          all:
            - {axis: disposition, missing_or: acquisition}
            - {axis: directory_type, is: anat}
            - {axis: base, is: T1w}
            - not: {any: [{axis: contrast_mix, is: intermediate_PD_T2}, {axis: contrast_mix, is: T2like_T1}, {axis: contrast_mix, is: T1like_IR_longTE}, {axis: contrast_mix, is: PD_T2star}]}
            - not: {axis: modifier, is: FLAIR}
        cite: 'an anatomical T1w acquisition that is not a T1-FLAIR'
        source: axes
    set: {role: t1w}

  flair:
    clauses:
      - when:
          all:
            - {axis: disposition, missing_or: acquisition}
            - {axis: directory_type, is: anat}
            - {axis: base, is: T2w}
            - not: {any: [{axis: contrast_mix, is: intermediate_PD_T2}, {axis: contrast_mix, is: T2like_T1}, {axis: contrast_mix, is: T1like_IR_longTE}, {axis: contrast_mix, is: PD_T2star}]}
            - {axis: modifier, is: FLAIR}
        cite: 'an anatomical T2w acquisition with a FLAIR modifier'
        source: axes
    set: {role: flair}

  # Record 51 R8: a T2w that is not a FLAIR. Ours, not v0's: v0's cohort pick
  # knew T1w and FLAIR only. A balanced steady state is T2w by this pack's
  # convention (0.15.0) and is a candidate here, which the pick's tiers score
  # near the floor.
  t2w:
    clauses:
      - when:
          all:
            - {axis: disposition, missing_or: acquisition}
            - {axis: directory_type, is: anat}
            - {axis: base, is: T2w}
            - not: {any: [{axis: contrast_mix, is: intermediate_PD_T2}, {axis: contrast_mix, is: T2like_T1}, {axis: contrast_mix, is: T1like_IR_longTE}, {axis: contrast_mix, is: PD_T2star}]}
            - not: {axis: modifier, is: FLAIR}
        cite: 'an anatomical T2w acquisition that is not a FLAIR'
        source: axes
    set: {role: t2w}
