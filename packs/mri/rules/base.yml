    set: {base: 'T2rho'}

  'keywords:T2starw':
    clauses:
      - {keywords: ['t2*', 't2star', 't2 star', 't2*w', 't2*-w'], tier: keywords}
    set: {base: 'T2starw'}

  # MRI pack 0.11.0: a gradient echo named T2 is T2*-weighted [P8, MQ8]:
  # `t2_fl2d_tra_hemo`, a FLASH of TE 26 ms, was T2w by its word on the
  # 2026-09-28 re-measure. Before the T2w words, which would take it.
  # MRI pack 0.18.0: a gradient-echo EPI that no earlier rule placed (not a
  # diffusion, perfusion, BOLD or SWI series) is T2*-weighted, unless its
  # words say T1 (GE's SPGR-EPI, case 32) (sealed-1 A7).
  'technique:GRE-EPI':
    clauses:
      - {when: {all: [{axis: technique, is: 'GRE-EPI'}, {not: {text: search_text, matches: '(^|[^a-z0-9])t1'}}]}, cite: 'GRE-EPI', source: technique}
    set: {base: 'T2starw'}
    confidence: 0.8
    why: 'a gradient-echo EPI is T2*-weighted'

  # MRI pack 0.21.0 (dev-6's A7): on a gradient echo the MTw word outranks
  # a T2 word (`T2_TE7_MTw_ax`, an echo of an MT-weighted multi-echo FFE).
  'gre:mtw_named':
    clauses:
      - {flag: gre_mtw_named, tier: keywords}
    set: {base: 'MTw'}
    why: 'a gradient echo named MT-weighted is MTw whatever else its name says'

  'gre:t2_named':
    clauses:
      - {flag: is_t2_named_gre, tier: keywords}
    set: {base: 'T2starw'}
    why: 'a gradient echo with a long echo time named T2 is T2*-weighted'

  'keywords:T2w':
    clauses:
      - {keywords: ['t2w', 't2 w', 't2-w', 't2 weighted', 't2-weighted', 't2'], tier: keywords}
    set: {base: 'T2w'}

  'keywords:PDw':
    clauses:
      - {keywords: ['pdw', 'pd w', 'pd-w', 'pd weighted', 'proton density', 'proton-density', 'qmap pd', 'pd map'], tier: keywords}
    set: {base: 'PDw'}

  'keywords:T1w':
    clauses:
