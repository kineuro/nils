  'dual_echo:t2':
    clauses:
      - {when: {all: [{text: search_text, any_substring: ['pd', 'proton density', 'proton-density']}, {text: search_text, any_substring: ['t2']}, {field: echo_time, ge: 40}]}, cite: 'T2 echo', source: physics, tier: physics}
    set: {base: 'T2w'}
    confidence: 0.85

  # Pack 0.9.0, Nima's ruling (2026-09-27): a dual-echo spin echo is base by
  # the echo on screen, whatever its words say. The digest splits it into one
  # stack per echo, and a long repetition time with a short echo is
  # proton-density weighted, with a long one T2-weighted [MQ20, M1, RP14, B1].
  # 40 ms is v0's cut, ours: the published PD echo is at most about 30 ms and
  # the T2 echo at least about 80 ms, so it sits in the gap.
  'dual_echo:short_echo':
    clauses:
      - {when: {all: [is_multi_echo, has_se, {not: has_epi}, {field: stacks_in_series, eq: 2}, {field: repetition_time, ge: 2000}, {field: echo_time, gt: 0}, {field: echo_time, lt: 40}]}, cite: 'the short echo of a dual-echo spin echo', source: physics, tier: physics}
    set: {base: 'PDw'}
    confidence: 0.8

  'dual_echo:long_echo':
    clauses:
      - {when: {all: [is_multi_echo, has_se, {not: has_epi}, {field: stacks_in_series, eq: 2}, {field: repetition_time, ge: 2000}, {field: echo_time, ge: 40}]}, cite: 'the long echo of a dual-echo spin echo', source: physics, tier: physics}
    set: {base: 'T2w'}
    confidence: 0.8

  # Tier 5. Keywords, in the axis's own priority order.
  # MRI pack 0.18.0: MR cholangiopancreatography is heavily T2-weighted,
  # whatever its repetition time (sealed-1 A7: its base was left empty).
  # MRI pack 0.21.0 (dev-6's A5): a spin echo at a long TR and an echo time
  # under 40 ms is proton-density weighted whatever a T2 word says, the
  # first echo of a dual-echo PD/T2 written as its own series; the dual-echo
  # ruling (pack 0.9.0) reads the echo on screen.
  'r3:se_short_te_t2_named':
    clauses:
      - {flag: se_short_te_t2_named, tier: physics}
    set: {base: 'PDw'}
    confidence: 0.75
    why: 'a long-TR spin echo at a short echo time is proton-density weighted'

  'keywords:mrcp':
    clauses:
      - {flag: mrcp_named, tier: keywords}
    set: {base: 'T2w'}
    why: 'MRCP is a heavily T2-weighted fluid image'

  'keywords:DWI':
    clauses:
      - {keywords: ['dwi', 'diffusion', 'dti', 'diff ', 'hardi'], tier: keywords}
    set: {base: 'DWI'}

  'keywords:PWI':
    clauses:
