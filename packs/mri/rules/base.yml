# SPDX-License-Identifier: AGPL-3.0-only
#
# The base contrast, transcribed from v0 0.5.3 `detectors/base_contrast.py`
# and `detection_yaml/base-detection.yaml`.
#
# This is the axis that needs the longhand form. v0's other detectors scan an
# axis's values and try three tiers per value; this one scans six tiers and
# tries every value inside each. A rule set is ordered rules, so the tiers are
# the rules and their order is v0's.

rule_set: base
decides: [base]

tiers: {exclusive: 0.9, keywords: 0.85, physics: 0.7}

order:
  - 'construct:inversion'
  - 'construct:phase'
  - 'flag:spectroscopy'
  - 'construct:b1map'
  - 'r3:no_base'
  - 'technique:MPRAGE'
  - 'technique:MEMPRAGE'
  - 'technique:MP2RAGE'
  - 'technique:TOF-MRA'
  - 'technique:CE-MRA'
  - 'technique:ZTE-silent-mra'
  - 'construct:in_opposed_gre'
  - 'stage:named'
  - 'technique:ME-GRE'
  - 'technique:comb-ME-GRE'
  - 'technique:DWI-EPI'
  - 'technique:DWI-TSE'
  - 'bold:gre_epi'
  - 'construct:m0'
  - 'technique:ASL'
  - 'perfusion:single_volume'
  - 'technique:Perfusion-EPI'
  - 'technique:DCE'
  - 'balanced:low_flip_2d'
  - 'balanced:t2_over_t1'
  - 'construct:diffusion'
  - 'construct:perfusion'
  - 'construct:swi'
  - 'flag:dwi'
  - 'flag:pwi'
  - 'flag:swi'
  - 'flag:mtw'
  - 'flag:synthetic_t1'
  - 'flag:synthetic_t2'
  - 'flag:synthetic_flair'
  - 'flag:synthetic_pd'
  - 'flag:synthetic_dir'
  - 'flag:synthetic_psir'
  - 'flag:t1_map'
  - 'flag:t2_map'
  - 'flag:mp2rage_inversion'
  - 'flag:mp2rage_uniform'
  - 'flair:t1_text'
  - 'flair:t2_text'
  - 'flair:short_te'
  - 'flair:long_te'
  - 'flair:default'
  - 'dual_echo:pd'
  - 'dual_echo:t2'
  - 'dual_echo:short_echo'
  - 'dual_echo:long_echo'
  - 'r3:se_short_te_t2_named'
  - 'keywords:mrcp'
  - 'keywords:DWI'
  - 'keywords:PWI'
  - 'keywords:SWI'
  - 'keywords:T1rho'
  - 'keywords:T2rho'
  - 'keywords:T2starw'
  - 'technique:GRE-EPI'
  - 'gre:mtw_named'
  - 'gre:t2_named'
  - 'keywords:T2w'
  - 'keywords:PDw'
  - 'keywords:T1w'
  - 'keywords:MTw'
  - 'modifier:stir'
  - 'physics:ir_stir_like'
  - 'physics:ir_standard'
  - 'physics:se_t1w'
  - 'physics:se_t2w'
  - 'physics:se_pdw'
  - 'physics:se_long_te'
  - 'physics:gre_t2starw_long_tr'
  - 'physics:gre_pdw'
  - 'physics:gre_t1w'
  - 'physics:gre_t2starw'

rules:

  # Tier 1. Some techniques and some constructs lock the base contrast, and
  # these are taken as authoritative: no conflict check, no keyword may
  # override. Each is also a constraint a campaign freezes, since its
  # condition reads other axes and nothing else, so it holds for a rater's
  # answer as much as for the rules'.
  #
  # v0's map has ten entries and two of them name techniques its own technique
  # axis does not have (SWI, DSC-EPI), so they can never fire. A rule
  # that names a value outside an axis's vocabulary fails this pack at load,
  # which is how they were found.
  #
  # Record 48 checked each against at least two independent sources
  # (`studies/2026-09-25-pack-constraints/` in the design repository; the ids
  # in brackets are its sources, listed in PROVENANCE.md). This set runs
  # after construct (pack.yml `order`), so a rule that reads construct reads
  # what was decided.

  # The two inversions of an MP2RAGE carry no base contrast of their own:
  # the construct says what they are, and BIDS files them as `inv-1` and
  # `inv-2` of the suffix `MP2RAGE` and not as a weighting [B1], the images
  # the uniform T1-weighted image is computed from [P9, MQ6]. Nima's ruling,
  # 2026-09-27 (pack 0.9.0), which replaces 0.6.0's "INV2 is PDw". First, so
  # the MP2RAGE rule below never reaches them.
  'construct:inversion':
    clauses:
      - {when: {any: [{axis: construct, is: INV1}, {axis: construct, is: INV2}]}, cite: 'an MP2RAGE inversion', source: construct}
    set: {base: null}
    confidence: 0.9
    why: 'an MP2RAGE inversion is named by its construct and has no base contrast'

  # MRI pack 0.13.0: a phase image carries no base contrast, whatever its
  # sequence (the SWI and SyMRI routes already say so for theirs; pack
  # 0.11.0 kept the vote from filling one). dev-1: a Philips MDME `PHASE
  # MAP` outside the SyMRI route was PDw by its echo time, and a phase image
  # of an MT-prepared multi-echo gradient echo T2*w by its technique; both
  # were settled none.
  'construct:phase':
    clauses:
      - {when: {axis: construct, is: Phase}, cite: 'a phase image', source: construct}
      # MRI pack 0.18.0: and a phase contrast's velocity image.
      - {when: {axis: construct, is: Velocity}, cite: 'a velocity image', source: construct}
    set: {base: null}
    confidence: 0.9
    why: 'a phase image has no base contrast'

  # MRI pack 0.14.0: a spectroscopy acquisition has no image contrast
  # (dev-2: a GE `PROBE-SV` left empty, settled none).
  # MRI pack 0.20.0: and any stack the technique axis reads as MRS (dev-5's
  # A1: a GE single-voxel result named "MRS", given PWI by the vote).
  'flag:spectroscopy':
    clauses:
      - {flag: is_spectroscopy, tier: keywords}
      - {when: {axis: technique, is: MRS}, cite: 'MRS', source: technique}
    set: {base: null}
    confidence: 0.85
    why: 'a spectroscopy acquisition has no base contrast'

  # MRI pack 0.21.0 (record 48, conventions round 3): no base contrast for
  # a calibration scan (case 7: coil-sensitivity and receive-field references
  # are not meant to be read), any output of a phase contrast (case 5: a
  # flow image, not tissue contrast), a temporal standard deviation (case
  # 4), and a real or imaginary spin-echo component without PSIR evidence
  # (case 24: its intensity follows the receiver phase).
  'r3:no_base':
    clauses:
      - {when: {axis: provenance, is: Calibration}, cite: 'a calibration scan', source: provenance}
      - {when: {axis: technique, is: PC-MRA}, cite: 'a phase contrast', source: technique}
      - {when: {axis: construct, is: StdDevTime}, cite: 'a temporal standard deviation', source: construct}
      - {when: {axis: construct, is: Speed}, cite: 'a phase-contrast speed image', source: construct}
      - when:
          all:
            - se_component_no_psir
            - {not: {axis: modifier, is: PSIR}}
            - {not: {axis: modifier, is: IR}}
            - {not: {axis: modifier, is: FLAIR}}
            - {not: {axis: modifier, is: STIR}}
            - {not: {axis: modifier, is: DIR}}
        cite: 'a real or imaginary spin-echo component without PSIR evidence'
        source: flags
    set: {base: null}
    confidence: 0.85
    why: 'a calibration scan, a phase-contrast output, a temporal map and a spin-echo component without PSIR evidence have no base contrast'

  # 3D inversion-prepared rapid gradient echo [MQ6, B1, P11, S8]
  # MRI pack 0.18.0: a B1 (flip angle) map is a map of the transmit field,
  # with no contrast weighting, as the SyMRI route already says of its own
  # (sealed-1 A17: a B1 map read as DWI).
  'construct:b1map':
    clauses:
      - {when: {axis: construct, is: B1map}, cite: 'a B1 map', source: construct}
    set: {base: null}
    confidence: 0.9
    why: 'a B1 (flip angle) map measures the transmit field and has no base contrast'

  'technique:MPRAGE':
    clauses:
      - {when: {axis: technique, is: 'MPRAGE'}, cite: 'MPRAGE', source: technique}
    set: {base: 'T1w'}
    confidence: 0.95
    why: 'the MPRAGE technique implies a T1w base contrast'

  # [P12, MQ6]
  'technique:MEMPRAGE':
    clauses:
      - {when: {axis: technique, is: 'MEMPRAGE'}, cite: 'MEMPRAGE', source: technique}
    set: {base: 'T1w'}
    confidence: 0.95
    why: 'the MEMPRAGE technique implies a T1w base contrast'

  # UNI, UNI-DEN and a T1 map are T1-weighted; the two inversions have no
  # base (above) [P9, MQ6, B1]
  'technique:MP2RAGE':
    clauses:
      - {when: {all: [{axis: technique, is: 'MP2RAGE'}, {not: {axis: construct, is: INV1}}, {not: {axis: construct, is: INV2}}]}, cite: 'MP2RAGE', source: technique}
    set: {base: 'T1w'}
    confidence: 0.95
    why: 'the MP2RAGE uniform image and T1 map are T1-weighted; its inversions have no base'

  # The physics sources agree the stationary tissue of a TOF is T1-weighted
  # [RP7, MQ7]; DICOM and BIDS give angiography a class of its own [D3, D4,
  # B1]. Nima's ruling, 2026-09-26: T1w stays, and angiography is seen in the
  # technique and the construct.
  'technique:TOF-MRA':
    clauses:
      - {when: {axis: technique, is: 'TOF-MRA'}, cite: 'TOF-MRA', source: technique}
    set: {base: 'T1w'}
    confidence: 0.9
    why: 'the TOF-MRA technique implies a T1w base contrast'

  # Not always: a Dixon or an in and opposed phase multi-echo GRE is
  # T1-weighted [MQ8, P14, P16, P15]. So it is no constraint (hints.yml says
  # what is usual), and the rule reads the file's own Dixon and phase flags,
  # which keeps it a reading of the stack rather than a law of the schema.
  # MRI pack 0.18.0 (vocabulary): a contrast-enhanced angiography is a
  # T1-weighted spoiled gradient echo timed to the bolus.
  'technique:CE-MRA':
    clauses:
      - {when: {axis: technique, is: 'CE-MRA'}, cite: 'CE-MRA', source: technique}
    set: {base: 'T1w'}
    confidence: 0.9
    why: 'a contrast-enhanced angiography is a T1-weighted spoiled gradient echo'

  # MRI pack 0.18.0 (vocabulary): GE's Silent MRA subtracts control from
  # label, an angiogram with no tissue weighting (the deep research, case 29:
  # base none).
  'technique:ZTE-silent-mra':
    clauses:
      - {when: {all: [{axis: technique, is: 'ZTE'}, silent_mra_named]}, cite: 'a Silent MRA', source: technique}
    set: {base: null}
    confidence: 0.85
    why: 'a Silent MRA is a label-minus-control angiogram with no tissue weighting'

  # MRI pack 0.20.0: the in-phase or opposed-phase echo of a two-point
  # Dixon or in/opposed-phase gradient echo is T1-weighted, whatever its
  # echo count makes the technique (dev-5's A3: the in-phase echo of a 2D
  # FLASH at TR 90 ms and flip 70 was T2*w as a multi-echo gradient echo).
  # Never a spin echo's, whose Dixon echoes keep the spin echo's weighting.
  'construct:in_opposed_gre':
    clauses:
      - {when: {all: [{any: [{axis: construct, is: InPhase}, {axis: construct, is: OutPhase}]}, has_gre, {not: has_se}, {not: has_epi}]}, cite: 'an in-phase or opposed-phase gradient echo', source: construct}
    set: {base: 'T1w'}
    confidence: 0.85
    why: 'a two-point Dixon or in/opposed-phase gradient echo is T1-weighted'

  # MRI pack 0.22.0 (dev-7): an acquired STAGE echo takes the weighting its
  # name states, PD at the low flip and T1 at the high one (flags.yml,
  # `stage_pd_echo`), before the multi-echo rule below would make it T2*w.
  'stage:named':
    clauses:
      - {flag: stage_pd_echo, tier: keywords}
      - {flag: stage_t1_echo, tier: keywords}
    set: {base: [{value: 'PDw', when: stage_pd_echo}, {value: 'T1w', when: stage_t1_echo}]}
    why: 'a STAGE acquisition is named for the weighting its flip angle gives'

  'technique:ME-GRE':
    clauses:
      - {when: {all: [{axis: technique, is: 'ME-GRE'}, {not: {any: [has_dixon, has_water, has_fat, has_in_phase, has_out_phase, mtw_named]}}]}, cite: 'ME-GRE', source: technique}
    set: {base: 'T2starw'}
    confidence: 0.85
    why: 'a multi-echo GRE that is not a Dixon, an in and opposed phase or a magnetisation transfer weighting is taken as T2*-weighted'

  # MRI pack 0.12.0: nor an MT-weighted one. A multi-parameter mapping
  # protocol acquires an MT-weighted multi-echo 3D gradient echo beside its
  # PD- and T1-weighted ones [P51], and names it so; the MT pulse, not the echo
  # train, is its contrast (dev-1: two Philips multi-echo FFEs named for MT
  # were T2*w, settled MTw). The words go to `keywords:MTw`.

  # MEDIC, MERGE and M-FFE are T2*-weighted [MQ9, P17, P18]
  # MRI pack 0.20.1: but not the SWI image of combined echoes, nor its
  # projections. Pack 0.20.0 made a Philips SWIp output (`SW_M`) of a
  # multi-echo acquisition comb-ME-GRE (record 48, case 2), and the SWI
  # route keeps the processed image and its MIP and minIP base SWI (pack
  # 0.9.0). Read without this guard, the clause is an implication that
  # every comb-ME-GRE is T2*w, which the ruled answer broke on 299 archive
  # stacks at the first reclassify with 0.20.0. Construct SWI, MIP or MinIP
  # is on no other comb-ME-GRE stack of the archive.
  'technique:comb-ME-GRE':
    clauses:
      - {when: {all: [{axis: technique, is: 'comb-ME-GRE'}, {not: {any: [{axis: construct, is: SWI}, {axis: construct, is: MIP}, {axis: construct, is: MinIP}]}}]}, cite: 'comb-ME-GRE', source: technique}
    set: {base: 'T2starw'}
    confidence: 0.9
    why: 'the comb-ME-GRE technique implies a T2*w base contrast'

  # [D1, MQ3, RP8]
  'technique:DWI-EPI':
    clauses:
      - {when: {axis: technique, is: 'DWI-EPI'}, cite: 'DWI-EPI', source: technique}
    set: {base: 'DWI'}
    confidence: 0.95
    why: 'the DWI-EPI technique implies a DWI base contrast'

  # MRI pack 0.15.0, Nima's ruling N3 (2026-09-30, record 48): a diffusion
  # read out by a turbo spin echo is diffusion-weighted as the EPI one is
  # [D1, MQ3, RP8].
  'technique:DWI-TSE':
    clauses:
      - {when: {axis: technique, is: 'DWI-TSE'}, cite: 'DWI-TSE', source: technique}
    set: {base: 'DWI'}
    confidence: 0.95
    why: 'the DWI-TSE technique implies a DWI base contrast'

  # MRI pack 0.13.0: a BOLD time series read out by a gradient-echo EPI is
  # T2*-weighted [MQ1, RP1] (dev-1: both BOLD stacks, Siemens `epfid`, were
  # settled T2*w and the rules left them empty). It reads the readout as
  # well as the technique, because spin-echo BOLD is T2-weighted [P1]: so it
  # is no constraint, and `hints.yml` keeps the usual case a hint.
  # MRI pack 0.14.0: and a BOLD series whose file states no readout at all
  # (Siemens `FMRI\NONE` written without ScanningSequence or a sequence
  # name), at an echo time a spin-echo BOLD does not use (dev-2: four
  # resting-state runs at TE 33 ms left empty, settled T2*w). A spin echo
  # stated keeps it out.
  'bold:gre_epi':
    clauses:
      - {when: {all: [{axis: technique, is: 'BOLD-EPI'}, is_gre_epi]}, cite: 'BOLD-EPI on a gradient-echo EPI', source: technique}
      - {when: {all: [{axis: technique, is: 'BOLD-EPI'}, {not: is_se_epi}, {not: has_se}, {field: echo_time, gt: 0}, {field: echo_time, lt: 50}]}, cite: 'BOLD-EPI with no spin echo stated, TE under 50 ms', source: technique}
    set: {base: 'T2starw'}
    confidence: 0.85
    why: 'a gradient-echo BOLD time series is T2*-weighted'

  # MRI pack 0.11.0: an ASL's M0 scan is the proton-density reference a CBF
  # quantification divides by, so it is PDw and not the perfusion weighting
  # of its technique [P20; both research reports of 2026-09-28]. Before the
  # ASL rule, which would take it.
  'construct:m0':
    clauses:
      - {when: {axis: construct, is: M0}, cite: 'an ASL M0 scan', source: construct}
    set: {base: 'PDw'}
    confidence: 0.95
    why: 'the M0 scan of an ASL is its proton-density reference'

  # [RP5, MQ2, D1, D2]
  'technique:ASL':
    clauses:
      - {when: {axis: technique, is: 'ASL'}, cite: 'ASL', source: technique}
    set: {base: 'PWI'}
    confidence: 0.95
    why: 'arterial spin labelling is perfusion-weighted imaging'

  # DSC, DCE and ASL are the three perfusion-weighted techniques [RP2, MQ2,
  # D3, P2]
  # MRI pack 0.18.0: a DSC image of one volume, written ORIGINAL, is a single
  # gradient-echo EPI and T2*-weighted; perfusion weighting needs the bolus
  # (the deep research, case 8; flags.yml, `single_volume_dsc`).
  'perfusion:single_volume':
    clauses:
      - {when: {all: [{axis: technique, is: 'Perfusion-EPI'}, single_volume_dsc]}, cite: 'one volume of a DSC EPI', source: technique}
    set: {base: 'T2starw'}
    confidence: 0.8
    why: 'one volume of a gradient-echo EPI carries no bolus: it is T2*-weighted'

  'technique:Perfusion-EPI':
    clauses:
      - {when: {axis: technique, is: 'Perfusion-EPI'}, cite: 'Perfusion-EPI', source: technique}
    set: {base: 'PWI'}
    confidence: 0.95
    why: 'a dynamic susceptibility contrast series is perfusion-weighted imaging'

  'technique:DCE':
    clauses:
      - {when: {axis: technique, is: 'DCE'}, cite: 'DCE', source: technique}
    set: {base: 'PWI'}
    confidence: 0.95
    why: 'a dynamic contrast enhanced series is perfusion-weighted imaging'

  # MRI pack 0.15.0, Nima's ruling N6 (2026-09-30, record 48, "N6 and N11
  # after the look-up"): a balanced steady-state scan (TrueFISP, FIESTA,
  # balanced FFE; CISS and FIESTA-C) is T2w, as a convention. Its contrast
  # is T2/T1: "Balanced-SSFP is certainly not a T2-weighted sequence"
  # (Scheffler and Lehnhardt 2003) [P52, P53]. Neither BIDS nor DICOM has a
  # T2/T1 term, and clinical use calls these scans (heavily) T2-weighted,
  # bright fluid; so here T2w stands for T2/T1, and the technique carries
  # the mechanism. Never T1w, which the echo-time window below gave every
  # one of them (dev-2: a GE `3D FIESTA` at TE 1.5 ms, settled T2w). Two
  # exceptions follow their own rules. A 2D balanced scan at a very low flip
  # angle, 10 degrees or less, is proton-density-like: its T2/T1 dependence
  # fades as the flip falls (Huang et al. 2002) [P54]. A magnetisation-
  # prepared one (an inversion or another preparation) is weighted as its
  # preparation decides, so these two rules leave it to the rules after
  # them. Neither is a constraint: both read flags as well as the technique.
  'balanced:low_flip_2d':
    clauses:
      - {when: {all: [{any: [{axis: technique, is: bSSFP}, {axis: technique, is: CISS}]}, is_2d, {not: has_ir}, {not: has_mag_prepared}, {field: flip_angle, gt: 0}, {field: flip_angle, le: 10}]}, cite: 'a 2D balanced steady state at a flip of 10 degrees or less', source: technique}
    set: {base: 'PDw'}
    confidence: 0.7
    why: 'a 2D balanced steady-state scan at a very low flip angle is proton-density-like (Huang et al. 2002)'

  'balanced:t2_over_t1':
    clauses:
      - {when: {all: [{any: [{axis: technique, is: bSSFP}, {axis: technique, is: CISS}]}, {not: has_ir}, {not: has_mag_prepared}]}, cite: 'a balanced steady state', source: technique}
    set: {base: 'T2w'}
    confidence: 0.85
    why: 'a balanced steady-state scan is T2w by convention: T2w stands for its T2/T1 contrast (Scheffler and Lehnhardt 2003), which no base value names'

  # ADC, eADC, FA, MD and trace images are computed from diffusion-weighted
  # acquisitions [D2, D5, MQ3, MQ4, T1, P3]. isoDWI is trace under another
  # name [MQ3, D2].
  'construct:diffusion':
    clauses:
      - {when: {any: [{axis: construct, is: ADC}, {axis: construct, is: eADC}, {axis: construct, is: FA}, {axis: construct, is: MD}, {axis: construct, is: Trace}, {axis: construct, is: isoDWI}]}, cite: 'a diffusion map', source: construct}
    set: {base: 'DWI'}
    confidence: 0.95
    why: 'ADC, eADC, FA, MD and trace images are computed from diffusion-weighted acquisitions'

  # Perfusion parameters, from DSC, DCE or ASL alike, so they say no
  # technique [D6, RP2, RP5, MQ2]
  'construct:perfusion':
    clauses:
      - {when: {any: [{axis: construct, is: CBF}, {axis: construct, is: CBV}, {axis: construct, is: MTT}, {axis: construct, is: Tmax}, {axis: construct, is: TTP}, {axis: construct, is: PBP}, {axis: construct, is: K2}, {axis: construct, is: DeltaM}]}, cite: 'a perfusion map', source: construct}
    set: {base: 'PWI'}
    confidence: 0.95
    why: 'CBF, CBV, MTT, Tmax and TTP are perfusion parameters, from DSC, DCE or ASL, and an ASL difference image is perfusion-weighted'

  # SWI, SWIp, SWAN, FSBB and BSI are the vendors' susceptibility-weighted
  # images [MQ5, RP6, P4]
  'construct:swi':
    clauses:
      - {when: {axis: construct, is: SWI}, cite: 'SWI', source: construct}
    set: {base: 'SWI'}
    confidence: 0.95
    why: 'a susceptibility-weighted image is base SWI'

  # Tier 2. Flags that settle the base on their own.
  'flag:dwi':
    clauses:
      - {flag: 'is_dwi', tier: exclusive}
      - {flag: 'has_adc', tier: exclusive}
      - {flag: 'has_fa', tier: exclusive}
      - {flag: 'has_trace', tier: exclusive}
    set: {base: 'DWI'}

  'flag:pwi':
    clauses:
      - {flag: 'is_perfusion', tier: exclusive}
      - {flag: 'is_asl', tier: exclusive}
      - {flag: 'has_cbf', tier: exclusive}
      - {flag: 'has_cbv', tier: exclusive}
      - {flag: 'has_mtt', tier: exclusive}
      - {flag: 'has_tmax', tier: exclusive}
      - {flag: 'has_ttp', tier: exclusive}
    set: {base: 'PWI'}

  'flag:swi':
    clauses:
      - {flag: 'is_swi', tier: exclusive}
      - {flag: 'has_swi', tier: exclusive}
    set: {base: 'SWI'}

  'flag:mtw':
    clauses:
      - {flag: 'has_mtc', tier: exclusive}
    set: {base: 'MTw'}

  'flag:synthetic_t1':
    clauses:
      - {flag: 'has_t1_synthetic', tier: exclusive}
    set: {base: 'T1w'}

  'flag:synthetic_t2':
    clauses:
      - {flag: 'has_t2_synthetic', tier: exclusive}
    set: {base: 'T2w'}

  'flag:synthetic_flair':
    clauses:
      - {flag: 'has_flair_synthetic', tier: exclusive}
    set: {base: 'T2w'}

  'flag:synthetic_pd':
    clauses:
      - {flag: 'has_pd_synthetic', tier: exclusive}
    set: {base: 'PDw'}

  'flag:synthetic_dir':
    clauses:
      - {when: {all: [is_dir, is_synthetic]}, cite: 'is_dir and is_synthetic', source: flags, tier: exclusive}
    set: {base: 'T2w'}

  'flag:synthetic_psir':
    clauses:
      - {when: {all: [has_psir, is_synthetic]}, cite: 'has_psir and is_synthetic', source: flags, tier: exclusive}
    set: {base: 'T1w'}

  'flag:t1_map':
    clauses:
      - {flag: has_t1_map, tier: exclusive}
      - {flag: has_r1, tier: exclusive}
    set: {base: 'T1w'}

  'flag:t2_map':
    clauses:
      - {flag: has_t2_map, tier: exclusive}
      - {flag: has_r2, tier: exclusive}
    set: {base: 'T2w'}

  # Pack 0.9.0: an inversion the construct did not name still has no base
