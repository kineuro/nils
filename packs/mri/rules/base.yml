  'flag:mp2rage_inversion':
    clauses:
      - {flag: is_mp2rage_inv1, tier: exclusive}
      - {flag: is_mp2rage_inv2, tier: exclusive}
    set: {base: null}
    why: 'an MP2RAGE inversion has no base contrast'

  'flag:mp2rage_uniform':
    clauses:
      - {flag: has_uniform, tier: exclusive}
      - {flag: is_uniform_denoised, tier: exclusive}
    set: {base: 'T1w'}

  # Tier 3. FLAIR can be T1 or T2 weighted; the text decides, then the echo time.
  # MRI pack 0.16.0: never on a dual-echo spin echo that only its name calls
  # FLAIR (flags.yml, `flair_named_dual_echo`, dev-4 H3).
  'flair:t1_text':
    clauses:
      - {when: {all: [{any: [is_flair, {text: search_text, substring: flair}]}, {not: flair_named_dual_echo}, {text: search_text, substring: t1}]}, cite: t1, source: text, tier: keywords}
    set: {base: 'T1w'}

  'flair:t2_text':
    clauses:
