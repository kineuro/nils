    set: {base: 'T1w'}

  # MRI pack 0.14.0: the same words, as `mtw_named` reads them, and not
  # where they switch it off (`MT=OFF`; dev-2: a 3D SPGR was MTw).
  'keywords:MTw':
    clauses:
      - {flag: mtw_named, tier: keywords}
    set: {base: 'MTw'}

  # MRI pack 0.14.0: a STIR the modifier axis found by its words, where no
  # word and no inversion time said a base, is T2-weighted as the window
  # below says for one with an inversion time (dev-2: a Philips MobiView
  # `STIR_TSE` with no inversion time left empty, settled T2w) [IM3, MQ12].
  'modifier:stir':
    clauses:
      - {when: {axis: modifier, is: STIR}, cite: 'a STIR', source: modifier}
    set: {base: 'T2w'}
    confidence: 0.75
    why: 'a short tau inversion recovery reads as T2-weighted'

  # Tier 6. The acquisition's own numbers. v0 tries inversion recovery first,
  # and guards the spin-echo and gradient-echo windows with `not has_epi`: an
  # echo-planar readout has its own timing and these windows do not describe
  # it. The comparisons are v0's, strict at both ends.
  #
  # Every window whose evidence is that a time is *small* also asks that the
  # time is a measurement at all. An echo time of zero is not a short echo
  # time: no readout has one, and a scanner that writes 0.0 is saying it has
  # nothing to say, which is what a flow study writes. An absent value
  # already fails a comparison; a zero one did not, and on a real archive
  # that turned one phase-contrast study into 297 anatomical T1w stacks at
  # 0.70, which is exactly the confidence that asks nobody. The same guard
  # is on the flair and dual-echo windows above and on the EPIMix route.

  'physics:ir_stir_like':
    clauses:
      - {when: {all: [has_ir, {field: inversion_time, gt: 0}, {field: inversion_time, lt: 300}]}, cite: 'an inversion time under 300 ms', source: physics, tier: physics}
    set: {base: 'T2w'}
    confidence: 0.75
    why: 'a short inversion time suppresses fat, which is a STIR and reads as T2-weighted'

  'physics:ir_standard':
    clauses:
      - {when: {all: [has_ir, {field: inversion_time, ge: 300}, {field: inversion_time, le: 1500}]}, cite: 'inversion time between 300 and 1500 ms', source: physics, tier: physics}
    set: {base: 'T1w'}
    confidence: 0.7

  'physics:se_t1w':
    clauses:
      - {when: {all: [has_se, {not: has_epi}, {field: repetition_time, gt: 0}, {field: repetition_time, lt: 1000}, {field: echo_time, gt: 0}, {field: echo_time, lt: 30}]}, cite: 'a short repetition and echo time', source: physics, tier: physics}
    set: {base: 'T1w'}
    confidence: 0.7

  'physics:se_t2w':
    clauses:
      - {when: {all: [has_se, {not: has_epi}, {field: repetition_time, gt: 2000}, {field: echo_time, gt: 50}]}, cite: 'a long repetition and echo time', source: physics, tier: physics}
    set: {base: 'T2w'}
    confidence: 0.7

  'physics:se_pdw':
    clauses:
      - {when: {all: [has_se, {not: has_epi}, {field: repetition_time, gt: 2000}, {field: echo_time, gt: 0}, {field: echo_time, lt: 30}]}, cite: 'a long repetition and a short echo time', source: physics, tier: physics}
    set: {base: 'PDw'}
    confidence: 0.65

  # MRI pack 0.15.0: a gradient echo at a long repetition time, a low flip
  # and an echo time of 12 ms or more is T2*-weighted: the long TR and the
  # low flip leave little T1 weighting, and the echo time lets T2* decay set
  # the contrast. GE's GRASS and MPGR hemorrhage protocols run at TR 500 to
  # 900 ms, flip 20 to 25 degrees and TE 15 to 30 ms (dev-3: two GE `Ax GRE`
  # at TE 15 ms, flip 20, TR 500, left empty between the two windows and
  # settled T2*w; the window below starts above 15 ms) [P8, MQ8].
  # MRI pack 0.18.0: a spin echo with an echo time of 80 ms or more is
  # T2-weighted at any repetition time: a fast-recovery or respiratory-
  # triggered one states a short TR (sealed-1 A7: a 3D fast-recovery FSE
  # left without a base).
  'physics:se_long_te':
    clauses:
      - {when: {all: [has_se, {not: has_epi}, {field: echo_time, ge: 80}]}, cite: 'an echo time of 80 ms or more', source: physics, tier: physics}
    set: {base: 'T2w'}
    confidence: 0.7

  'physics:gre_t2starw_long_tr':
    clauses:
      - {when: {all: [has_gre, {not: has_epi}, {not: has_ir}, {field: repetition_time, ge: 200}, {field: flip_angle, gt: 0}, {field: flip_angle, le: 30}, {field: echo_time, ge: 12}]}, cite: 'a flip of 30 degrees or less at a repetition time of 200 ms or more, and an echo time of 12 ms or more', source: physics, tier: physics}
    set: {base: 'T2starw'}
    confidence: 0.7

  # MRI pack 0.14.0: a spoiled gradient echo flipped 10 degrees or less at a
  # repetition time of 20 ms or more is well under the Ernst angle of brain
  # tissue, so proton density and not T1 sets its contrast: a
  # multi-parameter mapping protocol's PD-weighted echo is FA 5 to 6 at TR
  # about 25, its T1-weighted one FA 20 or more [P51]. Never an
  # inversion-prepared one (dev-2: a GE 3D SPGR at FA 10, TR 35, the MT-off
  # partner of an MT pair, settled PDw; the rules said T1w by its echo time).
  'physics:gre_pdw':
    clauses:
      - {when: {all: [has_gre, {not: has_epi}, {not: has_ir}, {field: flip_angle, gt: 0}, {field: flip_angle, le: 10}, {field: repetition_time, ge: 20}, {field: echo_time, gt: 0}, {field: echo_time, lt: 10}]}, cite: 'a flip of 10 degrees or less at a repetition time of 20 ms or more', source: physics, tier: physics}
    set: {base: 'PDw'}
    confidence: 0.65

  'physics:gre_t1w':
    clauses:
      - {when: {all: [has_gre, {not: has_epi}, {field: echo_time, gt: 0}, {field: echo_time, lt: 10}]}, cite: 'a very short echo time', source: physics, tier: physics}
    set: {base: 'T1w'}
    confidence: 0.7

  'physics:gre_t2starw':
    clauses:
      - {when: {all: [has_gre, {not: has_epi}, {field: echo_time, gt: 15}]}, cite: 'a long echo time on a gradient echo', source: physics, tier: physics}
    set: {base: 'T2starw'}
