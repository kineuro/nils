#
# What is not classified at all, transcribed from v0 0.5.3
# `classification/pipeline.py` (its first act) and `core/context.py`.
#
# v0 returns an excluded result before any detector runs, so an excluded stack
# carries no axis at all rather than an answer nobody should read. This rule
# set runs first and decides every axis, most of them to nothing. What it rules
# out is what is not an image of a person: a screen capture and an error map.

rule_set: excluded
decides: [directory_type, base, technique, modifier, construct, quality, provenance, body_part, post_contrast]

# MRI pack 0.12.0, Nima's ruling (2026-09-28): a workstation reformat, tagged
# SECONDARY and never PRIMARY, is no longer ruled out here. It is classified
# on every axis as any stack is (provenance ProjectionDerived, construct MPR,
# MIP or MinIP as its header says, and the technique, base, modifier and
# post-contrast of its source), and the disposition marks it `reformat`
# (rules/disposition.yml), which is what a pipeline reads to skip it. Ruling
# it out left every axis of 193 of dev-1's 900 stacks empty, the largest
# error group of that reference (890 cells).
order: [screenshot, error_map]

rules:

  screenshot:
    clauses:
      - {flag: is_screenshot, tier: exclusive}
    set: &blank
      directory_type: excluded
      base: null
      technique: null
      modifier: null
      construct: null
      quality: null
      provenance: null
      body_part: null
      post_contrast: null

  error_map:
    clauses:
      - {flag: is_error, tier: exclusive}
    set: *blank
