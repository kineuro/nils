# SPDX-License-Identifier: AGPL-3.0-only
#
# The SWI route, transcribed from v0 0.5.3 `classification/branches/swi.py`.
#
# One acquisition, seven outputs. The processed image and its projections
# are base SWI, the magnitude T2*w and the phase none (pack 0.9.0). A route is a rule set with an entry condition;
# nothing else distinguishes it (spec section 6.5).
#
# The order is the knowledge, not the plumbing: QSM is tried LAST, because one
# vendor stamps `psd/QSM/me` into the description of every output of the
# acquisition, so `qsm` in the text says nothing until the specific output
# labels have been ruled out.
#
# This route was the C11 prototype's second criterion, and it matched v0 on
# all 17,054 stacks it routes (spikes/pack/README.md).

rule_set: swi
enter_when: {axis: provenance, is: SWIRecon}
decides: [base, construct, technique, directory_type, provenance]
# Pack 0.9.0, Nima's ruling (2026-09-28): the acquisition's own images, its
# magnitude and its phase, are RawRecon, and its minimum intensity projection
# is ProjectionDerived; what the scanner computed from them (the SWI image,
# QSM, an R2* map, a MIP) keeps SWIRecon. The route was entered on
# SWIRecon, so it decides the provenance again for those outputs. Pack
# 0.12.0: a reformat is ProjectionDerived too, and the real part RawRecon.
redecides: [provenance]
tiers: {exclusive: 0.95, keywords: 0.9, stated: 0.9}

# MRI pack 0.12.0: every output keeps the construct ND where its image type
# says it (`ND`, not distortion corrected), as the SyMRI route's do since
# 0.11.0: the reading guide takes ND off the image type whatever else the
# image is, and dev-1 settled ND beside SWI on two stacks the route had
# written SWI alone.

# Every output of one acquisition shares its readout.
derive:
  swi_technique:
    axis: technique
    cases:
      # MRI pack 0.11.0: a gradient-echo EPI SWI (Siemens `epfid3d`, Philips
      # FEEPI SWIp) is GRE-EPI, as its readout is anywhere else.
      - {when: is_gre_epi, value: GRE-EPI}
      - {when: has_epi, value: EPI}
      # MRI pack 0.12.0: a series split by echo is a multi-echo gradient
      # echo, as the technique axis reads it anywhere else (dev-1 settled
      # ME-GRE on the two SWI stacks where the axis said so and the route
      # GRE). A spoiled GRE is not told apart here: dev-1's panel said GRE on
      # seven SWI stacks and SP-GRE on four where the axis said SP-GRE.
      - {when: {all: [is_multi_echo, has_gre]}, value: ME-GRE}
      - {when: has_gre, value: GRE}
      - {when: {text: search_text, any_substring: [epi, 3depi]}, value: EPI}
      - {value: GRE}

order: [minip, mip, phase, real, swi, projection, r2star, magnitude, qsm_source_echo, qsm, mpr, fallback]

rules:

  minip:
    clauses:
      - {flag: is_minip, tier: exclusive}
      - {keywords: [minip, 'min ip'], tier: keywords}
    set:
      # A projection through the volume, as any other minIP is (pack 0.9.0);
      # its base is still SWI.
      provenance: ProjectionDerived
      base: SWI
      construct:
        - MinIP
        # The echo-combined output of a multi-echo susceptibility
        # acquisition, whichever of the route's outputs it is: 1,084 of the
        # 1,154 stacks that carry `MEAN` are SWI, MinIP, MIP or magnitude
        # images of one, so this is where the identity has to be said.
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.95
    why: 'a minimum intensity projection of the SWI: the venogram'

  mip:
    clauses:
      - {flag: is_mip, tier: exclusive}
      - {when: {all: [{text: search_text, substring: mip}, {not: {text: search_text, substring: minip}}]}, cite: mip, source: text, tier: keywords}
    set:
      base: SWI
      construct:
        - MIP
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.9

  # The normalizer expands pha and phs to phase, so a GE PHS output lands
  # here. A QSM token beats a bare P token: DERIVED\PRIMARY\QSM\P is a map.
  phase:
    clauses:
      - {when: {all: [has_phase, {not: has_magnitude}, {not: has_qsm}]}, cite: has_phase, source: flags, tier: exclusive}
      - {when: {all: [{text: search_text, substring: phase}, {not: {text: search_text, substring: magnitude}}, {not: has_qsm}]}, cite: phase, source: text, tier: keywords}
    set:
      # The acquisition's own phase image: RawRecon, and no base contrast
      # (pack 0.9.0). An echo-combined phase is computed, and keeps SWIRecon.
      provenance: [{value: RawRecon, when: {not: is_mean}}]
      base: null
      construct:
        - Phase
        - {value: QSM, when: {text: search_text, substring: qsm}}
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.9

  # MRI pack 0.12.0: the real part of the complex signal, which Philips
  # writes beside the magnitude and the phase of its SWIp (`R_FFE`): an
  # image of the acquisition as the magnitude is, RawRecon and T2*w, with
  # construct Real, where the route called it the SWI image (dev-1, one
  # stack, three cells).
  real:
    clauses:
      - {when: {all: [has_real, {not: has_swi}, {not: has_phase}]}, cite: 'has_real without a SWI token', source: flags, tier: exclusive}
    set:
      provenance: [{value: RawRecon, when: {not: is_mean}}]
      base: T2starw
      construct:
        - Real
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.85

  swi:
    clauses:
      - {flag: has_swi, tier: exclusive}
    set:
      base: SWI
      construct:
        - SWI
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.9

  projection:
    clauses:
      - {flag: is_projection, tier: exclusive}
    set:
      base: SWI
      construct:
        - SWI
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.8

  r2star:
    clauses:
      - {flag: has_r2star, tier: exclusive}
      - {keywords: [r2star], tier: keywords}
    set:
      base: SWI
      construct:
        - {value: QSM, when: {any: [has_qsm, {text: search_text, substring: qsm}]}}
        - R2starmap
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.9

  magnitude:
    clauses:
      - {when: {all: [has_magnitude, {not: has_swi}]}, cite: 'has_magnitude without a SWI token', source: flags, tier: exclusive}
      - {keywords: [magnitude], tier: keywords}
    set:
      # The acquisition's own magnitude image: RawRecon and T2*-weighted, a
      # gradient echo with a long echo time [P8, MQ5] (pack 0.9.0). An
      # echo-combined magnitude is computed, and keeps SWIRecon.
      provenance: [{value: RawRecon, when: {not: is_mean}}]
      base: T2starw
      # MRI pack 0.12.0: a magnitude is not a QSM map because the protocol
      # is named for one (dev-1: a multi-echo magnitude named QSM was
      # Magnitude and QSM); a source echo of a QSM acquisition is the rule
      # below, `qsm_source_echo`, and the map itself `qsm`.
      construct:
        - Magnitude
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.85

  # Multi-echo source data from a QSM acquisition: an acquisition-style name
  # rather than a short output label, and no QSM token.
  qsm_source_echo:
    clauses:
      - when:
          all:
            - {not: has_qsm}
            - {text: search_text, substring: qsm}
            - {text: search_text, any_substring: ['10te', '8te', '6te', '5te', '4te', '3te']}
            - {text: search_text, substring: psd}
        cite: 'a multi-echo QSM source'
        source: text
        tier: keywords
    set:
      # The echoes as acquired, as the magnitude above (pack 0.9.0).
      provenance: [{value: RawRecon, when: {not: is_mean}}]
      base: T2starw
      construct:
        - Magnitude
        - QSM
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.8

  qsm:
    clauses:
      - {flag: has_qsm, tier: exclusive}
      - {keywords: [qsm], tier: keywords}
    set:
      base: SWI
      construct:
        - QSM
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.95

  # A plane the console resliced from the acquisition, whose image type says
  # MPR and names none of the outputs above. It is a reformat as every other
  # MPR is, and the route's last resort called 375 of them the processed
  # SWI image (record 41).
  # MRI pack 0.12.0: a plane resliced from a susceptibility acquisition is
  # ProjectionDerived, as any reformat made from another series is (the
  # reading guide), and not SWIRecon (dev-1: two EPI SWI reformats).
  mpr:
    clauses:
      - {flag: is_mpr, tier: exclusive}
    set:
      provenance: ProjectionDerived
      base: SWI
      construct:
        - MPR
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.9

  fallback:
    clauses:
      - {when: true, cite: SWIRecon, source: provenance}
    set:
      base: SWI
      construct:
        - SWI
        - {value: EchoCombined, when: is_mean}
        - {value: ND, when: has_nd}
      technique: {from: swi_technique}
      directory_type: anat
    confidence: 0.7
    why: 'an SWI acquisition whose output type is unclear is the processed image'
