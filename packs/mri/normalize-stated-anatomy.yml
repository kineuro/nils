#
# The stated anatomy text: `BodyPartExamined` alone, folded and tokenized as
# `anatomy_text` is, with nothing dropped (spec section 6.4).
#
# The file states a body part, but it is written from the exam's
# registration and not from the series, so it says the same thing on every
# series of an exam: five scanner protocols had a brain protocol in exams
# registered as a spine, where every series said spine, and spinal series in
# exams registered as a brain (record 41). The body-part rules read it after
# the series' own words and its coil, never ahead of them.

normalize: stated_anatomy_text
from:
  - text_body_part

# `VERTEBRALCRANIUM` is Philips' body part for its neuro exam cards, spine
# and brain alike, and not one of DICOM's defined terms for Body Part
# Examined (source D7). It names no part: on the archive it stood on 1,090
# stacks, whose own words said a spine on 669 and a brain on 8, and the rest
# held brain protocols (a 3D FLAIR, a DIR, surveys centred on the root of
# the nose) beside spinal ones. Read as a stated body part, its `vertebral`
# made every one of them a spine. So it is dropped here and says nothing:
# the series' own words, the coil or the geometry decide, or nothing does
# (2026-09-27).
token_removals: ['vertebralcranium']

# As in `normalize-anatomy.yml`: the French for neck, spelled as a word so
# that no keyword has to be three letters long.
token_replacements:
  'cou': 'neck'
