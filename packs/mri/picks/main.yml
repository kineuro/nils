# SPDX-License-Identifier: AGPL-3.0-only
#
# Which stack stands for a session's role
# (`docs/specs/wave3-anonymize-and-bids.md`, section 10).
#
# Every number here is v0's, from `qc/cohort_main/main_qc_weights.yaml`, whose
# own header says "edit this file to tune the auto-pick algorithm, no code
# change required". It is carried rather than reinvented. What changed is where
# it lives, that each component is named in the answer, and that a tie is
# reported instead of settled by whichever row the database returned first.
#
# The number that makes any of this necessary: 82.5 percent of the archive's
# sessions that hold a T1w hold more than one, and the worst holds 462.

pick: main
# Record 51 R8: `t2w` joins the two v0 knew. A role is scored on tables of its
# own (R7), and the pack refuses to load a role that has none.
roles: [t1w, flair, t2w]

# Two stacks of one acquisition are one candidate, so that the two echoes of a
# series do not compete with each other for the session. v0's stage-1 bundle
# key, name for name; `orientation` and the timing are fields of the
# fingerprint rather than axes, which is the only difference.
same_acquisition:
  - body_part
  - orientation
  - base
  - mr_acquisition_type
  - technique
  - modifier
  - construct
  - directory_type
  - post_contrast
  - echo_time
  - repetition_time
  - inversion_time
  - flip_angle

# And one acquisition that produced several images is merged back into one
# candidate, one family per kind of acquisition that writes several (record
# 51: v0 carried two preferences, and the pack before 0.17.0 carried only the
# Dixon one). A stack belongs to the first family whose token it holds.
family:
  # A Dixon gives an in-phase, an out-of-phase, a water and a fat image;
  # without this they compete with each other four ways.
  - name: dixon
    when: {of: modifier, token: Dixon}
    over: construct
    # The outputs of one Dixon may differ slightly in timing, which is v0's
    # reason for dropping it from the family key.
    ignoring: [echo_time, repetition_time, inversion_time, flip_angle]
    # Best first. A family holding neither is not a candidate at all: v0 drops
    # it, and its comment says why, which is that a Dixon with no in-phase and
    # no water image is not a T1w anybody measures on.
    canonical: [InPhase, Water]
    # v0's `retake_dixon_canonical`: more than one stack of the canonical
    # output is the acquisition run twice.
    retake_above: 1
  # An MP2RAGE gives two inversions and the uniform image, often denoised
  # too. v0's `mp2rage_canonical_priority` is "Denoised,Uniform" and then
  # "Uniform", which this pack names UniformDenoised and Uniform.
  - name: mp2rage
    when: {of: technique, token: MP2RAGE}
    over: construct
    ignoring: [echo_time, repetition_time, inversion_time, flip_angle]
    canonical: [UniformDenoised, Uniform]
    # v0: where neither is labelled, "tag all (cohort with bare MP2RAGE, no
    # labeled sister)", so the acquisitions stand apart as they were.
    without_canonical: apart
    # v0's `retake_mp2rage`: more than two.
    retake_above: 2

components:

  # v0's `dim_score`. 3D outright, and 2D at 0.85 less 0.30 times the share of
  # the population that is 3D: what a 2D acquisition means depends on what else
  # was available at the time, so it scores well in an all-2D cohort and poorly
  # beside 3D.
  - name: dim
    weight: 0.18
    kind: choice
    of: mr_acquisition_type
    scores: {'3D': 1.0, '2D': 0.85}
    missing: 0.40
    crowded_by: {value: '3D', by: 0.30}

  # v0's `technique_tiers`, per role, because a TSE is a poor T1w and a good
  # FLAIR. The two bonuses are its `dixon_tier_bonus` and
  # `waterexc_tier_bonus`, and the Dixon one keeps its condition.
  - name: tech
    weight: 0.15
    kind: tier
    of: technique
    missing: 0.30
    per_role:
      t1w:
        MPRAGE: 1.00
        MP2RAGE: 1.00
        SPACE: 0.85
        VIBE: 0.85
        FLASH: 0.70
        FSPGR: 0.70
        TurboFLASH: 0.65
        GRE: 0.55
        SE: 0.50
        TIRM: 0.45
        TSE: 0.40
        FIESTA: 0.40
        CISS: 0.40
        Unknown: 0.30
      flair:
        SPACE: 1.00
        TSE: 0.90
        TIRM: 0.75
        GRASE: 0.65
        RESOLVE: 0.50
        Unknown: 0.40
      # Record 51 R8, and ours, not v0's (v0 had no T2w role). Drafted from
      # what the analyses that read a T2w take and from the development
      # corpus: of its 124 T2w candidates under this pack, 65 are TSE, 30
      # TIRM (a STIR), 21 RESTORE, 3 SPACE, 2 MRF and one each CISS, GRASE
      # and HASTE. A 3D turbo spin echo first, because FreeSurfer's pial
      # refinement and SAMSEG want an isotropic volume; then the 2D turbo
      # spin echo nearly every protocol runs and its fast-recovery variant;
      # the single-shot and the inversion-recovery ones lower, because
      # neither is the T2w a volume analysis measures on. A balanced steady
      # state is T2w by this pack's convention (0.15.0) and is T2/T1, so it
      # sits at the floor with what the table does not name.
      t2w:
        SPACE: 1.00
        TSE: 0.90
        RESTORE: 0.80
        GRASE: 0.65
        MESE: 0.55
        SE: 0.50
        HASTE: 0.45
        TIRM: 0.40
        CISS: 0.30
        FIESTA: 0.30
        Unknown: 0.30
    bonuses:
      - of: modifier
        token: Dixon
        amount: 0.10
        needs: {of: construct, any: [InPhase, Water]}
      - of: modifier
        token: WaterExc
        amount: 0.05

  # v0's `modifier_score`: additive on a neutral half. MT-prep is usually for
  # a TOF and not a main T1w; a Dixon FLAIR is rare and usually not the
  # canonical one.
  - name: mod
    weight: 0.12
    kind: tokens
    of: modifier
    base: 0.5
    per_role:
      t1w:
        Dixon: 0.20
        WaterExc: 0.15
        MT: -0.05
        PreScanNorm: 0.05
      flair:
        Dixon: -0.10
        WaterExc: -0.05
      # Ours (record 51 R8). A fat-suppressed T2w is a good one for lesions
      # and a poorer one for the volume analyses that read a T2w beside a
      # T1w; a Dixon T2w is rare and usually not the canonical one, as v0
      # says of a FLAIR.
      t2w:
        Dixon: -0.10
        FatSat: -0.05

  # Where this volume's slice count falls among the population's, in its own
  # dimension bucket: a 2D stack is not short for being 2D.
  - name: slices
    weight: 0.20
    kind: percentile
    of: n_instances
    population: slices
    split_by: mr_acquisition_type
    missing: 0.40
    unknown: 0.60

  - name: fov
    weight: 0.10
    kind: percentile
    of: fov_x
    population: fov
    missing: 0.40
    unknown: 0.60

  # How common this technique is. The floor is what stops a rare-but-good
  # acquisition being buried, and the `when_bonus` row is v0's deliberate
  # statement that a Dixon or a water-excitation bundle is a good acquisition
  # even where it is rare.
  - name: share
    weight: 0.15
    kind: share
    of: technique
    tops_out: 0.50
    share_coef: 0.70
    floor_coef: 0.30
    floor_value: 0.50
    when_bonus: {share_coef: 0.40, floor_coef: 0.60, floor_value: 0.85}

  - name: orient
    weight: 0.05
    kind: present
    of: [image_orientation_patient]
    base: 0.40
    each: 0.60

  - name: complete
    weight: 0.05
    kind: present
    of: [n_instances, fov_x]
    base: 0.50
    each: 0.25

# v0's EPIMix penalty, whose comment says it "is allowed as a fallback but
# never preferred when RawRecon is available". A multiplier and not a
# component, because that is what never preferred means: no amount of slices
# buys it back.
penalty:
  of: provenance
  # MRI pack 0.18.0: NeuroMix, a provenance of its own since, takes the same.
  by_value: {EPIMix: 0.5, NeuroMix: 0.5}

borders:
  # v0's `runner_up_within_pct`. At or under this the order between the top
  # two is noise, and the answer says so instead of the first row quietly
  # winning. `within` includes the number itself, which is the one threshold
  # here that does.
  runner_up_within: 0.05
  # v0's `rare_technique_share`: the pick is the best of what is here and
  # unlike what the rest of the population did, which usually means the
  # protocol changed or the session is missing its real one. `below` is
  # strictly below: a technique held by exactly a tenth of the population is
  # not rare.
  rare_within: {of: technique, share_below: 0.10}

  # Record 51 R6: v0's other six reasons, each as v0's `_pick_for_session`
  # computed it at 5ee391f and each with v0's number from
  # `border_thresholds`. A pack that leaves one out never raises it.

  # v0's `retake`: the winner holds more than one stack of one acquisition.
  # v0's partial-volume demotion is read first: where the largest slice
  # count is at least `partial_min_slices`, a stack under `partial_below` of
  # it is a helper or an aborted scan and not a second take ("a 170 vs 40
  # gap is caught; 192 vs 168 is not"). A family's candidate is a retake by
  # its family's `retake_above` instead.
  retake: {of: n_instances, partial_below: 0.50, partial_min_slices: 60}
  # v0's `unknown_dim`: the winner's dimension is not known.
  unknown_dim: {of: mr_acquisition_type}
  # v0's `slice_count_outlier` (`slice_pctile_lo`, `slice_pctile_hi`): the
  # winner's largest slice count strictly outside the 5th to 95th percentile
  # of its dimension's population, the one the `slices` component builds.
  slice_outlier: {population: slices, below: 0.05, above: 0.95}
  # v0's `pre_post_twin_pct`: another candidate at least this fraction of
  # the winner's score, whose contrast shares nothing with the winner's.
  # v0 also made the twin a main; here it is a border, and a person picks.
  pre_post_twin: {of: post_contrast, at_least: 0.85}
  # v0's `epimix_fallback`: a stack of the winner is an EPIMix, which the
  # penalty above lets win only where nothing better was taken. MRI pack
  # 0.19.0 (record 53, pack contract 8): or a NeuroMix, which pack 0.18.0
  # took apart from EPIMix and the penalty already reads.
  fallback: {of: provenance, is: [EPIMix, NeuroMix]}
  # v0's `dixon_vs_plain_pct`: a Dixon won and a candidate that is neither
  # a Dixon nor water-excited is within a tenth of it, the tenth included.
  dixon_vs_plain: {family: dixon, of: modifier, plain_without: [Dixon, WaterExc], within: 0.10}
