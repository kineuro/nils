      - all: [{field: repetition_time, ge: 1360}, {field: repetition_time, lt: 1420}, {field: inversion_time, ge: 508}, {field: inversion_time, le: 762}]
      - all: [{field: repetition_time, ge: 1420}, {field: repetition_time, lt: 1480}, {field: inversion_time, ge: 528}, {field: inversion_time, le: 792}]
      - all: [{field: repetition_time, ge: 1480}, {field: repetition_time, lt: 1540}, {field: inversion_time, ge: 547}, {field: inversion_time, le: 821}]
      - all: [{field: repetition_time, ge: 1540}, {field: repetition_time, lt: 1600}, {field: inversion_time, ge: 567}, {field: inversion_time, le: 850}]
      - all: [{field: repetition_time, ge: 1600}, {field: repetition_time, lt: 1670}, {field: inversion_time, ge: 588}, {field: inversion_time, le: 881}]
