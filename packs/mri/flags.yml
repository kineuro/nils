  # An inversion-recovery spin echo whose short inversion time is far from
  # that null: IR, whatever its words or GE's `T1FLAIR_GEMS` say (on the
  # archive, 559 such stacks stored FLAIR move to IR and 106 to FLAIR).
  ir_far_from_csf_null:
    all:
      - has_ir
      - has_se
      - {not: has_gre}
      - {not: is_mdme}
      - {not: synthetic_or_map}
      - {not: is_dir}
      - {field: repetition_time, gt: 0}
      - {field: inversion_time, ge: 300}
      - {field: inversion_time, lt: 1400}
      - {not: ti_near_csf_null}
