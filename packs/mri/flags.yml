      - all: [{field: repetition_time, ge: 6210}, {field: repetition_time, lt: 6690}, {field: inversion_time, ge: 1636}, {field: inversion_time, le: 2454}]
      - all: [{field: repetition_time, ge: 6690}, {field: repetition_time, lt: 7240}, {field: inversion_time, ge: 1701}, {field: inversion_time, le: 2552}]
      - all: [{field: repetition_time, ge: 7240}, {field: repetition_time, lt: 7900}, {field: inversion_time, ge: 1769}, {field: inversion_time, le: 2653}]
      - all: [{field: repetition_time, ge: 7900}, {field: repetition_time, lt: 8700}, {field: inversion_time, ge: 1840}, {field: inversion_time, le: 2759}]
      - all: [{field: repetition_time, ge: 8700}, {field: repetition_time, lt: 9720}, {field: inversion_time, ge: 1913}, {field: inversion_time, le: 2870}]
      - all: [{field: repetition_time, ge: 9720}, {field: repetition_time, lt: 11130}, {field: inversion_time, ge: 1990}, {field: inversion_time, le: 2985}]
      - all: [{field: repetition_time, ge: 11130}, {field: repetition_time, lt: 13370}, {field: inversion_time, ge: 2072}, {field: inversion_time, le: 3108}]
      - all: [{field: repetition_time, ge: 13370}, {field: repetition_time, lt: 16000}, {field: inversion_time, ge: 2138}, {field: inversion_time, le: 3207}]
  # An inversion-recovery spin echo whose short inversion time is far from
  # that null: IR, whatever its words or GE's `T1FLAIR_GEMS` say (on the
  # archive, 559 such stacks stored FLAIR move to IR and 106 to FLAIR).
  ir_far_from_csf_null:
    all:
      - has_ir
      - has_se
      - {not: has_gre}
      - {not: is_mdme}
      - {not: synthetic_or_map}
      - {not: is_dir}
      - {field: repetition_time, gt: 0}
      - {field: inversion_time, ge: 300}
      - {field: inversion_time, lt: 1400}
      - {not: ti_near_csf_null}
      # MRI pack 0.21.0: GE's `T1FLAIR_GEMS` overrides the null (record 48,
      # conflict 3).
      - {not: scan_options.has_t1flair_gems}

  # === MRI pack 0.18.0: the values the vocabulary lacked ====================
  # Nima, 2026-09-30: "if we need to add something just do it. we cannot
  # force things to category they don't belong to." The deep research names
  # each as missing; `empirical-conventions.md` counts them.

  # --- technique MRS (case 16): a spectroscopy acquisition as GE writes it,
  # a few MR images of the PROBE result, never a planning series or a
  # localizer.
  # Read from the technique's text: GE's exam protocol that names a
  # spectroscopy would otherwise make every short series of the exam MRS.
  # MRI pack 0.19.0: or, first, an MR Spectroscopy Storage object, whatever
  # it is named (case 16, record 53 S1): its SOP class is the one statement
  # a planning image named for a spectrum cannot make.
  is_mrs:
    any:
      - mrs_object
      - all:
          - {text: technique_text, matches: '(^|[^a-z])(probe\s*-?\s*(sv|p|s|press|steam)?|spectroscopy|svs|csi|mrs|mrsi)([^a-z]|$)|(single|singel|singe) ?voxel'}
          - {field: n_instances, gt: 0}
          - {field: n_instances, le: 16}
          - {not: {text: search_text, matches: 'locali[sz]er|scout|survey|(^|[^a-z])(loc|plan|planning)([^a-z]|$)'}}
  mrs_object: {text: sop_class_uid, equals: '1.2.840.10008.5.1.4.1.1.4.2'}

  # --- technique ZTE (case 29): GE's `Silenz` pulse sequence, Siemens'
  # PETRA, or GE's Silent MRA by its words. Never a silent PROPELLER or a
  # silent FSE, which are quiet turbo spin echoes.
  is_zte:
    any:
      - {text: ge_pulse_sequence_name, matches: '^\s*silen'}
      - {text: technique_text, matches: '(^|[^a-z])(zte|petra|silenz)([^a-z]|$)'}
      - silent_mra_named

  # --- technique CE-MRA (cases 2 and 33): a 3D gradient echo that is an
  # angiography given contrast, or a time-resolved angiography (always
  # contrast), or GE's `VASCTOF_GEMS` where the TOF reading does not hold
  # and no SPGR name says otherwise. Never a series whose words say TOF or
  # inflow, and never a phase contrast.
  ce_mra_words: {text: technique_text, matches: '(^|[^a-z])(ce\s*-?\s*mra|cemra|tricks|twist|trak|4d\s*-?\s*mra|time\s*-?\s*resolved|bolus\s*chase|smartprep|care\s*bolus|fluoro\s*-?\s*trig)'}
  is_ce_mra:
    all:
      - is_3d
      - has_gre
      - {not: has_epi}
      - {not: has_se}
      - {not: is_pc}
      # nor a TOF the header states, an ASL (a non-contrast 4D MRA) or a
      # DCE run (a TWIST-VIBE)
      - {not: sequence_name.is_tof}
      - {not: sequence_variant.is_tof}
      - {not: scan_options.has_inflow_gems}
      - {not: philips_inflow_named}
      - {not: is_asl}
      - {not: asl_words}
      - {not: dce_words}
      - {not: {text: technique_text, matches: 'vibe'}}
      # `tof` anywhere, as the TOF value's own keyword reads it (`3DTOF`)
      - {not: {text: technique_text, matches: 'tof|time of flight|inflow'}}
      - any:
          - ce_mra_words
          - all:
              - {text: technique_text, matches: '(^|[^a-z])(mra|angio|angiography)'}
              - any: [contrast_said, {text: technique_text, matches: '(^|[^a-z])ce([^a-z]|$)'}]
          - all: [scan_options.has_tof_gems, {not: ge_vasctof_as_tof}, {not: ge_spgr_named}]

  # --- construct PBP and K2 (case 17): by Siemens' tokens or the name.
  pbp_stated:
    any:
      - image_type.has_peak_bolus
      - {text: technique_text, matches: '(^|[^a-z])pbp([^a-z]|$)|percentage of baseline'}
  # The words only on a map `perfusion_map_named` takes (no ASL, no stated
  # readout other than EPI, no time series): a bare `K2` or `leakage` says
  # nothing on any other series.
  k2_stated:
    all:
      - any:
          - image_type.has_k2
          - image_type.has_leakage
          - all:
              - {text: technique_text, matches: '(^|[^a-z])k2([^a-z0-9]|$)|leakage'}
              - perfusion_map_named
      - {not: is_asl}

  # --- construct Velocity (case 19): a phase contrast's velocity image,
  # where its image type or its words say velocity.
  velocity_image:
    all:
      - is_pc
      # MRI pack 0.20.0: not GE's Inhance 3D Velocity, whose product name
      # says velocity on every image (dev-5's A11).
      - {not: ge_inhance_velocity}
      - {not: has_magnitude}
      - {not: {text: technique_text, matches: '(^|[^a-z])(magn|mag|magnitude)([^a-z]|$)'}}
      - any:
          - {parser: image_type, any_token: [VELOCITY, VEL, VELOCITY_MAP]}
          - {text: technique_text, matches: '(^|[^a-z])(velocity|vel|venc)([^a-z]|$)'}

  # === 16. MRI pack 0.19.0 (record 53): the enhanced object's mechanism =====
  # The deep research's case 22 (PS3.3 C.8.13.4, the MR Pulse Sequence
  # module): an enhanced MR or MR spectroscopy object says how it was
  # acquired in attributes a classic image never writes, which the
  # fingerprint carries since record 53 S1. They are the most mechanism
  # specific field there is, so each reaches the flag the technique axis
  # already reads (`has_se`, `has_gre`, `has_epi`, `is_tse`, `is_space`,
  # `is_haste`, `is_se_epi`, `is_gre_epi`, `is_tof`, `is_pc`, `is_asl`,
  # `is_ssfp`, `is_psif`, `is_fisp`, `has_spoiled`, `is_radial`,
  # `is_spiral`, `has_ir`) and GRASE's own. A classic image has none of them,
  # so nothing here holds on one and its reading is unchanged. The table:
  #   EPI YES + SPIN -> SE-EPI; EPI YES + GRADIENT -> GRE-EPI;
  #   BOTH + EPI -> GRASE; SPIN + MSE YES + FULL -> SS-TSE;
  #   SPIN + MSE YES + 3D -> 3D-TSE; SPIN + MSE YES -> TSE;
  #   SPIN + MSE NO -> SE; GRADIENT + FREE_PRECESSION -> bSSFP;
  #   TRANSVERSE -> SS-GRE; TIME_REVERSED -> SSFP; LONGITUDINAL or
  #   spoiled -> SP-GRE; TOF YES -> TOF-MRA; PC YES -> PC-MRA;
  #   ASL present -> ASL; RADIAL or SPIRAL -> the modifiers.
  # A text is read lower-cased.
  mech_spin: {text: echo_pulse_sequence, equals: spin}
  mech_gradient: {text: echo_pulse_sequence, equals: gradient}
  mech_both: {text: echo_pulse_sequence, equals: both}
  mech_epi: {text: echo_planar_pulse_sequence, equals: 'yes'}
  mech_train: {text: multiple_spin_echo, equals: 'yes'}
  mech_single_shot: {text: segmented_k_space_traversal, equals: full}
  mech_se_epi: {all: [mech_spin, mech_epi]}
  mech_gre_epi: {all: [mech_gradient, mech_epi]}
  mech_grase: {all: [mech_both, mech_epi]}
  mech_ss_tse: {all: [mech_spin, mech_train, mech_single_shot, {not: mech_epi}]}
  mech_3d_tse: {all: [mech_spin, mech_train, is_3d, {not: mech_single_shot}, {not: mech_epi}]}
  mech_tse: {all: [mech_spin, mech_train, {not: mech_epi}]}
  mech_bssfp: {all: [mech_gradient, {text: steady_state_pulse_sequence, equals: free_precession}]}
  mech_ss_gre: {all: [mech_gradient, {text: steady_state_pulse_sequence, equals: transverse}]}
  mech_ssfp: {all: [mech_gradient, {text: steady_state_pulse_sequence, equals: time_reversed}]}
  mech_spoiled:
    all:
      - mech_gradient
      - {not: mech_epi}
      - any:
          - {text: steady_state_pulse_sequence, equals: longitudinal}
          - {text: spoiling, matches: '^(rf|gradient|rf_and_gradient)$'}
  mech_tof: {text: time_of_flight_contrast, equals: 'yes'}
  mech_pc: {text: phase_contrast, equals: 'yes'}
  mech_asl: {text: arterial_spin_labeling_contrast, matches: '^(continuous|pseudocontinuous|pulsed)$'}
  mech_radial: {text: geometry_of_k_space_traversal, equals: radial}
  mech_spiral: {text: geometry_of_k_space_traversal, equals: spiral}
  mech_ir: {text: inversion_recovery, equals: 'yes'}

  # === 17. MRI pack 0.20.0: dev-5's nine disputes and its rule bugs ==========
  # The nine disputes of dev-5's grade, as record 48 rules them by the deep
  # research ("The nine dev-5 disputes, by the deep research";
  # `studies/2026-09-30-dev5-reference/deep-research-disputes.md`, cases 1 to
  # 9), checked against the archive's counts (`empirical-disputes.md` there),
  # and the rule-bug groups A1 to A11 of dev-5's grade (`grade.md`, part 2),
  # in the design repository. Fixed here and graded on a later fresh read,
  # never on dev-5. Every corpus stack is invented from the pattern those
  # files name.

  # --- case 5, outside the SWI route: a Siemens MEAN phase or magnitude of
  # a multi-echo gradient echo (`fl2d8`: 8 of the archive's 11 MEAN phases,
  # and 51 MEAN magnitudes) is its echoes combined, comb-ME-GRE, as the route
  # says of an SWI's: a mean over echoes is an echo combination (the deep
  # research's header rule for case 5, P or M with MEAN; record 48).
  siemens_mean_echoes:
    all:
      - {text: manufacturer, prefix: siemens}
      - is_mean
      - has_gre
      - {not: has_epi}
      - {not: has_swi}
      - {not: is_mip}
      - {not: is_minip}
      - {not: is_projection}
      - any: [has_phase, has_magnitude]
      - any: [{field: echo_train_length, ge: 2}, me_gre_named]
  # comb-ME-GRE's combination: Philips' combined mFFE (pack 0.14.0) and a
  # Siemens MEAN phase or magnitude over echoes.
  combined_echoes_stated: {any: [philips_mffe, siemens_mean_echoes]}

  # --- case 1: a Philips FFE. What the scanner states decides, never the
  # name: the enhanced module's Spoiling (0018,9016) where it is written,
  # then Philips' scanning technique (2001,1020) where present (`T1FFE` is
  # SP-GRE, `FFE` SS-GRE, whatever SequenceVariant says), then
  # SequenceVariant (SP is SP-GRE, SS is SS-GRE; OSP or NONE alone says
  # nothing of spoiling and stays GRE). "T1W" in a name describes the
  # contrast and never makes a spoiled gradient echo. The archive's counts
  # (`empirical-disputes.md`, case 1): SequenceVariant carries SP on 1,318
  # of 1,363 `T1FFE` stacks and on none of 1,465 `FFE`; OSP stands in for
  # either on 170, where the private technique still tells; 328 of the 362
  # T1-named single-echo FFEs are private `FFE`. Multi-echo, balanced, turbo
  # and magnetisation-prepared FFEs are decided before this.
  philips_ffe:
    all:
      - {text: manufacturer, prefix: philips}
      - any: [image_type.hint_gre, scanning_sequence.has_gre, mech_gradient,
              {text: philips_scanning_technique, matches: '^(t1ffe|ffe)$'}]
      - {not: has_epi}
      - {not: has_mag_prepared}
      - {not: philips_balanced}
      - {not: philips_tfe}
      - {not: philips_t2ffe}
  philips_ffe_technique: {text: philips_scanning_technique, matches: '^ffe$'}
  philips_ffe_steady_state:
    all:
      - philips_ffe
      - {not: mech_spoiled}
      - any:
          - {text: spoiling, equals: none}
          - philips_ffe_technique
          - all:
              - {not: philips_t1ffe}
              - {not: sequence_variant.has_spoiled}
              - sequence_variant.has_steady_state
  # SS-GRE's combination: GE's steady states (pack 0.15.0 and 0.18.0) and
  # Philips' FFE (case 1).
  ss_gre_by_vendor: {any: [ge_steady_state_gre, philips_ffe_steady_state]}

  # --- case 2: a Philips SWIp image of a multi-echo acquisition written one
  # image per slice (`SW_M`, `SW_P`; the archive's 272 have echo time 0 and
  # 4 or 6 echoes) combines its echoes: comb-ME-GRE. The per-echo images
  # beside it (echo numbers set) stay ME-GRE.
  philips_swip_combined:
    all:
      - {text: manufacturer, prefix: philips}
      - {parser: image_type, any_token: [SW_M, SW_P, SW_M_FFE, SW_P_FFE]}
      - {not: has_epi}
      - {not: is_multi_echo}
      - {not: {text: echo_numbers, matches: '^\s*([2-9]|1[0-9])\s*$'}}
      - {field: n_instances, le: {field: n_slices}}
      # MRI pack 0.21.0: the echo count from (2001,xx14) where it is written,
      # the train only where it is not (record 48, conventions round 3).
      - any:
          - philips_several_echoes
          - all: [{not: philips_echoes_stated}, {field: echo_train_length, ge: 2}]

  # --- case 3: a Siemens inversion recovery written ORIGINAL whose
  # ImageType states R (the real part) is phase-sensitive: modifier PSIR,
  # construct Real. The archive's 573 such stacks carry no PSIR token; the
  # 19 named PSIR or TrueIR have the same fields as the 554 unnamed, so R is
  # the mark (`empirical-disputes.md`, case 3). A reformat of one keeps the
  # R and follows its source, as the counts note of the 59 there. Its
  # magnitude keeps IR or FLAIR by its TI.
  siemens_real_ir:
    all:
      - {text: manufacturer, prefix: siemens}
      - has_ir
      - has_real
      - {not: has_phase}
      - {not: has_magnitude}

  # --- case 4: the ADC or eADC of a Siemens or Philips multi-direction
  # DTI is a tensor's output, DTIRecon, by the acquisition: named DTI,
  # tensor, `mddw` (Siemens' multi-directional diffusion weighting) or by six
  # or more directions, or six or more directions stated on the map. Neither
  # make writes an MD output beside it (`empirical-disputes.md`, case 4: 0
  # of 507). GE writes its tensor's mean diffusivity apart (`AvDC`, beside
  # 317 of 1,470 multi-direction ADCs), so GE's ADC keeps ruling 7
  # (RawRecon) and its AvDC is DTIRecon with MD. An FA sibling is the
  # session's, which one stack does not see.
  tensor_source_named:
    all:
      - {not: {text: manufacturer, prefix: ge}}
      - any:
          - dti_words
          - {text: technique_text, matches: '(^|[^a-z])mddw([^a-z]|$)'}
          - {text: technique_text, matches: '(^|[^0-9])([6-9]|[1-9][0-9]{1,2}) ?(dir|dirs|directions|riktningar)([^a-z]|$)'}
          - {field: dwi_directions, ge: 6}
          # MRI pack 0.21.0: or a bare count of six or more in a Siemens
          # diffusion name (dev-6's A10, section 18).
          - siemens_diffusion_count_named

  # MRI pack 0.23.0: case 4 by the session (`passes/session_dti.yml`; dev-8:
  # a Philips `dADC iso` beside its source `MB2Sense2 DTI opt16 tra DWI
  # iso`). What a sibling shows of a tensor acquisition, by its header
  # alone: an FA (the FA sibling of DR4), or a name for a tensor, mddw or six
  # or more directions.
  tensor_source_sibling:
    any:
      - image_type.has_fa
      - dti_words
      - {text: technique_text, matches: '(^|[^a-z])mddw([^a-z]|$)'}
      - {text: technique_text, matches: '(^|[^0-9])([6-9]|[1-9][0-9]{1,2}) ?(dir|dirs|directions|riktningar)([^a-z]|$)'}
  # A plain DWI acquisition beside a map: an original diffusion image or a
  # series named for a diffusion, which is no tensor, no map and not the
  # isotropic image (Philips writes that as a series of its own, `isoDWI`).
  plain_dwi_source_sibling:
    all:
      - {not: tensor_source_sibling}
      - {not: image_type.has_adc}
      - {not: image_type.has_eadc}
      - {not: image_type.has_trace}
      - {not: {text: search_text, matches: '(^|[^a-z])(adc|eadc|dadc|fa|trace|tracew|iso|isotropic|exp)([^a-z]|$)'}}
      - any:
          - all: [image_type.is_original, image_type.has_diffusion]
          - {text: search_text, matches: '(^|[^a-z])(dwi|diff|diffusion)'}
  # A diffusion named for fewer than six directions: Siemens' three-scan
  # trace, or a count of one to five.
  few_directions_named: {text: technique_text, matches: '(^|[^a-z0-9])3 ?scan|(^|[^0-9])[1-5] ?(dir|dirs|directions|riktningar)([^a-z]|$)'}

  # --- case 6: a planning series of at most 5 slices per plane named for
  # planning (a localizer word, or loc, plan, mid-line, align, 3-plane) is a
  # localizer; few slices without such a word are not (the archive's 175
  # few-slice T1 spin echoes named T1 are acquisitions).
  planning_few_slices:
    all:
      - {field: n_slices, gt: 0}
      - {field: n_slices, le: 5}
      - {not: is_derived}
      - {not: is_mip}
      - {not: is_projection}
      - {text: technique_text, matches: '(^|[^a-z])(loc|plan|planning|mid ?-? ?line|align|3 ?-? ?plane|tri ?-? ?plane)([^a-z]|$)'}
  localizer_by_shape: {any: [is_tri_plane_scout, planning_few_slices, survey_swedish]}

  # --- case 7: a b=0 EPI run of a few volumes named by a phase-encoding
  # direction (PA beside AP diffusions) is a reversed-phase reference,
  # FieldmapRef, not a b=0 diffusion image. The whole series is b=0 (one
  # stack, no positive b value); the archive's 1,125 such runs have 1 to 4
  # volumes, 749 of them beside a reversed partner by the header. The pack
  # reads one stack, so the partner is not checked; a run without a
  # direction or field-map word stays a b=0 diffusion image.
  b0_reversed_pe_reference:
    all:
      - has_epi
      - {not: has_positive_b_value}
      - {field: stacks_in_series, eq: 1}
      - {not: is_derived}
      - {not: is_asl}
      - {not: is_perfusion}
      - {not: is_sbref}
      - {not: is_swi}
      - any:
          - {text: dwi_b_values, matches: '^[\s0.,\\]+$'}
          - {field: diffusion_b_value, eq: 0}
      - any: [is_dwi, {text: technique_text, matches: '(^|[^a-z])(b0|b ?= ?0|diff|dwi|dti)([^a-z]|$)'}]
      - fieldmap_ref_words
      - any: [{not: pe_sign_stated}, pe_name_agrees_with_sign]
  # Where the Siemens CSA sign gives the run's own direction (the registry's
  # `dwi_pe_direction` from geometry), the name's direction must be it: on
  # the archive's 18 runs whose name says reversed, the sign equals the
  # partner's, and those are no FieldmapRef (record 48, "The nine, after our
  # counts"). Whether the partner runs the other way is the session's.
  pe_sign_stated: {text: dwi_pe_direction_source, equals: geometry}
  pe_name_agrees_with_sign:
    any:
      - all: [{text: dwi_pe_direction, equals: pa}, {text: technique_text, matches: '(^|[^a-z])pa([^a-z]|$)'}]
      - all: [{text: dwi_pe_direction, equals: ap}, {text: technique_text, matches: '(^|[^a-z])ap([^a-z]|$)'}]
      - all: [{text: dwi_pe_direction, equals: rl}, {text: technique_text, matches: '(^|[^a-z])rl([^a-z]|$)'}]
      - all: [{text: dwi_pe_direction, equals: lr}, {text: technique_text, matches: '(^|[^a-z])lr([^a-z]|$)'}]

  # --- case 9: a derived motion-corrected DSC run is the acquisition's
  # series registered, not a perfusion map: RawRecon with MoCo. Only the
  # maps are PerfusionRecon; the "derived MoCo DSC" clauses of packs 0.10.0
  # and 0.18.0 are withdrawn (`perfusion_recon_extra` above, and the
  # provenance axis).

  # --- A2: a Siemens Dixon or in/opposed-phase FLASH with no Dixon token in
  # its image type, told by its name and its echo time at its field: fat and
  # water are in phase at about 4.6 ms (1.5 T) and 2.3 ms (3 T) and their
  # multiples, opposed half way between.
  siemens_in_opp_named:
    all:
      - {text: manufacturer, prefix: siemens}
      - has_gre
      - {not: has_epi}
      - {not: has_in_phase}
      - {not: has_out_phase}
      - {not: has_water}
      - {not: has_fat}
      - {text: technique_text, matches: 'dixon|(^|[^a-z])(in ?-? ?opp|in ?-? ?out|opp ?-? ?ph|opposed)'}
  te_in_phase:
    any:
      - all: [{field: field_strength_normalized, ge: 1.4}, {field: field_strength_normalized, le: 1.6},
              {any: [{all: [{field: echo_time, ge: 4.2}, {field: echo_time, le: 5.2}]},
                     {all: [{field: echo_time, ge: 8.8}, {field: echo_time, le: 9.8}]}]}]
      - all: [{field: field_strength_normalized, ge: 2.8}, {field: field_strength_normalized, le: 3.2},
              {any: [{all: [{field: echo_time, ge: 2.1}, {field: echo_time, le: 2.6}]},
                     {all: [{field: echo_time, ge: 4.4}, {field: echo_time, le: 5.0}]}]}]
  te_opposed_phase:
    any:
      - all: [{field: field_strength_normalized, ge: 1.4}, {field: field_strength_normalized, le: 1.6},
              {any: [{all: [{field: echo_time, ge: 1.9}, {field: echo_time, le: 2.7}]},
                     {all: [{field: echo_time, ge: 6.5}, {field: echo_time, le: 7.4}]}]}]
      - all: [{field: field_strength_normalized, ge: 2.8}, {field: field_strength_normalized, le: 3.2},
              {any: [{all: [{field: echo_time, ge: 1.0}, {field: echo_time, le: 1.4}]},
                     {all: [{field: echo_time, ge: 3.2}, {field: echo_time, le: 3.9}]}]}]
  siemens_in_phase_echo: {all: [siemens_in_opp_named, te_in_phase]}
  siemens_opposed_phase_echo: {all: [siemens_in_opp_named, te_opposed_phase]}

  # --- A4: FLAIR from a name that the physics rules out: no inversion
  # stated and a repetition time under 1,000 ms (a T1 VISTA reformat that
  # reuses a FLAIR protocol's name).
  flair_named_not_inverted:
    all:
      - {field: repetition_time, gt: 0}
      - {field: repetition_time, lt: 1000}
      - {not: has_ir}
      - {not: is_flair}

  # --- A6: GE research mode (ScanningSequence RM). A spin echo whose flip is
  # not written, with an echo train of 3 or more at an echo time of 30 ms or
  # more and no gradient-echo word, is a spin echo as `ge_research_se` says
  # of one with its flip; a series named for a gradient echo is one.
  ge_research_se_train:
    all:
      - {text: manufacturer, prefix: ge}
      - scanning_sequence.has_research
      - {not: scanning_sequence.has_gre}
      - {not: scanning_sequence.has_epi}
      - {not: has_positive_b_value}
      - {not: is_time_series}
      - {not: {text: technique_text, matches: 'epi|diff|dwi|dti|swi|swan|asl|perf|bold|fmri|probe|spectro|gradient-echo|spgr|grass|fiesta|(^|[^a-z])(gre|fgre|ffe|bravo|tof)([^a-z]|$)'}}
      - {any: [{field: flip_angle, present: false}, {field: flip_angle, eq: 0}]}
      - {field: echo_train_length, ge: 3}
      - {field: echo_time, ge: 30}
  ge_research_gre_named:
    all:
      - {text: manufacturer, prefix: ge}
      - scanning_sequence.has_research
      - {not: scanning_sequence.has_se}
      - {not: scanning_sequence.has_epi}
      - {text: technique_text, matches: 'gradient-echo|spgr|fspgr|grass|mpgr|(^|[^a-z])(gre|fgre|bravo)([^a-z]|$)'}
      - {not: {text: technique_text, matches: '(^|[^a-z])(fse|frfse|ssfse|spin-echo|se|epi)([^a-z]|$)'}}

  # --- A7: the b=0 (T2-weighted) output of GE's DTI processing on a header
  # a toolkit rewrote with numbers ("MCT2w", "T2w-MC-"), or any such header
  # that states six or more diffusion directions, is a diffusion image.
  ge_numeric_dti_output:
    all:
      - ge_numeric_header
      - any:
          - {text: technique_text, matches: '(^|[^a-z])(mc ?-? ?t2w?|t2w? ?-? ?mc)([^a-z]|[0-9]|$)'}
          - {field: dwi_directions, ge: 6}

  # --- beside the nine (record 48, "The nine, after our counts"): a Philips
  # multi-echo FFE written one echo per stack, split by echo or with an echo
  # number of 2 or more, is its echoes kept apart, ME-GRE; comb-ME-GRE is
  # only the combined image. A single-echo FFE named mFFE or T2* is not
  # combined either. Pack 0.18.0 gave comb-ME-GRE to about 1,036 per-echo
  # stacks and 164 single-echo ones by the name `mffe`
  # (`empirical-disputes.md`, beside the nine). An echo-1 stack of a series
  # whose other echoes are in other series cannot tell itself from the
  # combined image; the session can.
  philips_per_echo_ffe:
    all:
      - philips_ffe
      - any:
          - is_multi_echo
          - {text: echo_numbers, matches: '^\s*([2-9]|1[0-9])\s*$'}
  philips_single_echo_ffe:
    all:
      - philips_ffe
      - {not: is_multi_echo}
      # MRI pack 0.21.0: (2001,xx14) counts the echo images a series holds,
      # and a merged mFFE writes 1 there beside a train of 5 (156 archive
      # stacks), so one echo acquired is still read from the train here.
      - {field: echo_train_length, present: true}
      - {field: echo_train_length, le: 1}
      - {not: philips_several_echoes}
  philips_not_combined_ffe: {any: [philips_per_echo_ffe, philips_single_echo_ffe]}

  # --- A8: a Siemens gradient-echo sequence name outranks a turbo spin
  # echo's letters inside another word (`tse` in "hjärtsekvens", which the
  # keyword finds as a substring). A whole word still counts.
  tse_letters_inside_a_word_on_gre_stem:
    all:
      - sequence_name.is_gre_stem
      - {text: technique_text, matches: 'tse|fse'}
      - {not: {text: technique_text, matches: '(^|[^a-z])(tse|fse|turbo ?spin|fast ?spin|turbo se|fast se)([^a-z]|$)'}}

  # --- A9: Siemens names the minimum intensity projection of its SWI
  # `mIP_Images` in mixed case; `MIP` is the maximum.
  minip_mixed_case: {text_raw: text_series_description, matches: '(^|[^A-Za-z])mIP([^A-Za-z]|$)'}

  # --- A10: a Philips survey named in Swedish, `ÖSIKT` (översikt), which
  # the normalizer spells `sikt`.
  # Read from the series' own words, never GE's exam-level ProtocolName.
  survey_swedish: {text: technique_text, matches: '(^|[^a-z])sikt([^a-z]|$)'}

  # --- A11: GE Inhance 3D Velocity, named so, is a phase contrast whatever
  # `IFLOW_GEMS` says; Inhance with no velocity word stays inflow (TOF). Its
  # product name is no velocity image.
  # MRI pack 0.21.0: or by its pulse sequence, `Inh-Vel`, and the encoding
  # velocity in its name (`Inhance VENC=60`).
  ge_inhance_velocity:
    all:
      - {text: manufacturer, prefix: ge}
      - any:
          - all:
              - {text: technique_text, matches: 'inhance'}
              - {text: technique_text, matches: '(^|[^a-z])(velocity|vel|venc|pc|phase contrast)([^a-z]|$)'}
          - {text: ge_pulse_sequence_name, matches: '^inh-?vel'}

  # === 18. MRI pack 0.21.0: conventions round 3 ==============================
  # Record 48, "Conventions, round 3" and "The four round-3 conflicts"
  # (Nima, 2026-10-01), from the deep research's 40 cases
  # (`studies/2026-10-01-conventions-r3/deep-research-r3.md`) and our
  # archive's counts for them (`empirical.md` there), in the design
  # repository. Every corpus stack is invented from the pattern those files
  # name (`corpus/axes-0210.yml`).

  # --- localizers: a vendor's flag outranks the slice count. GE writes
  # SeriesPlane (0019,xx17) 256 on a three-plane localizer (dcm2niix's GE
  # README), Siemens names its AutoAlign scouts `AAHead_Scout` (and
  # `AutoAlign Scout`, `AASpine_Scout`), their MPRs among them (Localizer
  # with construct MPR); with
  # ImageType LOCALIZER, SCOUT or POSDISP these are localizers whatever
  # their slice count (case 6).
  ge_three_plane_localizer:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: ge_series_plane, matches: '^\s*256(\.0*)?\s*$'}
  siemens_autoalign_scout:
    all:
      - {text: manufacturer, prefix: siemens}
      - any:
          - {text: text_series_description, matches: '(^|[^a-z])(aa[a-z]*[ _-]?scout|autoalign)'}
          - {text: text_protocol_name, matches: '(^|[^a-z])(aa[a-z]*[ _-]?scout|autoalign)'}
  # The other makers' automatic planning scouts are the same product as
  # AutoAlign under their own names, and the name is the vendor's protocol,
  # not the site's: Philips' SmartExam survey (`SmartBrain`, 3D, about 100
  # slices) and GE's READYBrain (`3D Ready Brain localizer`).
  vendor_auto_scout:
    any:
      - siemens_autoalign_scout
      - all: [{text: manufacturer, prefix: philips}, smart_survey]
      - all: [{text: manufacturer, prefix: ge}, {text: technique_text, matches: 'ready ?brain'}]
  # A series the header shows split into planes, each a stack, and named for
  # planning is a three-plane localizer by the scanner's own geometry, which
  # is what GE's SeriesPlane 256 states (Siemens' and Philips' localizers of
  # 6 to 19 slices a plane, GE's of up to 20 before its series plane is read).
  tri_plane_planning: {field: split_reason, eq: multi_orientation}
  vendor_localizer_flag: {any: [is_localizer, tri_plane_planning]}
  # The slice-count rule (record 48, dev-5's case 6, and the research's
  # order) for a series no vendor flag marks: a planning word makes a
  # localizer only of at most 5 slices a plane; more is a series named for
  # planning and read as what it is. A composite of survey stations stays
  # one whatever its slices (case 1, below).
  planning_word_too_many_slices:
    all:
      - {field: n_slices, gt: 5}
      - {not: vendor_localizer_flag}
      - {not: stitched_composite}

  # --- composites (conflict 1): a stitched image of several acquisitions or
  # stations (Philips MobiView, Siemens Inline Composing `COMPOSED`,
  # `COMP_AD`, `COMP_SP` and their kin) is computed from other series:
  # provenance ProjectionDerived with construct Composed, the Siemens
  # ORIGINAL notwithstanding; a composite of survey stations is a
  # Localizer. Siemens' `MULTIECHOCOMBINED` is no stitching and stays out.
  composite_token: {parser: image_type, any_token: [COMPOSED, COMPOSITE, COMP_AD, COMP_SP, COMP_AN, COMP_AD_N, COMP_MIP]}
  stitched_composite: {any: [composite_token, composed_named]}

  # --- MRI pack 0.22.0 (dev-7): an image the scanner typed LOCALIZER or
  # SCOUT whose ScanningSequence states a plain gradient echo (no EP, no
  # SE) is read by that readout: a diffusion word in its name, or a Philips
  # private technique carried from the series it plans, names another
  # series' technique (a SmartPlan image `dADC iso`, GR, TR 3 ms).
  typed_localizer_gre:
    all:
      - any: [image_type.is_localizer, image_type.is_scout]
      - scanning_sequence.has_gre
      - {not: scanning_sequence.has_epi}
      - {not: scanning_sequence.has_se}

  # --- Philips `MAXIMUM` (case 2): a projection only where the geometry
  # shows one, at most 3 slices or a slab of 10 mm or more; the archive's
  # 157 are whole 3D volumes of 30 to 200 contiguous slices, none named MIP,
  # so none. The pack compares numbers and does no arithmetic, so the
  # research's "three times the source thickness" is the slab's own.
  maximum_projection:
    all:
      - image_type.has_maximum
      - any: [{field: n_slices, le: 3}, {field: slice_thickness, ge: 10}]

  # --- Siemens 3D-card outputs (case 3): each image by its own ImageType,
  # whatever its series is named. A `CSA MPR` image in a series named MIP is
  # a reformat, MPR; a `CSA MIP` one in a series named MPR a MIP (409
  # archive stacks were MIP by the name).
  csa_mpr_image:
    all:
      - {parser: image_type, substring: 'CSA MPR'}
      - {not: {parser: image_type, substring: 'CSA MIP'}}
  # A composite whose stations are no survey, by its words: the survey
  # words of MobiView's rule (pack 0.18.0) and the localizer words.
  composite_not_survey:
    all:
      - stitched_composite
      - {not: {text: search_text, matches: 'survey|scout|locali[sz]er|(^|[^a-z])(loc|sikt)([^a-z]|$)|smartbrain'}}

  # --- Siemens `STDDEV_TIME` (case 4): the voxelwise standard deviation over
  # the measurements, a temporal map and no spatial projection: construct
  # StdDevTime. `STDDEV_SAG`, `_COR` and `_TRA` stay StdDevProj.
  stddev_time: {parser: image_type, any_token: [STDDEV_TIME, STDDEV]}

  # --- phase contrast (case 5). GE's `VASCPC_GEMS` and its phase-contrast
  # pulse sequences (`2dphcon`, `3dphcon`) are a phase contrast, as Philips'
  # `PCA` token already is (dev-6's A6: a GE 2D PC read as a plain gradient
  # echo). GE's Inhance 3D Velocity by its pulse sequence (`Inh-Vel`).
  ge_phase_contrast:
    all:
      - {text: manufacturer, prefix: ge}
      - any:
          - {parser: scan_options, token: VASCPC_GEMS}
          - {text: ge_pulse_sequence_name, matches: '^[23]d ?phcon|^inh-?vel'}
  # Philips' outputs, by their tokens: `M_PCA` the magnitude, `VELOCITY MAP`
  # with `P` the velocity (Velocity, pack 0.18.0), a `PROJECTION` a MIP, and
  # a `PCA` image that is none of these the phase-contrast angiogram, the
  # speed image (construct Speed).
  pc_magnitude_image: {all: [{text: manufacturer, prefix: philips}, {parser: image_type, token: M_PCA}]}
  pc_projection_image:
    all:
      - {text: manufacturer, prefix: philips}
      - {parser: image_type, token: PCA}
      - image_type.is_projection_image
  pc_speed_image:
    all:
      - {text: manufacturer, prefix: philips}
      - {parser: image_type, token: PCA}
      - {not: {parser: image_type, any_token: [M_PCA, P, PHASE, VELOCITY, VEL, VELOCITY_MAP]}}
      - {not: image_type.is_projection_image}
  # GE's `COLLAPSE` of a 2D phase contrast is the thick slab's combined-flow
  # image as acquired: RawRecon, no construct; a 3D one is a MIP.
  ge_pc_2d_collapse:
    all:
      - {text: manufacturer, prefix: ge}
      - ge_phase_contrast
      - {parser: image_type, token: COLLAPSE}
      - {text: mr_acquisition_type, equals: 2d}

  # --- calibration scans (case 7): a coil-sensitivity, receive-field or
  # prescan reference, by its name (GE's ASSET, ARC and PURE calibrations,
  # `ge_calibration` of pack 0.13.0, are all 899 such archive stacks), never
  # an image computed from others: provenance Calibration, base none. Not
  # meant for reading.
  calibration_scan:
    all:
      - {not: image_type.is_derived}
      - any:
          - ge_calibration
          - {text: technique_text, matches: '(^|[^a-z])(calibration|kalibrering|cal|coil ?sens(itivity)?|prescan)([^a-z0-9]|$)'}

  # --- the gradient-echo family (cases 8 and 9). GE: `fgre` without SP in
  # SequenceVariant is the fast GRASS, SS-GRE; `fspgr` the fast spoiled one,
  # as is an `efgre3d` with SP; an `efgre3d` without SP states no spoiling,
  # GRE. `FAST_GEMS` and `EDR_GEMS` say nothing of spoiling. Siemens `fl` is
  # SP-GRE whatever SequenceVariant says (`is_flash`, pack 0.10.0).
  ge_psd_unspoiled_fgre:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: ge_pulse_sequence_name, matches: '^fgre'}
      - {not: has_spoiled}
  ge_psd_fast_spoiled:
    all:
      - {text: manufacturer, prefix: ge}
      - any:
          - {text: ge_pulse_sequence_name, matches: 'fspgr'}
          - all: [{text: ge_pulse_sequence_name, matches: 'efgre3d'}, has_spoiled]
          - all: [{text: ge_pulse_sequence_name, matches: '^fgre'}, has_spoiled]
  ge_psd_efgre3d_unspoiled:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: ge_pulse_sequence_name, matches: 'efgre3d$|^efgre3d'}
      - {not: has_spoiled}

  # --- Dixon (case 10). Philips' scanning technique (2001,xx20) says TSE or
  # FFE, never ScanningSequence `GR` on an mDixon TSE: a Dixon part (W, F,
  # IP, OP) whose private technique is a spin echo, or which has none and is
  # named TSE with a train, is a turbo spin echo (14 archive stacks written
  # GR: the water images were T2*w and the in-phase images T1w at TE 108
  # ms, a misread no constraint showed).
  philips_dixon_part:
    all:
      - {text: manufacturer, prefix: philips}
      - any: [has_water, has_fat, has_in_phase, has_out_phase]
  philips_dixon_tse:
    all:
      - philips_dixon_part
      - any:
          - {text: philips_scanning_technique, matches: '^(tse|se|irtse|ir-tse|ir)$'}
          - all:
              - {not: {text: philips_scanning_technique, matches: '.'}}
              - {text: technique_text, matches: '(^|[^a-z])(tse|turbo spin)([^a-z]|$)'}
              - {field: echo_train_length, ge: 2}
  # Siemens' Dixon parts (`DIXON` with `IN_PHASE`, `OPP_PHASE`, `WATER`,
  # `FAT`) are a spoiled gradient echo, VI-GRE where the product is VIBE by
  # its name, never a multi-echo one (the Dixon modifier records the
  # echoes): 1,077 archive stacks were plain GRE.
  siemens_dixon_gre:
    all:
      - {text: manufacturer, prefix: siemens}
      - image_type.has_dixon
      - has_gre
      - {not: has_se}
      - {not: has_epi}

  # --- Philips' echo count (case 12) is (2001,xx14) where it is written; the
  # echo train length of a turbo field echo is its shot, not its echoes.
  philips_echoes_stated: {text: philips_number_of_echoes, matches: '^\s*[0-9]+\s*$'}
  philips_several_echoes: {text: philips_number_of_echoes, matches: '^\s*([2-9]|1[0-9])\s*$'}

  # --- Philips 3D T1 TFE (case 17): with the enhanced module's
  # InversionRecovery NO and no inversion time it is a turbo field echo,
  # FSP-GRE, not an MPRAGE; YES or a TI makes it one. A classic object
  # states neither and keeps its reading.
  philips_tfe_no_inversion:
    all:
      - philips_tfe
      - {text: inversion_recovery, equals: 'no'}
      - {not: {field: inversion_time, gt: 0}}

  # --- GE Silent MRA (case 18): no construct, its ASL token included.
  silent_mra_output: {all: [{text: manufacturer, prefix: ge}, {text: ge_pulse_sequence_name, matches: '^silen'}]}

  # --- GE's private image type (0043,xx2F): 1 is the phase (dcm2niix's GE
  # README). Its 2 and 3 are not read: our counts show 2 on every newer
  # PROPELLER image (case 21: no Real) and on MAGiC and diffusion maps, and
  # 3 on SWAN's computed outputs.
  ge_private_phase:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: ge_private_image_type, matches: '^\s*1\s*$'}

  # --- a real or imaginary spin-echo component without PSIR evidence has no
  # base (case 24): its intensity follows the receiver phase, not a weighting.
  se_component_no_psir:
    all:
      - any: [has_real, has_imaginary]
      - has_se
      - {not: has_ir}
      - {not: has_psir}
      - {not: {text: search_text, matches: 'psir|true ?ir|phase sensitive'}}

  # --- diffusion (case 26): a Philips "Reg - " copy is the registered
  # (motion-corrected) diffusion series, RawRecon with MoCo.
  philips_registered_copy:
    all:
      - {text: manufacturer, prefix: philips}
      - {text: text_series_description, matches: '^\s*reg\s*-'}

  # --- multi-shot diffusion EPI (case 27): GE MUSE by its pulse sequence or
  # name, Philips IRIS by its name, beside RESOLVE.
  ms_epi_stated:
    all:
      - is_dwi
      - any:
          - {text: ge_pulse_sequence_name, matches: 'muse'}
          - {text: technique_text, matches: '(^|[^a-z])(muse|iris)([^a-z]|$)'}

  # --- GE fast recovery (conflict 2): `FR_GEMS` decides the 90-degree
  # flip-back TSE, VFA-TSE, a PROPELLER's too (with Radial); an inversion
  # (`IR_GEMS` or a TI) is IR-TSE first; an FRFSE pulse sequence or name
  # without `FR_GEMS` is a plain TSE (GE disables fast recovery itself at a
  # long TR, Edmonson et al. 2012).
  ge_fast_recovery:
    all:
      - {text: manufacturer, prefix: ge}
      - {parser: scan_options, token: FR_GEMS}
      - {not: scan_options.has_ir_gems}
      - {not: {field: inversion_time, gt: 0}}
  ge_no_fast_recovery:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: scan_options, matches: '[a-z]'}
      - {not: {parser: scan_options, token: FR_GEMS}}

  # --- dev-6's rule bugs (`studies/2026-10-01-dev6-reference/grade.md`,
  # part 2, groups A1 to A10).
  # A1: an acquired echo of a susceptibility acquisition carries no
  # Magnitude construct (ruling N7): Philips' per-echo `M_FFE` images of a
  # SWIp, and an image GE writes ORIGINAL with no output prefix and no
  # magnitude token.
  philips_swi_acquired_echo:
    all:
      - {text: manufacturer, prefix: philips}
      - image_type.is_original
      - {parser: image_type, token: M_FFE}
      - {not: has_swi}
  swi_plain_echo:
    any:
      - philips_swi_acquired_echo
      - all: [ge_swi_unprefixed, {not: has_magnitude}]
      - siemens_qsm_acquired_echo
  # A4: GE's MEMP of one echo is a spin echo, whatever research mode and
  # the flip say (case 31).
  ge_memp_single_echo:
    all:
      - {text: manufacturer, prefix: ge}
      - any:
          - {text: ge_pulse_sequence_name, matches: 'memp'}
          - {text: ge_internal_pulse_sequence_name, matches: '^memp$'}
      - {not: is_multi_echo}
      - {not: has_epi}
  # A5: a spin echo at a long TR and an echo time under 40 ms is
  # proton-density weighted whatever a T2 word says (the dual-echo ruling:
  # the echo on screen decides).
  se_short_te_t2_named:
    all:
      - has_se
      - {not: has_ir}
      - {not: has_epi}
      - {not: is_flair}
      - {field: repetition_time, ge: 2000}
      - {field: echo_time, gt: 0}
      - {field: echo_time, lt: 40}
      - {text: search_text, matches: '(^|[^a-z0-9])t2w?([^a-z0-9*]|$)'}
      - {not: {text: search_text, matches: 'flair|stir|tirm|t2\*|t2star|dwi|diff'}}
  # A7: on a gradient echo the MTw word outranks a T2 word.
  gre_mtw_named: {all: [has_gre, {not: has_se}, mtw_named]}
  # A10: a Siemens diffusion named with a bare direction count of six or
  # more just before its b value (`ep2d_diff_2mm_hcp_32_b1000`) states a
  # tensor acquisition; never a three-scan trace, whose name holds other
  # numbers (a field of view, a scan time).
  siemens_diffusion_count_named:
    all:
      - {text: manufacturer, prefix: siemens}
      - {text: technique_text, matches: 'diff'}
      - {text: technique_text, matches: '(^|\s)([6-9]|[1-9][0-9]|[1-2][0-9]{2})\s+b ?[0-9]'}
      - {not: {text: technique_text, matches: 'trace|3 ?scan'}}
  # A8: an echo Siemens' STAGE acquired (written ORIGINAL) is RawRecon, no
  # longer its route's, and still the dual-echo gradient echo STAGE runs.
  stage_acquired_echo:
    all:
      - {text: manufacturer, prefix: siemens}
      - image_type.is_original
      - has_gre
      - {text: search_text, matches: '(^|[^a-z])stage([^a-z]|$)'}
  # MRI pack 0.22.0 (dev-7): STAGE acquires two dual-echo gradient echoes
  # at two flip angles for their weighting, a low one proton-density
  # weighted and a high one T1-weighted, and names each for it (`STAGE_pd`,
  # `STAGE_t1`); the name, not the echo train, is the base of an acquired
  # echo's magnitude (a `STAGE_pd` echo at flip 6 was T2*w).
  stage_pd_echo:
    all:
      - stage_acquired_echo
      - {not: has_phase}
      - {text: search_text, matches: '(^|[^a-z])(pdw?|proton-density)([^a-z]|$)'}
  stage_t1_echo:
    all:
      - stage_acquired_echo
      - {not: has_phase}
      - {text: search_text, matches: '(^|[^a-z0-9])t1w?([^a-z0-9]|$)'}

  # === 19. MRI pack 0.24.0: the exclusion `t2star-not-spin-echo` ============
  #
  # Packs 0.21.0 to 0.23.0 left 7 archive stacks with base T2*w beside a
  # spin-echo technique (`studies/2026-10-02-t2star-se-broken/` in the design
  # repository). On 4 of them a spin-echo word decided the technique against
  # a readout the header states: a Philips image typed LOCALIZER on a plain
  # gradient echo, named for the mDixon TSE it plans, and a GE `fgre` named
  # `T2* Ax FSE`. A spin-echo value is not taken where the header says what
  # the readout is:
  # - a gradient-echo scout, whose name may be the series it plans (below,
  #   `gre_scout_readout`);
  # - a GE fast gradient echo by its pulse sequence (round 3, case 8: the
  #   pulse sequence decides `fgre`, `fspgr` and `efgre3d`).
  #
  # Nima's ruling of 2026-10-02 (record 48, "Position displays follow ruling
  # 4"): Siemens' position display (`POSDISP`) is a gradient-echo scout and
  # is read GRE, by the readout it used, as ruling 4 of 2026-09-27 reads
  # every gradient-echo scout. Its FLASH draws the plan of another series and
  # carries that series' name (`PosDisp: [5] t2_tse_tra`), so the name says
  # nothing of its own readout. This reverses pack 0.18.1, which left its
  # technique to the words. The readout is the sequence name's (`*fl2d1`,
  # `*tfl`, `*tfi`), which `has_gre` reads whatever ScanningSequence says.
  posdisp_gre:
    all:
      - image_type.is_posdisp
      - has_gre
      - {not: has_se}
      - {not: has_epi}
  # An image typed LOCALIZER or SCOUT on a plain gradient echo (pack 0.22.0)
  # or a position display on one: read by its readout, never by the words of
  # the series it plans (no diffusion value, no spin-echo value).
  gre_scout_readout: {any: [typed_localizer_gre, posdisp_gre]}
  ge_fast_gre_psd: {any: [ge_psd_unspoiled_fgre, ge_psd_fast_spoiled, ge_psd_efgre3d_unspoiled]}
  readout_not_spin_echo: {any: [gre_scout_readout, ge_fast_gre_psd]}

  # === 20. MRI pack 0.24.0: the final certificate's GE rule gaps ============
  #
  # The final certificate's grade (`studies/2026-10-01-final-certificate-read/
  # grade.md` in the design repository, part 2, kind a) found GE groups the
  # development reads had not drawn. Each is widened to its rule.

  # --- A3: a GE MAGiC or MDME acquisition writes its images real-valued, as
  # GE's private image type (0043,xx2F) says with 2 (dcm2niix's GE README:
  # 0 to 3 are magnitude, phase, real and imaginary; the deep research, round
  # 3, case 21, reads the element for components with PROPELLER exempt). Our
  # counts: every acquired MAGiC and MDME image of the archive (156) writes
  # 2. PROPELLER, where 2 marks the newer software (case 21), is never read
  # so.
  ge_mdme_real:
    all:
      - {text: manufacturer, prefix: ge}
      - {any: [{text: ge_pulse_sequence_name, matches: '^(magic|mdme)'}, ge_magic_acquisition]}
      - {not: image_type.is_derived}
      - {text: ge_private_image_type, matches: '^\s*2\s*$'}
      - {not: is_radial}
      - {not: {text: ge_pulse_sequence_name, matches: 'prop'}}
  real_component: {any: [has_real, ge_mdme_real]}

  # --- A9: GE's SWI research sequence (pulse sequence `swi`, `swi_ks`,
  # `swi-stefan`) writes no magnitude series. Beside its phase and minIP it
  # writes the SWI image, named for the protocol and then `SWI`
  # (`Sc: Ax SWI 2mm SWI`) or `SWIFilt - <protocol>`, ORIGINAL and without
  # the prefix GE's SWAN puts on what it computed. It is the SWI image,
  # SWIRecon (convention 1). Our counts: 136 stacks of these pulse
  # sequences, none named for a magnitude.
  ge_swi_psd_output:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: ge_pulse_sequence_name, matches: '^swi([_-]|$)'}
      - {not: has_phase}
      - {not: is_mip}
      - {not: is_minip}
      - {not: {text: text_series_description, matches: 'phase|min ?ip|(^|[^a-z])mip([^a-z]|$)|magnitude|(^|[^a-z])mag([^a-z]|$)'}}
      - {text: text_series_description, matches: '(^|[^a-z])swifilt|(^|[^a-z])swi\s*$'}

  # --- A11: GE's multi-echo QSM (`psd/QSM/me`, 10 echoes) writes each echo
  # as its own stack (ME-GRE) and, from all of them, outputs GE marks with
  # private image type 3 and the last echo's number: the SWI image, its
  # minIP, the QSM and R2* maps, combined over the echoes (comb-ME-GRE), and
  # `MAG` and `PHS` at the last echo's time, which the reference reads as
  # one echo (ME-GRE). Our counts: 338 stacks, 120 of them outputs.
  ge_qsm_me_psd:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: ge_pulse_sequence_name, matches: 'qsm/me'}
      - {not: has_epi}
  ge_qsm_me_echo_output:
    all:
      - ge_qsm_me_psd
      - any:
          - has_phase
          - {text: search_text, matches: '^(mag|magnitude|phs|pha|phase)( |$)'}
  ge_qsm_me_combined:
    all:
      - ge_qsm_me_psd
      - {text: ge_private_image_type, matches: '^\s*3\s*$'}
      - {not: ge_qsm_me_echo_output}

  # --- A8 (GE): the maps GE's workstation writes under their full names. An
  # `Apparent Diffusion Coefficient`, an `Exponential Apparent Diffusion
  # Coefficient` and an `Exponential attenuation` (eADC both) and an
  # `Isotropic image` (Trace) are GE's diffusion maps, RawRecon by D3 (the
  # header cannot tell a GE DTI from a plain DWI; GE's tensor writes its
  # mean diffusivity apart, as AvDC). `Fractional aniso.` and an `MCFA...`
  # (GE's motion-corrected FA; no MoCo by N11) are FA. Older software writes
  # these `DERIVED\SECONDARY\REFORMATTED` in the plane of their source (15
  # archive stacks, all axial): no reformat.
  ge_plain_map_named:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: search_text, matches: '^(exponential )?apparent diffusion coefficient|^exp(onential)? attenuation|^isotropic image'}
      - {not: has_fa}
  ge_fa_named:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: search_text, matches: '^fractional aniso|^mc ?fa[0-9]'}
  ge_workstation_diffusion_map:
    all:
      - {text: manufacturer, prefix: ge}
      - image_type.is_derived
      - image_type.is_secondary
      - {any: [ge_plain_map_named, ge_fa_named, {text: search_text, matches: '^avdc'}]}

  # --- the B0 map of GE's research sequence (`B0map | B0rf`, internal pulse
  # sequence `B0map`), in research mode: a gradient-echo field map (TE
  # 3.6 ms), technique GRE, and a map of the field with no base contrast, as
  # a B1 map has none. The rules left both empty and the physics vote filled
  # TOF-MRA and T1w. Our counts: 23 archive stacks.
  ge_b0map_acquisition:
    all:
      - {text: manufacturer, prefix: ge}
      - any:
          - {text: ge_internal_pulse_sequence_name, matches: '^b0map'}
          - {text: ge_pulse_sequence_name, matches: '^b0(rf|map)'}
          - {text: search_text, matches: '^b0 ?map( |$)'}
      - {not: has_epi}
      - {not: has_se}

  # --- a GE SWI made by EPI is EPI (D12), by its pulse sequence (`ksepi`,
  # `ksepi2`, `epi2`) where research mode states no EPI and the train is
  # under R1's 32 (a `ksepi2` of train 16 was read ME-GRE by its train).
  ge_swi_epi_psd:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: ge_pulse_sequence_name, matches: '^(ks)?epi'}
  # === 21. MRI pack 0.24.0: the final certificate's disputes =================
  #
  # The final certificate's grade (`studies/2026-10-01-final-certificate-read/
  # grade.md` in the design repository, part 2, kind c) left five questions no
  # ruling covered. Four are settled here under record 48's rule (the deep
  # research where it is confident, our counts where it is not), written up
  # in `studies/2026-10-02-pack-0240/disputes.md`.
  #
  # C2: a GE `ksepi` 3D EPI at a short TR and TE is the EPIMix add-on's
  # T1-weighted SPGR-EPI, a gradient-echo EPI (the deep research, case 32 and
  # round 3's case 19; round 3's case 12: EPI stays only where nothing states
  # the echo), whatever it is named. A TE under 10 ms inside a TR under
  # 50 ms leaves no time for a spin echo. On the archive every GE `ksepi` 3D
  # stack is either this (TR 21 to 24 ms, TE 3 to 6.6 ms) or a susceptibility
  # EPI at a TR of 50 ms or more and a TE of 10 ms or more. Never EPIMix's own
  # `ksepimix`, which its route reads.
  ge_ksepi_3d_short:
    all:
      - {text: manufacturer, prefix: ge}
      - any:
          - {text: ge_pulse_sequence_name, matches: '^ksepi'}
          - {text: ge_internal_pulse_sequence_name, matches: '^ksepi'}
      - {not: {text: ge_pulse_sequence_name, matches: 'ksepimix|ksneuromix'}}
      - {not: {text: ge_internal_pulse_sequence_name, matches: 'ksepimix|ksneuromix'}}
      - {field: mr_acquisition_type, eq: '3D'}
      - {field: repetition_time, gt: 0}
      - {field: repetition_time, lt: 50}
      - {field: echo_time, gt: 0}
      - {field: echo_time, lt: 10}
  # C3: Philips writes its private diffusion direction (2001,1004) once a
  # series, from one of its images. A stack that holds more images a slice
  # than slices, of an acquisition of two or more directions the gradients
  # count, holds its directional images: the `I` names the isotropic image
  # among them, not the stack, which is the diffusion set and no Trace (the
  # adjudicators of the final read; dev-7 and the final read settled such
  # stacks without a construct, and every b=0-and-isotropic stack Trace).
  philips_directional_set:
    all:
      - {text: manufacturer, prefix: philips}
      - {field: dwi_directions, ge: 2}
      - {field: n_instances, gt: {field: n_slices}}
  # C4: a Siemens `Image Filter` copy, the post-processing that writes a
  # filtered copy of a series as a series of its own (ProtocolName `Image
  # Filter`, the name `<series>_FIL_<n>`), written DERIVED, is Filtered, as
  # GE's `FL:` copy written DERIVED is (record 48, DR8, decided by our
  # counts). An image the scanner filtered in its own reconstruction is
  # written ORIGINAL with `FIL` in its image type and `_FIL` after the
  # protocol's name, and has no construct (the deep research, case 10:
  # routine reconstruction filtering changes nothing an image depicts). Never
  # a position display, which carries the name of the series it plans.
  siemens_filter_copy:
    all:
      - {text: manufacturer, prefix: siemens}
      - is_derived
      - {not: image_type.is_posdisp}
      - any:
          - {text: text_protocol_name, matches: '^\s*image filter\s*$'}
          - {text: text_series_description, matches: '_fil_[0-9]+\s*$'}
  # C5: an echo of a Siemens multi-echo FLASH (`*fl3d6r`) named for QSM, as
  # the scanner acquired it (ORIGINAL, component M), has no Magnitude: the
  # scanner computed nothing from it, and QSM in the name is the site's
  # word, not a route that writes the phase's partner (N7). GE's QSM source
  # echoes (pack 0.21.0, dev-6's A2) and Philips' per-echo `M_FFE` are read
  # so already; a Siemens SWI sequence's own magnitude (`*swi3d`) keeps it.
  siemens_qsm_acquired_echo:
    all:
      - {text: manufacturer, prefix: siemens}
      - image_type.is_original
      - has_magnitude
      - {not: has_swi}
      - {not: is_mean}
      - {text: text_sequence_name, matches: '^\*?(wip)?fl[23]d'}
      - {text: search_text, matches: '(^|[^a-z])qsm'}
      - {not: {text: search_text, matches: '(^|[^a-z])swi'}}

