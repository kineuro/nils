      - all: [{field: repetition_time, ge: 1040}, {field: repetition_time, lt: 1080}, {field: inversion_time, ge: 396}, {field: inversion_time, le: 594}]
      - all: [{field: repetition_time, ge: 1080}, {field: repetition_time, lt: 1120}, {field: inversion_time, ge: 410}, {field: inversion_time, le: 615}]
      - all: [{field: repetition_time, ge: 1120}, {field: repetition_time, lt: 1160}, {field: inversion_time, ge: 424}, {field: inversion_time, le: 635}]
      - all: [{field: repetition_time, ge: 1160}, {field: repetition_time, lt: 1210}, {field: inversion_time, ge: 439}, {field: inversion_time, le: 659}]
      - all: [{field: repetition_time, ge: 1210}, {field: repetition_time, lt: 1260}, {field: inversion_time, ge: 456}, {field: inversion_time, le: 684}]
