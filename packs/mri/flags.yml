# SPDX-License-Identifier: AGPL-3.0-only
#
# The flag layer: named booleans a rule is written against.
#
# Transcribed from v0 0.5.3 `classification/core/flags.py` (138 flags in nine
# categories) and the seven helper methods of `core/context.py` that three of
# those categories take as keyword arguments. In v0 the helpers are Python and
# the flags are Python; here both are data, and a flag may reference another
# flag by bare name, which is how the helpers stop being a separate concept.
#
# Reference forms:
#   parser.predicate      a predicate of parsers.yml
#   flag_name             another flag in this file (evaluated in dependency
#                         order; a cycle fails the pack at load)
#   {parser: p, <atom>}   an inline parser atom, for the two places v0 reaches
#                         past its own named predicates into the token set
#   {field: f, <cmp>}     a comparison on a fingerprint scalar
#
# The text these read is `search_text`, which the pack normalizes for itself
# (normalize.yml): the same text v0's flags read, built the same way.
#   {text: f, <str>}      a match on a case-folded text field
#   {any|all|not: ...}    composition

flags:

  # === helpers ==============================================================
  # v0 keeps these in context.py as methods; they are flags like any other.

  has_positive_b_value:
    # b=0 is a reference image, not diffusion weighting; above 20000 s/mm² the
    # value is garbage (v0 has seen 7.23e+75). A field that will not parse as a
    # number makes the comparison false, never an error.
    all: [{field: diffusion_b_value, gt: 0}, {field: diffusion_b_value, le: 20000}]

  has_mp2rage_context: {text: search_text, substring: mp2rage}

  has_mpr_in_text:
    # 'mpr' as a word, and only on DERIVED: on an ORIGINAL it is the tail of
    # MPRAGE, on a DERIVED it is a reformat. MRI pack 0.11.0: or on a
    # projection image, which is how Philips writes its reformats, ORIGINAL
    # (`MPR Ax`, `ORIGINAL\PRIMARY\PROJECTION IMAGE\M\FFE`).
    all:
      - any: [image_type.is_derived, image_type.is_projection]
      - {text: search_text, matches: '\bmpr\b'}

  has_inv1_in_text: {text: search_text, matches: '\binv1\b'}
  has_inv2_in_text: {text: search_text, matches: '\binv2\b'}

  is_mp2rage_inv1_by_ti:
    all: [image_type.is_original, has_mp2rage_context,
          {field: inversion_time, gt: 0}, {field: inversion_time, lt: 1800.0}]
  is_mp2rage_inv2_by_ti:
    all: [image_type.is_original, has_mp2rage_context,
          {field: inversion_time, gt: 0}, {field: inversion_time, ge: 1800.0}]

  is_uniform_denoised:
    all:
      - image_type.is_derived
      - image_type.has_uniform
      - any:
          - {text: search_text, matches: 'uni\s*-\s*den'}
          - {text: search_text, matches: 'uniden'}
          - {text: search_text, matches: 'uniform\s+denoised'}
          - {text: search_text, matches: 'denoised\s+uniform'}

  # === 1. pulse sequence physics ============================================

  # MRI pack 0.10.0: never on a Siemens gradient-echo stem (`*ci3d1` and
  # `*tfi2d1` are written with ScanningSequence SE: 84 and 105 stacks on the
  # archive, 2026-09-28) nor on a gradient-echo EPI (`epfid`, which VB12T
  # once wrote `SE\EP`); the name decides against ScanningSequence. Philips'
  # scanning technique SEEPI is a spin-echo EPI.
  has_se:
    all:
      - {not: sequence_name.is_gre_stem}
      - {not: sequence_name.is_epi_gre}
      - {not: philips_gre_technique}
      - any: [has_se_evidence, philips_seepi]

  has_se_evidence:
    any:
      - scanning_sequence.has_se
      - scanning_sequence.has_fse
      - scanning_sequence.has_irfse
      - image_type.hint_se
      - sequence_name.is_se
      - sequence_name.is_tse
      - sequence_name.is_haste
      - sequence_name.is_space
      - sequence_name.is_space_ir
      - sequence_name.is_ir_tse
      - sequence_name.is_fse
      - sequence_name.is_ir_fse
      - sequence_name.is_me_se
      - sequence_name.is_mdme
      - sequence_name.is_epi_se
      # MRI pack 0.18.0: Siemens `epir` is an inversion-prepared spin-echo
      # EPI whatever ScanningSequence says (the deep research, case 1).
      - sequence_name.is_epi_ir
      # MRI pack 0.18.0: an enhanced object that states no ScanningSequence,
      # read from its echo train and flip angle (below, `se_by_train_unstated`).
      - se_by_train_unstated
      # Philips/GE: IR + SK without GR implies a TSE readout.
      - all: [scanning_sequence.has_ir, sequence_variant.has_segmented_kspace,
              {not: scanning_sequence.has_gre}]
      # MRI pack 0.14.0: a GE spin echo written in research mode (below).
      - ge_research_se

  # MRI pack 0.18.0: ScanningSequence as stated, except the bare `GE` a
  # third-party toolkit writes on the GE headers whose ScanOptions it
  # rewrote as numbers (below, `ge_numeric_header`), which says no gradient
  # echo: the names there tell a DTI's outputs (sealed-1 checkpoint, A9).
  has_gre:
    any: [ss_gre_stated, image_type.hint_gre, sequence_name.is_gre,
          sequence_name.is_fgre, sequence_name.is_flash, sequence_name.is_tfl,
          sequence_name.is_mprage, sequence_name.is_swi, sequence_name.is_ciss,
          sequence_name.is_tof, sequence_name.is_pc, sequence_name.is_epi_gre,
          # MRI pack 0.10.0: every Siemens gradient-echo stem, and Philips'
          # gradient-echo scanning techniques
          sequence_name.is_gre_stem, philips_gre_technique]

  has_epi:
    any: [scanning_sequence.has_epi, sequence_name.is_epi_diff,
          sequence_name.is_epi_gre, sequence_name.is_epi_se,
          sequence_name.is_epi_ir, sequence_name.is_epi_diff_resolve,
          sequence_name.is_epi_diff_b0, philips_feepi, philips_seepi]

  has_ir:
    any:
      - scanning_sequence.has_ir
      - scanning_sequence.has_irfse
      - image_type.hint_ir
      - image_type.has_dir
      - image_type.has_dir_synthetic
      - scan_options.has_ir
      - scan_options.has_ir_gems
      - scan_options.has_t1flair_gems
      - scan_options.has_t2flair_gems
      - sequence_name.is_ir_tse
      - sequence_name.is_ir_fse
      - sequence_name.is_space_ir
      - sequence_name.is_epi_ir
      - sequence_name.is_mprage
      - sequence_name.is_flair_seq
      - {field: inversion_time, gt: 0}
      # Philips: GR + MP + 3D and neither SE nor EPI is an IR-prepared 3D GRE.
      - all: [sequence_variant.has_mag_prepared, scanning_sequence.has_gre,
              {not: scanning_sequence.has_se}, {not: scanning_sequence.has_epi},
              {field: mr_acquisition_type, eq: '3D'}]

  has_ir_se:
    any:
      - scanning_sequence.has_irfse
      - sequence_name.is_ir_tse
      - sequence_name.is_ir_fse
      - sequence_name.is_space_ir
      - sequence_name.is_flair_seq
      # MRI pack 0.18.0: Siemens `epir` (the deep research, case 1).
      - sequence_name.is_epi_ir
      - all: [{any: [scanning_sequence.has_se, scanning_sequence.has_fse]},
              scanning_sequence.has_ir, {not: scanning_sequence.has_epi}]
      - all: [scanning_sequence.has_ir, sequence_variant.has_segmented_kspace,
              {not: scanning_sequence.has_gre}, {not: scanning_sequence.has_epi}]

  # Spatial saturation bands (GE's SAT_GEMS among them), not fat saturation:
  # every GE FS stack carries SAT_GEMS, most SAT_GEMS stacks have no fat
  # saturation. Read by no rule; keep it away from FatSat.
  has_saturation:
    any: [scanning_sequence.has_saturation, scan_options.has_sat_gems,
          scan_options.has_spatial_sat]

  # === 2. technique indicators ==============================================

  is_tse:
    any:
      - sequence_name.is_tse
      - sequence_name.is_tse_body
      - sequence_name.is_fse
      # MRI pack 0.11.0: Siemens `tir` is the turbo inversion recovery
      # (TIRM), whose train an old `tir1i7m` with ScanningSequence IR alone
      # and 27 echoes did not otherwise show; it was written SE.
      - sequence_name.is_ir_tse
      - all: [sequence_variant.has_segmented_kspace, scanning_sequence.has_se]
      - all: [sequence_variant.has_segmented_kspace, scanning_sequence.has_ir,
              {not: scanning_sequence.has_gre}]
      - se_echo_train
      - propeller_fse
  is_space:   {any: [sequence_name.is_space, sequence_name.is_space_ir]}
  is_haste:   sequence_name.is_haste
  # GE's `memp` names its spin echo whatever the number of echoes, so it is a
  # multi-echo spin echo only where the series holds several (pack 0.9.0).
  is_me_se:   {all: [sequence_name.is_me_se, is_multi_echo]}
  is_medic:   sequence_name.is_medic
  # MRI pack 0.15.0: or GE's MAGiC acquisition by its name (below).
  # MRI pack 0.18.0: or Philips' QMap/SyntAc acquisition by its name (below).
  is_mdme:    {any: [sequence_name.is_mdme, ge_magic_acquisition, philips_qmap_acquisition]}
  is_qalas:   sequence_name.is_qalas
  # MRI pack 0.10.0: Philips' scanning technique (2001,1020) decides the
  # family where Siemens' name would: T1FFE is spoiled, TFE and T1TFE the
  # turbo field echo, B-FFE and B-TFE balanced, T2FFE the echo of the
  # steady state (Philips, "Siemens to Philips sequence terminology";
  # observed on the archive, section 5.1 of the research).
  is_flash:   {any: [sequence_name.is_flash, sequence_name.is_fgre, philips_t1ffe]}
  # MRI pack 0.13.0: or a GE calibration scan (below).
  # MRI pack 0.18.0: but a calibration scan that states the unspoiled fast
  # steady state (`SS\SK` with FAST_GEMS) is SS-GRE, the later ruling on
  # exactly that stack (record 48, "Rulings after the re-adjudication").
  is_tfl:     {any: [sequence_name.is_tfl, philips_tfe, {all: [ge_calibration, {not: ge_fast_ss}]}]}
  # MRI pack 0.13.0: or a Siemens `t1_mpr` protocol (below).
  is_mprage:  {any: [sequence_name.is_mprage, t1_mpr_named]}
  is_ssfp:    {any: [sequence_name.is_trufisp, philips_balanced]}
  is_ciss:    sequence_name.is_ciss
  is_dess:    sequence_name.is_dess
  is_psif:    {any: [sequence_name.is_psif, sequence_variant.has_trss, philips_t2ffe]}
  is_fisp:    sequence_name.is_fisp
  is_swi:     {any: [sequence_name.is_swi, image_type.has_swi]}
  has_swi:    image_type.has_swi
  # MRI pack 0.18.0: GE's `VASCTOF_GEMS` only where nothing says the series
  # is something else (below, `ge_vasctof_as_tof`).
  is_tof:     {any: [sequence_name.is_tof, sequence_variant.is_tof,
                     ge_vasctof_as_tof, scan_options.has_inflow_gems,
                     philips_inflow_named]}
  # MRI pack 0.18.0: `hint_pca` also reads Philips' `PCA` token (parsers.yml).
  is_pc:      {any: [sequence_name.is_pc, image_type.hint_pca]}
  is_flair:   {any: [sequence_name.is_flair_seq, scan_options.has_t1flair_gems,
                     scan_options.has_t2flair_gems, image_type.has_flair_synthetic]}
  is_dir:     {any: [image_type.has_dir, image_type.has_dir_synthetic]}
  is_epi_diff_resolve: sequence_name.is_epi_diff_resolve
  # MRI pack 0.11.0: GE leaves a b value of 1000 in its private diffusion
  # element on series that are no diffusion at all (a T1 spin echo and a
  # three-plane SSFSE localizer in the 2026-09-28 re-measure), so on GE the
  # b value alone counts only where the header does not state a readout
  # that is not EPI.
  is_dwi:
    any:
      - sequence_name.is_epi_diff
      - sequence_name.is_epi_diff_resolve
      - sequence_name.is_epi_diff_b0
      - image_type.has_diffusion
      - all:
          - has_positive_b_value
          - {not: {all: [says_not_epi, {text: manufacturer, prefix: ge}]}}
          # MRI pack 0.18.0: never a field map that states a b value (a B1
          # map with b=1, sealed-1 checkpoint A17), nor a gradient-echo EPI
          # by its name (`epfid`, Philips FEEPI): diffusion weighting is a
          # spin echo's (A12).
          - {not: b_value_not_diffusion}
      # MRI pack 0.13.0: a Philips b=0 image named `sb0` or `b0`, and an EPI
      # named for its isotropic image, which GE writes with a b value of 0
      # (below).
      - b0_named
      - all: [trace_named, has_epi]
      # and GE's DTI outputs named `AvDC`, `FA` or `Exp attenuation`, written
      # with a b value of 0 (the reference read their source as a diffusion
      # EPI once Nima's ruling 7 stood, 2026-09-29).
      - all: [has_epi, {any: [md_named, fa_named, eadc_named]}]
      # MRI pack 0.15.0: a Siemens BLADE diffusion (`blade_b`), a turbo spin
      # echo and no EPI (below, `dwi_tse`).
      - sequence_name.is_blade_diff
      # MRI pack 0.18.0: a GE header rewritten with numbers, named for a
      # diffusion output (A9); a Philips diffusion by its scanning technique
      # (A17); a diffusion SBRef (below).
      - ge_numeric_diffusion_named
      - philips_dwi_technique
      - diffusion_sbref
  is_bold:    {all: [image_type.has_fmri, {not: image_type.has_phase}]}
  is_asl:     image_type.has_asl
  is_perfusion: image_type.has_perfusion
  # MRI pack 0.18.0: GE's `MRF_GEMS` alone is no fingerprinting. On the
  # archive its 11 stacks are FSE, FRFSE, Cube and PROPELLER by their pulse
  # sequence, with no fingerprinting word (the deep research, case 23;
  # `empirical-conventions.md`, case 23). The value's words still say it.
  is_mrf:     {all: [scan_options.has_mrf_gems, {text: search_text, matches: 'fingerprint|(^|[^a-z])mrf([^a-z]|$)'}]}
  is_radial:  {any: [scan_options.has_propeller_gems, image_type.layout_radial]}
  is_spiral:  scan_options.has_spiral_gems
  is_mavric:  image_type.has_mavric
  is_ideal:   scan_options.has_ideal_gems
  is_cine:    scan_options.has_cine_gems
  is_quant_map: sequence_name.is_quant_map

  # === 3. sequence variants =================================================

  has_spoiled:          sequence_variant.has_spoiled
  has_steady_state:     sequence_variant.has_steady_state
  has_segmented_kspace: sequence_variant.has_segmented_kspace
  # SequenceVariant MP alone. GE's `MP_GEMS` is no magnetisation
  # preparation: 117 of the 255 stacks that carry it are EPI (fMRI and DSC),
  # which fits GE's multi-phase, and GE documents no meaning for it (MRI
  # pack 0.10.0).
  has_mag_prepared:     sequence_variant.has_mag_prepared
  # MRI pack 0.11.0: GE writes magnetisation transfer as `MT_GEMS` in
  # ScanOptions (a GE TOF in the 2026-09-28 re-measure).
  has_mtc:              {any: [sequence_variant.has_mtc, scan_options.has_mt,
                               scan_options.has_mt_gems]}
  has_oversampling:     sequence_variant.has_oversampling
  # FS or SFS only; never GE's readout-direction tokens (parsers.yml)
  has_fat_sat:          scan_options.has_fat_sat
  has_water_excitation: scan_options.has_water_exc
  has_flow_comp:        scan_options.has_flow_comp
  has_partial_fourier:  {any: [scan_options.has_partial_fourier_phase,
                               scan_options.has_partial_fourier_freq]}
  has_parallel_imaging: {any: [scan_options.has_parallel_gems, scan_options.has_hypersense,
                               scan_options.has_cs_gems]}
  has_gating:           scan_options.has_gating

  # === 4. acquisition properties ============================================

  # MRI pack 0.11.0: `DIS3D` and `DIS2D` in Siemens' image type say which
  # distortion correction ran, not how the volume was acquired: a 2D
  # `*tir2d1_21` FLAIR written `DIS3D` was a 3D-TSE (the 2026-09-28
  # re-measure). They stand in only where the file does not state the
  # acquisition type.
  is_3d:
    any:
      - {field: mr_acquisition_type, eq: '3D'}
      - all: [{field: mr_acquisition_type, present: false}, image_type.is_3d_view]
  is_2d:
    any:
      - {field: mr_acquisition_type, eq: '2D'}
      - all: [{field: mr_acquisition_type, present: false}, image_type.is_2d_view]
  # v0 reads these three off a stack key its fingerprint query never selects,
  # so all three are permanently false there. The rule below is the one v0
  # meant, against the fingerprint column Wave 2 slice 1 added; the difference
  # is declared (spikes/pack/README.md, finding 1).
  is_multi_echo: {field: split_reason, eq: multi_echo}
  is_multi_ti:   {field: split_reason, eq: multi_ti}
  is_multi_fa:   {field: split_reason, eq: multi_flip_angle}
  # Pack 0.9.0, Nima's ruling (2026-09-27): a dual-echo PD/T2 fast or turbo
  # spin echo is a TSE, not a multi-echo spin echo. The digest splits it by
  # echo time into one stack per echo, two in the series, and its echo train
  # says TSE (the sequence name, segmented k-space, or a train longer than
  # one echo, which GE writes where it writes no variant). A conventional
  # multi-echo spin echo is 3 or more echoes for T2 mapping, or a pre-turbo
  # dual echo with no train, and stays ME-SE.
  is_dual_echo_tse:
    all:
      - is_multi_echo
      - has_se
      - {field: stacks_in_series, le: 2}
      - any: [is_tse, is_haste, {field: echo_train_length, gt: 1}]

  # === 5. derived / synthetic / quantitative ================================

  is_derived: image_type.is_derived
  is_synthetic:
    any: [image_type.is_synthetic, scanning_sequence.has_synthetic,
          sequence_variant.is_synthetic, image_type.has_t1_synthetic,
          image_type.has_t2_synthetic, image_type.has_pd_synthetic,
          image_type.has_flair_synthetic, image_type.has_stir_synthetic,
          image_type.has_psir_synthetic, image_type.has_dir_synthetic]
  has_t1_synthetic:    image_type.has_t1_synthetic
  has_t2_synthetic:    image_type.has_t2_synthetic
  has_pd_synthetic:    image_type.has_pd_synthetic
  has_flair_synthetic: image_type.has_flair_synthetic
  has_myelin:          image_type.has_myelin
  is_qmap:
    any: [image_type.has_qmap, scanning_sequence.has_qmap, image_type.has_t1_map,
          image_type.has_t2_map, image_type.has_r1, image_type.has_r2]
  has_t1_map: image_type.has_t1_map
  has_t2_map: image_type.has_t2_map
  has_r1:     image_type.has_r1
  has_r2:     image_type.has_r2
  has_uniform: image_type.has_uniform
  is_mp2rage_inv1: {any: [is_mp2rage_inv1_by_ti, has_inv1_in_text]}
  is_mp2rage_inv2: {any: [is_mp2rage_inv2_by_ti, has_inv2_in_text]}
  is_diffusion_derived:
    any: [image_type.has_adc, image_type.has_eadc, image_type.has_fa,
          image_type.has_trace, image_type.has_exp_diffusion, image_type.has_calc_bval]
  has_adc:   image_type.has_adc
  has_eadc:  image_type.has_eadc
  has_fa:    image_type.has_fa
  has_trace: image_type.has_trace
  # MRI pack 0.18.0: and Siemens' percentage of baseline at peak (`PBP`)
  # and a leakage map (`K2`), perfusion maps as the others are (sealed-1 A1;
  # the deep research, case 17).
  is_perfusion_derived:
    any: [image_type.has_cbf, image_type.has_cbv, image_type.has_mtt,
          image_type.has_ttp, image_type.has_tmax, image_type.has_oef,
          image_type.has_cmro2, image_type.has_leakage,
          image_type.has_peak_bolus, image_type.has_k2]
  has_cbf:  image_type.has_cbf
  has_cbv:  image_type.has_cbv
  has_mtt:  image_type.has_mtt
  has_tmax: image_type.has_tmax
  has_ttp:  image_type.has_ttp

  # === 6. image type / components ===========================================

  is_original:  image_type.is_original
  is_primary:   image_type.is_primary
  is_secondary: image_type.is_secondary
  # MRI pack 0.13.0: and Siemens' position display (`POSDISP`), the
  # planning picture of another series (dev-1: settled Localizer).
  # MRI pack 0.18.0: and GE's `SCOUT` in the image type (sealed-1 A18).
  is_localizer: {any: [image_type.is_localizer, sequence_name.is_localizer,
                       scan_options.has_scout_mode, image_type.is_posdisp,
                       image_type.is_scout]}
  has_magnitude: image_type.has_magnitude
  has_phase:     image_type.has_phase
  has_real:      image_type.has_real
  has_imaginary: image_type.has_imaginary
  # MRI pack 0.18.0: and GE's FLEX, a two-point Dixon (`FLEX_GEMS`; the
  # deep research, case 26; 116 archive stacks lacked Dixon).
  has_dixon:     {any: [image_type.has_dixon, scan_options.has_dix_fat,
                        scan_options.has_dix_water, scan_options.has_flex_gems]}
  has_water:     image_type.has_water
  has_fat:       image_type.has_fat
  has_in_phase:  image_type.has_in_phase
  has_out_phase: image_type.has_out_phase
  has_psir:      {any: [image_type.has_psir, image_type.has_psir_synthetic]}
  has_stir:      image_type.has_stir_synthetic

  # === 7. post-processing ===================================================

  # MRI pack 0.11.0: GE writes a TOF's MIP as `PROJECTION IMAGE\VASCULAR`
  # (`PJN:` in its name) and nothing else.
  # MRI pack 0.14.0: and GE's collapse (`COL:`, `COLLAPSE`), its maximum
  # projection through the volume.
  # MRI pack 0.18.0: Philips' `MAXIMUM` only beside `DERIVED` or a
  # projection token (the deep research, case 14; all 157 archive stacks
  # carry DERIVED, so none moves).
  is_mip:        {any: [image_type.is_mip, image_type.is_mip_thin,
                        {all: [image_type.has_maximum, {any: [image_type.is_derived, image_type.is_projection]}]},
                        {all: [image_type.is_projection, image_type.is_vascular]},
                        {parser: image_type, token: COLLAPSE}]}
  is_minip:      image_type.is_minip
  is_projection: image_type.is_projection
  # A curved planar reformat is a reformat: v0 parses `CPR` and reads it
  # nowhere.
  # MRI pack 0.13.0: or a PACS workstation's reformat (below).
  # MRI pack 0.16.0: or a derived image whose name gives another plane than
  # its protocol (below).
  is_mpr:        {any: [image_type.is_mpr, image_type.is_mpr_thick, image_type.layout_cpr,
                        has_mpr_in_text, is_projection_plane, is_workstation_reformat,
                        plane_reformat_named]}
  # MRI pack 0.12.0: Philips writes a reformat as `PROJECTION IMAGE`
  # (`ORIGINAL\PRIMARY\PROJECTION IMAGE\M\FFE`, or DERIVED or SECONDARY),
  # a plane and a maximum projection alike, and only the words or a MIP
  # token tell the projection. With neither it is a plane, an MPR: dev-1
  # settled MPR on 28 Philips reformats of which no construct rule voted on
  # one, and the header-judge prompt reads them so ("MIP needs MIP in the
  # words or ImageType").
  is_projection_plane:
    all:
      - image_type.is_projection_image
      - {not: image_type.is_vascular}
      - {not: is_mip}
      - {not: is_minip}
      - {not: projection_named}
      # MRI pack 0.13.0: nor a diffusion image with a b value (below).
      - {not: is_diffusion_projection}
      # MRI pack 0.14.0: nor GE's collapse, a projection through the volume
      # that GE writes `PROJECTION IMAGE\COLLAPSE` (dev-2: a `COL:` TOF was
      # an MPR; it is a MIP).
      - {not: {parser: image_type, any_token: [COLLAPSE, PJN]}}
  # MRI pack 0.12.0: a 90-degree flip-back (driven equilibrium) TSE by its
  # sequence name. Siemens writes an `R` right after `tse` on one with the
  # RESTORE pulse (`*tseR2d1rs16`; v0 parsed the stem as `is_tse_body` and
  # read it nowhere, and the header-judge prompt reads it so; the letters
  # after the echo train number, `*tse2d1rs15`, are not it); GE names the
  # pulse sequence FRFSE (0019,xx9C) [V1, P48, MQ14]. dev-1 settled VFA-TSE
  # on 14 Siemens, one GE and one Philips 2D TSE that the rules called TSE.
  is_restore_tse:
    any:
      - sequence_name.is_tse_body
      - {text: ge_pulse_sequence_name, matches: 'frfse'}
  # The words of base MTw (rules/base.yml, `keywords:MTw`), for the rule
  # that must not take such a series first (MRI pack 0.12.0).
  # MRI pack 0.14.0: not where the words switch it off (`MT=OFF`, below).
  mtw_named:
    all:
      - {text: search_text, any_substring: [mtw, 'mt w', 'magnetization transfer', 'magnetization-transfer', 'mt weighted']}
      - {not: mt_negated}
  # The word `phase` meaning something other than a phase image, and no
  # phase in the image type (MRI pack 0.12.0).
  phase_not_an_image:
    all:
      - {not: has_phase}
      # MRI pack 0.13.0: and `multiphase`, `AP phase` and `PV phase`, the
      # timing of a dynamic series (dev-1: a TWIST subtraction and a MERGE
      # named for the AP phase of a dynamic study).
      - {text: search_text, matches: '\b(in|out|opp|opposed|arterial|venous|portal|delayed|late|early|dynamic|dyn|multi|ap|pv)\s*-?\s*phase|\bphase\s*-?\s*(contrast|encod|enc|\d)|\b(pc|phase) ?(mra|angio|flow)'}
  # A maximum or minimum projection said in words, as the construct axis's
  # MIP and MinIP keywords read it.
  projection_named: {text: search_text, matches: '\b(mip|minip|min ip|max ip|mnip)\b|maximum intensity|minimum intensity'}
  is_subtraction: image_type.is_subtraction
  is_mean:       image_type.is_mean
  is_composite:  image_type.is_composite
  is_vascular:   image_type.is_vascular
  has_moco:      image_type.has_moco
  has_distortion_correction: {any: [image_type.is_2d_view, image_type.is_3d_view]}
  has_dis2d:     image_type.is_2d_view
  has_dis3d:     image_type.is_3d_view
  is_normalized: image_type.is_normalized
  has_nd:        image_type.has_nd
  # These two read the blob as stored, not case-folded, and after a left strip.
  is_ge_orig:     {text_raw: search_text, prefix: 'orig '}
  is_ge_filtered: {text_raw: search_text, prefix: 'filtered '}

  # === 8. exclusion / QA ====================================================

  is_error:      image_type.is_error
  is_screenshot: image_type.is_screenshot
  # Read by nothing, and deliberately: wiring it would stop 21 standard
  # deviation and coverage maps being classified as images of a person,
  # which is a change to what is excluded and belongs with the rest of the
  # exclusion tail, not here.
  is_qa:         image_type.is_qa
  is_ttest:      image_type.has_ttest
  is_tune:       sequence_name.is_tune
  is_wip:        sequence_name.is_wip

  # === 9. branch-specific ===================================================

  is_swi_magnitude:
    any:
      - all: [image_type.has_magnitude,
              {any: [sequence_name.is_swi, image_type.has_swi]}]
      - all: [image_type.has_swi, {not: image_type.is_minip},
              {not: image_type.has_phase}]
  is_swi_processed:
    any:
      - all: [image_type.has_swi, image_type.is_derived]
      # v0 reaches into the token set here rather than through a predicate.
      - all: [{parser: image_type, token: SW_M_FFE}, image_type.is_derived]
  has_qsm:    image_type.has_qsm
  has_r2star: image_type.has_r2star
  is_epi_swi:
    any:
      - all: [sequence_name.is_swi, scanning_sequence.has_epi]
      - all: [sequence_name.is_epi_gre, image_type.has_swi]
  is_symri_source:
    any:
      - all: [sequence_name.is_mdme, image_type.is_original]
      - all: [sequence_name.is_qalas, image_type.is_original]
  has_qmap_t1:    image_type.has_qmap_t1
  has_qmap_t2:    image_type.has_qmap_t2
  has_qmap_pd:    image_type.has_qmap_pd
  has_multi_qmap: image_type.has_multi_qmap
  has_pd_map:     image_type.has_pd_map
  has_b1_map:     image_type.has_b1_map
  has_b0_map:     image_type.has_b0_map
  has_dir_synthetic:  {any: [image_type.has_dir_synthetic, image_type.has_dir_synthetic_token]}
  has_psir_synthetic: {any: [image_type.has_psir_synthetic, image_type.has_psir_synthetic_token]}
  has_stir_synthetic: image_type.has_stir_synthetic
  is_magic_raw:   image_type.is_magic_raw
  # The four `is_dixon_*` flags that stood here said the Dixon part over
  # again: `has_water`, `has_fat`, `has_in_phase` and `has_out_phase` are
  # what the construct axis reads, and they have carried the part on all
  # 2,773 stacks that state it since the axis was written. Nothing read the
  # four, and a second spelling of a decided fact is how two parts of one
  # program come to disagree about it.
  has_fat_fraction:   image_type.has_fat_fraction

  # === 10. what the file says is wrong with the image ========================
  # Three statements a file makes about its own image being less than a
  # whole, honest one. None of them says what the image is, so none of them
  # belongs on an axis that answers that; they are the `quality` axis.

  # The vendor says this image was not distortion corrected.
  is_distorted:  image_type.is_distorted
  # A derived image the scanner made without one of its inputs.
  is_navail:     image_type.has_navail
  # Pixels NILS cannot read, so not an image it can convert.
  is_encrypted:  image_type.is_encrypted

  # === 11. fMRI, perfusion and the gradient-echo family (MRI pack 0.10.0) ====
  # `studies/2026-09-28-sequence-research/reconciled.md` in the design
  # repository: two independent research reports reconciled and checked
  # against the archive. Each flag names what it rests on.

  # --- Philips' scanning technique, private (2001,1020), the counterpart of
  # Siemens' sequence name. The strings are the ones the archive holds.
  philips_feepi:    {text: philips_scanning_technique, matches: '^feepi$'}
  philips_seepi:    {text: philips_scanning_technique, matches: '^seepi$'}
  philips_t1ffe:    {text: philips_scanning_technique, matches: '^t1ffe$'}
  philips_t2ffe:    {text: philips_scanning_technique, matches: '^t2ffe$'}
  philips_tfe:      {text: philips_scanning_technique, matches: '^(t1tfe|tfe)$'}
  philips_balanced: {text: philips_scanning_technique, matches: '^(b-ffe|b-tfe|bffe|btfe)$'}
  philips_gre_technique:
    any: [philips_feepi, philips_t1ffe, philips_t2ffe, philips_tfe, philips_balanced,
          {text: philips_scanning_technique, matches: '^ffe$'}]

  # --- the EPI readout: gradient or spin echo, from the name before
  # ScanningSequence. Both reports: `epfid` is the FID (gradient-echo) EPI and
  # `epse` the spin-echo one, and ScanningSequence cannot tell them apart on
  # old Siemens (`SE\EP` on a gradient-echo BOLD, dcm2niix issue 309); the
  # archive holds 8 `epse` stacks written `GR\EP`.
  # MRI pack 0.18.0: `epir` is a spin-echo EPI as `epse` is (the deep
  # research, case 1: "epse/epir -> spin-echo EPI; epfid -> GRE-EPI;
  # override ScanningSequence"). An EPI named T2* is a gradient echo
  # whatever ScanningSequence says (sealed-1 A12), and so is GE's
  # SPGR-EPI (case 32).
  is_se_epi:
    any:
      - sequence_name.is_epi_se
      - sequence_name.is_epi_ir
      - philips_seepi
      - all: [has_epi, has_se, {not: sequence_name.is_epi_gre}, {not: philips_feepi}, {not: t2star_epi_named}]
  is_gre_epi:
    any:
      - sequence_name.is_epi_gre
      - philips_feepi
      - ge_spgr_epi
      - all: [has_epi, t2star_epi_named, {not: sequence_name.is_epi_se}, {not: sequence_name.is_epi_ir}, {not: philips_seepi}]
      - all: [has_epi, has_gre, {not: sequence_name.is_epi_se}, {not: sequence_name.is_epi_ir}, {not: philips_seepi}]

  # --- how many time points a series holds. NumberOfTemporalPositions where
  # the file says it (the enhanced split, GE, Philips); a Siemens mosaic holds
  # one volume per image; otherwise the images per slice position, which the
  # language can only bound. On the archive every BOLD run held 100 or more
  # time points, every DSC run 40 to 90, a GE reverse-phase field map 4, and
  # no multiphase liver series more than 5.
  is_mosaic: image_type.layout_mosaic
  is_time_series:
    any:
      - {field: temporal_positions, ge: 10}
      - all: [{field: temporal_positions, present: false}, is_mosaic, {field: n_instances, ge: 10}]
      - all: [{field: temporal_positions, present: false}, {not: is_mosaic},
              {field: n_instances, gt: {field: n_slices}}, {field: n_instances, ge: 300}]
  is_few_volumes:
    any:
      - all: [{field: temporal_positions, present: true}, {field: temporal_positions, lt: 10}]
      - all: [{field: temporal_positions, present: false}, is_mosaic, {field: n_instances, lt: 10}]
      - all: [{field: temporal_positions, present: false}, {not: is_mosaic},
              {field: n_instances, le: {field: n_slices}}]

  # A readout the header states and that is not EPI: a gradient or spin echo
  # with no EPI anywhere. A word for an EPI technique is not believed on it.
  says_not_epi: {all: [{not: has_epi}, {any: [has_gre, has_se]}]}
  # Fewer than 10 time points, where the file says how many.
  has_few_time_points: {all: [{field: temporal_positions, present: true}, {field: temporal_positions, lt: 10}]}

  # --- words, as whole words. A keyword is a substring of the text, and the
  # short ones matched inside other words on the archive: `asl` inside
  # `basline` (13 stacks called ASL), `bold` inside Philips' `VenBOLD`, its
  # SWI (all 18 stacks called BOLD). A word here is bounded by anything that
  # is not a letter, so `ep2d_pasl`, `asl3d` and `ep2d_bold` still say it.
  bold_words:
    all:
      - {text: technique_text, matches: '(^|[^a-z])(bold|task)([^a-z]|$)|fmri|functional|resting state'}
      - {not: is_venbold}
  asl_words:  {text: technique_text, matches: '(^|[^a-z])(asl|pasl|casl|pcasl)([^a-z]|$)|arterial spin'}
  dsc_words:  {text: technique_text, matches: '(^|[^a-z])(dsc|pwi|perf)([^a-z]|$)|perfusion'}
  dce_words:  {text: technique_text, matches: '(^|[^a-z])dce([^a-z]|$)|dynamic contrast enhanced'}
  # Philips' SWI is VenBOLD: a 3D spoiled gradient echo with a long echo
  # time, not an fMRI series.
  is_venbold: {text: search_text, matches: 'venbold|venobold|(^|[^a-z])v?ven bold'}
  # A contrast-enhanced angiography run (TWIST, TRICKS) repeats a 3D spoiled
  # gradient echo through a bolus as DCE does; on the archive every such
  # series with 10 or more time points was one, and none was DCE.
  angio_words: {text: technique_text, matches: '(^|[^a-z])(mra|angio|twist|tricks|tof)([^a-z]|$)'}
  # Philips' PRESTO is a 3D gradient-echo DSC sequence, not DCE.
  presto_words: {text: technique_text, matches: '(^|[^a-z])presto([^a-z]|$)'}

  # --- contrast given, as the file or its words say it
  has_contrast_tag: {field: text_contrast, present: true}
  contrast_said:
    any:
      - has_contrast_tag
      - {text: technique_text, matches: '(^|[^a-z])(gd|gad|gado)([^a-z]|$)'}
      # MRI pack 0.11.0: `technique_text`, so GE's exam-level ProtocolName
      # (`MS+GD`) says nothing about a series.
      - all: [{text: technique_text, any_substring: {bucket: contrast_positive}},
              {not: {text: technique_text, any_substring: {bucket: contrast_negative}}}]

  # --- DSC. A perfusion image type, a map only DSC makes (not CBF, which
  # ASL makes too), or an EPI time series given contrast or named for it.
  # Both reports: the contrast tag decides BOLD against DSC where it is
  # present, and nothing in the header does where it is not; a missing tag
  # does not rule DSC out (pitfall 4), so the words count too.
  # Not on a 3D gradient echo that is no EPI: Siemens writes `TTP` on the
  # time-to-peak image of a dynamic VIBE too.
  is_dsc_map:
    all:
      - any: [has_cbv, has_mtt, has_ttp, has_tmax, image_type.has_leakage,
              image_type.has_peak_bolus, image_type.has_k2]
      - {not: is_asl}
      - {not: is_spiral}
      - {not: {all: [is_3d, {not: has_epi}]}}
  # A perfusion map named for what it is, where its image type says nothing
  # (Philips' `rCBV rSVD calculated ...`, written ORIGINAL\PRIMARY).
  # MRI pack 0.18.0: and the percentage of baseline at peak, a leakage (K2)
  # map and the other third-party map names (sealed-1 A1; the deep research,
  # case 17; on the archive 33 map-word, 15 PBP and 10 K2 or leakage stacks).
  perfusion_map_words: {text: technique_text, matches: '(^|[^a-z])(r?cbv|r?cbf|r?mtt|ttp|tmax|pbp|k2|leakage|oef|cth|cmro2)([^a-z]|$)'}
  is_dsc_stated: {any: [{all: [is_perfusion, {not: is_asl}]}, is_dsc_map]}
  is_dsc_series:
    all:
      - has_epi
      - is_time_series
      - {not: is_dwi}
      - {not: is_asl}
      - {not: bold_words}
      - any: [dsc_words, contrast_said]

  # --- BOLD. An EPI time series with nothing that says diffusion, perfusion
  # or contrast (both reports: many volumes, no contrast, no DIFFUSION,
  # PERFUSION or ASL token). A single-band reference is the BOLD run's own
  # reference image, and both reports put it under BOLD-EPI: a one-volume
  # gradient-echo EPI named `sbref`, or on Siemens numbered 1000 above its
  # run (dcm2niix issue 816), which is evidence and not a construct.
  is_bold_series:
    all:
      - has_epi
      - is_time_series
      - {not: is_dwi}
      - {not: is_perfusion}
      - {not: is_asl}
      - {not: is_perfusion_derived}
      - {not: dsc_words}
      - {not: contrast_said}
      - {not: is_venbold}
  is_sbref:
    all:
      - is_gre_epi
      - {not: is_se_epi}
      - {not: is_dwi}
      - is_few_volumes
      - any:
          - {text: technique_text, matches: '(^|[^a-z])sbref([^a-z]|$)'}
          - all: [{text: manufacturer, prefix: siemens}, {field: series_number, ge: 1000}]
  is_bold_structural: {any: [is_bold_series, is_sbref]}

  # --- DCE: a 3D spoiled gradient echo repeated through a bolus. QIBA: at
  # least 5 baseline phases, 40 to 80 phases, under 10 s each; the archive:
  # no multiphase liver series held more than 5 time points. So 10 or more
  # time points in one series, not an angiography run, not PRESTO.
  is_dce_series:
    all:
      - is_3d
      - has_gre
      - {not: has_epi}
      - any: [has_spoiled, is_flash]
      - any:
          - {field: temporal_positions, ge: 10}
          # MRI pack 0.11.0: a classic Siemens dynamic FLASH (`fldyn3d`)
          # writes each time point as a series of its own, so no series holds
          # 10 of them. Its name with a time-to-contrast in its words
          # (`TTC=9.6s`, one per phase) stands for the run: a dynamic VIBE
          # with Clariscan was VI-GRE on the re-measure of 2026-09-28. Not a
          # map computed from one, and not a multiphase body study, which
          # names its phases `dyn` and holds at most 5.
          - all: [sequence_name.is_fldyn, dynamic_words, {not: is_perfusion_derived}]
      - {not: angio_words}
      - {not: presto_words}
      - {not: is_tof}
      - {not: is_pc}
  dynamic_words: {text: technique_text, matches: '(^|[^a-z])ttc([^a-z]|$)'}

  # --- MoCo. Nima's ruling (2026-09-28): a motion-corrected series written
  # ORIGINAL\PRIMARY is not derived, so its provenance follows value 1 of
  # its image type, and only a DERIVED one takes the reconstruction's. A
  # computed map is not decided this way: Siemens writes some as ORIGINAL
  # (dcm2niix issue 243; on the archive `ORIGINAL\PRIMARY\PERFUSION\NONE\
  # DIS2D\RELCBF`), and its own token decides it.
  is_derived_moco: {all: [has_moco, is_derived]}

  # === 12. MRI pack 0.11.0: the new constructs and the re-measure's fixes =====
  # `studies/2026-09-28-sequence-research/decisions.md` (ruled 2026-09-28)
  # and the rule bugs of `studies/2026-09-28-judge-remeasure/` and
  # `-remeasure-2/`, in the design repository.

  # --- localizers the words and the tri-plane shape say. The normalizer
  # spells `3-pl` as `3 - pl`, `Ö-SIKT` as `- sikt` and `SUR**` as
  # `surstarstar`, so the provenance keywords take those spellings; and a
  # series split by orientation into stacks of at most 5 slices each, with
  # no projection, angiography or cholangiography in it, is a tri-plane
  # scout whatever its words (Philips `sSSh_TSE` of 3 slices a plane,
  # `T2W_TSE/SUR**` of 5).
  is_tri_plane_scout:
    all:
      - {field: split_reason, eq: multi_orientation}
      - {field: n_slices, le: 5}
      - {not: is_mip}
      - {not: is_minip}
      - {not: is_projection}
      - {not: is_mpr}
      - {not: is_derived}
      - {not: {text: search_text, matches: '(^|[^a-z])(mip|tof|mrcp|mra|angio)([^a-z]|$)'}}

  # --- a 3D turbo spin echo from the train where the name says nothing. A
  # GE CUBE FLAIR and its reformats state SE\IR, segmented k-space, 3D and
  # an echo train of 140 to 180; a 2D FLAIR's train is 1 to about 30 and a
  # single shot's is not IR-prepared.
  is_3d_tse:
    any:
      - all: [is_tse, is_3d]
      - all:
          - is_3d
          - has_se
          - {not: has_epi}
          - {not: is_haste}
          - {field: echo_train_length, ge: 100}

  # --- a gradient echo named T2 is T2*-weighted: `t2_fl2d_tra_hemo`, a FLASH
  # of TE 26 ms, was T2w by its word [P8, MQ8].
  # MRI pack 0.18.0: from an echo time of 8 ms. A spoiled gradient echo has
  # no T2 contrast, so its name can only mean T2* (a Philips T2-weighted FFE
  # read T2w, sealed-1 A12); never Philips' T2-FFE or a Siemens PSIF, the
  # time-reversed steady state, whose contrast is T2.
  is_t2_named_gre:
    all:
      - has_gre
      - {not: has_se}
      - {not: has_epi}
      - {not: is_psif}
      - {field: echo_time, ge: 8}
      - {text: search_text, matches: '(^|[^a-z0-9])t2w?([^a-z0-9*]|$)'}
      - {not: {text: search_text, matches: 't2\*|t2star|t2 star'}}

  # --- diffusion: the tensor's outputs against a plain DWI's. Nima's ruling 7
  # (2026-09-27): an ADC or trace the scanner made from a plain DWI is
  # RawRecon; an FA or other tensor map, or a trace of a DTI, is DTIRecon.
  dti_words: {text: search_text, matches: '(^|[^a-z])(dti|tensor|hardi|fractional anisotropy|colfa|color fa|colour fa|md map|mean diffusivity)'}
  # MRI pack 0.18.0: an isotropic (trace) image is RawRecon even of a named
  # DTI: the trace is computed from the diffusion images, not from the
  # tensor (sealed-1 C11 and A15; the deep research, case 11; D3 for GE).
  # On the archive 140 Philips named-DTI isotropic images lacked Trace.
  is_plain_dwi_map:
    all:
      - any: [has_adc, has_eadc, has_trace, image_type.has_exp_diffusion, image_type.has_calc_bval, trace_image]
      - {not: has_fa}
      - any: [{not: dti_words}, has_trace, trace_image]
  eadc_words: {text: search_text, matches: 'eadc|exp adc|exponential adc'}

  # --- ASL: the difference image (DeltaM), the M0 scan, and GE's two passes
  # from its private ASL element (0043,xxA3): PSEUDOCONTINUOUS on the
  # perfusion-weighted pass, CONTINUOUS on the proton-density one (dcm2niix;
  # both research reports).
  ge_asl_pw: {text: ge_asl_contrast_technique, matches: '^\s*pseudocontinuous\s*$'}
  ge_asl_pd: {text: ge_asl_contrast_technique, matches: '^\s*continuous\s*$'}
  # The label-control difference: Siemens `ASL\SUB`, `ASL\SUBTRACTION` and
  # the `TTEST` it writes on the same image, GE `PERFUSION_ASL` or its PW
  # pass, Philips' `PERFUSION` image of an ASL (written ORIGINAL though
  # computed). Never a CBF map, which is its own construct.
  is_asl_difference:
    all:
      - {not: has_cbf}
      - {not: is_qmap}
      - any:
          - all: [is_asl, {any: [is_subtraction, is_ttest]}]
          - {parser: image_type, token: PERFUSION_ASL}
          - ge_asl_pw
          - all: [{text: manufacturer, prefix: philips}, is_perfusion, {any: [is_asl, asl_words]}]
  # GE's PD pass, from the header alone.
  is_asl_m0_stated:
    all:
      - is_asl_m0
      - any:
          - ge_asl_pd
          - all: [{text: manufacturer, prefix: ge}, is_asl, is_original]
  ge_pepolar: {all: [is_epi_fieldmap_ref, {text: ge_pulse_sequence_name, matches: 'pepolar'}]}
  is_sbref_numbered: {all: [is_sbref, {text: manufacturer, prefix: siemens}, {field: series_number, ge: 1000}]}
  m0_words: {text: technique_text, matches: '(^|[^a-z0-9])(m0|m0scan|m0 scan|m0 image)([^a-z0-9]|$)'}
  # The M0 (proton-density) scan of an ASL: GE's PD pass (`ORIGINAL\PRIMARY\
  # ASL`, or (0043,xxA3) CONTINUOUS), or a series named M0 beside an ASL
  # readout, never a map, a synthetic image or a SyMRI acquisition.
  is_asl_m0:
    all:
      - {not: is_asl_difference}
      - {not: has_cbf}
      - {not: is_qmap}
      - {not: is_synthetic}
      - {not: is_mdme}
      - {not: has_pd_map}
      - any:
          - all: [ge_asl_pd, {not: is_derived}]
          # MRI pack 0.18.0: never GE's Silent MRA, an ASL-prepared
          # zero-echo-time angiography (sealed-1 A19; the deep research, case 29).
          - all: [{text: manufacturer, prefix: ge}, is_asl, is_original,
                  {not: {parser: image_type, token: PERFUSION_ASL}}, {not: ge_asl_pw},
                  {not: silent_mra_named}]
          - all: [m0_words, {any: [is_asl, asl_words, has_epi, is_3d, is_spiral]}]

  # --- an EPI reference with the phase encoding reversed, for distortion
  # correction (BIDS `fmap/_epi`): a few volumes of EPI with no diffusion,
  # perfusion or ASL, named for it or GE's `epi_pepolar` sequence
  # (0019,xx9C). GE's `rsfMRI_FieldMap` of 4 time points was BOLD before
  # 0.10.0 and EPI after it; this names what it is.
  fieldmap_ref_words:
    text: search_text
    matches: 'pepolar|topup|blip|(^|[^a-z])(fmap|field ?map|reverse|rev ?pe|revpe|opposite ?pe|ap|pa)([^a-z]|$)'
  is_epi_fieldmap_ref:
    all:
      - has_epi
      - is_few_volumes
      - {not: is_dwi}
      - {not: is_asl}
      - {not: is_perfusion}
      - {not: is_perfusion_derived}
      - {not: is_sbref}
      - {not: is_derived}
      - {not: is_swi}
      - any:
          - {text: ge_pulse_sequence_name, matches: 'pepolar'}
          - fieldmap_ref_words

  # === MRI pack 0.13.0: the rule errors of dev-1 on pack 0.12.0 ============
  # (`studies/2026-09-28-dev-reference/pack-0130-errors.md` in the design
  # repository). Each flag says what it rests on.

  # A spin echo whose header states an echo train of three or more is a
  # turbo spin echo, whatever SequenceVariant says: old Philips and GE files
  # write SequenceVariant OTHER or NONE on a TSE, and a conventional spin
  # echo has one echo per excitation (EchoTrainLength 1, or 0 where unset).
  # dev-1: every stack settled SE had a train of 0 or 1, and three settled
  # TSE with 3, 5 and 16 were SE. Not a series split by echo, which is a
  # multi-echo spin echo or a dual-echo TSE (their own values), and never an
  # MDME, whose train is its own.
  se_echo_train:
    all:
      - has_se
      - {not: has_epi}
      - {not: has_gre}
      - {not: is_multi_echo}
      - {not: is_mdme}
      # MRI pack 0.15.0, Nima's ruling N2 (2026-09-30, record 48): on GE a
      # stated train of 2 is a turbo factor of 2. A dual-echo spin echo is
      # split into one stack per echo, so the split keeps it out above, and
      # GE's T1 FSE runs trains of 2 to 4 (dev-2 and dev-3: ten GE T1 spin
      # echoes of train 2, `TRF_GEMS`, settled TSE).
      - any:
          - {field: echo_train_length, ge: 3}
          - all: [{text: manufacturer, prefix: ge}, {field: echo_train_length, ge: 2}]
  # GE writes a PROPELLER fast spin echo with ScanningSequence RM (research
  # mode), so no spin-echo flag holds; it is named for its blades and has an
  # echo train (dev-1: three `T2 PROP` and `Silent Propeller` stacks with no
  # technique, settled TSE) [MQ16]. Not a diffusion PROPELLER, which is DWI.
  # MRI pack 0.14.0: and by GE's other spellings of it (`ksprop`,
  # `T2prop`, `PropFSE`, below), with any echo train: GE writes 1 on a
  # research-mode PROPELLER (dev-2: three T2 PROPELLERs of train 1 settled
  # TSE, and every PROPELLER there was a fast spin echo).
  propeller_fse:
    all:
      - {any: [is_radial, propeller_named]}
      - {not: has_epi}
      - {not: has_gre}
      - {not: is_dwi}
  # A fluid-attenuated inversion recovery from its inversion time: a spin
  # echo inverted 1,400 to 2,600 ms before its excitation nulls the signal
  # of CSF, whose T1 is about 4 s, at repetition times of 4.5 to 11 s
  # [IM3]. dev-1: every inversion-recovery spin echo in that window was
  # settled FLAIR or DIR, and the 21 the pack read as IR alone (reformats
  # whose names say nothing, Philips `3D_FLAIR` written `Axial` or
  # `COR_1mm`) were settled FLAIR. Not a double inversion recovery, whose
  # reported time is in the same window (a GE DIR reports 2,802 ms, and a
  # FLAIR at the longest repetition times about 2,500 ms, so the window
  # stops at 2,600), and never a gradient echo (an MP2RAGE's second
  # inversion) or an EPI.
  is_flair_by_ti:
    all:
      - has_ir
      - has_se
      - {not: has_gre}
      # MRI pack 0.18.0: or Siemens' inversion-prepared spin-echo EPI,
      # `epir`, FLAIR when its inversion time nulls CSF (the deep research,
      # cases 1 and 15)
      - any: [{not: has_epi}, sequence_name.is_epi_ir]
      - {not: is_mdme}
      - {not: is_dir}
      - {not: {text: search_text, substring: dir}}
      # MRI pack 0.14.0: and never a synthetic image or map, whose header
      # repeats the inversion time of the contrast it was computed for
      # (dev-2: 0.13.0 made a Siemens synthetic PD map, `tir2d2_5` at TI
      # 2,600 ms, a FLAIR).
      - {not: synthetic_or_map}
      - any:
          - all: [{field: inversion_time, ge: 1400}, {field: inversion_time, le: 2600}]
          # MRI pack 0.18.0: or an inversion time within 20 per cent of the
          # one that nulls CSF at the stated repetition time, below the
          # window above (the deep research, case 15; below, `ti_near_csf_null`)
          - all: [{field: inversion_time, ge: 300}, {field: inversion_time, lt: 1400}, ti_near_csf_null]
  # A short tau inversion recovery from its inversion time: under 300 ms on
  # an inversion-recovery spin echo nulls fat [IM3, MQ12], the window the
  # base rule `physics:ir_stir_like` already reads. dev-1: all 19 such spin
  # echoes with an inversion time were settled STIR; two the pack read as IR
  # (a Siemens `tir2d1` with no name, an Elscint IRFSE) were STIR too. Never
  # an MDME, whose saturation delay reads as a short inversion time.
  is_stir_by_ti:
    all:
      - ir_stated
      - has_se
      - {not: has_gre}
      - {not: has_epi}
      - {not: is_mdme}
      # MRI pack 0.14.0: nor a synthetic image or map (above).
      - {not: synthetic_or_map}
      - {field: inversion_time, gt: 0}
      - {field: inversion_time, lt: 300}
  # An inversion the file states as such (ScanningSequence, ScanOptions or
  # the sequence name), not an inversion time alone, which a vendor may
  # write for a spectral fat-suppression delay.
  ir_stated:
    any:
      - scanning_sequence.has_ir
      - scanning_sequence.has_irfse
      - scan_options.has_ir
      - scan_options.has_ir_gems
      - sequence_name.is_ir_tse
      - sequence_name.is_ir_fse
      - {text: search_text, matches: '(^|[^a-z])(stir|tirm|irfse|ir-fse|ir fse)'}
  # Black blood by name: a DANTE preparation (Siemens `dante` in the
  # sequence name) or Philips' `BB` (`3D T1 BB`, the black-blood VISTA).
  black_blood_named: {text: search_text, matches: '(^|[^a-z0-9])(bb|dante)([^a-z0-9]|$)|-dante-'}
  # Philips MultiVane by its protocol shorthand, `MV` or `MV150` (dev-1:
  # three `T2W_MV...` stacks settled Radial).
  multivane_named: {all: [{text: manufacturer, prefix: philips}, {text: search_text, matches: '(^|[^a-z0-9])mv[0-9]*([^a-z0-9]|$)'}]}
  # Philips' water-selective 3D gradient echo, WATS (a water excitation).
  wats_named: {text: search_text, matches: '(^|[^a-z0-9])wats'}
  # A Siemens `t1_mpr` protocol is an MPRAGE (the `mpr` is the sequence, not
  # a reformat): a 3D gradient echo of a long repetition time, which only an
  # inversion-prepared one has.
  t1_mpr_named:
    all:
      - {text: search_text, matches: '(^|[^a-z0-9])t1w mpr (ns|sag|tra|cor|iso|p2)'}
      - has_gre
      - {not: has_epi}
      - {field: repetition_time, ge: 1000}
  # A reformat made on a PACS workstation (Sectra), which writes a thick-slab
  # average as `DERIVED\SECONDARY\<plane>\AVERAGE` or `DERIVED\SECONDARY\OTHER\AVERAGE`
  # and often no name, or names itself (dev-1: four such stacks settled
  # ProjectionDerived and MPR).
  is_workstation_reformat:
    all:
      - image_type.is_derived
      - image_type.is_secondary
      - {not: image_type.is_primary}
      - {not: is_mip}
      - {not: is_minip}
      - any:
          - image_type.has_average
          - {text: search_text, substring: sectra reconstruction}
  # Philips' `PROJECTION IMAGE` on a diffusion image with a b value is its
  # computed isotropic image, not a reformat (dev-1: a `b1000` stack).
  # MRI pack 0.14.0: or its b=0 image, named `b0` (dev-2: a Philips `b0`
  # written `PROJECTION IMAGE\M\SE` was a reformat).
  is_diffusion_projection: {all: [image_type.is_projection_image, {any: [has_positive_b_value, b0_named]}]}
  # The isotropic (trace) diffusion image by Philips' and GE's names:
  # `isob-1000`, `isoDiff`, GE's `Isotropic Image`.
  trace_named: {text: search_text, matches: '(^|[^a-z0-9])iso\s*-?\s*(b\s*-?\s*[0-9]|diff|dwi)|isotropic image'}
  # A b=0 image of a Philips diffusion named `sb0` or `b0`: the Philips
  # diffusion is written as a spin echo (its EPI factor as the echo train),
  # so without a b value nothing says diffusion. Never a B0 field map.
  b0_named:
    all:
      - {text: search_text, matches: '(^|[^a-z0-9])s?b0([^a-z0-9]|$)'}
      - {not: {text: search_text, substring: map}}
      - {not: has_gre}
  # GE's DTI outputs by their names: `AvDC` (the average diffusion
  # coefficient, the mean diffusivity), `FA`, and `Exp attenuation` (the
  # exponential ADC).
  md_named: {text: search_text, matches: '(^|[^a-z0-9])avdc([^a-z0-9]|$)'}
  # MRI pack 0.14.0: and GE's prefixes on the same outputs of a DTI,
  # `FA-<series>`, `ExpAtt-<series>` (written ORIGINAL\PRIMARY\OTHER with the
  # b value of their source; dev-2: nine stacks).
  fa_named:
    any:
      - {all: [image_type.is_derived, {text: search_text, matches: '^fa( |$)'}]}
      - {all: [{text: manufacturer, prefix: ge}, {text: search_text, matches: '^fa\s*-\s'}]}
      # MRI pack 0.18.0: the FA of a GE DTI whose header a third-party
      # toolkit rewrote with numbers, named FA (sealed-1 A9).
      - {all: [ge_numeric_header, {text: search_text, matches: '(^|[^a-z])fa([^a-z]|$)'}]}
  eadc_named: {text: search_text, matches: 'exp attenuation|^expatt\s*-\s'}
  # GE's eigenvectors of a tensor, `Evec1-<series>` to `Evec3-`: a tensor's
  # output, DTIRecon under ruling 7 (dev-2).
  evec_named: {all: [{text: manufacturer, prefix: ge}, {text: search_text, matches: '^evec[1-3]?\s*-\s'}]}
  tensor_output_named: {any: [fa_named, evec_named]}
  # Elscint's filtered images: `ENHANCED` in ScanOptions. The name of the
  # filter file (`CVE:STD9_enh_06.par`) is on unfiltered series too, and
  # dev-1 settled Filtered only where ScanOptions says ENHANCED. GE's `FL:`
  # prefix names a filtered copy as `FILTERED` does.
  is_elscint_filtered: {all: [{text: manufacturer, prefix: elscint}, scan_options.has_enhanced]}
  is_ge_fl_prefix: {all: [{text: manufacturer, prefix: ge}, {text: search_text, matches: '^fl [a-e] '}]}
  # MRI pack 0.18.0: without Elscint's `ENHANCED`, which is routine
  # reconstruction filtering and changes nothing an image depicts: no
  # construct (the deep research, case 10; the archive's 68 Elscint stacks,
  # all with the token in ScanOptions).
  is_filtered_named: is_ge_fl_prefix
  # Nima's ruling (2026-09-29, record 48, group 6): a GE calibration scan
  # (ASSET, `3D Calibration`, `Cal ...`) is no localizer. It is an acquired
  # image and a fast spoiled gradient echo.
  ge_calibration:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: search_text, matches: '(^|[^a-z])(calibration|kalibrering|cal)([^a-z0-9]|$)'}
  # GE's prospective motion correction, PROMO, in ScanOptions.
  has_promo: scan_options.has_promo_gems
  # SyMRI's tissue maps (`DERIVED\PRIMARY\CSF`, WM, GM): quantitative maps
  # of a partial volume, with no base contrast.
  # MRI pack 0.14.0: never a synthetic weighted image, which may name a
  # tissue it adds (Philips `DERIVED\PRIMARY\T2\SYNTHETIC\CSF`, a synthetic
  # T2w "+ CSF" that 0.13.0 made a CSF map; dev-2).
  is_symri_tissue_map:
    all:
      - {parser: image_type, any_token: [CSF, WM, GM]}
      - {not: {parser: image_type, token: SYNTHETIC}}
      - {not: is_synthetic}

  # === MRI pack 0.14.0: the rule errors of dev-2 on pack 0.13.0 ============
  # (`studies/2026-09-29-dev2-reference/results.md` in the design
  # repository). Each flag says what it rests on.

  # A synthetic image, a map, or an image generated from other images: its
  # inversion time is the one it was computed for, not an inversion it was
  # acquired with. Siemens writes a synthetic image's ScanningSequence as
  # GENERATED, and names it (`Synthetic MR IR`, `PD map`).
  synthetic_or_map:
    any:
      - is_synthetic
      - is_qmap
      - has_pd_map
      - scanning_sequence.is_generated
      - {text: search_text, matches: 'synthetic|symri|(^|[^a-z])map([^a-z]|$)'}

  # A FLAIR by its words, its flags or its inversion time, on a spin-echo
  # readout, is an inversion-recovery turbo spin echo: every 2D and 3D FLAIR
  # is one [IM3, MQ12]. GE writes a FLAIR as ScanningSequence IR alone, RM
  # (research mode) or `mrcflair`, and Philips as `M_IR` with SE absent, so
  # neither `has_se` nor a train needs to hold; only a gradient echo, an EPI,
  # an MDME or a synthetic image is kept out (dev-2: 28 FLAIRs with no
  # technique, settled IR-TSE).
  flair_tse:
    all:
      - any: [is_flair, is_flair_by_ti, {text: technique_text, substring: flair}]
      # MRI pack 0.16.0: never a dual-echo spin echo that only its name
      # calls FLAIR (dev-4, H3).
      - {not: flair_named_dual_echo}
      - any: [has_se, scanning_sequence.has_ir, scanning_sequence.has_research, image_type.hint_ir]
      - {not: has_gre}
      - {not: has_epi}
      - {not: is_mdme}
      - {not: synthetic_or_map}
  is_ir_tse_readout: {any: [{all: [has_ir, is_tse]}, flair_tse]}
  # GE's PROPELLER by its other names: `ksprop`, `T2prop`, `T1FLAIRprop`,
  # `PropFSE` and a misspelt `PROPPELLER` (dev-2: eleven stacks without
  # Radial). The normalizer already makes `prop` alone `propeller`.
  # MRI pack 0.16.0: or `PROPks` (dev-4: a GE `Ax T1 FLAIR PROPks`, dev-2's
  # B2 on a spelling 0.14.0 did not reach).
  # MRI pack 0.18.0: read from the technique's text, which leaves out GE's
  # exam-level ProtocolName: a PROPELLER named in the exam protocol is not
  # this series' readout (sealed-1 A11).
  propeller_named: {text: technique_text, matches: 'prop(p?eller|fse|ks)?([^a-z]|$)'}
  # MRI pack 0.16.0: or a Siemens BLADE by its sequence name (parsers.yml,
  # `is_blade_tse`).
  radial_named: {any: [multivane_named, propeller_named, sequence_name.is_blade_tse]}
  # A GE spin echo written in research mode: ScanningSequence RM, so no
  # readout is stated, but a flip of 80 degrees or more and an echo time of
  # 8 ms or more, which a gradient echo does not have outside an EPI.
  # Never a diffusion, perfusion, BOLD or SWI series, or a time series
  # (dev-2: eight GE `SAG T2`, `AX T2` and `T1 Variab Flip` stacks, with
  # trains of 22, 14 and 1, settled TSE and SE).
  ge_research_se:
    all:
      - {text: manufacturer, prefix: ge}
      - scanning_sequence.has_research
      - {not: scanning_sequence.has_gre}
      - {not: scanning_sequence.has_epi}
      - {not: has_positive_b_value}
      - {not: is_time_series}
      - {not: {text: search_text, matches: 'epi|diff|dwi|dti|swi|swan|asl|perf|bold|fmri|probe|spectro'}}
      - {field: flip_angle, ge: 80}
      - {field: echo_time, ge: 8}
  # A multi-echo gradient echo by its name: Siemens' FLASH names its echoes
  # after the plane (`fl2d8`, eight echoes; `fl3d1r` has one), or the words
  # say `8 echoes` (dev-2: two Siemens 8-echo T2* stacks read as SP-GRE
  # and GRE, settled ME-GRE).
  me_gre_named:
    all:
      - {not: has_se}
      - {not: has_epi}
      - any:
          - {text: text_sequence_name, matches: '^\*?(wip_?)?fl[23]d([3-9]|[1-9][0-9])'}
          - {text: technique_text, matches: '(^|[^0-9])([3-9]|[1-9][0-9]) ?echoes'}
  is_me_gre: {any: [{all: [is_multi_echo, has_gre]}, me_gre_named]}
  # Philips' multi-echo FFE combined into one image (mFFE, the sum over its
  # echoes): a 2D or 3D FFE, steady state, whose echo train states 3 to 16
  # echoes and whose series is not split by echo (dev-2: a Philips `sCum`
  # of the same acquisition as the `mFFE` Nima ruled comb-ME-GRE).
  philips_mffe:
    all:
      - {text: manufacturer, prefix: philips}
      - scanning_sequence.has_gre
      - sequence_variant.has_steady_state
      - {not: has_epi}
      - {not: is_multi_echo}
      - {not: has_mag_prepared}
      - {field: echo_train_length, ge: 3}
      - {field: echo_train_length, le: 16}
  # GE's fast spoiled gradient echo, FSPGR, states `FAST_GEMS` in ScanOptions
  # (dev-2: a 3D SPGR with it read as SP-GRE, settled FSP-GRE). Only a
  # spoiled one: GE writes `FAST_GEMS` on its steady-state FGRE and FIESTA
  # too (SequenceVariant SS without SP; the three-plane scouts, and a FIESTA
  # dev-1 settled bSSFP), which are no spoiled gradient echo.
  # MRI pack 0.18.0: or a gradient echo GE names SPGR (in its pulse
  # sequence or words) with `FAST_GEMS`, and a TRICKS, a time-resolved 3D
  # fast spoiled gradient echo (the deep research, cases 7 and 33; on the
  # archive 114 TRICKS stacks, all `SK\SS` with `FAST_GEMS`).
  ge_fspgr:
    all:
      - {text: manufacturer, prefix: ge}
      - scan_options.has_fast_gems
      - any: [has_spoiled, ge_spgr_named, tricks_named]
      - has_gre
      - {not: has_se}
      - {not: has_epi}
  # An inflow (time-of-flight) angiography by its words: a 3D gradient echo
  # named for angiography, of a repetition time a contrast run does not use
  # (a CE-MRA's is under 10 ms), with no contrast and no phase contrast
  # (dev-2: two Siemens `fi3d1tun` `ANGIO` stacks read as GRE, settled TOF).
  tof_by_words:
    all:
      - {text: technique_text, matches: '(^|[^a-z])(angio|mra)'}
      - is_3d
      # MRI pack 0.15.0: or an old Siemens inflow sequence named `tun`,
      # written in research mode (below).
      - any: [has_gre, siemens_tun_named]
      - {not: has_epi}
      - {not: is_pc}
      - {not: contrast_said}
      - {field: repetition_time, ge: 15}
  # Philips' MobiView images are composed from stations (dev-2: three).
  # MRI pack 0.18.0: or named as composed (Philips' composed spine images,
  # sealed-1 A15).
  composed_named: {text: search_text, matches: 'mobiview|(^|[^a-z])(composed|composing)([^a-z]|$)'}
  # A series named for radial MIP views (`MIP_Radials`) is a set of rotated
  # projections, not a radial acquisition (dev-2: a TOF MIP read as Radial).
  radial_views_named: {all: [{text: search_text, matches: 'radials'}, {any: [is_mip, is_minip, is_mpr, projection_named]}]}
  # A magnetisation transfer the words switch off: `utan MTC` (without),
  # `MT=OFF` (dev-2: a TSE read as MT and a 3D SPGR as MTw).
  mt_negated:
    text: search_text
    matches: '(^|[^a-z])(utan|without|ej|no|non)\s*-?\s*(mtc|magnetization-transfer)|(mtc|magnetization-transfer)\s*-?\s*(off|no|0)([^a-z0-9]|$)'
  # Philips' SmartExam brain survey, `SmartBrain`: a localizer, whatever its
  # 3D TFE says (dev-2: read as a ProjectionDerived MPRAGE).
  smart_survey: {text: search_text, matches: 'smartbrain|smart brain|smartexam'}
  # A spectroscopy acquisition (GE `PROBE-SV`, `PROBE-P`, a CSI): no image
  # contrast at all (dev-2: a GE PROBE left with an empty base, settled none).
  is_spectroscopy: {text: search_text, matches: '(^|[^a-z])(probe\s*-?\s*(sv|p|s|press|steam)?|spectroscopy|svs|csi)([^a-z]|$)'}
  # A GE SWI image as the scanner acquired it: GE names its computed outputs
  # with a prefix (`SWI:`, `SWIphase:`, `mIP:`), and an `Ax SWI 3D...` written
  # ORIGINAL with none is the magnitude (dev-2: three read as the SWI image).
  ge_swi_unprefixed:
    any:
      - ge_swi_unprefixed_named
      # MRI pack 0.18.0: an echo of a multi-echo SWI written ORIGINAL with
      # no SWI token, whoever wrote the file (a third-party copy of a GE
      # SWAN, sealed-1 A19): an acquired echo, RawRecon and T2*w
      # (convention 1).
      - swi_acquired_echo
  ge_swi_unprefixed_named:
    all:
      - {text: manufacturer, prefix: ge}
      - image_type.is_original
      - {not: image_type.is_derived}
      - {not: has_swi}
      - {not: has_phase}
      - {not: is_mip}
      - {not: is_minip}
      - {text: search_text, substring: swi}
      - {not: {text: search_text, matches: '^(swi|swiphase|swi phase|mip|minip|min ip|pha|phase|qsm)( |$)'}}
      - {not: {text: search_text, substring: swan}}

  # === MRI pack 0.15.0: Nima's rulings on pack 0.14's disputes, and dev-3's ===
  # rule errors on pack 0.14.0 (record 48, "Rulings on pack 0.14's disputes"
  # and "N6 and N11 after the look-up", 2026-09-30;
  # `studies/2026-09-29-dev2-reference/disputes-0140.md` and
  # `studies/2026-09-29-dev3-reference/results.md` in the design repository).

  # --- N3: a diffusion read out by a turbo spin echo (DWI-TSE): Philips'
  # DWI-TSE, a PROPELLER, BLADE or MultiVane diffusion, a HASTE diffusion.
  # Read from a diffusion flag with a stated spin echo, a train and no EPI.
  # Philips writes its EPI diffusion as a spin echo too (ScanningSequence SE,
  # its EPI factor as the echo train, and `DwiSE` in its private scanning
  # technique on its DWI-TSE as well: 5,212 stacks on the archive), so "no
  # EPI" must be said by something that names the turbo readout: the words,
  # the radial or single-shot readout, or the pixel bandwidth. An EPI
  # readout is sampled at 1,000 Hz per pixel or more; every Philips `DwiSE`
  # stack under 600 Hz on the archive (12) is in a study that runs a DWI-TSE.
  dwi_tse_named: {text: technique_text, matches: '(^|[^a-z])(tse|fse|ssfse|haste|propeller|blade|multivane)([^a-z]|$)'}
  philips_dwi_tse_bandwidth:
    all:
      - {text: manufacturer, prefix: philips}
      - {field: echo_train_length, ge: 2}
      - {field: pixel_bandwidth, gt: 0}
      - {field: pixel_bandwidth, lt: 600}
  # GE's PROPELLER diffusion is read apart: GE writes it with ScanningSequence
  # RM or SE, so no spin echo or no diffusion flag holds (`is_dwi` leaves out
  # a GE b value beside a stated non-EPI readout, since GE writes b values on
  # SSFSE localizers and spin echoes too). Its PROPELLER readout and its
  # diffusion named together say it (the archive: a `DWI PROP` acquisition
  # at b=1000, read as DWI-EPI, whose own ADC maps were DWI-TSE).
  dwi_tse:
    any:
      - all:
          - is_dwi
          - has_se
          - {not: has_epi}
          - {not: has_gre}
          - any: [{field: echo_train_length, ge: 2}, is_radial, propeller_named, is_haste]
          - any: [dwi_tse_named, sequence_name.is_blade_diff, is_haste, is_radial, philips_dwi_tse_bandwidth]
      - all:
          - {text: manufacturer, prefix: ge}
          - has_positive_b_value
          - any: [is_radial, propeller_named]
          - {text: technique_text, matches: '(^|[^a-z])(dwi|dti|diff)'}
          - {not: has_epi}
          - {not: has_gre}

  # --- N4: Philips writes its computed isotropic diffusion image as
  # `PROJECTION IMAGE` (the pack reads it so since 0.13.0, to keep it from
  # being a reformat, `is_diffusion_projection`), so such an image with a
  # positive b value is the trace, named or not. Never its b=0 image, a
  # maximum or minimum projection, or a map.
  philips_trace_projection:
    all:
      - {text: manufacturer, prefix: philips}
      - image_type.is_projection_image
      - has_positive_b_value
      - {not: b0_named}
      - {not: is_mip}
      - {not: is_minip}
      - {not: projection_named}
      - {not: {text: search_text, matches: '(^|[^a-z])(e?adc|fa)([^a-z]|$)'}}
  # MRI pack 0.18.0: or Philips' private diffusion direction `I` (2001,1004),
  # its isotropic image; the standard (0018,9075) ISOTROPIC is absent on
  # every Philips DTI of the archive, where (2001,1004) marks 81 of its 140
  # isotropic images (the deep research, case 11; `empirical-conventions.md`).
  trace_image: {any: [trace_named, philips_trace_projection, philips_isotropic_private]}

  # --- R1: a GE SWI written in research mode (ScanningSequence RM) with an
  # echo train of 32 or more is an EPI: a train of 48 inside a repetition
  # time of 62 ms is an echo spacing of about 1 ms, an EPI factor and not 48
  # echoes. GE's multi-echo SWI (SWAN) at a train of 16 and TR 117 ms stays
  # ME-GRE, as dev-1 and dev-2 settled it.
  ge_swi_epi_train:
    all:
      - {text: manufacturer, prefix: ge}
      - scanning_sequence.has_research
      - {field: echo_train_length, ge: 32}

  # --- dev-3, G1: GE's steady-state gradient echo, GRASS or MPGR: written
  # ScanningSequence GR and SequenceVariant SS without SP, the unspoiled
  # (steady-state) gradient echo the vocabulary files under SS-GRE, which
  # only Siemens `fi` detected. GE writes SS on its balanced FIESTA and its
  # fast FGRE too, at repetition times under 10 ms, so a repetition time of
  # 20 ms or more keeps them out (dev-3: six `Ax MPGR`, `SC:AX T2 GRE` and
  # `Ax T2* suscept GRE` stacks at TR 500 to 900 ms, settled SS-GRE).
  ge_grass:
    all:
      - {text: manufacturer, prefix: ge}
      - scanning_sequence.has_gre
      - has_steady_state
      - {not: has_spoiled}
      - {not: has_mag_prepared}
      - {not: has_epi}
      - {not: has_se}
      - {field: repetition_time, ge: 20}

  # --- dev-3, G3: GE's MAGiC acquisition (the multi-dynamic multi-echo
  # spin echo SyMRI reads) named `Qmap` or `MAGiC`, written in research mode
  # with no sequence name, split by echo or by saturation delay (dev-3: an
  # `Ax Qmap Head` read as a dual-echo TSE, settled MDME) [P24].
  ge_magic_acquisition:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: search_text, matches: '(^|[^a-z])(qmap|magic)([^a-z]|$)'}
      - {not: image_type.is_derived}
      - {not: has_epi}
      - {not: has_gre}
      - any: [is_multi_echo, is_multi_ti]
      - {field: echo_train_length, ge: 2}

  # --- dev-3, B14: an old Siemens inflow angiography (MAGNETOM Vision,
  # `tun_s`), written in research mode, so no gradient echo is stated; the
  # name is the inflow sequence as `fi3d1tun` is (dev-3: two
  # `MRA_FAST_FLOW` stacks with no technique, settled TOF).
  siemens_tun_named:
    all:
      - {text: manufacturer, prefix: siemens}
      - {text: text_sequence_name, matches: '^\*?(fi[23]d[0-9]*)?tun'}

  # === MRI pack 0.16.0: dev-4's rule errors ================================

  # --- dev-4, H1: Siemens' BLADE turbo spin echo named by its sequence
  # alone, `*tseB2d1_17`, is Radial. 0.15.0 read Radial from the words
  # only; `tseBR` gave the restore (VFA-TSE) and no Radial (an ESSENZA
  # `t2_tse_tra`; dev-1 and dev-4 settled Radial on every `tseB` stack). The flag is in `radial_named` above; on the archive, 19
  # `tseB` stacks carry no BLADE word.

  # --- dev-4, H2: a reformat whose name gives another plane than the
  # protocol it was made from: a derived image of a 3D acquisition named
  # `Cor` or `Ax` from a protocol named `Sag` (dev-4: a Terra.X `Cor T1
  # MP2RAGE 2mm` from `Sag 3D T1 MP2RAGE`, written
  # `DERIVED\PRIMARY\T1\UNIFORM`, settled ProjectionDerived with MPR and
  # Uniform). Axial and transverse are one plane. Never a projection or
  # Siemens' position display. On the archive, 37 derived 3D stacks meet it
  # that no other reformat rule reached, every one a plane reformat by its
  # name (MP2RAGE, SPACE FLAIR, MPRAGE and `ax reformat`).
  plane_reformat_named:
    all:
      - image_type.is_derived
      - is_3d
      - {not: image_type.is_posdisp}
      - {not: is_mip}
      - {not: is_minip}
      - {not: projection_named}
      - {text: text_protocol_name, matches: '(^|[^a-z])(sag|cor|ax|tra)([^a-z]|$)'}
      - any:
          - all:
              - {text: text_series_description, matches: '(^|[^a-z])sag([^a-z]|$)'}
              - {not: {text: text_protocol_name, matches: '(^|[^a-z])sag([^a-z]|$)'}}
          - all:
              - {text: text_series_description, matches: '(^|[^a-z])cor([^a-z]|$)'}
              - {not: {text: text_protocol_name, matches: '(^|[^a-z])cor([^a-z]|$)'}}
          - all:
              - {text: text_series_description, matches: '(^|[^a-z])(ax|tra)([^a-z]|$)'}
              - {not: {text: text_protocol_name, matches: '(^|[^a-z])(ax|tra)([^a-z]|$)'}}

  # --- dev-4, H3: a dual-echo spin echo named FLAIR is no FLAIR when
  # nothing in its header inverts: split by echo, no inversion time, no
  # inversion recovery stated, no gradient echo or EPI (dev-4: a MAGNETOM
  # Vision `FLAIR`, sequence `tse2-5`, TR 4,761 ms, TE 22 ms, settled TSE,
  # no modifier and PDw; both adjudicators cite the missing inversion). A
  # FLAIR is one echo. On the archive, the 20 stacks named FLAIR that are
  # split by echo with no inversion time and a spin-echo name are all the
  # Vision's `tse2-5` at TE 22 and 90 ms. The name then decides nothing:
  # the dual-echo rules read the echo.
  flair_named_dual_echo:
    all:
      - is_multi_echo
      - {text: search_text, substring: flair}
      - {not: has_ir}
      - {not: {field: inversion_time, gt: 0}}
      - {not: has_gre}
      - {not: has_epi}

  # --- dev-4, H4: a Siemens acquired diffusion image whose protocol is
  # named for the ADC it also makes (`ep2d_diff_trace_ADC`): ORIGINAL, a b
  # value above 0, and no ADC in the image type. Siemens writes ADC in the
  # image type of every ADC map (on the archive, all of the Symphony's), so
  # the word in the name is the protocol's and not this image's (dev-4: two
  # Symphony `ORIGINAL\PRIMARY\M\ND` stacks at b 1000 read ADC; on the
  # archive, 206 such stacks, all `M\ND`). The map is its own series.
  siemens_acquired_diffusion:
    all:
      - {text: manufacturer, prefix: siemens}
      - image_type.is_original
      - {not: image_type.has_adc}
      - has_positive_b_value

  # --- dev-4, H5: GE's IDEAL writes its outputs as `OutPhase:`, `InPhase:`,
  # `WATER:` and `FAT:` before the series name; InPhase read `inphase`, and
  # OutPhase now reads `outphase` (axes/construct.yml).

  # === MRI pack 0.18.0: sealed-1's rule bugs and the vendor conventions =====
  # The sealed-1 checkpoint's rule-bug groups A1 to A20
  # (`studies/2026-09-28-certificate/checkpoint-r7-results.md`), the deep
  # research on vendor conventions (`deep-research-conventions.md`, Part A,
  # cases 1 to 35), the archive counts (`empirical-conventions.md`) and
  # record 48's rulings, in the design repository. Nima, 2026-09-30: the
  # conventions follow the deep research, except where our archive's counts
  # or our vocabulary overrule it. No stack below comes from a header: each
  # is written from the pattern those files name.

  # --- A9 and case 24: GE headers whose ScanOptions (and sometimes
  # ScanningSequence) a third-party toolkit rewrote as numbers (fo-dicom 5 on
  # all 1,731 archive stacks; ScanOptions `1140850688` and six other codes,
  # ScanningSequence `EP\SE`, `2` or `GE`). The codes are documented
  # nowhere, so the names decide.
  # --- A16 and case 7: the steady-state gradient echoes GE writes as SS-GRE:
  # GRASS and MPGR (dev-3, G1) and the fast `SS\SK` echo of the
  # re-adjudication's ruling (below).
  ge_steady_state_gre: {any: [ge_grass, ge_fast_ss]}

  # --- case 13: GE's FIESTA-C is CISS, and only its name says so (its pulse
  # sequence `efgre3d`, ScanOptions and SequenceVariant are plain FIESTA's;
  # 16 archive stacks named FIESTA-C, all stored bSSFP). The keywords it
  # replaces, `fiesta-c` and `fiesta c`, missed the normalizer's `fiesta - c`
  # and matched `FIESTA COR` (9 plain FIESTA stacks stored CISS).
  fiesta_c_named: {text: search_text, matches: 'fiesta\s*(-\s*)?c([^a-z0-9]|$)|fiestac'}

  # --- the stated forms of the three SyMRI maps, by token or by name
  # (A15: a Philips QMAP T2 map).
  qmap_t1_stated: {any: [image_type.has_qmap_t1, qmap_t1_named]}
  qmap_t2_stated: {any: [image_type.has_qmap_t2, qmap_t2_named]}
  qmap_pd_stated: {any: [image_type.has_qmap_pd, qmap_pd_named]}
  # --- case 30: the exponential ADC by Siemens' `EXP` token (196 archive
  # stacks, none stored eADC) or GE's name.
  eadc_stated: {any: [eadc_named, image_type.has_exp_diffusion]}
  # --- A1: the maps and runs PerfusionRecon reads beyond the image type's tokens.
  perfusion_recon_extra: {any: [{all: [is_perfusion, is_derived_moco]}, perfusion_map_named, derived_moco_dsc]}
  # --- A14, A15: projections and reformats by what the header says.
  projection_extra: {any: [stddev_projection, minip_named_projection, radial_reformat_named]}

  ge_numeric_header:
    all:
      - {text: manufacturer, prefix: ge}
      - any:
          - {text: scan_options, matches: '^\s*[0-9]+\s*$'}
          - {text: scanning_sequence, matches: '^\s*[0-9]+\s*$'}
  # Nor where Siemens' sequence name says a spin-echo EPI (`epse`, `epir`),
  # which old Siemens software writes `EP\GR` (the 11 classic `epse` and
  # `epir` headers of the archive; the deep research, case 1: the name
  # overrides ScanningSequence).
  ss_gre_stated:
    all:
      - {not: sequence_name.is_epi_se}
      - {not: sequence_name.is_epi_ir}
      - any:
          - {parser: scanning_sequence, any_token: [GR, FE, FE3D]}
          - all: [{parser: scanning_sequence, token: GE}, {not: ge_numeric_header}]
  ge_numeric_diffusion_named:
    all:
      - ge_numeric_header
      - {text: search_text, matches: '(^|[^a-z])(dti|dwi|diff|diffusion|tensor|fa|adc|isoadc|avdc|b0|b1000|isotropic|trace|expatt)([^a-z]|$)|exp attenuation'}

  # --- A6 and case 22: an enhanced MR object states no ScanningSequence,
  # and our packets and registry carry none of the MR Pulse Sequence
  # Module's attributes, so the mapping table of PS3.3 C.8.13.4 cannot run.
  # What the header holds is its echo train and flip angle: an excitation of
  # 90 degrees or more with a train of three or more echoes is a turbo spin
  # echo (SPIN with multiple echoes per excitation, the table's TSE and
  # 3D-TSE), which the rules then read as they read any spin echo. Never a
  # diffusion, perfusion or EPI series, whose train is the EPI factor.
  se_by_train_unstated:
    all:
      - {field: scanning_sequence, present: false}
      - {not: ss_gre_stated}
      - {not: image_type.hint_gre}
      - {not: sequence_name.is_gre}
      - {not: sequence_name.is_gre_stem}
      - {not: philips_gre_technique}
      - {not: philips_feepi}
      - {field: echo_train_length, ge: 3}
      - {field: flip_angle, ge: 90}
      - {not: has_positive_b_value}
      - {not: image_type.has_diffusion}
      - {not: image_type.has_perfusion}
      - {not: {text: search_text, matches: '(^|[^a-z])(epi|dwi|dti|diff|diffusion|perf|perfusion|dsc|asl|bold|fmri|ffe|fe|gre|swi|tof|pca)([^a-z]|$)'}}

  # --- A2 and case 18: a DSC EPI named for susceptibility is perfusion,
  # never SWI. SWI needs a non-EPI gradient echo or an SWI token; an EPI time
  # series or a `PERFUSION` image type is the bolus (high confidence).
  dsc_not_swi:
    all:
      - {not: image_type.has_swi}
      - has_epi
      - any: [{all: [is_perfusion, {not: is_asl}]}, is_time_series, is_dsc_series, {text: technique_text, matches: 'ep2d\s*perf'}]

  # --- A1 and case 17: a DSC map named for what it is, and a derived
  # motion-corrected DSC run (Nima's MoCo ruling, 2026-09-28), are
  # PerfusionRecon. Not an ASL map, and not a series whose header states a
  # readout that is not EPI (8 archive stacks with a map word are IR-TSE
  # images).
  perfusion_map_named:
    all:
      - perfusion_map_words
      - {not: is_time_series}
      - {not: is_asl}
      - {not: asl_words}
      - {not: is_spiral}
      - {not: says_not_epi}
  derived_moco_dsc:
    all:
      - is_derived_moco
      - has_epi
      - {not: is_asl}
      - {not: asl_words}
      - {not: is_dwi}
      - any: [is_perfusion, is_dsc_series, dsc_words, contrast_said]

  # --- case 8: a single-volume DSC, `PERFUSION` written ORIGINAL with one
  # volume, is physically a T2*-weighted gradient-echo EPI (the deep
  # research: Perfusion-EPI, base T2starw). NumberOfTemporalPositions is
  # absent on 27 of the archive's 29 such stacks, so one volume is read as
  # the file allows: one temporal position, one mosaic image, or no more
  # images than slice positions.
  single_volume_dsc:
    all:
      - is_perfusion
      - {not: is_asl}
      - is_original
      - {not: is_perfusion_derived}
      - has_epi
      - any:
          - {field: temporal_positions, eq: 1}
          - all: [{field: temporal_positions, present: false}, is_mosaic, {field: n_instances, le: 1}]
          - all: [{field: temporal_positions, present: false}, {not: is_mosaic}, {field: n_instances, gt: 0}, {field: n_instances, le: {field: n_slices}}]

  # --- A3 is `hint_pca` (parsers.yml).

  # --- C2 and case 2: GE's `VASCTOF_GEMS` is a template flag, documented
  # nowhere, that GE's contrast MRA protocols carry too. It says TOF only
  # where nothing says otherwise: no contrast agent or contrast word, no
  # multiphase (`MP_GEMS` or more than one time point), no SPGR or contrast
  # MRA words (the deep research, case 2; on the archive 95 SPGR-named and
  # 20 contrast-MRA-named stacks of its 498 were stored TOF-MRA). A series
  # whose words say TOF is still TOF by the value's keywords.
  ge_vasctof_as_tof:
    all:
      - scan_options.has_tof_gems
      - {not: contrast_said}
      - {not: {text: technique_text, matches: '(^|[^a-z])(ce|cemra|bolus|fluoro|smartprep|contrast|tricks)([^a-z]|$)'}}
      - {not: scan_options.has_mp_gems}
      - {not: {field: temporal_positions, gt: 1}}
      - {not: ge_spgr_named}

  # --- A4 and case 20: Philips' `s3DI` names a 3D inflow (time-of-flight)
  # acquisition and its projections. The token is in names only (45 archive
  # stacks; pack 0.15 read 21 TOF and 24 SP-GRE, v0 22 TOF); the raters read
  # it TOF. The research's reading, TOF, is taken (low to medium confidence).
  philips_inflow_named:
    all:
      - {text: manufacturer, prefix: philips}
      - {text: search_text, matches: '(^|[^a-z0-9])s?3di([^a-z0-9]|$)'}
      - {not: has_epi}
      - {not: has_se}

  # --- A5 and case 21: Philips' QMap (SyntAc) acquisition, the
  # multi-dynamic multi-echo spin echo SyMRI reads, named `QMap` or `SyntAc`:
  # its phase images, `ORIGINAL\PRIMARY\P\PHASE\MAP\SE`, are MDME whatever
  # the private scanning technique says (`GRASE` on 15,494 QMap images,
  # `TSE` on 152; the 8 phase images pack 0.15 read ME-SE are the `TSE`
  # ones). As GE's MAGiC above.
  philips_qmap_acquisition:
    all:
      - {text: manufacturer, prefix: philips}
      - {text: search_text, matches: '(^|[^a-z])(qmap|q map|syntac)([^a-z]|$)'}
      - {not: image_type.is_derived}
      - {not: has_epi}
      - {not: has_gre}

  # --- A8 is `is_mrf` above.

  # --- A10, cases 12 and 25: EPIMix by its pulse sequence (`ksepimix*`,
  # 0019,109C), where its words do not say it (5 archive EPIMix stacks were
  # RawRecon); NeuroMix (`ksneuromix*`) the same.
  epimix_psd: {text: ge_pulse_sequence_name, matches: 'epimix|neuromix'}
  epimix_not_neuromix:
    any:
      - {text: search_text, matches: 'epimix'}
      - {text: ge_pulse_sequence_name, matches: 'epimix'}

  # --- A11: names read as what they do not mean.
  # A PROPELLER named only in GE's exam-level ProtocolName.
  ge_exam_only_propeller:
    all:
      - {text: manufacturer, prefix: ge}
      - {not: is_radial}
      - {text: search_text, matches: 'propeller|prop([^a-z]|$)'}
      - {not: {text: technique_text, matches: 'propeller|prop([^a-z]|$)'}}
  # An acquired diffusion image whose protocol, not its own name, says ADC.
  adc_only_in_protocol:
    all:
      - image_type.is_original
      - {not: image_type.has_adc}
      - has_positive_b_value
      - {text: text_protocol_name, matches: 'adc'}
      - {not: {text: text_series_description, matches: 'adc'}}
  # A slice whose protocol, not its own name, says MIP.
  mip_only_in_protocol:
    all:
      - {not: image_type.is_derived}
      - {not: image_type.is_mip}
      - {not: image_type.is_minip}
      - {not: image_type.is_projection}
      - {text: text_protocol_name, matches: '(^|[^a-z])(mip|minip|mnip)([^a-z]|$)'}
      - {not: {text: text_series_description, matches: 'mip'}}
  # The magnitude echo of a field map: an image, not the map (the phase
  # difference is the map).
  fieldmap_magnitude:
    all:
      - image_type.has_magnitude
      - {not: has_phase}
      - {not: image_type.has_b0_map}
      - image_type.is_original

  # --- A12: an EPI named T2* is a gradient-echo EPI; a GRE-EPI with a
  # b value is no diffusion; a field map states no diffusion.
  t2star_epi_named:
    all:
      - {text: technique_text, matches: 't2\s*\*|t2\s*-?\s*star'}
      - {not: has_positive_b_value}
      - {not: image_type.has_diffusion}
  b_value_not_diffusion:
    any:
      - sequence_name.is_epi_gre
      - philips_feepi
      - image_type.has_b1_map
      - image_type.has_b0_map
      - {text: search_text, matches: 'b1\s*-?\s*map|flip angle map|(^|[^a-z0-9])t?b1([^a-z0-9]|$)|tfl\s*b1'}

  # --- A16 and cases 7, 32, 33: GE's SPGR by name or pulse sequence, TRICKS,
  # the SPGR-EPI, and the re-adjudication's fast steady-state echo.
  ge_spgr_named:
    any:
      - {text: technique_text, matches: '(^|[^a-z])f?spgr'}
      - {text: ge_pulse_sequence_name, matches: 'spgr'}
  tricks_named: {text: technique_text, matches: '(^|[^a-z])tricks([^a-z]|$)'}
  ge_spgr_epi:
    all:
      - {text: manufacturer, prefix: ge}
      - {text: technique_text, matches: 'spgr\s*-?\s*epi'}
  # Record 48, "Rulings after the re-adjudication": a GE gradient echo with
  # SequenceVariant `SS\SK` and `FAST_GEMS`, not spoiled, is SS-GRE. Never a
  # balanced FIESTA or one GE names SPGR or TRICKS (FSP-GRE, above), nor an
  # angiography.
  ge_fast_ss:
    all:
      - {text: manufacturer, prefix: ge}
      - scanning_sequence.has_gre
      - scan_options.has_fast_gems
      - has_steady_state
      - has_segmented_kspace
      - {not: has_spoiled}
      - {not: has_mag_prepared}
      - {not: has_epi}
      - {not: has_se}
      - {not: ge_spgr_named}
      - {not: tricks_named}
      - {not: {text: technique_text, matches: 'fiesta|(^|[^a-z])(tof|mra|angio)'}}

  # --- A17: a Philips diffusion by its private scanning technique (`DwiSE`,
  # `DwiEPI`), its b=0 image included (dev-1 to dev-3 settle 36 such stacks
  # DWI-EPI). The turbo-spin-echo diffusion is `dwi_tse` above.
  philips_dwi_technique:
    all:
      - {text: manufacturer, prefix: philips}
      - {text: philips_scanning_technique, matches: '^dwi'}

  # --- A18 and case 28: Philips' MobiView is a composed image, a localizer
  # only where its words say survey or scout (42 archive stacks were
  # Localizer without such a word).
  mobiview_not_survey:
    all:
      - {text: search_text, substring: mobiview}
      - {not: {text: search_text, matches: 'survey|scout|locali[sz]er|(^|[^a-z])loc([^a-z]|$)'}}

  # --- A19: an echo of a multi-echo SWI written ORIGINAL, whatever its
  # maker says (a third-party copy of a GE SWAN), and GE's Silent MRA.
  swi_acquired_echo:
    all:
      - is_multi_echo
      - image_type.is_original
      - {not: image_type.is_derived}
      - {not: has_swi}
      - {not: has_phase}
      - {not: is_mip}
      - {not: is_minip}
      - {not: is_mean}
      # GE names what it computed with a prefix (`SWI:`, `SWIphase:`, `mIP:`)
      - {not: {text: search_text, matches: '^(swi|swiphase|swi phase|mip|minip|min ip|pha|phase|qsm)( |$)'}}
  silent_mra_named:
    any:
      - {text: ge_pulse_sequence_name, matches: 'silen'}
      - all:
          - {text: search_text, matches: 'silen'}
          - {text: search_text, matches: 'mra|angio|(^|[^a-z])tof([^a-z]|$)'}

  # --- A20 and case 27: Siemens writes `TTEST` on the subtraction image of
  # its 3D GRASE ASL: all 354 archive stacks carry `SUB` and 350 are named
  # `perfusion_weighted` by the scanner, so the research's t-test map is
  # refuted there. A t-test map only outside an ASL.
  ttest_on_asl:
    any:
      - is_asl
      - is_subtraction
      - asl_words
      - has_cbf
      - {text: search_text, matches: 'perfusion\s*-?\s*weighted|relcbf'}

  # --- A14, A15 and cases 30, 35: projections, reformats and computed
  # images whose image type or name tells.
  stddev_projection: image_type.has_stddev
  minip_named_projection:
    all:
      - any: [image_type.is_derived, image_type.is_projection]
      - {text: search_text, matches: '(^|[^a-z])(minip|mnip|min ip|min - ip)([^a-z]|$)'}
  radial_reformat_named:
    all:
      - image_type.is_derived
      - {text: search_text, matches: '(^|[^a-z])radials?([^a-z]|$)'}
      - {text: search_text, matches: 'thick|slab|mpr|reformat|(^|[^a-z])(mip|minip)([^a-z]|$)|radials'}
  sub_named:
    all:
      - {text: search_text, matches: '(^|[^a-z])sub([^a-z]|$)|subtract'}
      - {not: is_asl}
      - {not: asl_words}
  qmap_t2_named: {all: [image_type.is_derived, {text: search_text, matches: '(^|[^a-z])(qmap\s*-?\s*t2w?|t2w?\s*-?\s*qmap)([^a-z]|$)'}]}
  qmap_t1_named: {all: [image_type.is_derived, {text: search_text, matches: '(^|[^a-z])(qmap\s*-?\s*t1w?|t1w?\s*-?\s*qmap)([^a-z]|$)'}]}
  qmap_pd_named: {all: [image_type.is_derived, {text: search_text, matches: '(^|[^a-z])(qmap\s*-?\s*pdw?|pdw?\s*-?\s*qmap)([^a-z]|$)'}]}
  philips_isotropic_private:
    all:
      - {text: manufacturer, prefix: philips}
      - {text: philips_diffusion_direction, matches: '^\s*i\s*$'}
      - has_positive_b_value

  # --- A7 and case 6: the single-band reference of a diffusion run (a
  # reversed-blip one included), by its name: construct SBRef and base DWI
  # (the deep research: "SBRef/DWI", as b=0 diffusion images are settled
  # elsewhere). A BOLD run's SBRef is `is_sbref` above.
  diffusion_sbref:
    all:
      - {text: technique_text, matches: '(^|[^a-z])sbref([^a-z]|$)'}
      - has_epi
      - any: [is_se_epi, {text: technique_text, matches: '(^|[^a-z])(dwi|dti|diff|diffusion|b0|hardi)'}]

  # --- A7: a base the words and the echo time tell.
  # Read from the technique's text: GE's exam protocol names a trial `MRC`.
  mrcp_named: {text: technique_text, matches: 'mrcp|cholangio'}

  # --- A13 and case 15: an inversion-recovery spin echo is FLAIR only where
  # its inversion time nulls CSF at its repetition time: TI_null = T1 ln(2 /
  # (1 + exp(-TR / T1))), T1 of CSF 4,000 ms, within 20 per cent (the deep
  # research, case 15, medium to high confidence). The pack compares numbers
  # and does no arithmetic, so the formula is written out as bins of the
  # repetition time in which TI_null moves by at most 4 per cent, each with
  # the window around its middle (the generator is in the pack 0.18.0 study,
  # `tinull.py`). Applied between the STIR window (under 300 ms) and the long
  # FLAIR window (1,400 to 2,600 ms) that `is_flair_by_ti` already reads.
  ti_near_csf_null:
