# SPDX-License-Identifier: AGPL-3.0-only
#
# MRI pack 0.13.0: the rule errors of the development reference dev-1 on
# pack 0.12.0, one or more cases for each fix, and the cases that keep each
# fix from reaching what it must not. Every stack here is invented; the
# values are the shapes the rules turn on.

cases:

  # --- the inversion time decides FLAIR and STIR

  - name: an inversion-recovery spin echo inverted at 1,650 ms is a FLAIR though its name says nothing
    stack:
      image_type: 'ORIGINAL\PRIMARY\PROJECTION IMAGE\M\IR'
      scanning_sequence: IR
      sequence_variant: SK
      scan_options: FS
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: 'COR_1mm'
      repetition_time: 4800
      echo_time: 300
      inversion_time: 1650
      echo_train_length: 170
    axes:
      modifier: 'FLAIR,FatSat'

  - name: a GE CUBE reformat inverted at 1,850 ms is a FLAIR
    stack:
      image_type: 'DERIVED\SECONDARY\REFORMATTED\AVERAGE'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      scan_options: 'SAT_GEMS\EDR_GEMS\FS\IR_GEMS'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'MPR COR'
      repetition_time: 6800
      echo_time: 135
      inversion_time: 1850
      echo_train_length: 200
    axes:
      modifier: 'FLAIR,FatSat'
      provenance: ProjectionDerived
      construct: MPR

  - name: a double inversion recovery reporting 2,802 ms is not taken for a FLAIR
    stack:
      image_type: 'DERIVED\SECONDARY\REFORMATTED\AVERAGE'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      scan_options: 'EDR_GEMS\FS\IR_GEMS'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'AX REFORMAT'
      repetition_time: 7000
      echo_time: 90
      inversion_time: 2802
      echo_train_length: 160
    axes:
      modifier: 'FatSat,IR'

  - name: a double inversion recovery named DIR stays DIR inside the FLAIR window
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_IR\M\IR'
      scanning_sequence: IR
      sequence_variant: SK
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: '3D_DIR_SAG'
      repetition_time: 5500
      echo_time: 300
      inversion_time: 2550
    axes:
      modifier: DIR

  - name: a T1-weighted SPACE inverted at 380 ms is no FLAIR and no STIR
