      text_sequence_name: '*tir2d1rr17'
      text_series_description: 'noseries'
      repetition_time: 4300
      echo_time: 58
      inversion_time: 230
      echo_train_length: 17
    axes:
      modifier: STIR
      technique: TIRM

  - name: an MDME's short saturation delay is still no STIR
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'SE\IR'
      sequence_variant: 'SK\SP\MP'
