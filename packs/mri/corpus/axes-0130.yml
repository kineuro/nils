      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: 'SE\IR'
      sequence_variant: 'SK\SP\MP'
      scan_options: 'IR\PFP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*spcir_257ns'
      text_series_description: 't1_space_ir_sag'
      repetition_time: 4000
      echo_time: 380
      inversion_time: 380
    axes:
      modifier: IR

  - name: an MP2RAGE's second inversion is a gradient echo and no FLAIR
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'GR\IR'
      sequence_variant: 'SK\SP\MP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*tfl3d1_16'
      text_series_description: 'mp2rage_INV2'
      repetition_time: 5000
      echo_time: 2.9
      inversion_time: 2500
    flags:
      is_flair_by_ti: false

  - name: an inversion-recovery spin echo inverted at 230 ms is a STIR though its name says nothing
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D'
      scanning_sequence: SE
      sequence_variant: 'SP\SK'
      scan_options: 'SP\PER'
      mr_acquisition_type: 2D
