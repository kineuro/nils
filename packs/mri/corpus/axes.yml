#
# What the axes decide, and what the pack's own normalizer makes of the text
# they search. Every stack here is invented; the values are the shapes the
# rules turn on.

cases:

  - name: a Siemens MPRAGE is an MPRAGE by its sequence name
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: GR
      sequence_variant: 'SK\SP\MP'
      text_sequence_name: '*tfl3d1_16'
      text_series_description: 'sag T1 mprage'
      mr_acquisition_type: 3D
    axes:
      technique: MPRAGE
      provenance: RawRecon

  - name: a diffusion EPI is DWI-EPI, and its b value is not a modifier
    stack:
      image_type: 'ORIGINAL\PRIMARY\DIFFUSION\NONE'
      scanning_sequence: EP
      text_sequence_name: '*ep_b1000#1'
      text_series_description: 'ax dwi b1000'
      diffusion_b_value: '1000'
    axes:
      technique: DWI-EPI
      # Not DTIRecon: that provenance needs a diffusion-derived output, and
      # this is the acquisition itself.
      provenance: RawRecon

  - name: a FLAIR is a modifier of an inversion-recovery TSE, not a technique
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      text_sequence_name: '*tir2d1_15'
      text_series_description: 'ax T2 FLAIR'
      inversion_time: 2500
    axes:
      # The axis stores the display name: v0 calls IR-TSE a TIRM in a row.
      technique: TIRM
      modifier: FLAIR

  - name: an ADC map is a construct, and the map is what it is of
    stack:
      image_type: 'DERIVED\PRIMARY\ADC\ADC'
      text_series_description: 'ax dwi ADC'
    axes:
      construct: ADC

  - name: a localizer says so in its provenance
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      text_sequence_name: '*fl2d1_scout'
      text_series_description: 'localizer'
    axes:
      provenance: Localizer

  - name: the pack normalizes its own text, so a star is a word
    stack:
      text_series_description: 'ax T2*  swi'
      text_protocol_name: 'SWI_pha'
    flags: {}
    axes:
      construct: Phase

  - name: at most one member of an exclusion group survives
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'SE\IR'
      text_series_description: 'ax T2 flair stir'
      inversion_time: 2500
    axes:
      # FLAIR and STIR are both in IR_CONTRAST; the lower priority wins.
      modifier: FLAIR

  # --- from the nmosd gate (spec section 11.2). Each of these is a case the
  # parity diff produced: v0's stored verdict disagreed, v0's own code agreed,
  # and the case is what keeps the answer once nobody remembers the argument.

  - name: a multi-echo Siemens sequence is MEDIC, and its contrast is T2 star
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'GR'
      sequence_variant: 'SP\OSP'
      text_sequence_name: '*me2d1r3'
      text_series_description: 'ax t2 medic'
      echo_time: 20
      repetition_time: 700
      flip_angle: 20
    axes:
      technique: MEDIC
      base: 'T2*w'

  - name: a stack marked ND carries the ND construct
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      text_series_description: 'ax t1 se'
      scanning_sequence: 'SE'
      echo_time: 12
      repetition_time: 500
    axes:
      construct: ND

  # The word that decided this one in the gate: `search_text` drops `brain`
  # and `head` as boilerplate, which is right for telling techniques apart,
  # so what says brain here is the Swedish for it, with the non-ASCII folded
  # to a space exactly as the keyword list spells it. The body-part axis no
  # longer depends on that accident; the cases below are why.
  - name: a description in Swedish says which body part it is
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_series_description: 'ax t2 hjärna'
      scanning_sequence: 'SE'
      echo_time: 100
      repetition_time: 4000
    axes:
      body_part: brain

  # --- the body part the file states (record 35, S2). The body-part rules
  # read `anatomy_text`, which drops nothing, so a stack whose
  # `BodyPartExamined` says so in English gets a body part even where the
  # description says nothing about anatomy at all.

  - name: a stated body part of BRAIN,HEAD is a brain, whatever the description says
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'BRAIN,HEAD'
      text_series_description: 'ax t2 tse'
      text_sequence_name: '*tse2d1_15'
      scanning_sequence: 'SE'
      echo_time: 100
      repetition_time: 4000
    axes:
      body_part: brain

  - name: a stated body part of HEAD alone is a brain
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'HEAD'
      text_series_description: 'sag 3d t1'
    axes:
      body_part: brain

  - name: a spine and a neck stated together are a spine, as they always were
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'SPINE,NECK'
      text_series_description: 'sag t2 tse'
    axes:
      body_part: spine

  - name: a neck stated beside a brain is both
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'BRAIN,NECK'
      text_series_description: 'cor t1 tse'
    axes:
      body_part: brain-neck

  - name: a neck stated on its own is a neck
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'NECK'
      text_series_description: 'ax t2 tse'
    axes:
      body_part: neck

  # Record 35, the re-run: `cou` is three letters and was matched as a plain
  # substring, so it fired inside longer words, and because it is the neck
  # half of the brain-and-neck rule as well, an ordinary brain series with
  # such a word in it came out as a neck beside a brain. The rule that can
  # name a neck sits behind that one, so it was reached by nothing: the
  # French word is a word now, and a fragment decides neither rule.
  - name: a word that merely contains a neck term is not a neck
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'BRAIN,HEAD'
      text_series_description: 'ax t2 acoustic'
    axes:
      body_part: brain

  - name: a neck named in French is still a neck
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'COU'
      text_series_description: 'ax t2 tse'
    axes:
      body_part: neck

  - name: a body part whose accented letter came through damaged still decides
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'MR hj?rna'
      text_series_description: 'ax t2 tse'
    axes:
      body_part: brain

  - name: the boilerplate is still boilerplate to the axes it was written for
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      text_body_part: 'BRAIN,HEAD'
      text_series_description: 'sag brain T1 mprage'
      text_sequence_name: '*tfl3d1_16'
      scanning_sequence: GR
      sequence_variant: 'SK\SP\MP'
      mr_acquisition_type: 3D
    axes:
      technique: MPRAGE
      body_part: brain

  # --- a physics value is evidence only where there is one (record 35, S4).
  # Every window whose evidence is that a time is small asks first that the
  # time was measured: an echo time of 0.0 is what a flow study writes, and
  # reading it as a very short one made 297 phase-contrast stacks anatomical.

  - name: a gradient echo whose echo time is zero is not a T1w
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      text_series_description: 'ax flow'
      text_sequence_name: '*fl2d1'
      echo_time: 0
      repetition_time: 30
    axes:
      base: ''

  - name: a gradient echo with a measured short echo time is a T1w, as it was
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      text_series_description: 'ax flow'
      text_sequence_name: '*fl2d1'
      echo_time: 4
      repetition_time: 30
    axes:
      base: 'T1w'

  - name: an inversion time of zero is not a short one
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'SE\IR'
      text_series_description: 'ax study'
      text_sequence_name: '*tir2d1_15'
      inversion_time: 0
      echo_time: 15
      repetition_time: 1500
    axes:
      base: ''

  # --- the identities ImageType states (record 37, slice S5). Every stack
  # below is invented; what is real is the token and the verdict the
  # 2026-09-19 survey gave it.

  - name: a composed image is not the stations it was stitched from
    stack:
      image_type: 'DERIVED\PRIMARY\M\NORM\COMPOSED'
      text_series_description: 'sag T2 spine'
    axes:
      construct: Composed

  - name: the short spellings of composed say the same thing
    stack:
      image_type: 'DERIVED\PRIMARY\M\COMP_SP'
      text_series_description: 'sag T2 spine'
    axes:
      construct: Composed

  - name: the echo-combined image is told from the echoes it combined
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\MEAN'
      text_series_description: 'ax me gre'
    axes:
      construct: EchoCombined

  - name: an echo-combined susceptibility image says so through its route
    stack:
      image_type: 'DERIVED\PRIMARY\SWI\MEAN'
      text_series_description: 'ax swi'
    axes:
      provenance: SWIRecon
      construct: EchoCombined,SWI

  - name: a quantitative map says which quantity it is of, and only that one
    stack:
      image_type: 'DERIVED\PRIMARY\QMAP\T1'
      text_series_description: 'qmap'
    axes:
      construct: T1map

  - name: the T2 map of the same acquisition is a T2 map and not both
    stack:
      image_type: 'DERIVED\PRIMARY\QMAP\T2'
      text_series_description: 'qmap'
    axes:
      construct: T2map

  - name: a map that names no quantity is still a map
    stack:
      image_type: 'DERIVED\PRIMARY\QMAP'
      text_series_description: 'qmap'
    axes:
      construct: Qmap

  - name: a flip angle map is a B1 map, which is what BIDS calls it too
    stack:
      image_type: 'DERIVED\PRIMARY\FLIP ANGLE MAP'
      text_series_description: 'b1 calibration'
    axes:
      construct: B1map

  - name: a t test map is not an image of the person
    stack:
      image_type: 'DERIVED\PRIMARY\TTEST'
      text_series_description: 'ax perfusion'
    axes:
      construct: TTestMap

  - name: the projection spellings with no predicate are projections
    stack:
      image_type: 'DERIVED\PRIMARY\MINIMUM'
      text_series_description: 'cor venogram'
    axes:
      construct: MinIP

  - name: a maximum projection spelled out, and one spelled short
    stack:
      image_type: 'DERIVED\PRIMARY\HD MIP'
      text_series_description: 'cor angio'
    axes:
      construct: MIP

  - name: a truncated projection value is still a projection
    stack:
      image_type: 'DERIVED\PRIMARY\PROJECTION IMAG'
      text_series_description: 'cor angio'
    flags:
      is_projection: true
    axes:
      provenance: ProjectionDerived

  - name: the metal artefact technique is a technique, and its composite an image
    stack:
      image_type: 'DERIVED\PRIMARY\MAVRIC_COMPOSITE'
      text_series_description: 'cor hip'
    axes:
      technique: MAVRIC
      construct: Composed

  - name: a derived image made without one of its inputs says so
    stack:
      image_type: 'DERIVED\PRIMARY\SWI\NAVAIL'
      text_series_description: 'ax swi'
    axes:
      quality: InputUnavailable

  - name: an image the vendor did not distortion correct says so
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\DISTORTED'
      text_series_description: 'ax t2'
    axes:
      quality: Distorted

  - name: and a sound image says nothing on that axis
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      text_series_description: 'ax t2'
    axes:
      quality: ''

  - name: the Dixon part was always on the construct axis, whichever part it is
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\DIS2D\OPP_PHASE'
      text_series_description: 'ax vibe'
    axes:
      construct: OutPhase

  # --- what the protocols said (record 41, S1). Five scanner protocols were
  # read against their printouts, and these are the rules the printouts
  # proved wrong. The names are the protocols' own public sequence names;
  # every stack is invented.

  # Siemens writes `SK` in SequenceVariant on every EPI, single shot or not,
  # so segmented k-space beside an EPI readout is no evidence of a
  # readout-segmented one. Only the RESOLVE sequence's own name (`*re_b`)
  # is; 2,916 single-shot diffusion stacks and 462 BOLD stacks said RESOLVE.
  - name: a single-shot diffusion EPI is not RESOLVE because Siemens writes SK on it
    stack:
      image_type: 'ORIGINAL\PRIMARY\DIFFUSION\NONE\ND\NORM'
      scanning_sequence: EP
      sequence_variant: 'SK\SP'
      scan_options: 'PFP\FS'
      text_sequence_name: '*ep_b1000#1'
      text_series_description: 'ep2d_diff_2mm_hcp_32_b1000_AP'
      text_protocol_name: 'ep2d_diff_2mm_hcp_32_b1000_AP'
      diffusion_b_value: '1000'
    axes:
      technique: DWI-EPI

  - name: and neither is the trace image computed from it
    stack:
      image_type: 'DERIVED\PRIMARY\DIFFUSION\TRACEW\ND\NORM'
      scanning_sequence: EP
      sequence_variant: 'SK\SP'
      text_sequence_name: '*ep_b1000t'
      text_series_description: 'ep2d_diff_2mm_hcp_32_b1000_AP_TRACEW'
    axes:
      technique: DWI-EPI

  - name: a readout-segmented diffusion EPI is RESOLVE by its sequence name
    stack:
      image_type: 'DERIVED\PRIMARY\DIFFUSION\TRACEW\NORM\DIS2D'
      scanning_sequence: RM
      sequence_variant: 'SK\SP'
      text_sequence_name: '*re_b1000t'
      text_series_description: 'ax dwi b1000'
    axes:
      technique: RESOLVE

  - name: a multiband BOLD series is BOLD, not RESOLVE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM\MOSAIC'
      scanning_sequence: EP
      sequence_variant: 'SK\OSP'
      text_sequence_name: '*epfid2d1_104'
      text_series_description: 'rs-fMRI_ep2d_bold_sms_2mmi_RL_hcp_6min'
      text_protocol_name: 'rs-fMRI_ep2d_bold_sms_2mmi_RL_hcp_6min'
    axes:
      technique: BOLD

  - name: and its motion-corrected copy is BOLD by its protocol
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM\MOCO\MOSAIC'
      scanning_sequence: EP
      sequence_variant: 'SK\OSP'
      text_sequence_name: '*epfid2d1_104'
      text_series_description: 'MoCoSeries'
      text_protocol_name: 'rs-fMRI_ep2d_bold_sms_2mmi_RL_hcp_6min'
    axes:
      technique: BOLD

  - name: a gradient-echo EPI the name says nothing about is a gradient-echo EPI
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D'
      scanning_sequence: EP
      sequence_variant: 'SK\SP\OSP'
      text_sequence_name: 'epfid2d1_64'
      text_series_description: 'ax ep2d'
    axes:
      technique: GRE-EPI

  - name: a 3D GRASE arterial spin labelling series is ASL
    stack:
      image_type: 'ORIGINAL\PRIMARY\ASL\NONE\ND\NORM\MOSAIC'
      scanning_sequence: EP
      sequence_variant: SK
      text_sequence_name: '*tgse3d1_3000'
      text_series_description: 'Ax ASL 3D'
    axes:
      technique: ASL

  # A name is not a scan option. The console's printout for this protocol
  # says flow compensation is off, ScanOptions holds only `PFP`, and the
  # name says `0 flow comp`: 87 acquired stacks and 125 reformats of them
  # were FlowComp by the words alone.
  - name: a name that mentions flow compensation does not switch it on
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: SE
      sequence_variant: 'SK\SP'
      scan_options: PFP
      text_sequence_name: '*spc_314ns'
      text_series_description: 'Sag T2 3D SPACE 0 flow comp'
      mr_acquisition_type: 3D
    axes:
      technique: SPACE
      modifier: ''

  - name: flow compensation is what ScanOptions says it is
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: SE
      sequence_variant: 'SK\SP'
      scan_options: 'FC\PFP'
      text_sequence_name: '*tse2d1_15'
      text_series_description: 'sag t2 tse'
    axes:
      modifier: FlowComp
