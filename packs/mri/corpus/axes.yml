      image_type: 'DERIVED\PRIMARY\PROJECTION IMAGE\VASCULAR'
      scanning_sequence: GR
      sequence_variant: 'SS\SP'
      scan_options: 'FC\SAT_GEMS\MT_GEMS\VASCTOF_GEMS\FS'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'PJN:Ax MRA 3D TOF 3Slabs'
    axes:
      technique: TOF
      modifier: 'FatSat,FlowComp,MT'
      construct: MIP

  - name: a Philips MPR written ORIGINAL as a projection image is an MPR
    stack:
      image_type: 'ORIGINAL\PRIMARY\PROJECTION IMAGE\M\FFE'
      scanning_sequence: GR
      sequence_variant: MP
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: 'MPR Ax'
    axes:
      construct: MPR
      provenance: ProjectionDerived

  - name: a gradient-echo EPI SWI is GRE-EPI
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: EP
      sequence_variant: SK
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*epfid3d1_15'
      text_series_description: 'swi_epi3d_mag'
    axes:
      technique: GRE-EPI

  # MDME keeps ND; post-contrast is not read off GE's exam name.
  - name: a Siemens SyMRI acquisition image keeps ND from its image type
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'SE\IR'
      sequence_variant: 'SK\SP\MP'
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_sequence_name: 'tir2d2_5'
      text_series_description: 'SyMRI'
      split_reason: multi_echo
      stacks_in_series: 2
    axes:
      provenance: RawRecon
      # Pack 0.12.0: an acquired image, so no Magnitude; and its saturation
      # delay, written as a TI beside SE\IR, is no IR modifier.
      construct: ND
      technique: MDME
      modifier: ''

  - name: a GE exam protocol named MS+GD says nothing of a STIR before contrast
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: 'SE\IR'
      sequence_variant: 'SK\OSP'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Cor STIR 3mm'
      text_protocol_name: 'MS+GD 131030'
      inversion_time: 165
    axes:
      post_contrast: ''

  - name: a Siemens protocol name that says +GD still counts
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: SE
      manufacturer: SIEMENS
      text_sequence_name: '*se2d1'
      text_series_description: 't1_se_tra'
      text_protocol_name: 't1_se_tra +gd'
    axes:
      post_contrast: '1'

  # --- MRI pack 0.12.0: the dev-1 development reference's rule errors
  # (`studies/2026-09-28-dev-reference/` in the design repository). Every
  # stack here is invented, in the shape the errors had.

  # Philips writes a reformat as a projection image, planes and maximum
  # projections alike; with no MIP token and no MIP word it is a plane.
  - name: a Philips reformat written as a projection image is an MPR
    stack:
      image_type: 'DERIVED\PRIMARY\PROJECTION IMAGE\M\FFE'
      scanning_sequence: GR
      sequence_variant: MP
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: 'VCor 3D T1 TFE'
    axes:
      provenance: ProjectionDerived
      construct: MPR

  - name: a Philips projection image named MIP is a MIP and not a plane
    stack:
      image_type: 'DERIVED\PRIMARY\PROJECTION IMAGE\M\FFE'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: 'MIP TOF cor'
    axes:
      provenance: ProjectionDerived
      construct: MIP

  # A workstation writes MPR on a projection too.
  - name: a workstation MIP written MPR is a MIP alone
    stack:
      image_type: 'DERIVED\SECONDARY\MPR\ND'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d1r_t70'
      text_series_description: 'tof_3d_multi-slab_MIP_COR'
    axes:
      provenance: ProjectionDerived
      construct: 'MIP,ND'
      disposition: reformat

  - name: a minimum intensity projection is not also a maximum one
    stack:
      image_type: 'DERIVED\PRIMARY\MNIP\ND'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*swi3d1r'
      text_series_description: 'mIP_Images(SW)'
    axes:
      provenance: ProjectionDerived
      construct: 'MinIP,ND'

  - name: a denoised MP2RAGE uniform image is UniformDenoised alone
    stack:
      image_type: 'DERIVED\PRIMARY\M\ND\UNIFORM'
      scanning_sequence: 'GR\IR'
      sequence_variant: 'SK\SP\MP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*tfl3d1_16'
      text_series_description: 'mp2rage_sag_UNI-DEN'
    axes:
      construct: 'Denoised,ND'

  - name: an in-phase Dixon image is not a phase image
    stack:
      image_type: 'DERIVED\PRIMARY\DIXON\IN_PHASE'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d2'
      text_series_description: 't1_vibe_dixon_tra_in-phase'
    axes:
      construct: InPhase

  - name: a phase image is still a phase image by its image type and its word
    stack:
      image_type: 'ORIGINAL\PRIMARY\P\ND'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d1r'
      text_series_description: 'gre_phase'
    axes:
      construct: 'ND,Phase'

  # RESTORE, by the letter Siemens writes after `tse`.
  - name: a Siemens TSE with RESTORE is the driven equilibrium TSE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: SE
      sequence_variant: 'SK\SP\OSP'
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_sequence_name: '*tseR2d1rs16'
      text_series_description: 't2_tse_tra'
      echo_train_length: 16
    axes:
      technique: RESTORE

  - name: the letters after a Siemens TSE's echo train are not RESTORE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: SE
      sequence_variant: 'SK\SP\OSP'
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_sequence_name: '*tse2d1rs15'
      text_series_description: 't2_tse_tra'
      echo_train_length: 15
    axes:
      technique: TSE

  # The SWI route: the real part, a magnitude named for QSM, a reformat,
  # and a multi-echo readout.
  # MRI pack 0.25.0 (the protocol sweep): with no base, as round 3's case 24
  # reads a component without PSIR evidence, whose intensity follows the
  # receiver phase.
  - name: the real part of a Philips SWIp is an acquired component with no base
    stack:
      image_type: 'ORIGINAL\PRIMARY\R_FFE\R\FFE'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: 'SWIp'
    axes:
      provenance: RawRecon
      construct: Real
      base: ''

  - name: a magnitude of a multi-echo series named QSM is no QSM map
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*swi3d4r'
      text_series_description: 'swi_qsm_tra_Mag'
      split_reason: multi_echo
      stacks_in_series: 4
    axes:
      provenance: RawRecon
      construct: 'Magnitude,ND'
      base: 'T2*w'
      technique: MEGRE

  # A multi-parameter mapping protocol's MT-weighted multi-echo gradient
  # echo takes its base from the MT pulse, not the echo train.
  - name: an MT-weighted multi-echo gradient echo is MTw
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: 'MPM_MTw_3D'
      split_reason: multi_echo
      stacks_in_series: 6
    axes:
      technique: MEGRE
      base: MTw

  # --- MRI pack 0.13.0: the body region, the body part's coarse mode
  # (record 50, one model in two modes). The rules fold the body part the
  # rules before them decided: a brain and a brain and neck are the head, a
  # neck and a spine the spine. Where the body part has no value the region
  # has none either, and nothing of the file is read for it.

  - name: a stated brain is the head
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'BRAIN,HEAD'
      text_series_description: 'ax t2 tse'
    axes:
      body_part: brain
      body_region: head

  - name: a brain and neck is the head
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'BRAIN,NECK'
      text_series_description: 'cor t1 tse'
    axes:
      body_part: brain-neck
      body_region: head

  - name: a neck is the spine in the coarse mode
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'NECK'
      text_series_description: 'ax t2 tse'
    axes:
      body_part: neck
      body_region: spine

  - name: a cervical spine is the spine
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'SPINE,NECK'
      text_series_description: 'sag t2 tse HWS'
    axes:
      body_part: spine
      body_region: spine

  # The body part's last resort, at 0.60, still gives the region: the
  # region reads the body part, not how sure it was.
  - name: a portrait sagittal field of view is a spine, and so the spine
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_series_description: 'sag t2 tse'
      orientation: Sagittal
      fov_x: 200
      fov_y: 400
      aspect_ratio: 2.0
    axes:
      body_part: spine
      body_region: spine

  - name: no body part is no body region
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'VERTEBRALCRANIUM'
      text_series_description: 'cs10_3D_FLAIR'
      text_protocol_name: 'WIP cs10_3D_FLAIR'
    axes:
      body_part: ''
      body_region: ''

  # A stack ruled out has every class axis blank, the body part with them,
  # so it has no region even where its stated body part names one.
  - name: a screen save stated as a head has no body region
    stack:
      image_type: 'DERIVED\SECONDARY\SCREEN SAVE'
      text_body_part: 'HEAD'
      text_series_description: 'sag t1 screenshot'
    axes:
      directory_type: excluded
      body_part: ''
      body_region: ''

  # A localizer is classified on every axis, the body part among them, and
  # its region follows as on any stack.
  - name: a localizer stated as a head is the head
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_body_part: 'HEAD'
      text_series_description: 'localizer'
      image_role: original_primary
    axes:
      directory_type: localizer
      body_part: brain
      body_region: head
