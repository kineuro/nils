#
# MRI pack 0.24.0: the exclusion `t2star-not-spin-echo`, which packs 0.21.0
# to 0.23.0 broke on 7 archive stacks (base T2*w beside a spin-echo
# technique): a spin-echo word against the readout an image typed LOCALIZER,
# a Siemens position display (Nima, 2026-10-02) or a GE fast gradient echo
# states, a GE research-mode series named for a
# gradient echo read as a spin echo by its flip, and a gradient-echo window
# read on a stack the pack reads as a spin echo. One or more cases for each
# rule, and the cases that keep each rule from reaching what it must not.
# Every stack here is invented from the pattern the design repository's
# files name; none is a real header.

cases:

  # --- a spin-echo word does not decide against a readout the header states

  - name: a Philips image typed LOCALIZER on a plain gradient echo, named for the mDixon TSE it plans, is no TSE
    stack:
      image_type: 'LOCALIZER'
      scanning_sequence: GR
      sequence_variant: MP
      scan_options: FC
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'T2_mDixon_TSE_sag'
      n_slices: 1
      repetition_time: 3.1
      echo_time: 1.4
      flip_angle: 8
      echo_train_length: 400
    flags:
      typed_localizer_gre: true
      readout_not_spin_echo: true
    axes:
      provenance: Localizer
      technique: GRE

  - name: a Philips mDixon TSE water image written GR stays a TSE
    stack:
      image_type: 'DERIVED\PRIMARY\W\W\DERIVED'
      scanning_sequence: GR
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      philips_scanning_technique: TSE
      text_series_description: 'T2_mDixon_TSE_sag'
      n_slices: 24
      repetition_time: 3000
      echo_time: 100
      flip_angle: 90
      echo_train_length: 20
    flags:
      philips_dixon_tse: true
      readout_not_spin_echo: false
    axes:
      technique: TSE
      base: T2w

  # --- Nima, 2026-10-02: a Siemens position display is a gradient-echo
