      n_slices: 1
      repetition_time: 8.6
      echo_time: 4.0
      flip_angle: 20
    flags:
      posdisp_gre: true
      gre_scout_readout: true
      readout_not_spin_echo: true
    axes:
      provenance: Localizer
      technique: FLASH
      base: T2w

  - name: a position display written SE and IR, whose sequence name is a FLASH, is read by the FLASH
