      echo_numbers: '1'
      stacks_in_series: 1
      n_instances: 26
      n_slices: 26
    axes:
      technique: MEDIC

  - name: a single-echo Philips FFE named mFFE is no combined image
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: SS
