      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: SS
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'GD_mFFE tra'
      repetition_time: 700
      echo_time: 20
      flip_angle: 28
      echo_train_length: 5
      echo_numbers: '3'
      split_reason: multi_echo
      stacks_in_series: 5
    axes:
      technique: MEGRE

  - name: the fifth echo of a Philips mFFE written as a series of its own is ME-GRE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: SS
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'GD_mFFE tra'
      repetition_time: 700
      echo_time: 32
      flip_angle: 28
      echo_train_length: 5
      echo_numbers: '5'
      stacks_in_series: 1
    axes:
