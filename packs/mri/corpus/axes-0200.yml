      repetition_time: 4000
      echo_time: 380
      inversion_time: 380
      flip_angle: 120
      echo_train_length: 241
    axes:
      modifier: PSIR
      construct: Real

  - name: the magnitude of a Siemens inversion recovery keeps IR
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D'
