# SPDX-License-Identifier: AGPL-3.0-only
#
# MRI pack 0.20.0: the nine disputes of a development grade (dev-5) as
# record 48 rules them by a deep research and our archive's counts ("The
# nine dev-5 disputes, by the deep research" and "The nine, after our
# counts"), the per-echo Philips multi-echo FFE found beside them, and the
# grade's rule-bug groups A1 to A11. One or more cases for each change, and
# the cases that keep each change from reaching what it must not. Every
# stack here is invented from the pattern the design repository's files
# name; none is a real header.

cases:

  # --- case 1: a Philips FFE, by Spoiling, then the private technique, then
  # SequenceVariant; never by "T1W" in its name

  - name: a Philips T1W_FFE whose SequenceVariant states the steady state is SS-GRE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: SS
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'T1W_FFE CLEAR'
      repetition_time: 460
      echo_time: 2.2
      flip_angle: 80
      echo_train_length: 1
    axes:
      technique: FISP

  - name: a Philips FFE of the private technique T1FFE is SP-GRE with OSP in place of SP
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: OSP
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      philips_scanning_technique: T1FFE
      text_series_description: 'T1W_FFE'
      repetition_time: 200
      echo_time: 4.6
      flip_angle: 80
    axes:
      technique: FLASH

  - name: a Philips FFE of the private technique FFE is SS-GRE with OSP in place of SS
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: OSP
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      philips_scanning_technique: FFE
      text_series_description: 'T2W_FFE'
      repetition_time: 600
      echo_time: 16
      flip_angle: 18
    axes:
      technique: FISP

  - name: a Philips T1W_FFE with only OSP and no private technique is a plain gradient echo
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: OSP
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'T1W_FFE'
      repetition_time: 200
      echo_time: 4.6
      flip_angle: 80
    axes:
      technique: GRE

  - name: a Philips FFE whose SequenceVariant states SP stays SP-GRE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: '3D FFE'
      repetition_time: 25
      echo_time: 4.6
      flip_angle: 30
    axes:
      technique: FLASH

  - name: an enhanced Philips FFE whose Spoiling says RF is SP-GRE whatever SequenceVariant says
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: SS
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      echo_pulse_sequence: GRADIENT
      spoiling: RF
      text_series_description: 'T1 FFE'
      repetition_time: 25
      echo_time: 4.6
