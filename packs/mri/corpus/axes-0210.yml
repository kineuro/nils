      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D\COMP_SP\COMPOSED'
      scanning_sequence: SE
      sequence_variant: 'SK\SP\OSP'
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 't2_tse_sag_COMP_SP'
      text_sequence_name: '*tse2d1_24'
      n_slices: 15
      repetition_time: 3500
      echo_time: 100
      echo_train_length: 24
    axes:
      provenance: ProjectionDerived
      construct: Composed

  - name: a Siemens composed localizer is a localizer and Composed
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D\COMP_SP\COMPOSED'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'localizer_COMP_SP'
      text_sequence_name: '*fl2d1'
      split_reason: multi_orientation
      n_slices: 6
      repetition_time: 8.6
      echo_time: 4
    axes:
      provenance: Localizer
      construct: Composed

  - name: a Philips MobiView survey of 8 slices is a localizer
    stack:
      image_type: 'DERIVED\PRIMARY\M\M\DERIVED'
      scanning_sequence: RM
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'Survey MobiView'
      n_slices: 8
      repetition_time: 3.5
      echo_time: 1.6
    axes:
