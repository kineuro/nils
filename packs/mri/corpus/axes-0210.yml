  # --- Dixon (case 10)

  - name: a Philips mDixon TSE water image written GR is a TSE, T2w at TE 108 ms
    stack:
      image_type: 'DERIVED\PRIMARY\W\W\DERIVED'
      scanning_sequence: GR
      sequence_variant: MP
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'cs_T2_mDixon_TSE_cor'
      repetition_time: 3000
      echo_time: 108
      echo_train_length: 25
    flags:
      philips_dixon_tse: true
      has_gre: false
    axes:
      technique: TSE
      construct: Water
      modifier: Dixon
      base: T2w

  - name: the in-phase image of a Philips mDixon TSE written GR is a TSE, T2w, not the T1w of a gradient echo
