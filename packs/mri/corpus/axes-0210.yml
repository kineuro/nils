  - name: a GE TOF's COLLAPSE image stays a MIP of a TOF
    stack:
      image_type: 'DERIVED\PRIMARY\PROJECTION IMAGE\COLLAPSE'
      scanning_sequence: GR
      sequence_variant: 'SS\SP'
      scan_options: 'FC\SAT_GEMS\MT_GEMS\VASCTOF_GEMS\SP'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: 2dtof
      text_series_description: 'COL:Ax 2DTOF'
      repetition_time: 22
      echo_time: 4
      flip_angle: 60
    axes:
      provenance: ProjectionDerived
      technique: TOF
      construct: MIP

  - name: a Philips phase contrast's M_PCA image is its magnitude, with no base
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_PCA\M\PCA'
      scanning_sequence: GR
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'PCA flow'
      repetition_time: 12
      echo_time: 6
    axes:
      technique: PC
      construct: Magnitude
      base: ''

  - name: a Philips phase contrast's VELOCITY MAP image is Velocity, with no base
    stack:
      image_type: 'ORIGINAL\PRIMARY\VELOCITY MAP\P\PCA'
      scanning_sequence: GR
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'PCA flow'
      repetition_time: 12
      echo_time: 6
    axes:
      technique: PC
      construct: Velocity
      base: ''

  - name: a Philips PCA angiogram that is neither magnitude, velocity nor projection is Speed
    stack:
      image_type: 'ORIGINAL\PRIMARY\PCA\M\PCA'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: '3D PCA venous'
      repetition_time: 12
      echo_time: 6
    axes:
      technique: PC
      construct: Speed
      base: ''
      disposition: scanner_derived

  - name: a Philips phase contrast's PROJECTION image is a MIP
    stack:
      image_type: 'ORIGINAL\PRIMARY\PROJECTION IMAG\M\PCA'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: '3D PCA venous'
      repetition_time: 12
      echo_time: 6
    axes:
      provenance: ProjectionDerived
      technique: PC
      construct: MIP
      base: ''

  - name: GE's Inhance 3D Velocity by its pulse sequence is a phase contrast with no velocity image
    stack:
      image_type: 'DERIVED\PRIMARY\PROJECTION IMAGE\COLLAPSE'
      scanning_sequence: GR
      scan_options: 'ACC_GEMS\IFLOW_GEMS\PFP'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: Inh-Vel
