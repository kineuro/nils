  # --- calibration (case 7): provenance Calibration, no base

  - name: a GE calibration of efgre3d at flip 1 is Calibration, with no base, a working scan
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: GR
      sequence_variant: 'SS\SP\SK'
      scan_options: 'FAST_GEMS\EDR_GEMS'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: efgre3d
      text_series_description: 'Cal Head 24'
      repetition_time: 1.5
      echo_time: 0.5
      flip_angle: 1
    axes:
      provenance: Calibration
      technique: TurboFLASH
      base: ''
      disposition: working_scan
      convertible: 'no'
      role: ''

  - name: a GE ASSET calibration of fgre without SP is Calibration and SS-GRE
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: GR
      sequence_variant: SS
      scan_options: 'FAST_GEMS'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: fgre
