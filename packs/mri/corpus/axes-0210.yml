# SPDX-License-Identifier: AGPL-3.0-only
#
# MRI pack 0.21.0: record 48's conventions round 3 and its four ruled
# conflicts (composites, GE fast recovery, GE T1FLAIR_GEMS, the
# single-volume DSC), the three values the vocabulary lacked (provenance
# Calibration; constructs Speed and StdDevTime), and the rule-bug groups A1
# to A10 of a development grade. One or more cases for each rule, and the
# cases that keep each rule from reaching what it must not. Every stack here
# is invented from the pattern the design repository's files name; none is
# a real header.

cases:

  # --- localizers: a vendor flag outranks the slice count (case 6)

  - name: a GE series whose series plane is 256 is a localizer whatever its slice count
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: SE
      sequence_variant: SK
      scan_options: 'FAST_GEMS\SS_GEMS'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Ax T2 SSFSE'
      ge_series_plane: '256'
      n_slices: 12
      repetition_time: 1200
      echo_time: 90
      echo_train_length: 1
    axes:
      provenance: Localizer

  - name: a GE series plane other than 256 is no localizer flag
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Ax T2 FSE'
      ge_series_plane: '2'
      n_slices: 24
      repetition_time: 4000
      echo_time: 100
      echo_train_length: 16
    flags:
      ge_three_plane_localizer: false
    axes:
      provenance: RawRecon

  - name: a Siemens AutoAlign scout of 128 slices is a localizer
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS3D\MFSPLIT'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 'AAHead_Scout_32ch-head-coil'
      text_sequence_name: '*fl3d1_ns'
      n_slices: 128
      repetition_time: 3.2
      echo_time: 1.4
      flip_angle: 8
    axes:
      provenance: Localizer

  - name: the MPR of a Siemens AutoAlign scout is a localizer and an MPR
    stack:
      image_type: 'DERIVED\PRIMARY\MPR\NORM\DIS3D\MFSPLIT'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 'AAHead_Scout_MPR_sag'
      n_slices: 5
      repetition_time: 3.2
      echo_time: 1.4
      flip_angle: 8
    axes:
      provenance: Localizer
      construct: MPR

  - name: an image typed LOCALIZER of 20 slices is a localizer
    stack:
      image_type: 'ORIGINAL\PRIMARY\LOCALIZER'
      scanning_sequence: GR
      sequence_variant: SS
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Ax'
      n_slices: 20
      repetition_time: 5
      echo_time: 1.5
    axes:
      provenance: Localizer

  - name: Philips' SmartExam survey of 100 slices is a localizer
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_FFE\M\FFE'
      scanning_sequence: GR
      sequence_variant: MP
      mr_acquisition_type: 3D
      manufacturer: Philips Medical Systems
      text_series_description: 'SmartBrain'
      n_slices: 100
      repetition_time: 3.1
      echo_time: 1.4
      flip_angle: 8
    axes:
      provenance: Localizer

  - name: a series of 8 slices in one plane named loc, with no vendor flag, is no localizer
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'loc_trufi_sag'
      text_sequence_name: '*tfi2d1_12'
      n_slices: 8
      repetition_time: 4.2
      echo_time: 2.1
      flip_angle: 60
    axes:
      provenance: RawRecon

  - name: a three-plane localizer of 7 slices a plane, split by orientation, stays a localizer
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'localizer'
      text_sequence_name: '*fl2d1'
      split_reason: multi_orientation
      n_slices: 7
      repetition_time: 8.6
      echo_time: 4
      flip_angle: 20
    axes:
      provenance: Localizer

  # --- composites (conflict 1): ProjectionDerived with Composed, the
  # Siemens ORIGINAL notwithstanding; a composite of survey stations a
  # localizer whatever its slices

  - name: a Siemens Inline Composing image written ORIGINAL is ProjectionDerived and Composed
