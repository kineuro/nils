      construct: Composed

  - name: a Philips MobiView contrast composite is ProjectionDerived
    stack:
      image_type: 'DERIVED\SECONDARY\M\M\DERIVED'
      scanning_sequence: RM
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'MobiView STIR_TSE'
      n_slices: 15
      repetition_time: 3400
      echo_time: 50
      echo_train_length: 19
    axes:
      provenance: ProjectionDerived
      construct: Composed

  - name: a Siemens echo combination (MULTIECHOCOMBINED) is no stitched composite
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM\MULTIECHOCOMBINED'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'medic_tra'
      text_sequence_name: '*me2d1r5'
      n_slices: 30
      repetition_time: 600
      echo_time: 18
    flags:
      stitched_composite: false
    axes:
      provenance: RawRecon

  # --- Philips MAXIMUM (case 2): a projection only where the geometry shows one

  - name: a Philips MAXIMUM 3D volume of 180 contiguous slices is no MIP
    stack:
      image_type: 'DERIVED\PRIMARY\T2\MAXIMUM'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 3D
      manufacturer: Philips Healthcare
      philips_scanning_technique: TSE
      text_series_description: '3D FLAIR'
      n_slices: 180
      slice_thickness: 1.1
      spacing_between_slices: 0.55
      repetition_time: 4800
      echo_time: 320
      inversion_time: 1650
      echo_train_length: 182
    flags:
      is_mip: false
    axes:
      provenance: RawRecon
      construct: ''

  - name: a Philips MAXIMUM of one slice is a MIP
    stack:
      image_type: 'DERIVED\SECONDARY\T1\MAXIMUM'
      scanning_sequence: GR
      mr_acquisition_type: 3D
      manufacturer: Philips Healthcare
      text_series_description: 'T1 3D'
      n_slices: 1
      slice_thickness: 60
    flags:
      is_mip: true
    axes:
      provenance: ProjectionDerived

  # --- Siemens 3D-card outputs (case 3): each image by its own ImageType

  - name: a Siemens CSA MPR image in a series named MIP is an MPR
    stack:
      image_type: 'DERIVED\SECONDARY\PROJECTION IMAGE\CSA MPR\\CSAPARALLEL\M\ND\NORM'
      scanning_sequence: GR
      sequence_variant: 'SP\OSP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: '<MIP Thin Range[1]>'
      repetition_time: 21
      echo_time: 3.4
    axes:
      provenance: ProjectionDerived
      construct: 'MPR,ND'

  - name: a Siemens CSA MIP image in a series named MPR is a MIP
    stack:
      image_type: 'DERIVED\SECONDARY\PROJECTION IMAGE\CSA MIP\\CSAPARALLEL\M\ND'
      scanning_sequence: GR
      sequence_variant: 'SP\OSP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 'TOF_MPR tra'
      repetition_time: 21
      echo_time: 3.4
    axes:
      provenance: ProjectionDerived
      construct: 'MIP,ND'

  # --- Siemens standard deviations (case 4): STDDEV_TIME is a temporal map

  - name: a Siemens STDDEV_TIME image is StdDevTime with no base
    stack:
      image_type: 'DERIVED\PRIMARY\STDDEV_TIME\ND'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 'tof_StdDev_Time'
      text_sequence_name: '*fl3d1r_t70'
      repetition_time: 21
      echo_time: 3.4
    axes:
      provenance: ProjectionDerived
      construct: 'ND,StdDevTime'
      base: ''

  - name: a Siemens STDDEV_TRA image stays a standard deviation projection
    stack:
      image_type: 'ORIGINAL\PRIMARY\STDDEV_TRA\ND'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 'tof_StdDev_TRA'
      text_sequence_name: '*fl3d1r_t70'
      repetition_time: 21
      echo_time: 3.4
    axes:
      construct: 'ND,StdDevProj'

  # --- phase contrast (case 5)

  - name: a GE 2D phase contrast's COLLAPSE image is the acquisition, with no construct and no base
