    axes:
      technique: TurboFLASH

  - name: a Siemens fl3d with SequenceVariant SK alone is SP-GRE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      sequence_variant: SK
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 't1_fl3d_sag'
      text_sequence_name: '*fl3d1_ns'
      repetition_time: 11
      echo_time: 4.8
      flip_angle: 15
    axes:
