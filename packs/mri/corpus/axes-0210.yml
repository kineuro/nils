      image_type: 'DERIVED\PRIMARY\PROJECTION IMAGE\COLLAPSE'
      scanning_sequence: GR
      sequence_variant: SS
      scan_options: 'PPG\VB_GEMS\VASCPC_GEMS\PFF'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: fgre
      text_series_description: 'SAG 2 D PC'
      n_slices: 1
      repetition_time: 15.8
      echo_time: 4.9
      flip_angle: 25
    axes:
      provenance: RawRecon
      technique: PC
      construct: ''
      base: ''
      directory_type: misc

  - name: a GE 3D phase contrast's COLLAPSE image is a MIP with no base
