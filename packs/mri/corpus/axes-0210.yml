  - name: a GE fspgr pulse sequence is FSP-GRE
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: GR
      sequence_variant: 'SS\SP'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: fspgr
      text_series_description: 'Ax 3D T1'
      repetition_time: 7
      echo_time: 2.5
