      text_protocol_name: 'b1000'
      diffusion_b_value: 1000
      repetition_time: 3400
      echo_time: 79
      flip_angle: 90
      echo_train_length: 49
      pixel_bandwidth: 1300
    axes:
      provenance: RawRecon
      technique: DWI-EPI
      construct: Trace

  - name: a Philips b=0 image written PROJECTION IMAGE is no trace
    stack:
      image_type: 'ORIGINAL\PRIMARY\PROJECTION IMAGE\M\SE'
