  # --- N6: a balanced steady state is T2w, as a convention (T2w stands for T2/T1)

  - name: a GE 3D FIESTA at a very short echo time is T2w, not T1w
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: GR
      sequence_variant: SS
      scan_options: 'FAST_GEMS\VB_GEMS\EDR_GEMS\PFF'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: '3D FIESTA'
      repetition_time: 5.7
      echo_time: 1.5
      flip_angle: 70
    axes:
      technique: FIESTA
      base: T2w

  - name: a Siemens CISS is T2w
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      sequence_variant: 'SK\SS'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 'ciss3d_tra'
      text_sequence_name: '*ci3d1'
      repetition_time: 5.4
      echo_time: 2.4
      flip_angle: 50
    axes:
