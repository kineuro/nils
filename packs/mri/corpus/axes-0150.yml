# SPDX-License-Identifier: AGPL-3.0-only
#
# MRI pack 0.15.0: Nima's rulings on pack 0.14's disputes (record 48,
# 2026-09-30: N2, N3, N4, N6 and R1) and the rule errors of the development
# reference dev-3 on pack 0.14.0, one or more cases for each change, and the
# cases that keep each change from reaching what it must not. Every stack
# here is invented; the values are the shapes the rules turn on.

cases:

  # --- N2: a GE spin echo not split by echo, with a stated train of 2 or more

  - name: a GE T1 spin echo in research mode with a train of 2 is a TSE
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: RM
      sequence_variant: NONE
      scan_options: 'VB_GEMS\TRF_GEMS'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'AX T1+GD'
      repetition_time: 540
      echo_time: 10
      flip_angle: 90
      echo_train_length: 2
    axes:
      technique: TSE
      base: T1w

  - name: a GE spin echo written SE with a train of 2 is a TSE too
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: SE
      sequence_variant: NONE
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'SAG T1'
      repetition_time: 450
      echo_time: 12
      flip_angle: 90
      echo_train_length: 2
    axes:
      technique: TSE

  - name: a GE spin echo with a train of 1 stays a spin echo
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: RM
      sequence_variant: NONE
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'AX T1'
      repetition_time: 560
      echo_time: 14
      flip_angle: 90
      echo_train_length: 1
    axes:
      technique: SE

  - name: another vendor's spin echo with a train of 2 is not moved by the GE rule
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: SE
      sequence_variant: NONE
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'T1 TRA'
      text_sequence_name: 'se1a'
      repetition_time: 570
      echo_time: 14
      flip_angle: 90
      echo_train_length: 2
    axes:
      technique: SE

  # --- N3: a diffusion read out by a turbo spin echo is DWI-TSE

  - name: a Philips diffusion named DWI_TSE is a DWI-TSE with base DWI
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_SE\M\SE'
      scanning_sequence: SE
      sequence_variant: SK
      scan_options: FS
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'DWI_TSE NSA2'
      text_protocol_name: 'DWI_TSE NSA2'
      diffusion_b_value: 1000
      repetition_time: 3800
      echo_time: 64
      flip_angle: 90
      echo_train_length: 25
      pixel_bandwidth: 380
    axes:
      technique: DWI-TSE
      base: DWI

  - name: an unnamed Philips b=1000 image read out at a turbo spin echo's bandwidth is a DWI-TSE
    stack:
      image_type: 'ORIGINAL\PRIMARY\PROJECTION IMAGE\M\SE'
      scanning_sequence: SE
      sequence_variant: SK
      scan_options: FS
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'b1000'
      diffusion_b_value: 1000
      repetition_time: 8500
      echo_time: 64
      flip_angle: 90
      echo_train_length: 37
      pixel_bandwidth: 374
    axes:
      technique: DWI-TSE
      construct: Trace
      base: DWI

  - name: a Philips EPI diffusion, written as a spin echo with its EPI factor as the train, stays DWI-EPI
    stack:
