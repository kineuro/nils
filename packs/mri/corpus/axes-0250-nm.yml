      construct: Real

  - name: a Siemens reformat named PSIR of an inversion recovery is Real
    stack:
      image_type: 'DERIVED\PRIMARY\MPR\NORM\DIS2D'
      scanning_sequence: 'SE\IR'
      sequence_variant: 'SK\SP\MP'
      scan_options: 'IR\PFP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_series_description: 'Cor T1 3D PSIR TrueIR_MPR_sag'
      text_sequence_name: '*spcir_257ns'
      n_slices: 80
      repetition_time: 4000
      echo_time: 381
      inversion_time: 380
      flip_angle: 120
      echo_train_length: 242
    flags:
