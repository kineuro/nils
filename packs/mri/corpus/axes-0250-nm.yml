  # --- sequence identities

  - name: a Siemens enhanced object whose PulseSequenceName is tseR is RESTORE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NONE'
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      sop_class_uid: '1.2.840.10008.5.1.4.1.1.4.1'
      pulse_sequence_name: '*tseR2d1_15'
      echo_pulse_sequence: SPIN
      multiple_spin_echo: 'YES'
      text_series_description: 't2_tse_tra_384'
      n_slices: 25
      repetition_time: 6000
      echo_time: 97
      flip_angle: 150
      echo_train_length: 15
    flags:
      siemens_pulse_tse_restore: true
    axes:
      technique: RESTORE

  - name: a Siemens pre-turbo dual-echo spin echo split by echo is ME-SE
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: RM
      sequence_variant: OSP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'PD_T2_SE_TR'
      text_sequence_name: 'se2'
      split_reason: multi_echo
      n_slices: 19
      repetition_time: 2000
      echo_time: 80
      flip_angle: 90
      echo_train_length: 1
    flags:
      siemens_pre_turbo_dual_echo_se: true
    axes:
      technique: MESE

  - name: guard, a Siemens plain spin echo of one echo stays SE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: SE
      sequence_variant: SP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 't1_se_tra'
      text_sequence_name: '*se2d1'
      n_slices: 20
      repetition_time: 550
      echo_time: 10
      flip_angle: 90
      echo_train_length: 1
    flags:
      siemens_pre_turbo_dual_echo_se: false
    axes:
      technique: SE
