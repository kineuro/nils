# SPDX-License-Identifier: AGPL-3.0-only
#
# MRI pack 1.0.1: certificate 2's rule gaps (F1 to F5) and its three
# convention questions as Nima settled them after deep research (Q1 to Q3;
# the design repository's `studies/2026-10-05-cert2-errors/` and
# `studies/2026-10-05-pack-100/`; flags.yml, section 27). One or more cases
# for each rule, and the cases that keep each rule from reaching what it must
# not. Every stack here is invented from the pattern the design repository's
# files name; none is a real header.

cases:

  # --- F1: a long FLAIR window by the CSF null at a long repetition time

  - name: a Siemens t2_tirm at TR 10,140 ms and TI 2,616 ms nulls CSF and is a FLAIR, not a STIR
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\NORM\DIS2D'
      scanning_sequence: 'SE\IR'
      sequence_variant: 'SK\SP\MP\OSP'
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_sequence_name: '*tir2d1_16'
      text_series_description: 't2_tirm_tra_p2'
      repetition_time: 10140
      inversion_time: 2616
      echo_time: 85
      magnetic_field_strength: 3
      field_strength_normalized: 3
    flags:
      is_flair_by_ti: true

  - name: guard, a GE double inversion at TI 2,802 ms stays out of the long FLAIR window
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Sag CUBE DIR'
      repetition_time: 7000
      inversion_time: 2802
      echo_time: 90
    flags:
      is_flair_by_ti: false

  # --- F2: GE's private pulse sequence name states an inversion

  - name: a GE PROPELLER written SE whose pulse sequence is T1FLAIR/Prop at TI 110 ms at 1.5 T is a STIR
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: SE
      sequence_variant: SK
      scan_options: 'FAST_GEMS\PROP_GEMS'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: 'T1FLAIR/Prop'
      text_series_description: 'Ax T2 PROP'
      repetition_time: 4000
      inversion_time: 110
      echo_time: 90
      magnetic_field_strength: 1.5
      field_strength_normalized: 1.5
    flags:
      ir_stated: true

  - name: guard, a GE FSE with no inversion in its pulse sequence name states none
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      ge_pulse_sequence_name: 'frfse-xl'
      text_series_description: 'Ax T2 FRFSE'
      repetition_time: 4000
      echo_time: 90
    flags:
      ir_stated: false

  # --- F3: a Philips diffusion set of more images a slice than b values

  - name: a Philips DW_SSh of five images a slice at two b values with direction I and no direction count is no Trace
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_SE\M\SE'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      philips_scanning_technique: DwiSE
      philips_diffusion_direction: I
      text_series_description: 'DW_SSh'
      diffusion_b_value: 1000
      dwi_b_values: '0,1000'
      n_slices: 24
      n_instances: 120
      repetition_time: 3800
      echo_time: 90
    flags:
      philips_directional_set: true
      philips_isotropic_private: false
    axes:
      construct: ''

  - name: guard, the same set of b=0 and the isotropic image alone, two a slice at two b values, stays Trace
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_SE\M\SE'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      philips_scanning_technique: DwiSE
      philips_diffusion_direction: I
      text_series_description: 'DW_SSh'
      diffusion_b_value: 1000
      dwi_b_values: '0,1000'
      n_slices: 24
      n_instances: 48
      repetition_time: 3800
      echo_time: 90
    flags:
      philips_directional_set: false
      philips_isotropic_private: true
    axes:
      construct: Trace

  - name: guard, a Philips set of three b values and three images a slice is no directional set
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_SE\M\SE'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      philips_scanning_technique: DwiSE
      philips_diffusion_direction: I
      text_series_description: 'DWI b0 b500 b1000'
      diffusion_b_value: 1000
      dwi_b_values: '0,500,1000'
      n_slices: 20
      n_instances: 60
      repetition_time: 3800
      echo_time: 90
    flags:
      philips_directional_set: false

  - name: guard, a Philips stack of 24 images on 17 slices at one b value is no directional set
    stack:
      image_type: 'ORIGINAL\PRIMARY\M_SE\M\SE'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      philips_scanning_technique: DwiSE
      philips_diffusion_direction: I
      text_series_description: 'DIFF'
      diffusion_b_value: 1000
      dwi_b_values: '1000'
      n_slices: 17
      n_instances: 24
      repetition_time: 3800
      echo_time: 90
    flags:
      philips_directional_set: false
      philips_isotropic_private: true

  # --- F4: a Siemens SMWI is the SWI image of a QSM protocol

  - name: a Siemens SMWI computed from a multi-echo QSM is no acquired echo
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      sequence_variant: 'SP\OSP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d6r'
      text_series_description: 'WIP_QSM_Smwi'
      text_image_comments: 'SMWI (TGV)'
      repetition_time: 40
      echo_time: 20
      flip_angle: 15
      magnetic_field_strength: 7
      field_strength_normalized: 7
    flags:
      siemens_smwi_output: true
      siemens_qsm_acquired_echo: false

  - name: guard, an echo of the same protocol not named SMWI stays an acquired echo
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      sequence_variant: 'SP\OSP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d6r'
      text_series_description: 'WIP_QSM'
      repetition_time: 40
      echo_time: 20
      flip_angle: 15
    flags:
      siemens_smwi_output: false

  # --- F5: GE's registered DSC copy

  - name: a GE Reg - copy of a perfusion run written DERIVED is a registered copy
    stack:
      image_type: 'DERIVED\SECONDARY\REFORMATTED'
      scanning_sequence: 'EP\GR'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Reg - Ax Perfusion +K'
      temporal_positions: 50
      repetition_time: 1500
      echo_time: 30
    flags:
      registered_copy: true

  - name: guard, a GE series written ORIGINAL with Reg in its name is no registered copy
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: 'EP\GR'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Reg - Ax Perfusion +K'
      repetition_time: 1500
      echo_time: 30
    flags:
      registered_copy: false

  # --- Q1: a real (phase-sensitive) inversion recovery in the STIR window

  - name: a Philips real STIR named for no weighting at TE 50 ms is T2w with PSIR and Real
    stack:
      image_type: 'ORIGINAL\PRIMARY\R_IR\R\IR'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'real STIR sag'
      repetition_time: 4200
      inversion_time: 200
      echo_time: 50
      echo_train_length: 17
      magnetic_field_strength: 3
      field_strength_normalized: 3
    flags:
      real_stir_unnamed_long_te: true
      real_stir_unnamed_short_te: false
    axes:
      base: T2w

  - name: the same real STIR at TE 20 ms has no base the file can tell
    stack:
      image_type: 'ORIGINAL\PRIMARY\R_IR\R\IR'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'real STIR sag'
      repetition_time: 4200
      inversion_time: 200
      echo_time: 20
      echo_train_length: 17
      magnetic_field_strength: 3
      field_strength_normalized: 3
    flags:
      real_stir_unnamed_short_te: true
    axes:
      base: ''

  - name: a real STIR named PD keeps PDw
    stack:
      image_type: 'ORIGINAL\PRIMARY\R_IR\R\IR'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'real PD STIR sag'
      repetition_time: 4200
      inversion_time: 200
      echo_time: 50
      echo_train_length: 17
      magnetic_field_strength: 3
      field_strength_normalized: 3
    flags:
      real_stir_named_pd: true
      real_stir_unnamed: false
    axes:
      base: PDw

  - name: guard, a real IR named T1 in the T1-IR window is no real STIR
    stack:
      image_type: 'ORIGINAL\PRIMARY\R_IR\R\IR'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'T1 PSIR sag'
      repetition_time: 2400
      inversion_time: 400
      echo_time: 9
      magnetic_field_strength: 3
      field_strength_normalized: 3
    flags:
      real_ir_stir_window: false

  # --- Q2: a pituitary or sella dynamic

  - name: a Siemens dynamic sella VIBE of 7 time points is a T1-weighted run, no DCE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      sequence_variant: 'SP\OSP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d1'
      text_series_description: 'dynamic sella +contrast'
      temporal_positions: 7
      repetition_time: 4.9
      echo_time: 1.3
      flip_angle: 12
    flags:
      pituitary_dynamic_slow: true
      pituitary_dynamic_t1: true
    axes:
      base: T1w

  - name: a GE 2D pituitary dynamic named DCE with no time points stated is no DCE either
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: SE
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Cor T1 DCE hypofys'
      repetition_time: 400
      echo_time: 10
    flags:
      pituitary_dynamic_slow: true
    axes:
      base: T1w

  - name: guard, a sella dynamic of 40 time points 3 s apart may be a DCE
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      sequence_variant: 'SP\OSP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d1'
      text_series_description: 'dynamic sella DCE'
      temporal_positions: 40
      temporal_resolution: 3000
      repetition_time: 4.9
      echo_time: 1.3
      flip_angle: 12
    flags:
      pituitary_dynamic_slow: false

  - name: guard, a sella dynamic of 40 time points 20 s apart is slow
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: GR
      sequence_variant: 'SP\OSP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: '*fl3d1'
      text_series_description: 'dynamic sella DCE'
      temporal_positions: 40
      temporal_resolution: 20000
      repetition_time: 4.9
      echo_time: 1.3
      flip_angle: 12
    flags:
      pituitary_dynamic_slow: true

  # --- Q3: GE's output labels in ReceiveCoilName (a declared local convention)

  - name: a GE output labelled isoDWI under a series named MCT2w with b value 0 is Trace
    stack:
      image_type: 'DERIVED\SECONDARY\OTHER'
      scanning_sequence: 'EP\RM'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'MCT2w156/R3'
      receive_coil_name: 'isoDWI/b1000/R3'
      diffusion_b_value: 0
      dwi_b_values: '0'
      repetition_time: 8000
      echo_time: 80
    flags:
      ge_coil_label_isodwi: true
      trace_image: true
    axes:
      construct: Trace

  - name: the same series' image labelled T2w(b=0) is no Trace
    stack:
      image_type: 'DERIVED\SECONDARY\OTHER'
      scanning_sequence: 'EP\RM'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'isoDWI-MC-DTI'
      receive_coil_name: 'T2w(b=0)/R3'
      diffusion_b_value: 0
      dwi_b_values: '0'
      repetition_time: 8000
      echo_time: 80
    flags:
      ge_coil_label_not_isodwi: true
    axes:
      construct: ''

  - name: a GE output labelled isoADC is the ADC whatever its series is named
    stack:
      image_type: 'DERIVED\SECONDARY\OTHER'
      scanning_sequence: 'EP\RM'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'MC156/R3'
      receive_coil_name: 'isoADC/b1000/R3'
      repetition_time: 8000
      echo_time: 80
    flags:
      ge_coil_label_isoadc: true
    axes:
      construct: ADC

  - name: guard, a GE coil named for its array is no output label
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: 'EP\RM'
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Ax DWI'
      receive_coil_name: '8HRBRAIN'
      diffusion_b_value: 1000
      repetition_time: 8000
      echo_time: 80
    flags:
      ge_coil_output_label: false
