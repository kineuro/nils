#
# MRI pack 1.2.1: a gradient-echo scout (`gre_scout_readout`: an image typed
# LOCALIZER or SCOUT, or a Siemens position display, on a gradient echo)
# carries the name of the series it plans, so neither the Dixon modifier nor
# a water or fat construct is read from its words (record 55, ruling 12 (c):
# an error System 1 had learnt from the rules). A Dixon or water or fat part
# the header states still stands, and reaches Dixon through either route.
# Every stack here is invented from the pattern; none is a real header.

cases:

  - name: a Philips survey typed LOCALIZER on a gradient echo, named for the mDixon TSE it plans, is no Dixon
    stack:
      image_type: 'LOCALIZER'
      scanning_sequence: GR
      sequence_variant: MP
      scan_options: FC
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'cs1.8_T2_mDixon_TSE_cor_2.5mm'
      n_slices: 1
      repetition_time: 3.1
      echo_time: 1.4
      flip_angle: 8
    flags:
      typed_localizer_gre: true
    axes:
      modifier: FlowComp

  - name: a Philips mDixon TSE image as acquired keeps its Dixon
    stack:
      image_type: 'ORIGINAL\PRIMARY\W\W\DIXON'
      scanning_sequence: SE
      sequence_variant: SK
      scan_options: FC
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'T2_mDixon_TSE_cor'
      n_slices: 30
      repetition_time: 3000
      echo_time: 100
      flip_angle: 90
    flags:
      typed_localizer_gre: false
    axes:
      modifier: 'Dixon,FlowComp'

  - name: a Philips survey named for the water image of the mDixon it plans is no water image and no Dixon
    stack:
      image_type: 'LOCALIZER'
      scanning_sequence: GR
      sequence_variant: MP
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'T1 water image cor'
      n_slices: 1
      repetition_time: 3.1
      echo_time: 1.4
      flip_angle: 8
    flags:
      gre_scout_readout: true
    axes:
      construct: ''
      modifier: ''

  - name: a Siemens position display on a gradient echo, named for the Dixon VIBE it plans, is no Dixon
    stack:
      image_type: 'DERIVED\SECONDARY\POSDISP'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_sequence_name: '*fl2d1'
      text_series_description: 'PosDisp: [7] t1_vibe_dixon_tra'
      n_slices: 1
      repetition_time: 8.6
      echo_time: 4.0
      flip_angle: 20
    flags:
      gre_scout_readout: true
    axes:
      modifier: ''

  - name: a scout whose header states its Dixon part keeps its Dixon
    stack:
      image_type: 'ORIGINAL\PRIMARY\LOCALIZER\DIXON\W'
      scanning_sequence: GR
      sequence_variant: SP
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'survey_mDixon'
      n_slices: 1
      repetition_time: 3.1
      echo_time: 1.4
      flip_angle: 8
    flags:
      gre_scout_readout: true
    axes:
      modifier: Dixon

  - name: a GE scout whose description states its water part by GE's prefix is water, and Dixon through its construct
    stack:
      image_type: 'ORIGINAL\PRIMARY\LOCALIZER'
      scanning_sequence: GR
      sequence_variant: SS
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'WATER: 3-Plane Loc'
      n_slices: 1
      repetition_time: 5.0
      echo_time: 1.6
      flip_angle: 30
    flags:
      gre_scout_readout: true
      has_dixon: false
      has_water: true
    axes:
      construct: Water
      modifier: Dixon

  - name: a scout whose ScanOptions state a Dixon water part is water, and Dixon
    stack:
      image_type: 'ORIGINAL\PRIMARY\LOCALIZER'
      scanning_sequence: GR
      sequence_variant: SP
      scan_options: DIXW
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_sequence_name: '*fl2d1'
      text_series_description: 'localizer'
      n_slices: 1
      repetition_time: 8.6
      echo_time: 4.0
      flip_angle: 20
    flags:
      gre_scout_readout: true
    axes:
      construct: Water
      modifier: Dixon

  - name: a scout whose ScanOptions state a Dixon fat part is fat, and Dixon
    stack:
      image_type: 'ORIGINAL\PRIMARY\LOCALIZER'
      scanning_sequence: GR
      sequence_variant: SP
      scan_options: DIXF
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_sequence_name: '*fl2d1'
      text_series_description: 'localizer'
      n_slices: 1
      repetition_time: 8.6
      echo_time: 4.0
      flip_angle: 20
    flags:
      gre_scout_readout: true
    axes:
      construct: Fat
      modifier: Dixon
