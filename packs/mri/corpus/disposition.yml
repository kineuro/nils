#
# What to do with a stack, as opposed to what it is
# (`docs/specs/wave3-anonymize-and-bids.md`, section 7).
#
# The SyMRI cases first, because they are why the concept exists. v0 has one
# rule, `NIFTI_INCOMPATIBLE_PROVENANCES = {"SyMRI"}`, and refuses to convert
# all 36,692 SyMRI stacks in the live archive. That is right for the 33,692
# that are the MDME container and wrong for the roughly 3,000 that are
# ordinary images.

cases:

  # --- section 7.1: SyMRI is three different things

  - name: the MDME container is a working scan and not an image
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_series_description: 'SyMRI MDME'
      text_sequence_name: 'qrapmaster'
      scanning_sequence: SE
      image_role: original_primary
    axes:
      # Pack 0.9.0, Nima's ruling (2026-09-28): the images as acquired are
      # RawRecon; they are still the working scan the maps come from.
      provenance: RawRecon
      technique: MDME
      disposition: working_scan
      convertible: 'no'

  - name: a synthetic contrast from the same series is an ordinary image
    stack:
      image_type: 'DERIVED\PRIMARY\M\ND'
      text_series_description: 'SyMRI synthetic T1w'
      image_role: derived
    axes:
      provenance: SyMRI
      construct: SyntheticT1w
      disposition: scanner_derived
      convertible: 'yes'

  - name: and so is a quantitative map, which BIDS has a word for
    stack:
      image_type: 'DERIVED\PRIMARY\ND'
      text_series_description: 'SyMRI T1map'
      image_role: derived
    axes:
      provenance: SyMRI
      construct: T1map
      disposition: scanner_derived
      convertible: 'yes'

  # --- the rest of the vocabulary

  - name: an ordinary acquisition needs no rule to say so
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: GR
      sequence_variant: 'SK\SP\MP'
      text_sequence_name: '*tfl3d1_16'
      text_series_description: 'sag T1 mprage'
      mr_acquisition_type: 3D
      image_role: original_primary
    axes:
      disposition: acquisition
      convertible: 'yes'

  - name: a localizer is a scout, and converts perfectly well
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_series_description: 'localizer'
      image_role: original_primary
    axes:
      directory_type: localizer
      disposition: scout
      convertible: 'yes'

  - name: a screen capture is not an image whatever its ImageType claims
    stack:
      image_type: 'ORIGINAL\SECONDARY\SCREENSHOT'
      text_series_description: 'patient protocol'
      image_role: not_an_image
    axes:
      disposition: excluded
      convertible: 'no'

  - name: an ADC map is derived by the scanner from the diffusion it just ran
    stack:
      image_type: 'DERIVED\PRIMARY\DIFFUSION\ADC\ND\NORM'
      text_series_description: 'ax dwi ADC'
      scanning_sequence: EP
      image_role: derived
    axes:
      # Multi-valued: the ImageType's own ND rides along with it.
      construct: 'ADC,ND'
      disposition: scanner_derived
      convertible: 'yes'

  - name: a reformat the scanner made is a reformat
    stack:
      image_type: 'DERIVED\PRIMARY\MPR'
      text_series_description: 'cor MPR'
      image_role: derived
    axes:
      construct: MPR
      disposition: reformat
      convertible: 'yes'

  # MRI pack 0.12.0: a Siemens screen save is still not an image, now that
  # a secondary without a primary is classified.
  - name: a screen save is ruled out as a screenshot
    stack:
      image_type: 'DERIVED\SECONDARY\SCREEN SAVE'
      scanning_sequence: SE
      text_series_description: 'sag t1 screenshot'
    axes:
      directory_type: excluded
      disposition: excluded
      convertible: 'no'

  # MRI pack 0.12.0, Nima's ruling (2026-09-28): a workstation reformat,
  # tagged SECONDARY and never PRIMARY, is no longer ruled out by the class
  # phase. It is classified on every axis as any stack is, and its
  # disposition is `reformat`, which is what a pipeline reads to skip it.
  - name: a workstation reformat is classified and marked a reformat
    stack:
      image_type: 'DERIVED\SECONDARY\MPR'
      text_series_description: 'cor MPR'
      image_role: derived
    axes:
      provenance: ProjectionDerived
      construct: MPR
      directory_type: anat
      disposition: reformat
      convertible: 'yes'
      role: ''

  # Whatever its construct turned out to be: a map a workstation copied
  # is still a workstation's, and a pipeline skips it.
  - name: a workstation copy of an ADC map is a reformat, not scanner derived
    stack:
      image_type: 'DERIVED\SECONDARY\DIFFUSION\ADC'
      scanning_sequence: EP
      text_sequence_name: '*ep_b0_1000'
      text_series_description: 'ADC tra'
      image_role: derived
    axes:
      construct: ADC
      disposition: reformat

  # And a workstation reformat of an MPRAGE is not the session's main T1w,
  # though its base, technique and intent are the source's.
  - name: a workstation reformat of an MPRAGE keeps its axes and takes no role
    stack:
      image_type: 'DERIVED\SECONDARY\MPR\ND\NORM'
      scanning_sequence: 'GR\IR'
      sequence_variant: 'SK\SP\MP'
      mr_acquisition_type: 3D
      text_sequence_name: '*tfl3d1_16'
      text_series_description: 'T1 mprage cor MPR'
      image_role: derived
    axes:
      provenance: ProjectionDerived
      technique: MPRAGE
      base: T1w
      construct: 'MPR,ND'
      directory_type: anat
      disposition: reformat
      role: ''

  # --- section 10: which stacks are candidates for a role

  - name: an anatomical T1w acquisition is a candidate main T1w
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM'
      scanning_sequence: GR
      sequence_variant: 'SK\SP\MP'
      text_sequence_name: '*tfl3d1_16'
      text_series_description: 'sag T1 mprage'
      mr_acquisition_type: 3D
      image_role: original_primary
    axes:
      base: T1w
      directory_type: anat
      disposition: acquisition
      role: t1w

  - name: a FLAIR is a candidate FLAIR and not a candidate T1w
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      text_sequence_name: '*tir2d1_15'
      text_series_description: 'ax T2 FLAIR'
      image_role: original_primary
    axes:
      base: T2w
      disposition: acquisition
      role: flair

  # Record 49: a T1-weighted FLAIR is not a session's main T1w, and its base
  # is T1w, so it is not a candidate FLAIR either.
  - name: a T1-FLAIR is a candidate for no role
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: 'SE\IR'
      sequence_variant: SK
      text_sequence_name: '*tir2d1_7'
      text_series_description: 'ax T1 FLAIR'
      image_role: original_primary
    axes:
      base: T1w
      modifier: FLAIR
      directory_type: anat
      disposition: acquisition
      role: ''

  # v0 spends four query conditions on this: the intent is anatomical, the
  # stack is not a localizer, and its construct holds none of MIP, MPR,
  # Reformat or Synthetic. Once the disposition exists, one condition does it.
  - name: a synthetic T1w is not a candidate, because it is not an acquisition
    stack:
      image_type: 'DERIVED\PRIMARY\M\ND'
      text_series_description: 'SyMRI synthetic T1w'
      image_role: derived
    axes:
      disposition: scanner_derived
      role: ''

  - name: nor is a localizer, for the same one reason
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      text_series_description: 'localizer'
      image_role: original_primary
    axes:
      disposition: scout
      role: ''

  # --- record 37, slice S5: pixels nobody can read

  - name: an encrypted image is not converted, and is not excluded either
    stack:
      image_type: 'DERIVED\PRIMARY\ENCRYPTED'
      text_series_description: 'ax t1'
      image_role: derived
    axes:
      quality: Encrypted
      convertible: 'no'
      disposition: acquisition

  # --- record 41: what the scanner computed and wrote as an original image.
  # The printouts switch both on, and both are made from images the scanner
  # had just taken: the motion-corrected copy of a BOLD run, and the
  # perfusion-weighted image an ASL series computes from its label and
  # control images.

  # MRI pack 0.10.0, Nima's ruling (2026-09-28): "if Motion Correction is
  # ORIGINAL\PRIMARY then it is not derived". The copy Siemens writes
  # ORIGINAL is the acquisition with its MoCo modifier, and one written
  # DERIVED is the scanner's.
  - name: a motion-corrected copy of a BOLD run written ORIGINAL is not derived
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM\MOCO\MOSAIC'
      scanning_sequence: EP
      sequence_variant: 'SK\OSP'
      text_sequence_name: '*epfid2d1_104'
      text_series_description: 'MoCoSeries'
      text_protocol_name: 'rs-fMRI_ep2d_bold_sms_2mmi_RL_hcp_6min'
      image_role: original_primary
      n_instances: 500
      n_slices: 1
    axes:
      technique: BOLD
      modifier: MoCo
      provenance: RawRecon
      disposition: acquisition
      convertible: 'yes'

  - name: a motion-corrected copy written DERIVED is the scanner's
    stack:
      image_type: 'DERIVED\PRIMARY\M\ND\NORM\MOCO\MOSAIC'
      scanning_sequence: EP
      sequence_variant: 'SK\OSP'
      text_sequence_name: '*epfid2d1_104'
      text_series_description: 'MoCoSeries'
      text_protocol_name: 'rs-fMRI_ep2d_bold_sms_2mmi_RL_hcp_6min'
      image_role: derived
      n_instances: 500
      n_slices: 1
    axes:
      technique: BOLD
      modifier: MoCo
      provenance: BOLDRecon
      disposition: scanner_derived
      convertible: 'yes'

  - name: and the run itself is the acquisition
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND\NORM\MOSAIC'
      scanning_sequence: EP
      sequence_variant: 'SK\OSP'
      text_sequence_name: '*epfid2d1_104'
      text_series_description: 'rs-fMRI_ep2d_bold_sms_2mmi_RL_hcp_6min'
      image_role: original_primary
    axes:
      disposition: acquisition

  - name: the perfusion-weighted image of an ASL series is scanner derived
    stack:
      image_type: 'DERIVED\PRIMARY\ASL\ND\NORM\SUB\TTEST\MOSAIC'
      scanning_sequence: EP
      sequence_variant: SK
      text_sequence_name: '*tgse3d1_3000'
      text_series_description: 'Ax ASL 3D_PERFUSION_WEIGHTED'
      image_role: derived
    axes:
      provenance: ASLRecon
      disposition: scanner_derived

  - name: and the label and control images it was computed from are the acquisition
    stack:
      image_type: 'ORIGINAL\PRIMARY\ASL\NONE\ND\NORM\MOSAIC'
      scanning_sequence: EP
      sequence_variant: SK
      text_sequence_name: '*tgse3d1_3000'
      text_series_description: 'Ax ASL 3D'
      image_role: original_primary
    axes:
      # Pack 0.9.0: the acquisition's own images are RawRecon (Nima's
      # ruling, 2026-09-28); the subtraction above keeps ASLRecon.
      provenance: RawRecon
      disposition: acquisition
      directory_type: perf

  # --- MRI pack 1.5.1, the ruling of 2026-11-28: an image the scanner
  # computed from what it acquired, and that people use, is scanner_derived,
  # never a working scan and never the acquisition. Invented stacks, in the
  # shapes the makers write; beside each kind, the stacks that must not move.

  # SyMRI's products the working-scan rule did not name.
  - name: a synthetic DIR is a SyMRI product and converts
    stack:
      image_type: 'DERIVED\PRIMARY\DIR\SYNTHETIC'
      text_series_description: 'SyMRI DIR'
      image_role: derived
    axes:
      provenance: SyMRI
      construct: SyntheticDIR
      disposition: scanner_derived
      convertible: 'yes'

  - name: a synthetic PSIR is a SyMRI product and converts
    stack:
      image_type: 'DERIVED\PRIMARY\PSIR\SYNTHETIC'
      text_series_description: 'SyMRI PSIR'
      image_role: derived
    axes:
      provenance: SyMRI
      construct: SyntheticPSIR
      disposition: scanner_derived
      convertible: 'yes'

  - name: a synthetic STIR is a SyMRI product and converts
    stack:
      image_type: 'DERIVED\PRIMARY\T2STIR\SYNTHETIC'
      text_series_description: 'SyMRI STIR'
      image_role: derived
    axes:
      provenance: SyMRI
      construct: SyntheticSTIR
      disposition: scanner_derived
      convertible: 'yes'

  - name: a SyMRI tissue map is a SyMRI product and converts
    stack:
      image_type: 'DERIVED\PRIMARY\CSF'
      scanning_sequence: SE
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'CSF'
      text_protocol_name: 'SyMRI'
      image_role: derived
    axes:
      provenance: SyMRI
      construct: Qmap
      disposition: scanner_derived
      convertible: 'yes'

  - name: a SyMRI map set in one series is a SyMRI product and converts
    stack:
      image_type: 'DERIVED\PRIMARY\MULTI_QMAP\T1\T2\PD'
      scanning_sequence: SE
      sequence_variant: NONE
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'SyMaps (T1T2PD)'
      n_slices: 30
      repetition_time: 4500
      echo_time: 100
      image_role: derived
    axes:
      provenance: SyMRI
      construct: MultiQmap
      disposition: scanner_derived
      convertible: 'yes'

  - name: a SyMRI B1 map is a SyMRI product and converts
    stack:
      image_type: 'DERIVED\PRIMARY\B1MAP'
      text_series_description: 'SyMRI B1 map'
      image_role: derived
    axes:
      provenance: SyMRI
      construct: B1map
      disposition: scanner_derived
      convertible: 'yes'

  - name: guard, a QALAS image as acquired stays a working scan
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\DIS2D'
      scanning_sequence: 'GR\IR'
      sequence_variant: 'SK\SP\MP'
      mr_acquisition_type: 3D
      manufacturer: SIEMENS
      text_sequence_name: 'qalas3d'
      text_series_description: 'SyMRI 3D QALAS'
      image_role: original_primary
    axes:
      provenance: RawRecon
      technique: QALAS
      disposition: working_scan
      convertible: 'no'

  # An encrypted SyMRI map set, which only the vendor's software opens.
  - name: an encrypted SyMRI map set is scanner derived and still not converted
    stack:
      image_type: 'DERIVED\PRIMARY\MULTI_QMAP\ENCRYPTED'
      scanning_sequence: SE
      mr_acquisition_type: 2D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'MAGiC QMaps'
      image_role: derived
    axes:
      quality: Encrypted
      provenance: SyMRI
      construct: MultiQmap
      disposition: scanner_derived
      convertible: 'no'

  - name: and so is Philips' encrypted map set
    stack:
      image_type: 'DERIVED\PRIMARY\MULTI_QMAP\T1\T2\PD\ENCRYPTED'
      scanning_sequence: SE
      sequence_variant: NONE
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'SyMaps (T1T2PD)'
      n_slices: 30
      repetition_time: 4500
      echo_time: 100
      image_role: derived
    axes:
      quality: Encrypted
      provenance: SyMRI
      construct: MultiQmap
      disposition: scanner_derived
      convertible: 'no'

  # The perfusion outputs, on every maker; the ASL label and control images
  # (above) and the M0 scan stay acquisitions.
  - name: GE's perfusion-weighted ASL pass is scanner derived
    stack:
      image_type: 'DERIVED\PRIMARY\ASL\PERFUSION_ASL'
      scanning_sequence: 'RM\IR'
      scan_options: 'SPIRAL_GEMS'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      ge_asl_contrast_technique: PSEUDOCONTINUOUS
      text_series_description: 'Ax 3D ASL'
      image_role: derived
    axes:
      construct: DeltaM
      provenance: ASLRecon
      disposition: scanner_derived
      convertible: 'yes'
      role: ''

  - name: Philips' ASL difference image written ORIGINAL is scanner derived
    stack:
      image_type: 'ORIGINAL\PRIMARY\PERFUSION\FFE'
      scanning_sequence: GR
      mr_acquisition_type: 2D
      manufacturer: Philips Medical Systems
      text_series_description: 'pCASL'
      image_role: original_primary
    axes:
      construct: DeltaM
      provenance: ASLRecon
      disposition: scanner_derived
      convertible: 'yes'

  - name: an ASL CBF map is scanner derived
    stack:
      image_type: 'DERIVED\PRIMARY\ASL\CBF'
      scanning_sequence: 'RM\IR'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Cerebral Blood Flow'
      image_role: derived
    axes:
      construct: CBF
      disposition: scanner_derived

  - name: guard, GE's proton-density ASL pass stays the acquisition
    stack:
      image_type: 'ORIGINAL\PRIMARY\ASL'
      scanning_sequence: 'RM\IR'
      scan_options: 'SPIRAL_GEMS'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      ge_asl_contrast_technique: CONTINUOUS
      text_series_description: 'Ax 3D ASL'
      image_role: original_primary
    axes:
      construct: M0
      provenance: RawRecon
      disposition: acquisition

  - name: guard, a Siemens M0 named for it stays the acquisition
    stack:
      image_type: 'ORIGINAL\PRIMARY\OTHER'
      scanning_sequence: EP
      sequence_variant: SK
      manufacturer: SIEMENS
      text_sequence_name: '*epfid2d1_64'
      text_series_description: 'pcasl_M0'
      n_instances: 1
      n_slices: 1
      image_role: original_primary
    axes:
      construct: M0
      disposition: acquisition

  - name: guard, an M0 scan written DERIVED is ASLRecon and stays the acquisition
    stack:
      image_type: 'DERIVED\PRIMARY\ASL'
      scanning_sequence: EP
      sequence_variant: SK
      manufacturer: SIEMENS
      text_sequence_name: '*epfid2d1_64'
      text_series_description: 'pcasl_M0'
      n_instances: 1
      n_slices: 1
      image_role: derived
    axes:
      construct: M0
      provenance: ASLRecon
      disposition: acquisition

  - name: a DSC map with no construct of its own is scanner derived by its provenance
    stack:
      image_type: 'DERIVED\PRIMARY\PERFUSION\OEF MODEL BASED'
      scanning_sequence: EP
      sequence_variant: SK
      manufacturer: SIEMENS
      text_sequence_name: '*epfid2d1_128'
      text_series_description: 'ep2d_perf_OEF'
      image_role: derived
    axes:
      provenance: PerfusionRecon
      construct: ''
      disposition: scanner_derived
      convertible: 'yes'

  - name: an ASL output with no construct of its own is scanner derived by its provenance
    stack:
      image_type: 'DERIVED\PRIMARY\ASL'
      scanning_sequence: 'RM\IR'
      mr_acquisition_type: 3D
      manufacturer: GE MEDICAL SYSTEMS
      text_series_description: 'Transit Delay'
      image_role: derived
    axes:
      provenance: ASLRecon
      construct: ''
      disposition: scanner_derived
      convertible: 'yes'
