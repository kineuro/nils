# SPDX-License-Identifier: AGPL-3.0-only
#
# MRI pack 0.18.0: the rule bugs of the sealed-1 checkpoint (groups A1 to
# A20) and the vendor conventions of the 2026-09-30 deep research (Part A,
# cases 1 to 35), as Nima ruled them (record 48, "After the sealed
# checkpoint" and "After dev-5's reading": the conventions follow the deep
# research, except where the archive's counts or the vocabulary overrule
# it). One or more cases for each change, and the cases that keep each
# change from reaching what it must not. Every stack here is invented from
# the pattern the design repository's files name; none is a real header.

cases:

  # --- A1, case 17: DSC maps and a derived motion-corrected DSC run

  - name: a DSC rCBV map named by a third-party tool, with no map token, is PerfusionRecon and CBV
    stack:
      image_type: 'ORIGINAL\PRIMARY\M\ND'
      scanning_sequence: EP
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'rCBV calculated with Lupe'
      repetition_time: 1500
      echo_time: 30
      n_instances: 20
      n_slices: 20
    axes:
      provenance: PerfusionRecon
      construct: 'CBV,ND'
      base: PWI

  - name: a leakage map named K2 is PerfusionRecon
    stack:
      image_type: 'DERIVED\SECONDARY'
      scanning_sequence: EP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'K2 leakage [cSVD]'
      repetition_time: 1500
      echo_time: 30
      n_instances: 20
      n_slices: 20
    axes:
      provenance: PerfusionRecon

  - name: a Siemens percentage of baseline at peak map is PerfusionRecon
    stack:
      image_type: 'DERIVED\PRIMARY\PERFUSION\PBP\ND'
      scanning_sequence: EP
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'ep2d_perf_PBP'
      text_sequence_name: '*epfid2d1_128'
    axes:
      provenance: PerfusionRecon
      technique: Perfusion

  - name: a derived motion-corrected DSC run without the PERFUSION token is PerfusionRecon
    stack:
      image_type: 'DERIVED\PRIMARY\M\ND\MOCO\MOSAIC'
      scanning_sequence: EP
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'ep2d_perf_MoCo'
      text_sequence_name: '*epfid2d1_128'
      repetition_time: 1500
      echo_time: 30
      n_instances: 50
    axes:
      provenance: PerfusionRecon
      technique: Perfusion
      modifier: MoCo

  - name: an acquired DSC run named for the CBV it is computed for stays RawRecon
    stack:
      image_type: 'ORIGINAL\PRIMARY\PERFUSION\NONE\ND\MOSAIC'
      scanning_sequence: EP
      sequence_variant: SK
      mr_acquisition_type: 2D
      manufacturer: SIEMENS
      text_series_description: 'ep2d_perf rCBV'
      text_sequence_name: '*epfid2d1_128'
      repetition_time: 1500
      echo_time: 30
      n_instances: 50
    axes:
      provenance: RawRecon
      technique: Perfusion
      base: PWI

  # --- A2, case 18: a DSC EPI named for susceptibility is perfusion, never SWI

  - name: a Siemens DSC EPI named for susceptibility is an acquired perfusion series, not SWI
    stack:
      image_type: 'ORIGINAL\PRIMARY\PERFUSION\NONE\ND\MOSAIC'
