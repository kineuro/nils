[bids]
# The subject code is masked for the same reason. Six things are being
# asserted here at once, and each is worth naming:
#
#   * the two repeats of one acquisition are told apart by `run-`, which is the
#     standard's only answer, and not by a counter of ours;
#   * the two echoes are told apart by the measured `EchoNumbers`, which is
#     section 9.1's first correction to v0;
#   * the post-contrast repeat carries `ce-`, which nothing released before
#     2026-09-05 did, because the axis stores `1` and the release compared it
#     to `yes`;
#   * the ADC keeps its own suffix and takes no `part`, because the standard
#     gives its scanner derivatives none;
#   * the SWI has no BIDS word, so it is a derivative under section 9.1's name
#     carried in `acq-`;
#   * the localizer is DICOM under `sourcedata/`, which is the default of the
#     four answers a release may take.
#
# The functional series is not here at all, and that is the point: `func`
# requires `task`, nothing in a DICOM says what a subject was doing, and the
# release put it nowhere and raised one question per study.
files = [
  "derivatives/nils/sub-X/ses-20220115/anat/sub-X_ses-20220115_acq-AxSWI3DGREMagnitude.nii.gz",
  "sourcedata/sub-X/ses-20220115/localizer/Ax_T1w_2D_MPRAGE_ND/<dicom>",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_acq-Ax2DIRTSEFLAIR_FLAIR.nii.gz",
