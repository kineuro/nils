#
# What the reference selections come out as, in both layouts
# (`docs/specs/wave3-anonymize-and-bids.md`, section 12, bar 3).
#
# Hand-verified: every line below was read off a run and checked one at a
# time. The generator does not compute them, so a change in the pack, in either
# grammar or in the routing shows up here as a difference rather than moving
# with the code. When a difference is right, this file is the thing to edit,
# and the edit is the record of the decision.
#
# The corpus is `nils-dicom`'s `reference` example: one person, two occasions,
# and one of every case the release has to get right.

[descriptive]
# `sub-<code>/ses-<label>/` is stripped: the code is a pseudonym and changes
# with the key.
names = [
  "ses-20220115/anat/Ax_T1w_3D_MPRAGE_ND_1",
  "ses-20220115/anat/Ax_T1w_3D_MPRAGE_ND_2",
  "ses-20220115/anat/Ax_T2starw_3D_GRE_Magnitude-ND",
  "ses-20220115/anat/Ax_T2w_2D_FLAIR_TIRM_ND",
  "ses-20220115/dwi/Ax_DWI_2D_DWI-EPI_ADC_b1000",
  "ses-20220115/dwi/Ax_DWI_2D_DWI-EPI_Trace_b1000",
  "ses-20220115/func/Ax_T2starw_2D_MoCo_BOLD_ND",
  "ses-20220115/localizer/Ax_T1w_2D_MPRAGE_ND",
  "ses-20220715/anat/Ax_T1w_3D_MPRAGE_ND_CE",
  "ses-20220715/misc/Ax_T1w_2D_GRE_ND_e1",
  "ses-20220715/misc/Ax_T1w_2D_GRE_ND_e2",
]

# Amended 2026-09-29, MRI pack 0.14.0. The BOLD series, whose file states no
# readout (no ScanningSequence, no sequence name) at a short echo time, is
# T2*-weighted by the pack's rule for such a BOLD series, where the echo-time
# window had called it T1w; a gradient-echo BOLD is T2*-weighted, so the
# descriptive name is `Ax_T2starw_2D_MoCo_BOLD_ND`. Its BIDS name did not move.

# Amended 2026-09-28, MRI pack 0.12.0. The SWI's magnitude, whose image type
# holds ND, keeps construct ND beside Magnitude, as the SyMRI route's images
# have since 0.11.0 (the reading guide reads ND off the image type), so its
# descriptive name is `Magnitude-ND`. Its BIDS name did not move.

# Amended 2026-09-19, record 35. Eight names gained a body part: the classifier
# could not read the word BRAIN in front of it, because the normalizer stripped
# that token before the body-part rule saw the text, so those stacks had no body
# part at all and the label left it out. Each difference was checked by hand to
# be one token inserted into `acq-` and nothing else. The body part stays in the
# label because names must be unique: an archive-wide measurement found it is
# what separates 22 otherwise identical pairs, and BIDS also carries it in the
# sidecar as `BodyPart`.
[bids]
# The subject code is masked for the same reason. Six things are being
# asserted here at once, and each is worth naming:
#
#   * the two repeats of one acquisition are told apart by `run-`, which is the
#     standard's only answer, and not by a counter of ours;
#   * the two echoes are told apart by the measured `EchoNumbers`, which is
#     section 9.1's first correction to v0;
#   * the post-contrast repeat carries `ce-`, which nothing released before
#     2026-09-05 did, because the axis stores `1` and the release compared it
#     to `yes`;
#   * the ADC keeps its own suffix and takes no `part`, because the standard
#     gives its scanner derivatives none;
#   * the SWI's magnitude is the acquisition's own T2*-weighted image, so it
#     is `part-mag` of the suffix `T2starw` (MRI pack 0.9.0; the processed SWI
#     image, which BIDS has no word for, would be a derivative);
#   * the localizer is DICOM under `sourcedata/`, which is the default of the
#     four answers a release may take.
#
# The functional series is not here at all, and that is the point: `func`
# requires `task`, nothing in a DICOM says what a subject was doing, and the
# release put it nowhere and raised one question per study.
#
# Amended 2026-09-20, record 37 S6. One name changed: `DTIRecon` left the `acq-`
# label for `rec-`. It is a provenance, the thing that made the image out of the
# acquisition, which is what BIDS means by `rec-`; the schema's `dwi`
# ScannerDerivatives group, which owns the `ADC` suffix, allows the entity. The
# move loses no distinction and gains one: the `ADC` and the `trace` now share
# `acq-BrainAx2DDWIEPI`, which is true of them, where the old pair of labels
# claimed two different acquisitions. Checked name by name; nothing else moved.
#
# Amended 2026-09-28, MRI pack 0.9.0. The SWI series' magnitude is RawRecon and
# base T2*w, as acquired, where it was SWIRecon and base SWI. So it left
# `derivatives/` for the raw tree as `part-mag` of `T2starw`, which the schema
# admits, and its descriptive name says T2starw where it said SWI. Checked
# name by name; nothing else moved.
#
# Amended 2026-09-28, MRI pack 0.11.0. The ADC map, made by the scanner from
# a plain DWI, is RawRecon and no longer DTIRecon (ruling 7), so its name
# loses `rec-DTIRecon`. Nothing else moved.
# Amended 2026-10-08, record 55 C4. Nima found the BIDS names unreadable: every
# axis glued into one label, the brain spelled out, the FLAIR said twice. Each
# name now follows v0's slot order inside `acq-`, the brain implicit as in v0,
# and nothing the suffix or another entity already says. The slots are joined
# as CamelCase: `+` passes the official validator 3.0.2 but Nima found it no
# help ("+ is not very helping here"). This is the full naming style, the
# default; the minimal one is `[bids_minimal]` below. Checked name by name:
#
#   * the FLAIR: `Ax`, `2D`, the technique `IRTSE`; `FLAIR` left out because
#     it is the suffix;
#   * the MPRAGE pair and the post-contrast MPRAGE: `Ax`, `3D`, `MPRAGE`, with
#     `run-` and `ce-` as before;
#   * the SWI magnitude: `Ax`, `3D`, `GRE`, `part-mag` as before;
#   * the ADC and the trace: `Ax`, `2D`, `DWIEPI`, sharing one label, which is
#     true of them;
#   * the two echoes: `Ax`, `2D`, `GRE`, told apart by `echo-`.
#
# Only the `acq-` labels moved: no suffix, entity, route or count.

files = [
  "sourcedata/sub-X/ses-20220115/localizer/Ax_T1w_2D_MPRAGE_ND/<dicom>",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_acq-Ax2DIRTSE_FLAIR.nii.gz",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_acq-Ax3DMPRAGE_run-1_T1w.nii.gz",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_acq-Ax3DMPRAGE_run-2_T1w.nii.gz",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_acq-Ax3DGRE_part-mag_T2starw.nii.gz",
  "sub-X/ses-20220115/dwi/sub-X_ses-20220115_acq-Ax2DDWIEPI_ADC.nii.gz",
  "sub-X/ses-20220115/dwi/sub-X_ses-20220115_acq-Ax2DDWIEPI_trace.nii.gz",
  "sub-X/ses-20220715/anat/sub-X_ses-20220715_acq-Ax2DGRE_echo-1_T1w.nii.gz",
  "sub-X/ses-20220715/anat/sub-X_ses-20220715_acq-Ax2DGRE_echo-2_T1w.nii.gz",
  "sub-X/ses-20220715/anat/sub-X_ses-20220715_acq-Ax3DMPRAGE_ce-contrast_T1w.nii.gz",
]

# Record 55 C4, the minimal naming style (`--naming minimal`): `acq-` only
# where two stacks of a session would otherwise share a name. In this tree no
# two do once the localizer, which never takes its BIDS name, is left out of
# the comparison: the MPRAGE pair are true repeats and keep `run-`, the two
# echoes are `echo-`, the ADC and the trace their suffixes, the magnitude its
# `part-`, the post-contrast its `ce-`. Every slot the full style spells is in
# the sidecar's `NILS` object and the descriptive name in `scans.tsv`.
# Checked name by name on 2026-10-08.
[bids_minimal]
files = [
  "sourcedata/sub-X/ses-20220115/localizer/Ax_T1w_2D_MPRAGE_ND/<dicom>",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_FLAIR.nii.gz",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_part-mag_T2starw.nii.gz",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_run-1_T1w.nii.gz",
  "sub-X/ses-20220115/anat/sub-X_ses-20220115_run-2_T1w.nii.gz",
  "sub-X/ses-20220115/dwi/sub-X_ses-20220115_ADC.nii.gz",
  "sub-X/ses-20220115/dwi/sub-X_ses-20220115_trace.nii.gz",
  "sub-X/ses-20220715/anat/sub-X_ses-20220715_ce-contrast_T1w.nii.gz",
  "sub-X/ses-20220715/anat/sub-X_ses-20220715_echo-1_T1w.nii.gz",
  "sub-X/ses-20220715/anat/sub-X_ses-20220715_echo-2_T1w.nii.gz",
]

[private]
# Wave 4a section 5: the diffusion series carries a Siemens block. The pack's
# release list names the b value and the directionality, so they leave; the
# coil string is ingested into the registry and never released. The gate reads
# the released tree with `nils private`, which counts shapes and never values,
# and asserts that nothing it finds is outside the release list.
kept = ["0019xx0C SIEMENS MR HEADER", "0019xx0D SIEMENS MR HEADER"]
dropped = ["0051xx0F SIEMENS MR HEADER"]

[clinical]
# Wave 4a section 7.4: what the clinical layer put in the BIDS tree. The
# subject's sex and birth date come from the reference files themselves; the
# two EDSS scores are the gate's, five days before the first session and five
# days after the second, so each session's nearest value is its own and the
# signed distance tells the two apart. The date column is checked against the
# registry's own nearest by the bar, not listed here.
sex = "F"
age = 42

[clinical.sessions.20220115]
age = 42
edss = "3.5"
edss_days = -5

[clinical.sessions.20220715]
age = 42
edss = "4"
edss_days = 5

# Wave 7a section 8.1, record 55 C4: the names tree (`reference --names`), one
# session of stacks that want shared names. A release is never refused for a
# name conflict, so every stack is here, in every style:
#
#   * two FLAIR series alike in everything are one acquisition made again and
#     keep `run-` in BIDS; the third, cut at 3 mm, shares their name until the
#     slice thickness is said, and then all three say it: after the pack's
#     slots in the full style (`Ax2DIRTSE3mm`), alone in the minimal one
#     (`acq-3mm`), as its own `_3mm` slot in the descriptive layout, where the
#     repeats then take v0's plain counter `_1`, `_2` because that layout has
#     no runs;
#   * two MPRAGE series differ only in the protocol name, which no name may
#     spell, so they take the plain number, last: `Ax3DMPRAGE1` in the full
#     style, `acq-1` in the minimal one, `_1` in the descriptive layout. Never
#     a `run-`.
#
# The descriptive names are v0's grammar exactly. Read off a run on
# 2026-10-08 and checked name by name.
[names]
bids = [
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-Ax2DIRTSE3mm_FLAIR.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-Ax2DIRTSE5mm_run-1_FLAIR.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-Ax2DIRTSE5mm_run-2_FLAIR.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-Ax3DMPRAGE1_T1w.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-Ax3DMPRAGE2_T1w.nii.gz",
]
minimal = [
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-1_T1w.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-2_T1w.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-3mm_FLAIR.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-5mm_run-1_FLAIR.nii.gz",
  "sub-X/ses-20230301/anat/sub-X_ses-20230301_acq-5mm_run-2_FLAIR.nii.gz",
]
descriptive = [
  "ses-20230301/anat/Ax_T1w_3D_MPRAGE_ND_1",
  "ses-20230301/anat/Ax_T1w_3D_MPRAGE_ND_2",
  "ses-20230301/anat/Ax_T2w_2D_FLAIR_TIRM_ND_3mm",
  "ses-20230301/anat/Ax_T2w_2D_FLAIR_TIRM_ND_5mm_1",
  "ses-20230301/anat/Ax_T2w_2D_FLAIR_TIRM_ND_5mm_2",
]
