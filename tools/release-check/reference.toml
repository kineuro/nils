#
# What the reference selections come out as, in both layouts
# (`docs/specs/wave3-anonymize-and-bids.md`, section 12, bar 3).
#
# Hand-verified: every line below was read off a run and checked one at a
# time. The generator does not compute them, so a change in the pack, in either
# grammar or in the routing shows up here as a difference rather than moving
# with the code. When a difference is right, this file is the thing to edit,
# and the edit is the record of the decision.
#
# The corpus is `nils-dicom`'s `reference` example: one person, two occasions,
# and one of every case the release has to get right.

