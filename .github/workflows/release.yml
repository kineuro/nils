name: release
# On a version tag: build `nils` for the six targets (engine-build.yml, the same
# build as ci.yml), check that the binary carries the tag's version, and publish a
# GitHub release with the binaries, the packs, their checksums, and the matching section of
# CHANGELOG.md as the notes, in the form Bifrost uses (docs/decisions/15, R4).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/engine-build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: nils-*
          path: bin
          merge-multiple: true
      - name: the binaries carry the tag's version, and the packs go with them
        run: |
          v=${GITHUB_REF_NAME#v}
          chmod +x bin/nils-*
          got=$(bin/nils-linux-x86_64 --version)
          [ "$got" = "nils $v" ] || { echo "tag says $v, the binary says '$got': raise version in engine/Cargo.toml first"; exit 1; }
          # the rule sets travel with the binary: one tarball holding `packs/`,
          # which is what the installer unpacks and `nils update` swaps.
          tar -czf bin/packs.tar.gz packs
          (cd bin && sha256sum nils-* packs.tar.gz > SHA256SUMS && echo "$v" > VERSION && ls -la)
      - name: release notes from the changelog
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md | sed '1d' > notes.md
          [ -s notes.md ] || echo "NILS $v" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: NILS ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            bin/nils-*
            bin/packs.tar.gz
            bin/SHA256SUMS
            bin/VERSION
