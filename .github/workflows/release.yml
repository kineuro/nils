name: release
# On a version tag: publish a GitHub release whose notes are the matching section of
# CHANGELOG.md. The binaries and their checksums join this job when the engine exists,
# in the form Bifrost uses (docs/decisions/15, R4).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: release notes from the changelog
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md | sed '1d' > notes.md
          [ -s notes.md ] || echo "NILS $v" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: NILS ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
