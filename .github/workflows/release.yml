name: release
# On a version tag: the binaries for the six targets, checked to carry the tag's
# version, published as a GitHub release with the packs, their checksums, and the
# matching section of CHANGELOG.md as the notes, in the form Bifrost uses
# (docs/decisions/15, R4). A release builds only what changed:
#
# - The gate. A tag goes on a commit whose checks passed. The run that proves it is
#   main's own ci run on the commit, or the ci run of the pull request the commit
#   is the squash merge of, where the merge's tree is byte for byte the pull
#   request head's tree and main's tip before the merge is in that head, so that
#   run tested and built exactly this tree (scripts/release-pr-head.sh). ci.yml
#   runs the same jobs for both, so either way every check main requires is green
#   on some run of the same tree; the rule is never weaker than that. Where
#   neither run passed, the release stops at its first job and nothing is built,
#   pushed or published (scripts/release-ci-run.sh); once main's run on the commit
#   has passed, whoever tagged starts the release run again (Re-run all jobs, or
#   `gh run rerun <id>`); nothing here re-runs it.
# - The binaries. Either run built the six with engine-build.yml from this tree, so
#   the release takes them from the run that still keeps them (seven days), main's
#   first; where none does, they are built here the same way.
# - The model images (record 55 A5). A model's image is built from the tag only
#   when its package's files changed since the release that last shipped it; else
#   that release's image is taken, by the digest its IMAGES names, once the
#   registry says anyone may pull it (scripts/release-image-reuse.sh). The release
#   ships the descriptors of its model pipelines, each naming its image by digest
#   (pipelines.tar.gz, with IMAGES), checked by the tag's own binary as a catalog
#   takes them, and its notes say for each image whether it was built or taken,
#   and from which release. The release waits for both, so a tag's descriptors
#   never name an image older than its package's files.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  built:
    name: the binaries ci built
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        # the gate, and the run whose binaries the release takes (scripts/release-ci-run.sh):
        # `passed` is a ci run that passed on this tree, main's or the pull request's with the
        # same tree, and the step fails where there is none; `run` is the one of them that still
        # keeps the six binaries, empty where none does
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(scripts/release-ci-run.sh "$GITHUB_SHA")
          echo "$found" >> "$GITHUB_OUTPUT"
          echo "the gate: $(echo "$found" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: built
    if: needs.built.outputs.run == ''
    uses: ./.github/workflows/engine-build.yml

  model-images:
    # Record 55 A5: each model's image, one image that runs on the CPU and on a
    # card (CUDA torch wheels, which run on the CPU where the runner gives the
    # container no card), for linux/amd64, pushed by the tag. bodypart-embed's
    # encoder pins go to the body-part build, which fails where the weights it
    # bakes are other ones. The post-contrast fallback's image (Dockerfile.full)
    # is not here: it holds only FreeSurfer's Synth parts, but its build pulls
    # FreeSurfer's whole image (41 GB unpacked) and writes 34 GB, more than a
    # hosted runner's disk; it needs a larger runner.
    #
    # An image is built only when its package's files (pipelines/<image>, less its
    # tests and README, which the image does not hold) changed since the release
    # that last shipped it, read from git against that release's tag; nothing
    # outside the package is in the image, so nothing outside it decides
    # (scripts/release-image-reuse.sh). Otherwise the job takes that release's
    # image, by the digest its IMAGES names, after the registry says anyone may
    # pull it, and tags it with this release too; where any of that fails, it
    # builds. Nothing is built or pushed for a tag the gate refused.
    name: model image ${{ matrix.image }}
    needs: built
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [nils-bodypart, nils-postcontrast, nils-system1]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: built again, or the image of the release that last shipped it
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        # the script says why either way; where it says nothing, the image is built
        run: |
          what=build ref="" from=""
          IFS=$'\t' read -r what ref from < <(scripts/release-image-reuse.sh "$IMAGE" "$GITHUB_SHA") || true
          if [ "${what:-build}" = reuse ] && [ -n "$ref" ]; then
            echo "$IMAGE's files are $from's: its image $ref is taken, not built" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "from=$from" >> "$GITHUB_OUTPUT"
          fi
      - name: room for an image of CUDA wheels
        if: steps.reuse.outputs.ref == ''
        # a CUDA image is about 12 GB unpacked; the runner's toolchains this
        # job does not use make the room
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force > /dev/null
          df -h /
      - name: what the build checks
        if: steps.reuse.outputs.ref == ''
        id: args
        run: |
          if [ "${{ matrix.image }}" = nils-bodypart ]; then
            pins=$(python3 scripts/release-descriptors.py encoders pipelines/nils-bodypart/bodypart-embed/nils.job.yml)
            echo "build-args=ENCODER_DIGESTS=$pins" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        if: steps.reuse.outputs.ref == ''
        uses: docker/build-push-action@v6
        with:
          context: pipelines/${{ matrix.image }}
          platforms: linux/amd64
          push: true
          build-args: ${{ steps.args.outputs.build-args }}
          tags: ghcr.io/kineuro/${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: the previous release's image, tagged with this release too
        if: steps.reuse.outputs.ref != ''
        # a name for people; the descriptors pin the digest, so a failure here changes nothing
        continue-on-error: true
        run: docker buildx imagetools create --tag "ghcr.io/kineuro/${{ matrix.image }}:${{ github.ref_name }}" "${{ steps.reuse.outputs.ref }}"
      - name: the reference the release's descriptors pin, and where it comes from
        env:
          REUSED: ${{ steps.reuse.outputs.ref }}
          FROM: ${{ steps.reuse.outputs.from }}
          PUSHED: ${{ steps.push.outputs.digest }}
        # <image>.from says "built", or the release whose image this is, for the notes
        run: |
          mkdir -p refs
          ref=${REUSED:-ghcr.io/kineuro/${{ matrix.image }}@$PUSHED}
          echo "$ref" | tee "refs/${{ matrix.image }}.ref" >> "$GITHUB_STEP_SUMMARY"
          echo "${FROM:-built}" > "refs/${{ matrix.image }}.from"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}
          path: |
            refs/${{ matrix.image }}.ref
            refs/${{ matrix.image }}.from

  descriptors:
    # The descriptors the release ships: every one of this tree that names a
    # model image this run built or took, pinned to that image's digest, then
    # taken into a catalog by the tag's own binary, which must keep that image.
    # An image job that failed ships no descriptor and is named in the notes
    # (NOT-SHIPPED); it never holds back the binaries and the packs.
    needs: [built, build, model-images]
    if: ${{ !cancelled() && needs.built.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        # none where every image job failed
        continue-on-error: true
        with:
          pattern: image-*
          path: refs
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: nils-linux-x86_64
          path: bin
          merge-multiple: true
          run-id: ${{ needs.built.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      - name: the descriptors, pinned to the images this release built or took
        run: |
          mkdir -p refs
          python3 scripts/release-descriptors.py write --refs refs --out out --tag "$GITHUB_REF_NAME" \
            --expect nils-bodypart,nils-postcontrast,nils-system1
          cat out/MODEL-IMAGES.md out/NOT-SHIPPED >> "$GITHUB_STEP_SUMMARY"
      - name: taken by the tag's binary as a catalog takes them
        run: |
          chmod +x bin/nils-linux-x86_64
          nils() { HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/config" bin/nils-linux-x86_64 --registry "$RUNNER_TEMP/reg" "$@"; }
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/config"
          head -c 32 /dev/urandom | base64 -w0 | nils key add release
          nils init --key release
          for f in $(find out/pipelines -name nils.job.yml | sort); do
            nils pipeline add "$f" --json | python3 scripts/release-descriptors.py added out/IMAGES
          done
          tar -czf pipelines.tar.gz -C out pipelines
          cp out/IMAGES IMAGES
          cp out/NOT-SHIPPED NOT-SHIPPED
          cp out/MODEL-IMAGES.md MODEL-IMAGES.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-descriptors
          path: |
            pipelines.tar.gz
            IMAGES
            NOT-SHIPPED
            MODEL-IMAGES.md

  release:
    needs: [built, build, descriptors]
    if: ${{ !cancelled() && needs.built.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.descriptors.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: nils-*
          path: bin
          merge-multiple: true
          run-id: ${{ needs.built.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: release-descriptors
          path: bin
      - name: the binaries carry the tag's version, and the packs and the descriptors go with them
        run: |
          v=${GITHUB_REF_NAME#v}
          chmod +x bin/nils-*
          got=$(bin/nils-linux-x86_64 --version)
          [ "$got" = "nils $v" ] || { echo "tag says $v, the binary says '$got': raise version in engine/Cargo.toml first"; exit 1; }
          # the rule sets travel with the binary: one tarball holding `packs/`,
          # which is what the installer unpacks and `nils update` swaps.
          tar -czf bin/packs.tar.gz packs
          # the model pipelines' descriptors, pinned to this release's images,
          # which `nils pipeline add --release <name>` reads
          (cd bin && sha256sum nils-* packs.tar.gz pipelines.tar.gz IMAGES > SHA256SUMS && echo "$v" > VERSION && ls -la)
      - name: release notes from the changelog
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0} p' CHANGELOG.md | sed '1d' > notes.md
          [ -s notes.md ] || echo "NILS $v" > notes.md
          # each model image by its digest: built by this release, taken unchanged from
          # the release named, or published apart from the release
          if [ -s bin/MODEL-IMAGES.md ]; then { echo; cat bin/MODEL-IMAGES.md; } >> notes.md; fi
          if [ -s bin/NOT-SHIPPED ]; then
            { echo; echo "### Model images this release did not build"; echo; cat bin/NOT-SHIPPED; } >> notes.md
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: NILS ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            bin/nils-*
            bin/packs.tar.gz
            bin/pipelines.tar.gz
            bin/IMAGES
            bin/SHA256SUMS
            bin/VERSION

  image:
    # The same binaries, in an image for the two Linux architectures, so that
    # `nils setup` can put the engine in a container without building one.
    needs: [built, build]
    if: ${{ !cancelled() && needs.built.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: nils-linux-*
          path: bin
          merge-multiple: true
          run-id: ${{ needs.built.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      - name: the names the Containerfile expects
        run: |
          mv bin/nils-linux-x86_64 bin/nils-linux-amd64
          chmod +x bin/nils-linux-*
          ls -la bin
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: install/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kineuro/nils:${{ github.ref_name }}
            ghcr.io/kineuro/nils:latest
