name: ci
# Runs on every pull request and on main. "ci" checks the text, the SPDX headers and
# the sign-offs; "engine" formats, lints and tests the engine on both registry
# backends; "v0-compare" tests the compare tool over a synthetic registry on both
# backends; "build" is the six-target build of engine-build.yml, the way a release
# is made. Main requires all of them (docs/decisions/15, R8;
# docs/specs/wave1-parse-and-digest.md, §12.6).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: text hygiene
        run: scripts/check-hygiene.sh
      - name: SPDX headers
        run: scripts/check-spdx.sh
      - name: DCO on contracts/ and sdk/
        if: github.event_name == 'pull_request'
        run: scripts/check-dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  engine:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nils
          POSTGRES_PASSWORD: nils
          POSTGRES_DB: nils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nils"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The tests that need Postgres read this; without it they say so and pass.
      NILS_TEST_POSTGRES_DSN: postgres://nils:nils@localhost:5432/nils_test
    steps:
      - uses: actions/checkout@v7
      - name: the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' engine/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Wave 3 §9.6: a BIDS release converts with dcm2niix, so the tests that
      # write a tree need one. A deployment takes a current build from
      # rordenlab/dcm2niix; here the distribution's is enough to prove the
      # orchestration, and the tests say so and pass when it is absent.
      - name: dcm2niix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dcm2niix
          dcm2niix --version || true
      - name: rust-version matches the toolchain
        run: |
          channel="${{ steps.toolchain.outputs.channel }}"
          want=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' engine/Cargo.toml)
          case "$channel" in
            "$want" | "$want".*) echo "toolchain $channel, rust-version $want" ;;
            *) echo "engine/rust-toolchain.toml says $channel but engine/Cargo.toml says rust-version $want"; exit 1 ;;
          esac
      - name: format
        working-directory: engine
        run: cargo fmt --all --check
      - name: lint
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test on SQLite and Postgres 16
        working-directory: engine
        run: cargo test --workspace --locked

  # The v0 compare tool (§12.1) over a synthetic corpus the release binaries
  # write and digest: a projected v0 export with injected divergences must land
  # every one of them in its class, and a clean one must pass the gate on both
  # backends (§12.7).
  v0-compare:
    name: v0-compare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nils
          POSTGRES_PASSWORD: nils
          POSTGRES_DB: nils_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nils"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NILS_TEST_POSTGRES_DSN: postgres://nils:nils@localhost:5432/nils_test
    steps:
      - uses: actions/checkout@v7
      - name: the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' engine/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: build nils and the corpus writer
        working-directory: engine
        run: |
          cargo build --release --locked -p nils
          cargo build --release --locked --example corpus -p nils-dicom
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the tool
        run: python -m pip install --quiet -e "tools/v0-compare[test]"
      - name: test
        working-directory: tools/v0-compare
        run: python -m pytest -q

  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' engine/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: build nils and the corpus writer
        working-directory: engine
        run: |
          cargo build --release --locked -p nils
          cargo build --release --locked --example corpus -p nils-dicom
      - name: write the corpus
        working-directory: engine
        run: |
          n=$(python3 -c "import json;print(json.load(open('benches/baseline.json'))['instances'])")
          seed=$(python3 -c "import json;print(json.load(open('benches/baseline.json'))['seed'])")
          ./target/release/examples/corpus --out "$RUNNER_TEMP/corpus" --instances "$n" --seed "$seed" > "$RUNNER_TEMP/manifest.json"
          tail -c 400 "$RUNNER_TEMP/manifest.json"
      - name: digest it
        working-directory: engine
        run: |
          head -c 32 /dev/urandom | base64 -w0 > "$RUNNER_TEMP/key"
          ./target/release/nils key add bench --registry "$RUNNER_TEMP/reg" --from-file "$RUNNER_TEMP/key"
          rm -f "$RUNNER_TEMP/key"
          ./target/release/nils init --registry "$RUNNER_TEMP/reg" --backend sqlite --scheme blake2b-8 --key bench
          ./target/release/nils digest "$RUNNER_TEMP/corpus" --registry "$RUNNER_TEMP/reg" \
              --files dcm,no-ext --name bench --json > "$RUNNER_TEMP/report.json"
      - name: hold it against the baseline
        working-directory: engine
        run: python3 benches/gate.py "$RUNNER_TEMP/report.json" benches/baseline.json "${{ runner.os }}-${{ runner.arch }}"
      - name: fingerprint and classify the same corpus
        working-directory: engine
        run: |
          ./target/release/nils fingerprint --registry "$RUNNER_TEMP/reg" --name bench --json \
              > "$RUNNER_TEMP/fingerprint.json"
          ./target/release/nils classify --registry "$RUNNER_TEMP/reg" --pack-dir ../packs \
              --name bench --json > "$RUNNER_TEMP/classify.json"
          tail -c 600 "$RUNNER_TEMP/classify.json"
      - name: hold the classification against the baseline
        working-directory: engine
        run: |
          python3 benches/gate.py "$RUNNER_TEMP/fingerprint.json" benches/baseline.json \
              "${{ runner.os }}-${{ runner.arch }}" --stage fingerprint
          python3 benches/gate.py "$RUNNER_TEMP/classify.json" benches/baseline.json \
              "${{ runner.os }}-${{ runner.arch }}" --stage classify

  build:
    uses: ./.github/workflows/engine-build.yml
