name: Bug
description: Something NILS does wrong.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `nils --version`, or the commit.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands and shapes of the input (counts, modalities, sizes). No patient data, no identifiers, no UIDs, no clinical folder paths.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, backend (SQLite or Postgres), how NILS runs (binary, container).
