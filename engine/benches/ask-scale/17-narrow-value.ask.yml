# SPDX-License-Identifier: AGPL-3.0-only
# A filter on one value of an axis the pack declares a coarse form of. The
# diagnosis counts the set without the clause by the value of the axis
# and, since the clause keeps no stack of it, warns (narrow_value): the
# spines are under the same region as the neck, and the region is the
# wider choice. The cost of that count is what is timed.
ast_version: 1
name: scans of the neck
sets:
  necks:
    grain: stack
    where:
      - ["=", {}, ["axis", {}, "body_part"], "neck"]
out: {set: necks, level: count}
