# SPDX-License-Identifier: AGPL-3.0-only
# The shape an assistant drafts for "who was scanned twice alike": the best
# fine 3D T1w and the best fine 3D FLAIR of each session of a cohort, the
# sessions that have both from one scanner, and the subjects with two such
# sessions that agree in the model, the station and both signatures. Every
# relation a question has is in it: two picks, two attaches, a `where`
# between the partners, a `has` and a `same`.
ast_version: 1
name: subjects with two sessions alike in their best T1w and FLAIR
sets:
  scope:  {grain: cohort,  where: [["=", {}, ["field", {}, "name"], "alpha"]]}
  people: {grain: subject, of: scope}
  visits: {grain: session, of: people}
  t1:
    grain: stack
    of: visits
    where:
      - ["=",  {}, ["axis", {}, "base"], "T1w"]
      - ["=",  {}, ["derived", {}, "acquisition_type"], "3D"]
      - ["<=", {}, ["derived", {}, "voxel"], 1.2]
    bind:
      sig: ["derived", {level: loose}, "signature"]
    pick: {per: session, n: 1,
           by: [[["field", {}, "n_instances"], desc], [["field", {}, "id"], asc]]}
  flair:
    grain: stack
    of: visits
    where:
      - ["=",   {}, ["axis", {}, "base"], "T2w"]
      - ["has", {}, ["axis", {}, "modifier"], "FLAIR"]
      - ["=",   {}, ["derived", {}, "acquisition_type"], "3D"]
      - ["<=",  {}, ["derived", {}, "voxel"], 1.2]
    bind:
      sig: ["derived", {level: loose}, "signature"]
    pick: {per: session, n: 1,
           by: [[["field", {}, "n_instances"], desc], [["field", {}, "id"], asc]]}
  good:
    grain: session
    from: visits
    attach:
      - {as: t1,    set: t1}
      - {as: flair, set: flair}
    where:
      - ["=", {}, ["field", {}, "t1.station_name"], ["field", {}, "flair.station_name"]]
  answer:
    grain: subject
    from: people
    has:
      - {set: good, min: 2, as: n_good}
    same:
      - {as: alike, over: good, min: 2,
         by: [["field", {}, "t1.manufacturer_model_name"], ["field", {}, "t1.station_name"],
              ["field", {}, "t1.sig"], ["field", {}, "flair.sig"]]}
out: {set: answer, level: count}
