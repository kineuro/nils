# A subject set chosen by an axis of its stacks.
ast_version: 1
name: subjects with two or more 3D FLAIR stacks after contrast or DIR stacks
sets:
  wanted:
    grain: stack
    where:
      - ["or", {},
          ["and", {}, ["has", {}, ["axis", {}, "modifier"], "FLAIR"],
                      ["=", {}, ["axis", {}, "post_contrast"], "given"],
                      ["=", {}, ["derived", {}, "acquisition_type"], "3D"]],
          ["has", {}, ["axis", {}, "modifier"], "DIR"]]
  people:
    grain: subject
    has:
      - {set: wanted, min: 2}
out: {set: people, level: count}
