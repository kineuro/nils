[package]
name = "nils-release"
description = "The release of NILS: selecting, de-identifying and writing a dataset out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Record 37 S2: the coverage comparison of S1, which is the fact that
# separates more colliding names than any other and is written once.
nils-classify.workspace = true
nils-dicom.workspace = true
nils-pack.workspace = true
nils-registry.workspace = true
nils-session.workspace = true

blake2.workspace = true
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-object.workspace = true
dicom-transfer-syntax-registry.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

# The free-space preflight asks statvfs, which Windows does not have; there a
# release gets the operating system's error at the moment it runs out, which is
# what every release got before the preflight existed.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# The ask, so that one test can put the two counts of a selection side by
# side: what `nils select` reaches and what an ask over it holds.
nils-ask.workspace = true
nils-catalog.workspace = true
nils-digest.workspace = true
dicom-core.workspace = true
dicom-dictionary-std.workspace = true

[lints]
workspace = true
