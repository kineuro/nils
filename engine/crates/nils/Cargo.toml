[package]
name = "nils"
description = "NILS, the neuroimaging registry engine: one binary that digests DICOM into a registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "nils"
path = "src/main.rs"

[dependencies]
nils-dicom.workspace = true
nils-classify.workspace = true
nils-pack.workspace = true
nils-digest.workspace = true
nils-registry.workspace = true
nils-session.workspace = true
nils-release.workspace = true
nils-pseudonymize.workspace = true
nils-synth.workspace = true
nils-ask.workspace = true
nils-catalog.workspace = true
nils-pipeline.workspace = true

clap.workspace = true
serde-saphyr.workspace = true
csv.workspace = true
regex.workspace = true
serde.workspace = true
libc.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
jsonwebtoken.workspace = true
ureq.workspace = true
blake2.workspace = true
hex.workspace = true
jiff.workspace = true
ctrlc.workspace = true
tar.workspace = true
flate2.workspace = true
ring.workspace = true
toml.workspace = true
# nils setup asks the desk's own store whether it keeps anyone yet
rusqlite.workspace = true
# Wave 4c §6.8: the gate seeds a synthetic tree of its own.
dicom-core.workspace = true
dicom-dictionary-std.workspace = true
dicom-object.workspace = true
# the pyramid decodes compressed pixel data: JPEG (baseline, extended at 8
# bits, lossless), RLE and deflate in Rust through the registry's codecs,
# JPEG-LS in Rust through pure_jpegls, and JPEG 2000 through OpenJPEG's C
# source, compiled into the binary by the cc crate as ring's C is (no CMake).
# The Rust port of OpenJPEG (feature openjp2) frees a null pointer when a
# decoder is dropped, which debug builds abort on.
dicom-encoding.workspace = true
dicom-transfer-syntax-registry = { workspace = true, features = ["jpeg", "rle", "deflate", "openjpeg-sys"] }
pure_jpegls = "2"
openjph-core = "0.1.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]

[lints]
workspace = true
